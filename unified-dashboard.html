/* ================================================================
   ルールセット定義
   大会ごとの違いはすべてここに集約する。breakType / timeLimit は
   ruleOverrides（大会単位・試合単位）で上書き可能。
   ================================================================ */
const RULESETS = {
  jcl: {
    id: "jcl", label: "JCL方式", game: "nineball",
    scoring: { mode: "rackWinnerBonus", ballPoint: 1, nineBallBonus: 14, liveUpdateDuringRack: false },

  azuki: {

    hillDisplay: { enabled: false },
    bracket: { sizes: [4, 8], seedingSource: "prelimStandings" },
    grouping: { mode: "open" },
  },
  moss: {
    id: "moss", label: "モスカップ方式（JPA）", game: "nineball",
    scoring: { mode: "perBallJPA", ballPoint: 1, nineBallPoint: 2, liveUpdateDuringRack: true },
    handicap: { mode: "fixedByRound", targets: { prelim: 12, final: 20 } },
    breakType: "winner", breakTypeOverridable: true,
    timeLimit: { mode: "none" }, timeLimitOverridable: true,
    hillDisplay: { enabled: false },
    bracket: { sizes: [4, 8], seedingSource: "prelimStandings" },
    grouping: { mode: "open" },
  },
  setMatch: {
    id: "setMatch", label: "セットマッチ方式", game: "nineball",
    scoring: { mode: "rackRace", liveUpdateDuringRack: true },
    handicap: { mode: "classRace", classTargets: { A: 5, B: 4, C: 3 } },
    breakType: "winner", breakTypeOverridable: true,
    timeLimit: {
      mode: "shotClock",
      shotClock: { bankSeconds: 25 * 60, perShotSeconds: 40, extensionsPerRack: 1, extensionSeconds: 40 },
    },
    timeLimitOverridable: true,
    hillDisplay: { enabled: true },
    bracket: { sizes: [4, 8], seedingSource: "class" },
    grouping: { mode: "open" },
  },
};

function rulesetOf(tournament) {
  const base = RULESETS[tournament.rulesetId];
  if (!base) return null;
  const ov = tournament.rulesetOverrides || {};
  return {
    ...base,
    breakType: ov.breakType || base.breakType,
    timeLimit: ov.timeLimit || base.timeLimit,
  };
}

/* ================================================================
   対戦データ：events（生イベント）から score/racks/isHill/status を導出。
   events が唯一の正。derived は常に再構築できるキャッシュとして扱う。
   ================================================================ */
function deriveMatch(match, ruleset) {
  const events = match.events || [];
  const seats = [1, 2];
  const result = {
    score: { seat1: 0, seat2: 0 },
    racks: { seat1: 0, seat2: 0 },
    isHill: false,
    status: events.length === 0 ? "notStarted" : "inProgress",
    winnerSeat: null,
    currentBreakSeat: match.breakSeat || 1,
  };

  if (ruleset.scoring.mode === "rackWinnerBonus") {
    // JCL: 9番を落とした側がラック分+ボーナスをまとめて加算
    for (const ev of events) {
      if (ev.type === "rackWon") {
        result.score["seat" + ev.seat] += (ev.ballsWonInRack || 0) * ruleset.scoring.ballPoint + ruleset.scoring.nineBallBonus;
        result.racks["seat" + ev.seat] += 1;
      }
    }
  } else if (ruleset.scoring.mode === "perBallJPA") {
    // あずき杯/モス: 球ごとに即得点、9番のみ2点
    for (const ev of events) {
      if (ev.type === "ballPocketed") {
        const pts = ev.ball === 9 ? ruleset.scoring.nineBallPoint : ruleset.scoring.ballPoint;
        result.score["seat" + ev.seat] += pts;
      }
      if (ev.type === "rackWon") result.racks["seat" + ev.seat] += 1;
    }
  } else if (ruleset.scoring.mode === "rackRace") {
    // セットマッチ: ラック数だけがそのまま勝敗対象
    for (const ev of events) {
      if (ev.type === "rackWon") result.racks["seat" + ev.seat] += 1;
    }
  }

  const target = match.target || {};
  seats.forEach((s) => {
    const key = "seat" + s;
    const t = target[key];
    if (t == null) return;
    const cur = ruleset.scoring.mode === "rackRace" ? result.racks[key] : result.score[key];
    if (ruleset.hillDisplay.enabled && cur === t - 1) result.isHill = true;
    if (cur >= t) { result.status = "finished"; result.winnerSeat = s; }
  });

  // ブレイク権：ラック確定イベントの順序から導出する（breakType: winner=前ラック勝者／alternate=交互）
  const rackWinners = events.filter((ev) => ev.type === "rackWon").map((ev) => ev.seat);
  const firstBreak = match.firstBreakSeat || 1;
  if (rackWinners.length === 0) {
    result.currentBreakSeat = firstBreak;
  } else {
    const lastWinner = rackWinners[rackWinners.length - 1];
    result.currentBreakSeat = ruleset.breakType === "winner" ? lastWinner : (lastWinner === 1 ? 2 : 1);
  }

  return result;
}

function newId(prefix) {
  return prefix + "_" + Math.random().toString(36).slice(2, 10);
}

function nameOfNum(rosterNumber, roster) {
  const r = (roster || []).find((x) => x.rosterNumber === rosterNumber);
  return r ? r.displayName : "？";
}

/* ================================================================
   画面：大会詳細（名簿・対戦一覧の入口。コアループの本体は次段で拡張）
   ================================================================ */
function TournamentScreen({ tournament, allPlayers, onBack, onUpdateTournament }) {
  const [tab, setTab] = useState("roster");
  const ruleset = rulesetOf(tournament);
  const [showAddPlayer, setShowAddPlayer] = useState(false);
  const [editingEntry, setEditingEntry] = useState(null); // ロスターエントリ（{rosterNumber, playerId, displayName}）
  const [matches, setMatches] = useState([]);
  const [showNewMatch, setShowNewMatch] = useState(false);
  const [activeMatchId, setActiveMatchId] = useState(null);

  useEffect(() => {
    const ref = db.ref("matches/" + tournament.tournamentId);
    const cb = ref.on("value", (snap) => {
      const val = snap.val() || {};
      setMatches(Object.values(val).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)));
    });
    return () => ref.off("value", cb);
  }, [tournament.tournamentId]);

  const createMatch = (match) => {
    db.ref("matches/" + tournament.tournamentId + "/" + match.matchId).set(match);
    setShowNewMatch(false);
    setActiveMatchId(match.matchId);
  };

  const updateMatchEvents = (matchId, newEvents) => {
    db.ref("matches/" + tournament.tournamentId + "/" + matchId).update({ events: newEvents, updatedAt: Date.now() });
  };

  const addRosterEntry = (playerId, displayName, rosterNumber) => {
    const roster = [...(tournament.roster || []), { rosterNumber, playerId, displayName }];
    onUpdateTournament({ ...tournament, roster, updatedAt: Date.now() });
    setShowAddPlayer(false);
  };

  const updatePlayerMaster = (playerId, patch) => {
    // 選手マスタ（全大会共通）を更新。名前を直しても過去の対戦記録の表示には影響しない
    db.ref("players/" + playerId).update({ ...patch, updatedAt: Date.now() });
    if (patch.name) {
      const roster = (tournament.roster || []).map((r) => r.playerId === playerId ? { ...r, displayName: patch.name } : r);
      onUpdateTournament({ ...tournament, roster, updatedAt: Date.now() });
    }
    setEditingEntry(null);
  };

  const removeFromRoster = (rosterNumber) => {
    // この大会の名簿からのみ外す。選手マスタ自体は消さない
    const roster = (tournament.roster || []).filter((r) => r.rosterNumber !== rosterNumber);
    onUpdateTournament({ ...tournament, roster, updatedAt: Date.now() });
    setEditingEntry(null);
  };

  if (activeMatchId) {
    const m = matches.find((x) => x.matchId === activeMatchId);
    if (m) {
      return (
        <MatchScoreScreen
          match={m}
          ruleset={ruleset}
          roster={tournament.roster || []}
          onBack={() => setActiveMatchId(null)}
          onUpdateEvents={(newEvents) => updateMatchEvents(m.matchId, newEvents)}
        />
      );
    }
  }

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: C.bg, fontFamily: FONT }}>
      <TopBar title={tournament.name} onBack={onBack} />
      <div style={{ display: "flex", borderBottom: `1px solid ${C.line}`, background: "#fff" }}>
        {[["roster", "名簿"], ["matches", "対戦"]].map(([key, label]) => (
          <button key={key} onClick={() => setTab(key)} style={{
            flex: 1, padding: "13px 2px", background: "none", border: "none", fontSize: 14.5,
            fontWeight: tab === key ? 800 : 600, color: tab === key ? C.blue : C.sub, cursor: "pointer", fontFamily: FONT,
          }}>{label}</button>
        ))}
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: 14 }}>
        {tab === "roster" && (
          <>
            {(tournament.roster || []).length === 0 && <div style={{ color: C.sub, fontSize: 14, textAlign: "center", marginTop: 30 }}>まだ選手が登録されていません</div>}
            {(tournament.roster || []).map((r) => (
              <Card key={r.rosterNumber} onClick={() => setEditingEntry(r)}>
                <div style={{ fontSize: 15, fontWeight: 700 }}>#{r.rosterNumber} {r.displayName}</div>
              </Card>
            ))}
            <button onClick={() => setShowAddPlayer(true)} style={{ ...menuBtn, background: C.blue, color: "#fff", borderColor: C.blue, marginTop: 8 }}>＋ 選手を追加</button>
          </>
        )}
        {tab === "matches" && (
          <>
            {matches.length === 0 && <div style={{ color: C.sub, fontSize: 14, textAlign: "center", marginTop: 30 }}>まだ対戦がありません</div>}
            {matches.map((m) => {
              const d = deriveMatch(m, ruleset);
              const n1 = nameOfNum(m.seat1.rosterNumber, tournament.roster);
              const n2 = nameOfNum(m.seat2.rosterNumber, tournament.roster);
              const cur1 = ruleset.scoring.mode === "rackRace" ? d.racks.seat1 : d.score.seat1;
              const cur2 = ruleset.scoring.mode === "rackRace" ? d.racks.seat2 : d.score.seat2;
              const statusLabel = d.status === "finished" ? "試合終了" : d.status === "inProgress" ? "進行中" : "未開始";
              return (
                <Card key={m.matchId} onClick={() => setActiveMatchId(m.matchId)} highlight={d.status === "inProgress"}>
                  <div style={{ fontSize: 12, color: C.sub, marginBottom: 4 }}>
                    T{m.table}{m.roundLabel ? "・" + m.roundLabel : ""}・{statusLabel}
                  </div>
                  <div style={{ fontSize: 15, fontWeight: 700, display: "flex", justifyContent: "space-between" }}>
                    <span style={{ color: d.winnerSeat === 1 ? C.win : C.ink }}>{n1} {cur1}{m.target?.seat1 != null ? " / " + m.target.seat1 : ""}</span>
                    <span style={{ color: d.winnerSeat === 2 ? C.win : C.ink }}>{cur2}{m.target?.seat2 != null ? " / " + m.target.seat2 : ""} {n2}</span>
                  </div>
                </Card>
              );
            })}
            <button onClick={() => setShowNewMatch(true)} style={{ ...menuBtn, background: C.blue, color: "#fff", borderColor: C.blue, marginTop: 8 }}>＋ 対戦を作る</button>
          </>
        )}
      </div>
      {showNewMatch && (
        <BottomSheet title="対戦を作る" onClose={() => setShowNewMatch(false)}>
          <NewMatchForm ruleset={ruleset} tournament={tournament} allPlayers={allPlayers} onCreate={createMatch} onCancel={() => setShowNewMatch(false)} />
        </BottomSheet>
      )}
      {showAddPlayer && (
        <BottomSheet title="選手を追加" onClose={() => setShowAddPlayer(false)}>
          <AddPlayerForm existingRoster={tournament.roster || []} allPlayers={allPlayers} onAdd={addRosterEntry} onCancel={() => setShowAddPlayer(false)} />
        </BottomSheet>
      )}
      {editingEntry && (
        <BottomSheet title={`#${editingEntry.rosterNumber} を訂正`} onClose={() => setEditingEntry(null)}>
          <EditRosterEntry
            entry={editingEntry}
            player={(allPlayers || []).find((p) => p.playerId === editingEntry.playerId)}
            onSave={updatePlayerMaster}
            onRemove={() => removeFromRoster(editingEntry.rosterNumber)}
            onCancel={() => setEditingEntry(null)}
          />
        </BottomSheet>
      )}
    </div>
  );
}

function AddPlayerForm({ existingRoster, allPlayers, onAdd, onCancel }) {
  const [mode, setMode] = useState("existing"); // "existing" | "new"
  const [search, setSearch] = useState("");
  const [name, setName] = useState("");
  const [fargo, setFargo] = useState("");
  const [cls, setCls] = useState("");
  const nextNumber = (existingRoster.reduce((max, r) => Math.max(max, r.rosterNumber), 0) || 0) + 1;
  const usedPlayerIds = new Set(existingRoster.map((r) => r.playerId));
  const candidates = (allPlayers || [])
    .filter((p) => !usedPlayerIds.has(p.playerId))
    .filter((p) => !search.trim() || p.name.includes(search.trim()));

  const submitNew = () => {
    if (!name.trim()) return;
    // 選手マスタ（全大会共通）へ新規登録。重複判別は手動運用のため自動名寄せはしない
    const playerId = newId("p");
    db.ref("players/" + playerId).set({
      playerId, name: name.trim(),
      fargoRating: fargo ? Number(fargo) : null,
      class: cls || null,
      createdAt: Date.now(), updatedAt: Date.now(),
    });
    onAdd(playerId, name.trim(), nextNumber);
  };

  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <button onClick={() => setMode("existing")} style={{
          flex: 1, padding: "10px 0", border: `2px solid ${mode === "existing" ? C.blue : C.line}`,
          background: mode === "existing" ? C.lightBlue : "#fff", borderRadius: 10, fontWeight: 800, cursor: "pointer", fontFamily: FONT,
        }}>名簿から選ぶ</button>
        <button onClick={() => setMode("new")} style={{
          flex: 1, padding: "10px 0", border: `2px solid ${mode === "new" ? C.blue : C.line}`,
          background: mode === "new" ? C.lightBlue : "#fff", borderRadius: 10, fontWeight: 800, cursor: "pointer", fontFamily: FONT,
        }}>新規登録</button>
      </div>

      {mode === "existing" && (
        <div>
          <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="名前で検索"
            style={{ width: "100%", padding: "12px 10px", border: `1.5px solid ${C.line}`, borderRadius: 10, fontSize: 15, fontFamily: FONT, marginBottom: 12 }} />
          {candidates.length === 0 && <div style={{ color: C.sub, fontSize: 13.5, textAlign: "center", padding: "16px 0" }}>該当する選手がいません</div>}
          {candidates.map((p) => (
            <Card key={p.playerId} onClick={() => onAdd(p.playerId, p.name, nextNumber)}>
              <div style={{ fontSize: 15, fontWeight: 700 }}>{p.name}</div>
              <div style={{ fontSize: 12, color: C.sub, marginTop: 2 }}>
                Fargo：{p.fargoRating != null ? p.fargoRating : "未定"}　クラス：{p.class || "未定"}
              </div>
            </Card>
          ))}
          <button onClick={onCancel} style={{ ...menuBtn, background: C.zone, fontWeight: 700, marginTop: 8 }}>もどる</button>
        </div>
      )}

      {mode === "new" && (
        <div>
          <div style={{ fontSize: 13, fontWeight: 700, color: C.sub, marginBottom: 6 }}>名前</div>
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="選手名"
            style={{ width: "100%", padding: "12px 10px", border: `1.5px solid ${C.line}`, borderRadius: 10, fontSize: 15, fontFamily: FONT, marginBottom: 12 }} />
          <div style={{ fontSize: 13, fontWeight: 700, color: C.sub, marginBottom: 6 }}>Fargoレート（未定なら空欄でOK）</div>
          <input value={fargo} onChange={(e) => setFargo(e.target.value)} inputMode="numeric" placeholder="例：512"
            style={{ width: "100%", padding: "12px 10px", border: `1.5px solid ${C.line}`, borderRadius: 10, fontSize: 15, fontFamily: FONT, marginBottom: 12 }} />
          <div style={{ fontSize: 13, fontWeight: 700, color: C.sub, marginBottom: 6 }}>クラス（未定なら空欄でOK）</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
            {["", "A", "B", "C"].map((c) => (
              <button key={c || "none"} onClick={() => setCls(c)} style={{
                flex: 1, padding: "10px 0", border: `2px solid ${cls === c ? C.blue : C.line}`,
                background: cls === c ? C.lightBlue : "#fff", borderRadius: 10, fontWeight: 800, cursor: "pointer", fontFamily: FONT,
              }}>{c || "未定"}</button>
            ))}
          </div>
          <button onClick={submitNew} disabled={!name.trim()} style={{ ...menuBtn, background: C.blue, color: "#fff", borderColor: C.blue, opacity: name.trim() ? 1 : 0.5 }}>登録する</button>
          <button onClick={onCancel} style={{ ...menuBtn, background: C.zone, fontWeight: 700 }}>もどる</button>
        </div>
      )}
    </div>
  );
}

/* ================================================================
   画面：対戦作成フォーム（ルールセットに応じて目標点/ラック数を自動算出）
   ================================================================ */
const ROUND_LABELS = { prelim: "予選", quarterfinal: "準々決勝", semifinal: "準決勝", final: "決勝" };

function NewMatchForm({ ruleset, tournament, allPlayers, onCreate, onCancel }) {
  const roster = tournament.roster || [];
  const tables = tournament.tables || [1];
  const [table, setTable] = useState(tables[0]);
  const [seat1Num, setSeat1Num] = useState(roster[0] ? roster[0].rosterNumber : null);
  const [seat2Num, setSeat2Num] = useState(roster[1] ? roster[1].rosterNumber : null);
  const roundKeys = ruleset.handicap.mode === "fixedByRound" ? Object.keys(ruleset.handicap.targets) : null;
  const [round, setRound] = useState(roundKeys ? roundKeys[0] : "");
  const [target1, setTarget1] = useState("");
  const [target2, setTarget2] = useState("");
  const [firstBreak, setFirstBreak] = useState(1);

  const playerOf = (rosterNumber) => {
    const r = roster.find((x) => x.rosterNumber === rosterNumber);
    if (!r) return null;
    return (allPlayers || []).find((p) => p.playerId === r.playerId) || null;
  };

  // ルールセットに応じた目標の自動算出（fargoモードのみ未対応・手動入力）
  useEffect(() => {
    if (ruleset.handicap.mode === "fixedByRound") {
      const t = ruleset.handicap.targets[round];
      if (t != null) { setTarget1(String(t)); setTarget2(String(t)); }
    } else if (ruleset.handicap.mode === "classRace") {
      const p1 = playerOf(seat1Num), p2 = playerOf(seat2Num);
      const t1 = p1 && p1.class ? ruleset.handicap.classTargets[p1.class] : null;
      const t2 = p2 && p2.class ? ruleset.handicap.classTargets[p2.class] : null;
      if (t1 != null) setTarget1(String(t1));
      if (t2 != null) setTarget2(String(t2));
    }
    // eslint-disable-next-line
  }, [ruleset.handicap.mode, round, seat1Num, seat2Num]);

  const targetLabel = ruleset.scoring.mode === "rackRace" ? "目標ラック数" : "目標点";
  const canSubmit = seat1Num != null && seat2Num != null && seat1Num !== seat2Num && target1 !== "" && target2 !== "";

  const submit = () => {
    if (!canSubmit) return;
    const match = {
      matchId: newId("m"),
      tournamentId: tournament.tournamentId,
      table,
      roundLabel: roundKeys ? (ROUND_LABELS[round] || round) : "",
      seat1: { rosterNumber: seat1Num },
      seat2: { rosterNumber: seat2Num },
      target: { seat1: Number(target1), seat2: Number(target2) },
      firstBreakSeat: firstBreak,
      events: [],
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
    onCreate(match);
  };

  return (
    <div>
      <div style={{ fontSize: 13, fontWeight: 700, color: C.sub, marginBottom: 6 }}>卓</div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        {tables.map((n) => (
          <button key={n} onClick={() => setTable(n)} style={{
            flex: "0 0 auto", minWidth: 44, padding: "10px 0", border: `2px solid ${table === n ? C.blue : C.line}`,
            background: table === n ? C.lightBlue : "#fff", borderRadius: 10, fontWeight: 800, cursor: "pointer", fontFamily: FONT,
          }}>{n}</button>
        ))}
      </div>

      <div style={{ fontSize: 13, fontWeight: 700, color: C.sub, marginBottom: 6 }}>対戦者（青）</div>
      <select value={seat1Num ?? ""} onChange={(e) => setSeat1Num(Number(e.target.value))}
        style={{ width: "100%", padding: "12px 10px", border: `1.5px solid ${C.line}`, borderRadius: 10, fontSize: 15, fontFamily: FONT, marginBottom: 12 }}>
        <option value="" disabled>選手を選択</option>
        {roster.map((r) => <option key={r.rosterNumber} value={r.rosterNumber}>#{r.rosterNumber} {r.displayName}</option>)}
      </select>

      <div style={{ fontSize: 13, fontWeight: 700, color: C.sub, marginBottom: 6 }}>対戦者（赤）</div>
      <select value={seat2Num ?? ""} onChange={(e) => setSeat2Num(Number(e.target.value))}
        style={{ width: "100%", padding: "12px 10px", border: `1.5px solid ${C.line}`, borderRadius: 10, fontSize: 15, fontFamily: FONT, marginBottom: 12 }}>
        <option value="" disabled>選手を選択</option>
        {roster.map((r) => <option key={r.rosterNumber} value={r.rosterNumber}>#{r.rosterNumber} {r.displayName}</option>)}
      </select>
      {seat1Num != null && seat1Num === seat2Num && (
        <div style={{ color: C.red, fontSize: 12.5, marginBottom: 12 }}>同じ選手は選べません</div>
      )}

      {roundKeys && (
        <>
          <div style={{ fontSize: 13, fontWeight: 700, color: C.sub, marginBottom: 6 }}>回戦</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
            {roundKeys.map((k) => (
              <button key={k} onClick={() => setRound(k)} style={{
                flex: "1 0 40%", padding: "10px 0", border: `2px solid ${round === k ? C.blue : C.line}`,
                background: round === k ? C.lightBlue : "#fff", borderRadius: 10, fontWeight: 800, cursor: "pointer", fontFamily: FONT,
              }}>{ROUND_LABELS[k] || k}</button>
            ))}
          </div>
        </>
      )}

      {ruleset.handicap.mode === "fargo" && (
        <div style={{ fontSize: 12, color: C.sub, marginBottom: 8 }}>Fargoレートからの自動算出は未実装です。目標点を直接入力してください。</div>
      )}
      <div style={{ fontSize: 13, fontWeight: 700, color: C.sub, marginBottom: 6 }}>{targetLabel}（青／赤）</div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <input value={target1} onChange={(e) => setTarget1(e.target.value)} inputMode="numeric" placeholder="例：21"
          style={{ flex: 1, padding: "12px 10px", border: `1.5px solid ${C.line}`, borderRadius: 10, fontSize: 15, fontFamily: FONT }} />
        <input value={target2} onChange={(e) => setTarget2(e.target.value)} inputMode="numeric" placeholder="例：21"
          style={{ flex: 1, padding: "12px 10px", border: `1.5px solid ${C.line}`, borderRadius: 10, fontSize: 15, fontFamily: FONT }} />
      </div>

      <div style={{ fontSize: 13, fontWeight: 700, color: C.sub, marginBottom: 6 }}>最初のブレイク</div>
      <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
        <button onClick={() => setFirstBreak(1)} style={{
          flex: 1, padding: "10px 0", border: `2px solid ${firstBreak === 1 ? C.blue : C.line}`,
          background: firstBreak === 1 ? C.lightBlue : "#fff", borderRadius: 10, fontWeight: 800, cursor: "pointer", fontFamily: FONT,
        }}>青</button>
        <button onClick={() => setFirstBreak(2)} style={{
          flex: 1, padding: "10px 0", border: `2px solid ${firstBreak === 2 ? C.red : C.line}`,
          background: firstBreak === 2 ? C.lightRed : "#fff", borderRadius: 10, fontWeight: 800, cursor: "pointer", fontFamily: FONT,
        }}>赤</button>
      </div>

      <button onClick={submit} disabled={!canSubmit} style={{ ...menuBtn, background: C.blue, color: "#fff", borderColor: C.blue, opacity: canSubmit ? 1 : 0.5 }}>この内容で対戦を作る</button>
      <button onClick={onCancel} style={{ ...menuBtn, background: C.zone, fontWeight: 700 }}>もどる</button>
    </div>
  );
}

/* ================================================================
   画面：対戦スコア入力（ルールセットのscoring.modeごとに入力UIを出し分け）
   ================================================================ */
function MatchScoreScreen({ match, ruleset, roster, onBack, onUpdateEvents }) {
  const events = match.events || [];
  // rackWinnerBonus（JCL）方式専用：ラック確定前の未確定球数（ローカルのみ・events化しない）
  const [tally, setTally] = useState({ seat1: 0, seat2: 0 });
  useEffect(() => { setTally({ seat1: 0, seat2: 0 }); }, [match.matchId, events.length]);

  const d = deriveMatch(match, ruleset);
  const n1 = nameOfNum(match.seat1.rosterNumber, roster);
  const n2 = nameOfNum(match.seat2.rosterNumber, roster);
  const finished = d.status === "finished";

  const commit = (newEvents) => onUpdateEvents(newEvents);
  const undo = () => { if (events.length > 0) commit(events.slice(0, -1)); };
  const addRackWon = (seat, ballsWonInRack) => {
    commit([...events, { type: "rackWon", seat, ballsWonInRack: ballsWonInRack || 0, ts: Date.now() }]);
  };
  const addBallPocketed = (seat, ball) => {
    const evs = [...events, { type: "ballPocketed", seat, ball, ts: Date.now() }];
    if (ball === 9) evs.push({ type: "rackWon", seat, ts: Date.now() });
    commit(evs);
  };

  const cur = (key) => (ruleset.scoring.mode === "rackRace" ? d.racks[key] : d.score[key]);
  const target = match.target || {};

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: C.bg, fontFamily: FONT }}>
      <TopBar title={`T${match.table}${match.roundLabel ? "・" + match.roundLabel : ""}`} onBack={onBack} />
      <div style={{ flex: 1, overflowY: "auto", padding: 14 }}>
        {finished && (
          <div style={{ background: C.hillBg, border: `1.5px solid ${C.hill}`, borderRadius: 12, padding: 12, marginBottom: 14, textAlign: "center", fontWeight: 800, color: C.hill }}>
            🏆 {d.winnerSeat === 1 ? n1 : n2} の勝利
          </div>
        )}

        <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
          {[1, 2].map((seat) => {
            const key = "seat" + seat;
            const isBlue = seat === 1;
            const isBreak = d.currentBreakSeat === seat && !finished;
            return (
              <div key={seat} style={{
                flex: 1, background: isBlue ? C.lightBlue : C.lightRed, border: `2px solid ${isBlue ? C.blue : C.red}`,
                borderRadius: 14, padding: 12, textAlign: "center", position: "relative",
              }}>
                {isBreak && <div style={{ position: "absolute", top: 6, right: 8, fontSize: 11, fontWeight: 800, color: isBlue ? C.blue : C.red }}>●ブレイク</div>}
                <div style={{ fontSize: 14, fontWeight: 800, color: C.ink, marginBottom: 4 }}>{seat === 1 ? n1 : n2}</div>
                <div style={{ fontSize: 30, fontWeight: 900, color: isBlue ? C.blue : C.red }}>{cur(key)}</div>
                {target[key] != null && <div style={{ fontSize: 12, color: C.sub }}>／ {target[key]}{ruleset.hillDisplay.enabled && d.isHill && !finished ? "（ヒル）" : ""}</div>}
                {ruleset.scoring.mode === "rackWinnerBonus" && !finished && (
                  <div style={{ fontSize: 12, color: C.sub, marginTop: 6 }}>このラック：{tally[key]}球</div>
                )}
              </div>
            );
          })}
        </div>

        {!finished && ruleset.scoring.mode === "rackWinnerBonus" && (
          <div style={{ marginBottom: 16 }}>
            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              {[1, 2].map((seat) => (
                <div key={seat} style={{ flex: 1, display: "flex", gap: 6 }}>
                  <button onClick={() => setTally((t) => ({ ...t, ["seat" + seat]: Math.max(0, t["seat" + seat] - 1) }))} style={{ ...menuBtn, marginBottom: 0, flex: 1 }}>−1球</button>
                  <button onClick={() => setTally((t) => ({ ...t, ["seat" + seat]: t["seat" + seat] + 1 }))} style={{ ...menuBtn, marginBottom: 0, flex: 1 }}>＋1球</button>
                </div>
              ))}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => addRackWon(1, tally.seat1)} style={{ ...menuBtn, marginBottom: 0, flex: 1, background: C.blue, color: "#fff", borderColor: C.blue }}>{n1}が9番で終了</button>
              <button onClick={() => addRackWon(2, tally.seat2)} style={{ ...menuBtn, marginBottom: 0, flex: 1, background: C.red, color: "#fff", borderColor: C.red }}>{n2}が9番で終了</button>
            </div>
          </div>
        )}

        {!finished && ruleset.scoring.mode === "perBallJPA" && (
          <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
            {[1, 2].map((seat) => (
              <div key={seat} style={{ flex: 1, display: "flex", flexDirection: "column", gap: 6 }}>
                <button onClick={() => addBallPocketed(seat, 1)} style={{ ...menuBtn, marginBottom: 0, background: seat === 1 ? C.lightBlue : C.lightRed, borderColor: seat === 1 ? C.blue : C.red }}>球（1点）</button>
                <button onClick={() => addBallPocketed(seat, 9)} style={{ ...menuBtn, marginBottom: 0, background: seat === 1 ? C.blue : C.red, color: "#fff", borderColor: seat === 1 ? C.blue : C.red }}>9番（2点・ラック終了）</button>
              </div>
            ))}
          </div>
        )}

        {!finished && ruleset.scoring.mode === "rackRace" && (
          <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
            <button onClick={() => addRackWon(1)} style={{ ...menuBtn, marginBottom: 0, flex: 1, background: C.blue, color: "#fff", borderColor: C.blue }}>{n1}がラック取得</button>
            <button onClick={() => addRackWon(2)} style={{ ...menuBtn, marginBottom: 0, flex: 1, background: C.red, color: "#fff", borderColor: C.red }}>{n2}がラック取得</button>
          </div>
        )}

        <button onClick={undo} disabled={events.length === 0} style={{ ...menuBtn, background: C.zone, fontWeight: 700, opacity: events.length === 0 ? 0.5 : 1 }}>↩️ 直前の記録を取り消す</button>

        <div style={{ fontSize: 13, fontWeight: 700, color: C.sub, margin: "18px 0 6px" }}>タイムライン</div>
        {events.length === 0 && <div style={{ color: C.sub, fontSize: 13, textAlign: "center", padding: "10px 0" }}>まだ記録がありません</div>}
        {events.slice().reverse().map((ev, i) => (
          <div key={events.length - 1 - i} style={{ fontSize: 13, color: C.ink, padding: "6px 2px", borderBottom: `1px solid ${C.line}` }}>
            {ev.type === "rackWon" && `● ラック：${ev.seat === 1 ? n1 : n2}${ev.ballsWonInRack != null ? `（${ev.ballsWonInRack}球）` : ""}`}
            {ev.type === "ballPocketed" && `○ 球：${ev.seat === 1 ? n1 : n2}（${ev.ball === 9 ? "9番・2点" : "1点"}）`}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ================================================================
   App本体
   ================================================================ */
function App() {
  const [tournaments, setTournaments] = useState([]);
  const [allPlayers, setAllPlayers] = useState([]);
  const [screen, setScreen] = useState("home"); // "home" | "new" | "tournament"
  const [activeTournament, setActiveTournament] = useState(null);

  useEffect(() => {
    const ref = db.ref("players");
    const cb = ref.on("value", (snap) => {
      const val = snap.val() || {};
      setAllPlayers(Object.values(val).sort((a, b) => a.name.localeCompare(b.name, "ja")));
    });
    return () => ref.off("value", cb);
  }, []);

  useEffect(() => {
    const ref = db.ref("tournaments");
    const cb = ref.on("value", (snap) => {
      const val = snap.val() || {};
      setTournaments(Object.values(val).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)));
    });
    return () => ref.off("value", cb);
  }, []);

  useEffect(() => {
    if (!activeTournament) return;
    const ref = db.ref("tournaments/" + activeTournament.tournamentId);
    const cb = ref.on("value", (snap) => {
      const val = snap.val();
      if (val) setActiveTournament(val);
    });
    return () => ref.off("value", cb);
  }, [activeTournament && activeTournament.tournamentId]);

  const createTournament = (t) => {
    db.ref("tournaments/" + t.tournamentId).set(t);
    setActiveTournament(t);
    setScreen("tournament");
  };

  const updateTournament = (t) => {
    db.ref("tournaments/" + t.tournamentId).set({ ...t, updatedAt: Date.now() });
  };

  if (screen === "new") {
    return <NewTournamentScreen onCreate={createTournament} onCancel={() => setScreen("home")} />;
  }
  if (screen === "tournament" && activeTournament) {
    return <TournamentScreen tournament={activeTournament} allPlayers={allPlayers} onBack={() => setScreen("home")} onUpdateTournament={updateTournament} />;
  }
  return <HomeScreen tournaments={tournaments} onOpen={(t) => { setActiveTournament(t); setScreen("tournament"); }} onNew={() => setScreen("new")} />;
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  showCrash(String((e && e.stack) || e));
}
</script>
</body>
</html>
