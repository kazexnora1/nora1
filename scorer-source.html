<body>
<div id="root"></div>
<div id="crashlog" style="display:none; position:fixed; inset:0; background:#fff3f3; color:#7A2E2E; padding:16px; font-family:monospace; font-size:13px; white-space:pre-wrap; overflow:auto; z-index:9999;"></div>
<script>
  function showCrash(msg) {
    var el = document.getElementById("crashlog");
    el.style.display = "block";
    el.textContent = "エラーが発生しました:\n\n" + msg;
  }
  window.onerror = function (msg, src, line, col, err) {
    showCrash(msg + "\n" + (src || "") + ":" + line + ":" + col + "\n" + (err && err.stack ? err.stack : ""));
  };
  window.addEventListener("unhandledrejection", function (e) {
    showCrash("Promise rejected: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* =========================================================
   ビリヤード スコアラー（単体版）
   ・通信なし。すべて端末の中だけで動く（保存もこの端末のみ）
   ・試合はこのアプリの中で作る（本部アプリ・共有データベースは不要）
   ・進行中の試合は自動保存され、読み込み直すと続きから再開できる
   ========================================================= */

const FONT = "system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif";
// 更新のたびに数字を上げる。新しいファイルを置くと、開いている端末に更新バナーが出る
const APP_VERSION = "1.000";
const BUILD_TIME = "2026-09-01 単体版の初版";

const C = {
  bg: "#FFFFFF", zone: "#F5F6F8", card: "#FFFFFF", ink: "#1C2530", sub: "#6A7480", line: "#E4E7EB",
  blue: "#2E6DB5", red: "#C6392E", lightBlue: "#E9F1FB", lightRed: "#FBEBE9",
  win: "#2E7D46", hill: "#B26A1E", hillBg: "#FFF3E0", minus: "#C0392B", dead: "#B9B4A8",
};
const PC = [C.blue, C.red];

/* ========= 球の色 =========
   実際の球のセットに合わせて3種類。違いは色だけで、形は共通 */
const BALL_PALETTES = {
  a: { 1: "#E3A645", 2: "#193B7F", 3: "#C44341", 4: "#EC7882", 5: "#EC834E", 6: "#2A5C44", 7: "#966338", 8: "#271F1D", 9: "#E3A645", 10: "#193B7F" },
  b: { 1: "#F3C25B", 2: "#285090", 3: "#C44341", 4: "#734D7D", 5: "#EC834E", 6: "#90826F", 7: "#A8D6C6", 8: "#271F1D", 9: "#F3C25B", 10: "#285090" },
  c: { 1: "#E3A645", 2: "#285090", 3: "#C44341", 4: "#734D7D", 5: "#EC834E", 6: "#2A5C44", 7: "#AB7740", 8: "#271F1D", 9: "#E3A645", 10: "#285090" },
};
const BALL_DESIGN_SETS = [
  { id: "a", name: "カラーA" },
  { id: "b", name: "カラーB" },
  { id: "c", name: "カラーC" },
];
const DEFAULT_DESIGN = "a";
const paletteFor = (id) => BALL_PALETTES[id] || BALL_PALETTES[DEFAULT_DESIGN];

const mkBalls = (n) => Array.from({ length: Number(n) > 0 ? Number(n) : 9 }, (_, i) => ({ n: i + 1, loc: "c", dead: false }));

/* ========= 試合ルールの3軸（種目 × 得点方式 × ブレイク順） ========= */
const RULE_GAMES = {
  "9": { balls: 9, money: 9, label: "9ボール" },
  "10": { balls: 10, money: 10, label: "10ボール" },
  "8": { balls: 8, money: 8, label: "8ボール" },
};
/* 球1点・ゲームボール2点の数え方 */
const ballPts = (balls, loc, money) =>
  balls.filter((x) => x.loc === loc && !x.dead).reduce((sum, b) => sum + (b.n === money ? 2 : 1), 0);

const SCORING_DEFS = {
  jcl: {
    label: "14点制（レートハンデ）", unit: "point", hill: 14,
    sub: "ゲームボールを落とした側が14点、相手は落とした球の数",
    calcAdd: (balls, w) => {
      const ll = w === 0 ? "p2" : "p1";
      const loserPts = balls.filter((x) => x.loc === ll && !x.dead).length;
      const add = [0, 0];
      add[w] = 14;
      add[1 - w] = loserPts;
      return add;
    },
    calcLive: (balls, side) => balls.filter((b) => b.loc === side && !b.dead).length,
  },
  jpa_fixed: {
    label: "ボール加点（目標点）", unit: "point", hill: null,
    sub: "球1点・ゲームボール2点。先に目標点へ届いた方が勝ち",
    calcAdd: (balls, _w, g) => [ballPts(balls, "p1", g.money), ballPts(balls, "p2", g.money)],
    calcLive: (balls, side, g) => ballPts(balls, side, g.money),
  },
  set: {
    label: "セットマッチ（ラック先取）", unit: "rack", hill: null,
    sub: "ラックを取った側に1点。先に目標ラック数へ届いた方が勝ち",
    calcAdd: (_balls, w) => { const add = [0, 0]; add[w] = 1; return add; },
    calcLive: () => 0,
  },
};
const BREAK_MODES = [
  { id: "alternate", label: "交互ブレイク", sub: "1ラックごとに交代" },
  { id: "winner", label: "勝者ブレイク", sub: "そのラックを取った人が続けてブレイク" },
];

function specOf(src) {
  const o = src || {};
  return {
    game: RULE_GAMES[o.game] ? o.game : "9",
    scoring: SCORING_DEFS[o.scoring] ? o.scoring : "jcl",
    breakMode: o.breakMode === "winner" ? "winner" : "alternate",
  };
}
function makeRuleset(spec) {
  const g = RULE_GAMES[spec.game] || RULE_GAMES["9"];
  const sc = SCORING_DEFS[spec.scoring] || SCORING_DEFS.jcl;
  return {
    spec, unit: sc.unit,
    ballCount: g.balls,
    money: g.money,           // ゲームボール（これを落とすとラック確定）
    hillThreshold: sc.hill,   // 14点制だけが持つ「ヒル」の閾値。null なら「あと◯」表記
    // 8ボールの14点制だけは球を1つずつ追わず、「勝者」と「負けた側の残り球数」だけでラックを確定する
    simplified8: spec.game === "8" && spec.scoring === "jcl",
    label: RULE_GAMES[spec.game].label + "・" + sc.label,
    calcAdd: (balls, w) => sc.calcAdd(balls, w, g),
    calcLive: (balls, side) => sc.calcLive(balls, side, g),
    nextBrk: (lastResult, curBrk) => (spec.breakMode === "winner" ? (lastResult ? lastResult.w : curBrk) : 1 - curBrk),
  };
}
const getRuleset = (src) => makeRuleset(specOf(src));
const ballCountOf = (src) => (RULE_GAMES[specOf(src).game] || RULE_GAMES["9"]).balls;

/* ========= レートから目標点を出す（14点制のハンデ計算） ========= */
function roundHalfToEven(v) {
  const w = Math.floor(v);
  const d = v - w;
  if (Math.abs(d - 0.5) > 1e-9) return d > 0.5 ? w + 1 : w;
  return w % 2 === 1 ? w + 1 : w;
}
function normalizeRace(rt1, rt2, lowClamp) {
  const highClamp = 99.0;
  const p1IsHigh = rt1 >= rt2;
  const highRace = Math.max(rt1, rt2), lowRace = Math.min(rt1, rt2);
  let highC = highRace > highClamp ? highClamp : highRace;
  let lowC = highRace > highClamp ? lowRace - lowRace * ((highRace - highClamp) / highRace) : lowRace;
  highC = Math.min(lowRace < lowClamp ? highC + highC * ((lowClamp - lowRace) / lowC) : highC, highClamp);
  lowC = Math.max(lowC < lowClamp ? lowClamp : lowC, lowClamp);
  return { rt1: p1IsHigh ? highC : lowC, rt2: p1IsHigh ? lowC : highC };
}
function computeRace(R1, R2, lenPct) {
  const dampFactor = lenPct / 100;
  const avg = (R1 + R2) / 2;
  const gp = 0.018 * avg - 1.4;
  const delta = R1 - R2;
  const p1 = 1 - 1 / (1 + Math.pow(2, delta / 100));
  const p2 = 1 - p1;
  const p1AvgPts = p1 * 14.0 + p2 * (7.4 - 0.0062 * R2);
  const p2AvgPts = p2 * 14.0 + p1 * (7.4 - 0.0062 * R1);
  const rt1raw = p1AvgPts * gp * dampFactor;
  const rt2raw = p2AvgPts * gp * dampFactor;
  const lowClamp = 0.16 * lenPct + 12;
  const norm = normalizeRace(rt1raw, rt2raw, lowClamp);
  return { rt1: roundHalfToEven(norm.rt1), rt2: roundHalfToEven(norm.rt2) };
}

/* ========= 端末内の保存 =========
   通信は一切しない。進行中の試合と、前回の設定だけを残す */
const CUR_KEY = "solo_scorer_current_v1";
const SETUP_KEY = "solo_scorer_setup_v1";
const DESIGN_KEY = "solo_scorer_ball_design_v1";
const HELP_KEY = "solo_scorer_help_seen_v1";

function saveCurrent(setup, state) {
  try { localStorage.setItem(CUR_KEY, JSON.stringify({ setup, state, at: Date.now() })); } catch {}
}
function loadCurrent() {
  try {
    const v = JSON.parse(localStorage.getItem(CUR_KEY));
    return v && v.setup && v.state ? v : null;
  } catch { return null; }
}
function clearCurrent() { try { localStorage.removeItem(CUR_KEY); } catch {} }
function saveSetupDefaults(s) { try { localStorage.setItem(SETUP_KEY, JSON.stringify(s)); } catch {} }
function loadSetupDefaults() {
  try { return JSON.parse(localStorage.getItem(SETUP_KEY)) || null; } catch { return null; }
}
function loadBallDesign() {
  try {
    const v = localStorage.getItem(DESIGN_KEY);
    return BALL_DESIGN_SETS.some((d) => d.id === v) ? v : DEFAULT_DESIGN;
  } catch { return DEFAULT_DESIGN; }
}
function saveBallDesign(id) { try { localStorage.setItem(DESIGN_KEY, id); } catch {} }

/* 紙吹雪。ライブラリが読み込めていない時（オフラインなど）は静かに何もしない */
function fireConfetti(big) {
  if (typeof window.confetti !== "function") return;
  window.confetti({ particleCount: big ? 140 : 90, spread: big ? 100 : 80, origin: { y: 0.4 }, zIndex: 4000 });
  if (big) setTimeout(() => window.confetti({ particleCount: 80, spread: 120, origin: { y: 0.3 }, zIndex: 4000 }), 200);
}

function initialMatchState(setup) {
  return {
    version: 1,
    phase: "banking",     // banking（先攻決め）| play | done（ラック確定）| finished
    brk: null,
    tot: [0, 0],
    rack: 1,
    balls: mkBalls(ballCountOf(setup)),
    lastResult: null,
    hist: [],
    raceTo: [setup.raceTo[0], setup.raceTo[1]],
    names: [setup.names[0], setup.names[1]],
    startedAt: null,
    deadline: null,       // 時間切れの時刻（絶対時刻）
    pauseStart: null,
    finishedAt: null,
    elapsedMs: null,
    winner: null,
    bothLose: false,
  };
}

const fmtClock = (ms) => {
  const d = new Date(ms);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
};

/* ========= 新しいバージョンの検知 =========
   自分自身のURLをキャッシュ無視で取りに行き、埋め込まれたAPP_VERSIONが違えば知らせる */
function useVersionCheck() {
  const [newVersion, setNewVersion] = useState(null);
  useEffect(() => {
    let cancelled = false;
    const check = async () => {
      try {
        const res = await fetch(window.location.pathname + "?_=" + Date.now(), { cache: "no-store" });
        const text = await res.text();
        const m = text.match(/const APP_VERSION = "([^"]+)"/);
        if (!cancelled && m && m[1] && m[1] !== APP_VERSION) setNewVersion(m[1]);
      } catch {}
    };
    check();
    const iv = setInterval(check, 90000);
    const onVis = () => { if (document.visibilityState === "visible") check(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { cancelled = true; clearInterval(iv); document.removeEventListener("visibilitychange", onVis); };
  }, []);
  return newVersion;
}
function UpdateBanner() {
  const newVersion = useVersionCheck();
  const [dismissed, setDismissed] = useState(false);
  if (!newVersion || dismissed) return null;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, background: C.blue, color: "#fff", padding: "7px 12px", fontSize: 13, fontWeight: 800, flexShrink: 0 }}>
      <span onClick={() => window.location.reload()} style={{ flex: 1, cursor: "pointer" }}>🔄 新しいバージョンがあります・タップで更新</span>
      <span onClick={() => setDismissed(true)} style={{ cursor: "pointer", opacity: 0.85, padding: "0 4px" }}>✕</span>
    </div>
  );
}

/* ========= 共通の小さな部品 ========= */
const btnBase = { border: "none", borderRadius: 12, fontFamily: FONT, cursor: "pointer", fontWeight: 800 };
const ctrl = { flex: 1, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "9px 2px", fontSize: 13.5, fontWeight: 700, color: C.ink, cursor: "pointer", fontFamily: FONT };
const inputStyle = {
  width: "100%", boxSizing: "border-box", background: "#fff", border: `1px solid ${C.line}`,
  borderRadius: 10, color: C.ink, fontSize: 16, padding: "12px", outline: "none", fontFamily: FONT,
};

function Stepper({ label, value, min, max, step, onChange }) {
  const st = step || 1;
  const b = { width: 40, height: 40, borderRadius: 10, border: `1px solid ${C.line}`, background: "#fff", color: C.ink, fontSize: 19, cursor: "pointer", fontFamily: FONT };
  return (
    <div style={{ flex: 1, minWidth: 0, background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: "10px 10px 12px" }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: C.sub, marginBottom: 6, textAlign: "center" }}>{label}</div>
      <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
        <button style={b} onClick={() => onChange(Math.max(min, value - st))}>−</button>
        <div style={{ flex: 1, textAlign: "center", fontSize: 22, fontWeight: 800, fontVariantNumeric: "tabular-nums" }}>{value}</div>
        <button style={b} onClick={() => onChange(Math.min(max, value + st))}>＋</button>
      </div>
    </div>
  );
}

function Sheet({ title, onClose, children }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.55)", zIndex: 2000, display: "flex", alignItems: "flex-end" }}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: "#fff", width: "100%", maxWidth: 480, margin: "0 auto", boxSizing: "border-box",
        maxHeight: "86vh", overflowY: "auto", borderRadius: "18px 18px 0 0",
        padding: "16px 16px calc(20px + env(safe-area-inset-bottom, 0px))",
      }}>
        <div style={{ width: 40, height: 4, background: C.line, borderRadius: 2, margin: "0 auto 12px" }} />
        {title && <div style={{ fontSize: 17, fontWeight: 900, marginBottom: 12, color: C.ink }}>{title}</div>}
        {children}
        <button onClick={onClose} style={{ ...btnBase, width: "100%", background: C.zone, border: `1px solid ${C.line}`, padding: "12px 0", fontSize: 14, color: C.ink, marginTop: 14 }}>閉じる</button>
      </div>
    </div>
  );
}

/* ========= 使い方（初めて開いた人向け） ========= */
function HelpBody() {
  const row = (icon, title, body) => (
    <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
      <div style={{ fontSize: 20, flexShrink: 0, width: 26, textAlign: "center" }}>{icon}</div>
      <div style={{ minWidth: 0 }}>
        <div style={{ fontSize: 14.5, fontWeight: 800, color: C.ink }}>{title}</div>
        <div style={{ fontSize: 13, color: "#3F4A55", lineHeight: 1.75, marginTop: 2 }}>{body}</div>
      </div>
    </div>
  );
  return (
    <div>
      {row("🎱", "球を動かして点を入れる", "落とした球を、入れた人の側へ上下にスワイプします。球をタップして選んでから、名前のエリアをタップしても動きます。選手エリアの球は、真ん中の球エリアをタップすると台に戻ります。")}
      {row("✖️", "ノーカウントの球", "台にある球を素早く2回タップすると、点にならない球（無効球）にできます。もう一度2回タップで戻ります。")}
      {row("🏁", "ラックの終わり", "ゲームボール（9ボールなら9番）を入れた人の側へ動かすと、そのラックが確定します。数字が違っていれば「訂正」で戻せます。")}
      {row("↩︎", "間違えたとき", "「1手戻す」で直前の操作、「1ラック戻す」で前のラックまで戻せます。")}
      {row("📱", "この端末だけで動きます", "記録はこの端末の中だけに保存され、どこにも送られません。試合が終わると消えます。")}
    </div>
  );
}

/* ========= 左上のメニュー ========= */
function MenuButton({ style, ballDesign, onSetBallDesign, onQuit }) {
  const [open, setOpen] = useState(false);
  const [view, setView] = useState(null); // null | "help" | "design" | "share"
  const qrRef = useRef(null);
  const url = window.location.origin + window.location.pathname;

  useEffect(() => {
    if (view !== "share" || !qrRef.current) return;
    qrRef.current.innerHTML = "";
    try { new QRCode(qrRef.current, { text: url, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M }); } catch {}
  }, [view, url]);

  const item = {
    width: "100%", textAlign: "left", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10,
    padding: "13px 14px", fontSize: 14.5, fontWeight: 700, color: C.ink, cursor: "pointer", fontFamily: FONT, marginBottom: 8,
  };
  const close = () => { setOpen(false); setView(null); };

  return (
    <>
      <button onClick={() => { setOpen(true); setView(null); }} style={{
        background: "#fff", border: `1.5px solid ${C.line}`, borderRadius: 10, padding: "6px 11px",
        fontSize: 13, fontWeight: 800, color: C.ink, cursor: "pointer", fontFamily: FONT, whiteSpace: "nowrap", ...style,
      }}>☰ メニュー</button>

      {open && (
        <Sheet title={view === "help" ? "📖 使い方" : view === "design" ? "🎱 球の色" : view === "share" ? "📱 このアプリを渡す" : "☰ メニュー"} onClose={close}>
          {view === null && (
            <>
              <button onClick={() => setView("help")} style={item}>📖 使い方</button>
              <button onClick={() => setView("design")} style={item}>🎱 球の色</button>
              <button onClick={() => setView("share")} style={item}>📱 このアプリを渡す（QR）</button>
              {onQuit && (
                <button onClick={() => { close(); onQuit(); }} style={{ ...item, borderColor: C.minus, color: C.minus, marginBottom: 0 }}>
                  🚫 この試合をやめる
                </button>
              )}
            </>
          )}
          {view === "help" && <HelpBody />}
          {view === "design" && (
            <>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, justifyContent: "center", marginBottom: 8 }}>
                {BALL_DESIGN_SETS.map((d) => (
                  <button key={d.id} onClick={() => onSetBallDesign(d.id)} style={{
                    background: ballDesign === d.id ? C.blue : "#fff", color: ballDesign === d.id ? "#fff" : C.ink,
                    border: `1.5px solid ${ballDesign === d.id ? C.blue : C.line}`, borderRadius: 20,
                    padding: "9px 15px", fontSize: 13.5, fontWeight: 700, cursor: "pointer", fontFamily: FONT,
                  }}>{d.name}</button>
                ))}
              </div>
              <div style={{ display: "flex", justifyContent: "center", gap: 6, marginBottom: 8 }}>
                {[1, 2, 3, 4, 5].map((n) => (
                  <div key={n} style={{
                    width: 34, height: 34, borderRadius: 34, background: paletteFor(ballDesign)[n],
                    display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 14, fontWeight: 800,
                    border: "2px solid rgba(255,255,255,0.85)", boxShadow: "0 2px 5px rgba(0,0,0,0.18)",
                  }}>{n}</div>
                ))}
              </div>
              <div style={{ fontSize: 11.5, color: C.sub, lineHeight: 1.7, textAlign: "center" }}>
                手持ちの球に近い色を選べます。この端末だけの設定です
              </div>
            </>
          )}
          {view === "share" && (
            <div style={{ textAlign: "center" }}>

            </div>
          )}
        </Sheet>
      )}
    </>
  );
}

function MatchScreen({ setup, saved, onExit, ballDesign, onSetBallDesign }) {
  const ruleset = getRuleset(setup);
  const names = setup.names;
  const timeLimitEnabled = !!setup.timeLimit;

  const [state, setState] = useState(() => saved || initialMatchState(setup));
  const [nowTs, setNowTs] = useState(Date.now());
  const [pressed, setPressed] = useState(null);
  const [selectedBall, setSelectedBall] = useState(null); // タップで選んだ球
  const [dragDir, setDragDir] = useState(null);
  const [undoStack, setUndoStack] = useState([]);
  const [pendingWinner8, setPendingWinner8] = useState(null);
  const [toolsOpen, setToolsOpen] = useState(false);
  const [suppressWin, setSuppressWin] = useState(false);

  const palette = paletteFor(ballDesign);
  const stateRef = useRef(state);
  stateRef.current = state;

  useEffect(() => { const iv = setInterval(() => setNowTs(Date.now()), 1000); return () => clearInterval(iv); }, []);
  // 変わるたびに端末へ控える（読み込み直しても続きから開ける）
  useEffect(() => { saveCurrent(setup, state); }, [state, setup]);

  // 球エリア内では画面スクロールを止め、球の操作だけ効くようにする
  const playAreaRef = useRef(null);
  useEffect(() => {
    const el = playAreaRef.current;
    if (!el) return;
    const block = (e) => e.preventDefault();
    el.addEventListener("touchmove", block, { passive: false });
    return () => el.removeEventListener("touchmove", block, { passive: false });
  });

  const applyLocal = (updater) => {
    setState((s) => {
      const next = typeof updater === "function" ? updater(s) : updater;
      return { ...next, version: s.version + 1 };
    });
  };
  const pushUndo = () => setUndoStack((s) => [...s.slice(-19), stateRef.current]);

  const { tot, rack, brk, balls, phase, lastResult, hist } = state;
  const rt = (i) => state.raceTo[i] || 0;
  const pl = [{ name: names[0], raceTo: String(state.raceTo[0]) }, { name: names[1], raceTo: String(state.raceTo[1]) }];

  useEffect(() => { setSelectedBall(null); }, [rack, phase]);

  const live = [ruleset.calcLive(balls, "p1"), ruleset.calcLive(balls, "p2")];
  const liveTot = phase === "play" ? [tot[0] + live[0], tot[1] + live[1]] : [tot[0], tot[1]];
  // ヒルヒルは14点制だけの概念
  const hillHill = ruleset.hillThreshold != null
    ? rt(0) > 0 && rt(1) > 0 && rt(0) - tot[0] <= ruleset.hillThreshold && rt(1) - tot[1] <= ruleset.hillThreshold
    : false;
  // 14点制はラック確定分だけを表示（台上の球では動かさない）。ボール加点は常時ライブ更新
  const disp = ruleset.hillThreshold != null
    ? [tot[0], tot[1]]
    : (phase === "play" && !hillHill ? liveTot : [tot[0], tot[1]]);

  /* ===== 持ち時間 ===== */
  const deadline = state.deadline || null;
  const paused = !!state.pauseStart;
  const msLeft = deadline ? deadline - (state.finishedAt || (paused ? state.pauseStart : nowTs)) : null;
  const isTimeUp = msLeft != null && msLeft <= 0;
  const timeParts = msLeft == null ? ["--", "--"] : (() => {
    const s = Math.max(0, Math.floor(msLeft / 1000));
    return [String(Math.floor(s / 60)).padStart(2, "0"), String(s % 60).padStart(2, "0")];
  })();
  const rate = (i) => (rt(i) > 0 ? Math.min(1, tot[i] / rt(i)) : 0);

  /* ===== 勝敗判定 ===== */
  const reached = [rt(0) > 0 && tot[0] >= rt(0), rt(1) > 0 && tot[1] >= rt(1)];
  let matchWinner = null;
  if (reached[0] && reached[1]) matchWinner = lastResult ? lastResult.w : 0;
  else if (reached[0]) matchWinner = 0;
  else if (reached[1]) matchWinner = 1;
  else if (phase === "play" && !hillHill && !suppressWin) {
    if (liveTot[0] >= rt(0) && rt(0) > 0) matchWinner = 0;
    else if (liveTot[1] >= rt(1) && rt(1) > 0) matchWinner = 1;
  }
  // 時間切れ後は今のラックが最終ラック。終わってもどちらも届かなければ引き分け
  const bothLose = matchWinner == null && isTimeUp && phase === "done";
  const isFinalRack = isTimeUp && matchWinner == null && !bothLose;

  useEffect(() => {
    if ((matchWinner != null || bothLose) && !state.finishedAt) {
      const fin = Date.now();
      // ゲームボールを落とす前に目標点へ届いた決着。台上の球をここで確定させる
      const midRackWin = matchWinner != null && phase === "play" && !reached[matchWinner];
      if (midRackWin) pushUndo();
      applyLocal((s) => ({
        ...s,
        ...(midRackWin ? { tot: [liveTot[0], liveTot[1]], balls: mkBalls(ruleset.ballCount), phase: "done", lastResult: null } : {}),
        finishedAt: fin,
        elapsedMs: s.startedAt ? fin - s.startedAt : null,
        winner: matchWinner,
        bothLose,
      }));
    } else if (matchWinner == null && !bothLose && state.finishedAt) {
      applyLocal((s) => ({ ...s, finishedAt: null, elapsedMs: null, winner: null, bothLose: false }));
    }
  }, [matchWinner, bothLose, state.finishedAt]);

  const confettiFiredRef = useRef(false);
  useEffect(() => {
    if (matchWinner != null && !confettiFiredRef.current) { confettiFiredRef.current = true; fireConfetti(true); }
    else if (matchWinner == null) confettiFiredRef.current = false;
  }, [matchWinner]);

  // 台上の球を直して目標に届かなくなったら、ふつうの判定に戻す
  useEffect(() => {
    if (!suppressWin) return;
    const over = (rt(0) > 0 && liveTot[0] >= rt(0)) || (rt(1) > 0 && liveTot[1] >= rt(1));
    if (!over) setSuppressWin(false);
  }, [suppressWin, liveTot[0], liveTot[1]]);

  /* ===== 操作 ===== */
  const finish = (nb, w) => {
    pushUndo();
    const add = ruleset.calcAdd(nb, w);
    const entry = { rack, w, add, brk, hill: hillHill, at: Date.now() };
    applyLocal((s) => ({ ...s, balls: nb, tot: [s.tot[0] + add[0], s.tot[1] + add[1]], lastResult: entry, hist: [...s.hist, entry], phase: "done" }));
  };
  const move = (n, dir) => {
    if (phase !== "play") return;
    const b = balls.find((x) => x.n === n);
    let loc = b.loc;
    if (dir === "up") loc = b.loc === "c" ? "p1" : b.loc === "p2" ? "c" : "p1";
    else loc = b.loc === "c" ? "p2" : b.loc === "p1" ? "c" : "p2";
    const nb = balls.map((x) => (x.n === n ? { ...x, loc } : x));
    if (n === ruleset.money && (loc === "p1" || loc === "p2") && !b.dead) finish(nb, loc === "p1" ? 0 : 1);
    else { pushUndo(); applyLocal((s) => ({ ...s, balls: nb })); }
  };
  const toggleDead = (n) => {
    if (phase !== "play") return;
    pushUndo();
    applyLocal((s) => ({ ...s, balls: s.balls.map((b) => (b.n === n ? { ...b, dead: !b.dead } : b)) }));
  };
  const undoLast = () => setUndoStack((s) => {
    if (!s.length) return s;
    const prev = s[s.length - 1];
    applyLocal(prev);
    return s.slice(0, -1);
  });
  const correct = () => {
    // ゲームボール以外で決まった時はラックの結果が無いので、決着する直前の状態へ戻す
    if (!lastResult) {
      if (!undoStack.length) return;
      setSuppressWin(true);
      undoLast();
      return;
    }
    pushUndo();
    applyLocal((s) => ({
      ...s, tot: [s.tot[0] - s.lastResult.add[0], s.tot[1] - s.lastResult.add[1]],
      hist: s.hist.slice(0, -1), lastResult: null, phase: "play",
    }));
  };
  const nextRack = () => {
    pushUndo();
    applyLocal((s) => ({ ...s, balls: mkBalls(ruleset.ballCount), rack: s.rack + 1, brk: ruleset.nextBrk(s.lastResult, s.brk), lastResult: null, phase: "play" }));
  };
  const undoRack = () => {
    pushUndo();
    applyLocal((s) => {
      if (!s.hist.length) return s;
      const last = s.hist[s.hist.length - 1];
      return { ...s, tot: [s.tot[0] - last.add[0], s.tot[1] - last.add[1]], rack: last.rack, brk: last.brk, balls: mkBalls(ruleset.ballCount), phase: "play", lastResult: null, hist: s.hist.slice(0, -1) };
    });
  };
  // セットマッチ：球を動かさず、名前をタップして1ラック確定
  const recordSetRack = (w) => {
    if (ruleset.unit !== "rack" || phase !== "play" || matchWinner != null || bothLose) return;
    pushUndo();
    const add = [0, 0];
    add[w] = 1;
    applyLocal((s) => ({ ...s, tot: [s.tot[0] + add[0], s.tot[1] + add[1]], rack: s.rack + 1, brk: ruleset.nextBrk({ w }, s.brk), hist: [...s.hist, { rack: s.rack, w, add, brk: s.brk, hill: false, at: Date.now() }] }));
  };
  // 8ボールの14点制：勝者（14点固定）と、負けた側の残り球数（0〜7）だけでラックを確定
  const recordEightBallRack = (w, loserCount) => {
    if (!ruleset.simplified8 || phase !== "play" || matchWinner != null || bothLose) return;
    pushUndo();
    const add = [0, 0];
    add[w] = 14;
    add[1 - w] = Math.max(0, Math.min(7, loserCount));
    applyLocal((s) => ({ ...s, tot: [s.tot[0] + add[0], s.tot[1] + add[1]], rack: s.rack + 1, brk: ruleset.nextBrk({ w }, s.brk), hist: [...s.hist, { rack: s.rack, w, add, brk: s.brk, hill: false, at: Date.now() }] }));
    setPendingWinner8(null);
  };
  const rematch = () => {
    setUndoStack([]);
    setPendingWinner8(null);
    const now = Date.now();
    applyLocal((s) => ({
      ...s, tot: [0, 0], rack: 1, brk: null, balls: mkBalls(ruleset.ballCount), phase: "banking",
      lastResult: null, hist: [], startedAt: null, deadline: null, pauseStart: null,
      finishedAt: null, elapsedMs: null, winner: null, bothLose: false,
    }));
  };
  const chooseBreak = (i) => {
    applyLocal((s) => {
      if (s.startedAt) return { ...s, brk: i, phase: "play" };
      const now = Date.now();
      return { ...s, brk: i, phase: "play", startedAt: now, deadline: timeLimitEnabled ? now + (setup.minutes || 30) * 60000 : null };
    });
  };
  const swapBreak = () => {
    if (phase !== "play") return;
    if (window.confirm("ブレイク順を入れ替えますか？")) { pushUndo(); applyLocal((s) => ({ ...s, brk: 1 - s.brk })); }
  };
  const togglePause = () => {
    applyLocal((s) => {
      if (s.pauseStart) {
        const pausedMs = Date.now() - s.pauseStart;
        return { ...s, deadline: (s.deadline || Date.now()) + pausedMs, pauseStart: null };
      }
      return { ...s, pauseStart: Date.now() };
    });
  };
  const addTime = (min) => { pushUndo(); applyLocal((s) => ({ ...s, deadline: (s.deadline || Date.now()) + min * 60000 })); };
  const quit = () => {
    if (!window.confirm("この試合をやめます。記録は消えます。\nよろしいですか？")) return;
    onExit();
  };

  /* ===== 球のジェスチャー ===== */
  const lastTapRef = useRef({});
  const onPress = useCallback((n, isPressed) => { setPressed(isPressed ? n : null); }, []);
  const returnSelectedToCenter = () => {
    if (selectedBall == null) return;
    const b = balls.find((x) => x.n === selectedBall);
    if (!b || b.loc === "c" || phase !== "play") { setSelectedBall(null); return; }
    pushUndo();
    applyLocal((s) => ({ ...s, balls: s.balls.map((x) => (x.n === selectedBall ? { ...x, loc: "c" } : x)) }));
    setSelectedBall(null);
  };
  const gestureImpl = (n, dy, area) => {
    if (Math.abs(dy) > 28) { lastTapRef.current[n] = 0; setSelectedBall(null); move(n, dy < 0 ? "up" : "down"); return; }
    if (area === "rack") {
      const now = Date.now();
      const isDoubleTap = lastTapRef.current[n] && now - lastTapRef.current[n] < 340;
      lastTapRef.current[n] = isDoubleTap ? 0 : now;
      if (isDoubleTap) { toggleDead(n); setSelectedBall(null); return; }
    }
    if (selectedBall != null) {
      const sb = balls.find((x) => x.n === selectedBall);
      if (sb && sb.loc !== "c") { returnSelectedToCenter(); return; }
    }
    setSelectedBall((cur) => (cur === n ? null : n));
  };
  const gestureRef = useRef(gestureImpl);
  gestureRef.current = gestureImpl;
  const onGesture = useCallback((n, dy, area) => gestureRef.current(n, dy, area), []);
  const dragImpl = (n, dir) => { setDragDir(dir); if (dir != null) setSelectedBall(null); };
  const dragRef = useRef(dragImpl);
  dragRef.current = dragImpl;
  const onDrag = useCallback((n, dir) => dragRef.current(n, dir), []);
  const commitSelectedTo = (dir) => { if (selectedBall == null) return; move(selectedBall, dir); setSelectedBall(null); };
  const highlightUp = selectedBall != null || dragDir === "up";
  const highlightDown = selectedBall != null || dragDir === "down";
  const selectedOffTable = selectedBall != null && (balls.find((b) => b.n === selectedBall) || {}).loc !== "c";

  // 球のデザインを左右スワイプで切り替える
  const designSwipeRef = useRef({ x: 0, y: 0, active: false });
  const cycleBallDesign = (dir) => {
    const idx = BALL_DESIGN_SETS.findIndex((d) => d.id === ballDesign);
    const next = BALL_DESIGN_SETS[(((idx < 0 ? 0 : idx) + dir) % BALL_DESIGN_SETS.length + BALL_DESIGN_SETS.length) % BALL_DESIGN_SETS.length];
    if (next) onSetBallDesign(next.id);
  };
  const onDesignSwipeStart = (e) => { const t = e.touches[0]; designSwipeRef.current = { x: t.clientX, y: t.clientY, active: true }; };
  const onDesignSwipeEnd = (e) => {
    if (!designSwipeRef.current.active) return;
    designSwipeRef.current.active = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - designSwipeRef.current.x, dy = t.clientY - designSwipeRef.current.y;
    if (Math.abs(dx) > 36 && Math.abs(dx) > Math.abs(dy) * 1.5) cycleBallDesign(dx < 0 ? 1 : -1);
  };

  const hillInfo = (i) => {
    if (matchWinner != null || bothLose) {
      if (matchWinner === i) return { txt: "勝ち", on: true };
      return { txt: "あと" + Math.max(0, rt(i) - disp[i]), on: false };
    }
    if (rt(i) <= 0) return { txt: "", on: false };
    if (ruleset.hillThreshold == null) {
      const rem = rt(i) - disp[i];
      if (rem <= 0) return { txt: "達成", on: true };
      return rem <= 3 ? { txt: "あと" + rem + "！", on: true } : rem <= 5 ? { txt: "あと" + rem, on: true } : { txt: "あと" + rem, on: false };
    }
    const rem = rt(i) - tot[i];
    if (rem <= 0) return { txt: "達成", on: true };
    if (hillHill) return { txt: i === 0 ? "ヒルヒル！" : ruleset.money + "番勝負！", on: true };
    const toHill = rem - ruleset.hillThreshold;
    return toHill > 0 ? { txt: "あと" + toHill + "でヒル", on: false } : { txt: "あと" + rem + "で勝ち", on: true };
  };

  const col = (loc) => balls.filter((b) => b.loc === loc);
  const winnerLoc = lastResult ? (lastResult.w === 0 ? "p1" : "p2") : null;
  const histRows = hist.map((h) => ({ ...h }));

  /* ===== バンキング（先攻決め） ===== */
  if (phase === "banking") {
    return (
      <div style={{ maxWidth: 480, margin: "0 auto", padding: "14px 16px 60px", fontFamily: FONT, color: C.ink }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <MenuButton ballDesign={ballDesign} onSetBallDesign={onSetBallDesign} onQuit={quit} />
          <span style={{ fontSize: 12.5, color: C.sub, fontWeight: 700 }}>{ruleset.label}</span>
        </div>
        <div style={{ fontSize: 22, fontWeight: 800, marginBottom: 6, textAlign: "center" }}>先攻を決める</div>
        <div style={{ fontSize: 14, color: C.sub, marginBottom: 20, textAlign: "center" }}>バンキングで勝った方をタップしてください</div>
        <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
          {[0, 1].map((i) => (
            <button key={i} onClick={() => chooseBreak(i)} style={{
              ...btnBase, flex: 1, background: PC[i], color: "#fff", padding: "24px 8px", fontSize: 17, borderRadius: 14,
            }}>{pl[i].name}<br />が先攻</button>
          ))}
        </div>
        <div style={{ fontSize: 13.5, color: C.sub, textAlign: "center", lineHeight: 2 }}>
          {(ruleset.unit === "rack" ? "先取ラック数：" : "目標点：")}
          <b style={{ color: C.blue, fontSize: 16 }}>{rt(0)}</b> 対 <b style={{ color: C.red, fontSize: 16 }}>{rt(1)}</b><br />
          {timeLimitEnabled ? "持ち時間 " + (setup.minutes || 30) + "分（先攻を選んだ時点から計測）" : "時間制限なし"}
        </div>
      </div>
    );
  }

  /* ===== スコアリング ===== */
  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "10px 12px 60px", boxSizing: "border-box", color: C.ink, fontFamily: FONT }}>
      <div style={{ position: "relative", display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
        <span style={{ width: 90 }}>
          <MenuButton ballDesign={ballDesign} onSetBallDesign={onSetBallDesign} onQuit={quit} />
        </span>
        <div onClick={() => { if (timeLimitEnabled && matchWinner == null && !bothLose) togglePause(); }} style={{
          position: "absolute", left: "50%", transform: "translateX(-50%)",
          display: "flex", alignItems: "center", cursor: timeLimitEnabled && matchWinner == null && !bothLose ? "pointer" : "default",
          fontSize: 17, fontWeight: 800, fontVariantNumeric: "tabular-nums",
          color: matchWinner != null ? C.sub : paused ? C.hill : isTimeUp ? C.minus : msLeft != null && msLeft < 5 * 60 * 1000 ? C.hill : C.ink,
        }}>
          {!timeLimitEnabled ? null : matchWinner == null && isTimeUp ? <span>時間切れ</span> : (
            <>
              <span style={{ marginRight: 4, fontSize: 14, visibility: paused ? "visible" : "hidden" }}>⏸</span>
              <span style={{ width: 26, textAlign: "right" }}>{timeParts[0]}</span>
              <span style={{ width: 8, textAlign: "center" }}>:</span>
              <span style={{ width: 26, textAlign: "left" }}>{timeParts[1]}</span>
            </>
          )}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          {timeLimitEnabled && matchWinner == null && !bothLose && (
            <button onClick={() => setToolsOpen(true)} style={{
              background: paused ? C.hillBg : "#fff", border: `1px solid ${paused ? C.hill : C.line}`,
              borderRadius: 8, padding: "3px 8px", fontSize: 12, fontWeight: 800,
              color: paused ? C.hill : C.sub, cursor: "pointer", fontFamily: FONT, whiteSpace: "nowrap",
            }}>{paused ? "⏸ 停止中" : "⏱ 時間"}</button>
          )}
          <span style={{ fontSize: 12.5, color: C.sub }}>第 {rack} ラック</span>
        </div>
      </div>

      {toolsOpen && (
        <Sheet title="持ち時間" onClose={() => setToolsOpen(false)}>
          <div style={{ fontSize: 12.5, color: C.sub, textAlign: "center", marginBottom: 14 }}>
            {"時間の表示をタップすると一時停止・再開できます（" + (paused ? "現在：一時停止中" : "現在：動作中") + "）"}
          </div>
          <div style={{ fontSize: 13, fontWeight: 700, color: C.sub, textAlign: "center", marginBottom: 8 }}>持ち時間を延長</div>
          <div style={{ display: "flex", gap: 8 }}>
            {[1, 3, 5].map((min) => (
              <button key={min} onClick={() => addTime(min)} style={{
                flex: 1, background: "#fff", border: `1.5px solid ${C.blue}`, color: C.blue, borderRadius: 10,
                padding: "11px 0", fontSize: 14.5, fontWeight: 800, cursor: "pointer", fontFamily: FONT,
              }}>{"+" + min + "分"}</button>
            ))}
          </div>
        </Sheet>
      )}

      {isFinalRack && (
        <div style={{ background: C.hillBg, border: `1.5px solid ${C.hill}`, color: C.hill, borderRadius: 10, padding: "6px 10px", textAlign: "center", fontSize: 13.5, fontWeight: 800, marginBottom: 6 }}>
          時間切れ：このラックが最終ラック（届かなければ引き分け）
        </div>
      )}

      {/* スコアカード */}
      <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
        {[0, 1].map((i) => {
          const pc = PC[i];
          const hi = hillInfo(i);
          const tappable = ruleset.unit === "rack" && phase === "play" && matchWinner == null && !bothLose;
          return (
            <div key={i} onClick={tappable ? () => recordSetRack(i) : undefined} style={{
              flex: 1, minWidth: 0, background: pc, borderRadius: 14, padding: "8px 6px 6px", textAlign: "center", color: "#fff",
              boxShadow: brk === i ? "inset 0 0 0 3px rgba(255,255,255,0.65)" : "none",
              cursor: tappable ? "pointer" : "default", userSelect: "none", WebkitTapHighlightColor: "transparent",
            }}>
              <div style={{
                fontSize: 15, fontWeight: 800, borderRadius: 7, padding: "2px 0", marginBottom: 2,
                background: `linear-gradient(to right, rgba(255,255,255,0.42) ${Math.min(100, Math.round(rate(i) * 100))}%, rgba(0,0,0,0.14) ${Math.min(100, Math.round(rate(i) * 100))}%)`,
                textShadow: "0 1px 2px rgba(0,0,0,0.35)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
              }}>{pl[i].name}</div>
              <div style={{ fontSize: 40, fontWeight: 800, lineHeight: 1.05, fontVariantNumeric: "tabular-nums" }}>
                {ruleset.hillThreshold != null ? tot[i] : disp[i]}
                {ruleset.unit !== "rack" && <span style={{ fontSize: 20, fontWeight: 700, opacity: 0.75 }}>{"/" + pl[i].raceTo}</span>}
              </div>
              {ruleset.unit === "rack" && (
                <div style={{ fontSize: 13, fontWeight: 700, opacity: 0.85, marginTop: -2, marginBottom: 2 }}>{pl[i].raceTo + "先取"}</div>
              )}
              {ruleset.unit !== "rack" && hi.txt && (
                <div style={{ display: "inline-block", background: "#fff", color: hi.on ? pc : C.ink, borderRadius: 8, padding: "2px 8px", fontSize: 13, fontWeight: 800, marginTop: 4, whiteSpace: "nowrap" }}>{hi.txt}</div>
              )}
              {tappable && <div style={{ fontSize: 11, opacity: 0.85, marginTop: 4 }}>タップで+1ラック</div>}
              <div style={{ minHeight: 18, marginTop: 4 }}>
                {matchWinner != null || bothLose ? null : phase === "done" && lastResult ? (
                  ruleset.nextBrk(lastResult, brk) === i && <span style={{ color: "#fff", fontSize: 11.5, fontWeight: 800, letterSpacing: 1 }}>● 次ブレイク</span>
                ) : brk === i && (
                  <button onClick={swapBreak} style={{ background: "none", border: "none", color: "#fff", fontSize: 11.5, fontWeight: 800, letterSpacing: 1, cursor: "pointer", textDecoration: "underline", padding: 0 }}>● ブレイク</button>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {hillHill && matchWinner == null && phase === "play" && ruleset.hillThreshold != null && (
        <div style={{ background: C.hillBg, border: `1.5px solid ${C.hill}`, color: C.hill, borderRadius: 10, padding: "6px 10px", textAlign: "center", fontSize: 13.5, fontWeight: 800, marginBottom: 6 }}>
          {"ヒルヒル：このラックで" + ruleset.money + "番を落とした方が勝ち"}
        </div>
      )}

      {/* 決着 or 操作ボタン */}
      {matchWinner != null || bothLose ? (
        <div style={{ marginBottom: 6 }}>
          {bothLose ? (
            <div style={{ background: C.hillBg, border: `1.5px solid ${C.hill}`, color: C.hill, borderRadius: 12, padding: "8px 10px", textAlign: "center" }}>
              <div style={{ fontSize: 17.5, fontWeight: 800 }}>時間切れ</div>
              <div style={{ fontSize: 13.5, marginTop: 2, color: C.ink, fontWeight: 700 }}>{disp[0] + " － " + disp[1]}</div>
            </div>
          ) : (
            <div style={{ background: matchWinner === 0 ? C.lightBlue : C.lightRed, border: `1.5px solid ${PC[matchWinner]}`, color: PC[matchWinner], borderRadius: 12, padding: "8px 10px", textAlign: "center" }}>
              <div style={{ fontSize: 17.5, fontWeight: 800 }}>{"🏆 " + pl[matchWinner].name + " 勝利"}</div>
              <div style={{ fontSize: 13.5, marginTop: 2, color: C.ink, fontWeight: 700 }}>{disp[0] + " － " + disp[1]}</div>
            </div>
          )}
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <button onClick={correct} style={ctrl}>◀ 訂正</button>
            <button onClick={() => { if (window.confirm("同じ相手・同じ条件でもう1試合始めます。今の記録は消えます。よろしいですか？")) rematch(); }} style={{ ...ctrl, borderColor: C.blue, color: C.blue }}>🔁 リマッチ</button>
            <button onClick={() => { if (window.confirm("試合を終わります。記録は消えます。よろしいですか？")) onExit(); }} style={{ ...ctrl, background: C.ink, color: "#fff", border: "none" }}>終了</button>
          </div>
        </div>
      ) : ruleset.unit === "rack" ? (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 6 }}>
          <button onClick={undoLast} disabled={!undoStack.length} style={{ ...ctrl, flex: 1, opacity: undoStack.length ? 1 : 0.4 }}>↶ ラックを取り消す</button>
        </div>
      ) : ruleset.simplified8 ? (
        // 8ボール：まず勝者をタップ（14点固定）、続いて相手側が点数入力に変わる
        <div style={{ marginBottom: 6 }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
            {[0, 1].map((i) => {
              if (pendingWinner8 == null || pendingWinner8 === i) {
                const chosen = pendingWinner8 === i;
                return (
                  <button key={i} onClick={() => setPendingWinner8(chosen ? null : i)} style={{
                    ...ctrl, flex: 1, background: PC[i], color: "#fff", border: "none", opacity: pendingWinner8 == null || chosen ? 1 : 0.5,
                  }}>{(chosen ? "✓ " : "") + pl[i].name + " の勝ち（14点）"}</button>
                );
              }
              return (
                <select key={i} value="" onChange={(e) => { const v = parseInt(e.target.value, 10); if (!isNaN(v)) recordEightBallRack(pendingWinner8, v); }}
                  style={{ ...ctrl, flex: 1, background: PC[i], color: "#fff", border: "3px solid #FFD23F", textAlignLast: "center", textAlign: "center", animation: "eightBallAsk 1.1s ease-in-out infinite", fontWeight: 900 }}>
                  <option value="" disabled>{"👉 " + pl[i].name + "は何点？"}</option>
                  {[0, 1, 2, 3, 4, 5, 6, 7].map((n) => <option key={n} value={n}>{n}</option>)}
                </select>
              );
            })}
          </div>
          <div style={{ display: "flex", justifyContent: "center" }}>
            <button onClick={undoLast} disabled={!undoStack.length} style={{ ...ctrl, opacity: undoStack.length ? 1 : 0.4 }}>↶ ラックを取り消す</button>
          </div>
        </div>
      ) : (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 6 }}>
          {phase === "done" && lastResult
            ? <button onClick={correct} style={{ ...ctrl, flex: 1 }}>◀ 訂正</button>
            : <button onClick={undoLast} disabled={!undoStack.length} style={{ ...ctrl, flex: 1, opacity: undoStack.length ? 1 : 0.4 }}>↶ 1手戻す</button>}
          <div style={{ minWidth: 70, textAlign: "center", fontSize: 24, fontWeight: 800, fontVariantNumeric: "tabular-nums" }}>
            {phase === "done" && lastResult ? (
              <><span style={{ color: C.blue }}>{lastResult.add[0]}</span><span style={{ color: C.sub, margin: "0 4px" }}>-</span><span style={{ color: C.red }}>{lastResult.add[1]}</span></>
            ) : phase === "play" ? (
              <><span style={{ color: C.blue }}>{live[0]}</span><span style={{ color: C.sub, margin: "0 4px" }}>-</span><span style={{ color: C.red }}>{live[1]}</span></>
            ) : null}
          </div>
          {phase === "done" && lastResult
            ? <button onClick={nextRack} style={{ ...ctrl, flex: 1, background: C.ink, color: "#fff", border: "none" }}>次のラック ▶</button>
            : <button onClick={undoRack} disabled={!hist.length} style={{ ...ctrl, flex: 1, opacity: hist.length ? 1 : 0.4 }}>◀ 1ラック戻す</button>}
        </div>
      )}

      {/* 球エリア */}
      {ruleset.unit !== "rack" && !ruleset.simplified8 && (
        <div ref={playAreaRef} style={{ touchAction: "none" }}>
          <Zone label={pl[0].name} side="up" color={C.blue} balls={col("p1")} money={ruleset.money} palette={palette}
            sub={phase === "done" && winnerLoc === "p1"} pressed={pressed} selectedBall={selectedBall}
            highlight={phase === "play" && highlightUp} onPress={onPress} onGesture={onGesture} onDrag={onDrag}
            onZoneTap={() => commitSelectedTo("up")} />

          <div onClick={returnSelectedToCenter} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 4, padding: "10px 0", margin: "6px 0", cursor: selectedBall != null ? "pointer" : "default" }}>
            <div onTouchStart={onDesignSwipeStart} onTouchEnd={onDesignSwipeEnd}
              style={{ flex: 1, minWidth: 0, fontSize: 12, color: C.sub, textAlign: "right", lineHeight: 1.5, paddingRight: 6, overflowWrap: "break-word", touchAction: "pan-y" }}>
              {selectedOffTable
                ? <span style={{ color: C.blue, fontWeight: 800 }}>タップで<br />台に戻す</span>
                : matchWinner == null && phase === "play" && <>↑スワイプで<br />{pl[0].name}</>}
            </div>
            <div style={{
              display: "grid",
              gridTemplateColumns: ruleset.ballCount === 10 ? "repeat(5, minmax(0, 44px))" : "repeat(3, minmax(0, 52px))",
              gap: 7, flexShrink: 0,
              background: selectedOffTable ? C.lightBlue : "transparent",
              border: `1.5px dashed ${selectedOffTable ? C.blue : "transparent"}`,
              borderRadius: 12, padding: selectedOffTable ? 6 : 0,
              transition: "background 120ms ease, border-color 120ms ease",
            }}>
              {balls.map((b) => (
                <Ball key={b.n} b={b} big size={ruleset.ballCount === 10 ? 44 : undefined} money={ruleset.money} palette={palette}
                  pressed={pressed === b.n} selected={selectedBall === b.n} area="rack"
                  style={{ opacity: b.loc !== "c" ? 0.2 : 1 }} onPress={onPress} onGesture={onGesture} onDrag={onDrag} />
              ))}
            </div>
            <div onTouchStart={onDesignSwipeStart} onTouchEnd={onDesignSwipeEnd}
              style={{ flex: 1, minWidth: 0, fontSize: 12, color: C.sub, textAlign: "left", lineHeight: 1.5, paddingLeft: 6, overflowWrap: "break-word", touchAction: "pan-y" }}>
              {selectedOffTable
                ? <span style={{ color: C.blue, fontWeight: 800 }}>タップで<br />台に戻す</span>
                : matchWinner == null && phase === "play" && <>↓スワイプで<br />{pl[1].name}<br /><span style={{ fontSize: 11 }}>2回タップで無効球</span></>}
            </div>
          </div>

          <Zone label={pl[1].name} side="down" color={C.red} balls={col("p2")} money={ruleset.money} palette={palette}
            sub={phase === "done" && winnerLoc === "p2"} pressed={pressed} selectedBall={selectedBall}
            highlight={phase === "play" && highlightDown} onPress={onPress} onGesture={onGesture} onDrag={onDrag}
            onZoneTap={() => commitSelectedTo("down")} />
        </div>
      )}

      {/* ラックの履歴 */}
      {histRows.length > 0 && (
        <div style={{ marginTop: 10 }}>
          <div style={{ fontSize: 13.5, fontWeight: 800, marginBottom: 5 }}>
            {(ruleset.unit === "rack" ? "ラックの履歴（" : "ラック毎のスコア（履歴 ") + histRows.length + "）"}
          </div>
          {(ruleset.unit === "rack" ? histRows : histRows.slice().reverse()).map((h, k) => (
            <div key={k} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "6px 10px", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, marginBottom: 5 }}>
              <span style={{ fontSize: 13.5, color: C.sub }}>
                {"第" + h.rack + "R　"}<b style={{ color: PC[h.w] }}>{pl[h.w].name}</b>{h.hill ? " ⚑" : ""}
              </span>
              {ruleset.unit === "rack" ? (
                <span style={{ fontSize: 12.5, color: C.sub, fontVariantNumeric: "tabular-nums" }}>{h.at ? fmtClock(h.at) : ""}</span>
              ) : (
                <span style={{ fontVariantNumeric: "tabular-nums" }}>
                  <b style={{ fontSize: 16.5 }}>
                    <span style={{ color: C.blue }}>{h.add[0]}</span>
                    <span style={{ color: C.sub, margin: "0 2px" }}>–</span>
                    <span style={{ color: C.red }}>{h.add[1]}</span>
                  </b>
                </span>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ========= 選手エリア ========= */
function Zone({ label, side, color, balls, money, palette, sub, pressed, selectedBall, highlight, onPress, onGesture, onDrag, onZoneTap }) {
  return (
    <div onClick={onZoneTap} style={{
      background: highlight ? C.lightBlue : C.zone,
      border: `1.5px solid ${highlight ? C.blue : C.line}`,
      borderRadius: 12, padding: "7px 8px", minHeight: 52,
      display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
      transition: "background 120ms ease, border-color 120ms ease",
    }}>
      <div style={{ fontSize: 12.5, fontWeight: 800, color }}>{label}</div>
      {balls.length === 0 && (
        <div style={{ color: highlight ? C.blue : C.sub, fontSize: 11.5, textAlign: "center", fontWeight: highlight ? 800 : 400 }}>
          {highlight ? "タップで移動" : side === "up" ? "↑ 上にスワイプ" : "↓ 下にスワイプ"}
        </div>
      )}
      <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", gap: 5 }}>
        {balls.map((b) => (
          <Ball key={b.n} b={b} money={money} palette={palette} sub={sub} pressed={pressed === b.n}
            selected={selectedBall === b.n} area="zone" onPress={onPress} onGesture={onGesture} onDrag={onDrag} />
        ))}
      </div>
    </div>
  );
}

/* ========= 球 ========= */
function Ball({ b, big, size: sizeOverride, money, palette, sub, pressed, selected, area, style, onPress, onGesture, onDrag }) {
  const size = sizeOverride || (big ? 52 : 34);
  const base = (palette || BALL_PALETTES[DEFAULT_DESIGN])[b.n] || "#6A7480";
  // ゲームボールと9番は「白地＋縁取り」で描く（色で見分ける）
  const ring = b.n === (money || 9) || b.n === 9;
  const ref = useRef(null);
  const startYRef = useRef(0);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let curDir = null;
    const start = (e) => { e.preventDefault(); startYRef.current = e.touches[0].clientY; curDir = null; onPress(b.n, true); };
    const moveH = (e) => {
      e.preventDefault();
      if (!onDrag) return;
      const dy = e.touches[0].clientY - startYRef.current;
      const dir = Math.abs(dy) > 28 ? (dy < 0 ? "up" : "down") : null;
      if (dir !== curDir) { curDir = dir; onDrag(b.n, dir); }
    };
    const end = (e) => {
      e.preventDefault();
      onPress(b.n, false);
      if (onDrag) onDrag(b.n, null);
      const y = (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientY : startYRef.current);
      onGesture(b.n, y - startYRef.current, area);
    };
    const cancel = (e) => { e.preventDefault(); onPress(b.n, false); if (onDrag) onDrag(b.n, null); };
    const opts = { passive: false };
    el.addEventListener("touchstart", start, opts);
    el.addEventListener("touchmove", moveH, opts);
    el.addEventListener("touchend", end, opts);
    el.addEventListener("touchcancel", cancel, opts);
    return () => {
      el.removeEventListener("touchstart", start, opts);
      el.removeEventListener("touchmove", moveH, opts);
      el.removeEventListener("touchend", end, opts);
      el.removeEventListener("touchcancel", cancel, opts);
    };
  }, [b.n, onPress, onGesture, onDrag, area]);

  return (
    <div ref={ref} onContextMenu={(e) => e.preventDefault()} style={{
      width: size, height: size, borderRadius: size, flexShrink: 0,
      background: b.dead ? C.dead : ring ? "#fff" : base,
      border: ring && !b.dead ? `${Math.round(size * 0.16)}px solid ${base}` : "2px solid rgba(255,255,255,0.85)",
      boxShadow: selected ? `0 0 0 4px #fff, 0 0 0 7px ${C.blue}, 0 6px 16px rgba(0,0,0,0.3)`
        : pressed ? "0 0 0 5px rgba(0,0,0,0.12), 0 6px 16px rgba(0,0,0,0.3)"
        : b.dead || sub ? "none" : "0 2px 5px rgba(0,0,0,0.18)",
      color: ring && !b.dead ? base : "#fff",
      display: "flex", alignItems: "center", justifyContent: "center",
      fontSize: big ? 20 : 15, fontWeight: 800, boxSizing: "border-box",
      touchAction: "none", cursor: "pointer", position: "relative",
      userSelect: "none", WebkitUserSelect: "none", WebkitTouchCallout: "none", WebkitTapHighlightColor: "transparent",
      transform: selected ? "scale(1.15)" : pressed ? "scale(1.25)" : "scale(1)",
      transition: "transform 130ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 130ms ease",
      zIndex: pressed || selected ? 10 : 1,
      ...style,
    }}>
      {b.n}
      {b.dead && <span style={{ position: "absolute", fontSize: Math.round(size * 0.7), color: "#7A2E2E" }}>×</span>}
      {sub && !b.dead && (
        <span style={{ position: "absolute", top: -4, right: -4, background: C.minus, color: "#fff", width: 19, height: 19, borderRadius: 19, fontSize: 16.5, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center", lineHeight: 1 }}>−</span>
      )}
    </div>
  );
}

/* ========= 初回の案内 ========= */
function FirstRunHelp({ onClose }) {
  return (
    <Sheet title="📖 はじめに" onClose={onClose}>
      <HelpBody />
      <div style={{ fontSize: 12.5, color: C.sub, lineHeight: 1.7 }}>
        この案内は、あとから「☰ メニュー → 使い方」で開けます
      </div>
    </Sheet>
  );
}

/* ========= 外枠 ========= */
function App() {
  const [current, setCurrent] = useState(() => loadCurrent());
  const [running, setRunning] = useState(null); // { setup, saved }
  const [ballDesign, setBallDesign] = useState(() => loadBallDesign());
  const [showFirstRun, setShowFirstRun] = useState(() => {
    try { return !localStorage.getItem(HELP_KEY); } catch { return false; }
  });

  const updateBallDesign = (id) => { setBallDesign(id); saveBallDesign(id); };
  const closeFirstRun = () => {
    setShowFirstRun(false);
    try { localStorage.setItem(HELP_KEY, "1"); } catch {}
  };

  const start = (setup) => { clearCurrent(); setRunning({ setup, saved: null }); };
  const resume = () => { if (current) setRunning({ setup: current.setup, saved: current.state }); };
  const exit = () => { clearCurrent(); setCurrent(null); setRunning(null); };

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", fontFamily: FONT, background: C.bg }}>
      <UpdateBanner />
      <div style={{ flex: 1, minHeight: 0, overflowY: "auto" }}>
        {running ? (
          <MatchScreen key={running.setup.createdAt} setup={running.setup} saved={running.saved} onExit={exit}
            ballDesign={ballDesign} onSetBallDesign={updateBallDesign} />
        ) : (
          <SetupScreen resume={current} onResume={resume} onStart={start}
            ballDesign={ballDesign} onSetBallDesign={updateBallDesign} />
        )}
      </div>
      {showFirstRun && <FirstRunHelp onClose={closeFirstRun} />}
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  showCrash(e.message + "\n" + (e.stack || ""));
}
</script>
</body>
