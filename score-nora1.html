<div id="crashlog" style="display:none; position:fixed; inset:0; background:#fff3f3; color:#7A2E2E; padding:16px; font-family:monospace; font-size:13px; white-space:pre-wrap; overflow:auto; z-index:9999;"></div>
<script>
  function showCrash(msg) {
    const el = document.getElementById("crashlog");
    el.style.display = "block";
    el.textContent = "エラーが発生しました:\n\n" + msg;
  }
  window.onerror = function (msg, src, line, col, err) {
    showCrash(msg + "\n" + (src || "") + ":" + line + ":" + col + "\n" + (err && err.stack ? err.stack : ""));
  };
  window.addEventListener("unhandledrejection", function (e) {
    showCrash("Promise rejected: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ========= ハンデ計算（App Aと共通） ========= */
function roundHalfToEven(v) {
  const w = Math.floor(v);
  const d = v - w;
  if (Math.abs(d - 0.5) > 1e-9) return d > 0.5 ? w + 1 : w;
  return w % 2 === 1 ? w + 1 : w;
}
function normalizeRace(rt1, rt2, lowClamp) {
  const highClamp = 99.0;
  const p1IsHigh = rt1 >= rt2;
  const highRace = Math.max(rt1, rt2), lowRace = Math.min(rt1, rt2);
  let highC = highRace > highClamp ? highClamp : highRace;
  let lowC = highRace > highClamp ? lowRace - lowRace * ((highRace - highClamp) / highRace) : lowRace;
  highC = Math.min(lowRace < lowClamp ? highC + highC * ((lowClamp - lowRace) / lowC) : highC, highClamp);
  lowC = Math.max(lowC < lowClamp ? lowClamp : lowC, lowClamp);
  return { rt1: p1IsHigh ? highC : lowC, rt2: p1IsHigh ? lowC : highC };
}
function computeRace(R1, R2, lenPct) {
  const dampFactor = lenPct / 100;
  const avg = (R1 + R2) / 2;
  const gp = 0.018 * avg - 1.4;
  const delta = R1 - R2;
  const p1 = 1 - 1 / (1 + Math.pow(2, delta / 100));
  const p2 = 1 - p1;
  const p1AvgPts = p1 * 14.0 + p2 * (7.4 - 0.0062 * R2);
  const p2AvgPts = p2 * 14.0 + p1 * (7.4 - 0.0062 * R1);
  const rt1raw = p1AvgPts * gp * dampFactor;
  const rt2raw = p2AvgPts * gp * dampFactor;
  const lowClamp = 0.16 * lenPct + 12;
  const norm = normalizeRace(rt1raw, rt2raw, lowClamp);
  return { rt1: roundHalfToEven(norm.rt1), rt2: roundHalfToEven(norm.rt2), p1, p2 };
}

const FONT = "system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif";
const C = {
  bg: "#FFFFFF", zone: "#F5F6F8", card: "#FFFFFF", ink: "#1C2530", sub: "#6A7480", line: "#E4E7EB",
  blue: "#2E6DB5", red: "#C6392E", lightBlue: "#E9F1FB", lightRed: "#FBEBE9",
  win: "#2E7D46", hill: "#B26A1E", hillBg: "#FFF3E0", minus: "#C0392B", dead: "#B9B4A8",
};
const BALL = { 1: "#E0A93B", 2: "#2A56A0", 3: "#C0362B", 4: "#E495AC", 5: "#DE7E2C", 6: "#2F7D4E", 7: "#97663A", 8: "#1A1A1A", 9: "#E0A93B" };
const PC = [C.blue, C.red];
const mkBalls = () => Array.from({ length: 9 }, (_, i) => ({ n: i + 1, loc: "c", dead: false }));

/* ========= 共有バックエンド：Firebase Realtime Database =========
   ↓ B1・B3 とまったく同じ値を貼ってください */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB587L7xl4fcl63QPbpgCRmoxLh4xMwEnQ",
  authDomain: "nora1kaze-247f3.firebaseapp.com",
  databaseURL: "https://nora1kaze-247f3-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "nora1kaze-247f3",
  storageBucket: "nora1kaze-247f3.firebasestorage.app",
  messagingSenderId: "965985901209",
  appId: "1:965985901209:web:5f99e023c1492d50a0f608",
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

/* Firebaseは空の配列・空のオブジェクトを保存しない（キーごと消える）。
   読み込んだ直後にここで補っておかないと、hist などが undefined のまま使われて落ちる */
function normalizeMatch(m) {
  if (!m) return m;
  return {
    ...m,
    names: Array.isArray(m.names) ? m.names : ["P1", "P2"],
    tot: Array.isArray(m.tot) ? m.tot : [0, 0],
    raceTo: Array.isArray(m.raceTo) ? m.raceTo : [0, 0],
    balls: Array.isArray(m.balls) && m.balls.length === 9 ? m.balls : mkBalls(),
    hist: Array.isArray(m.hist) ? m.hist : [],
    rack: m.rack || 1,
    version: m.version || 1,
    phase: m.phase || "banking",
    brk: m.brk === 0 || m.brk === 1 ? m.brk : null,
    lastResult: m.lastResult || null,
  };
}

/* この対戦のデータだけを読み書きする（他の卓には一切触れない） */
async function loadMatchRemote(matchId) {
  const snap = await db.ref("matches/" + matchId).once("value");
  return normalizeMatch(snap.val());
}
/* 観戦ページは表示専用。書き込みは一切おこなわない */
async function saveMatchRemote() { /* no-op */ }
/* この対戦の変更を購読する。ポーリング不要で、相手の端末の操作が即座に届く */
function subscribeMatch(matchId, onValue, onError) {
  const ref = db.ref("matches/" + matchId);
  const handler = ref.on("value", (snap) => onValue(normalizeMatch(snap.val())),
    (e) => onError && onError(e && e.message ? e.message : String(e)));
  return () => ref.off("value", handler);
}

/* 試合の持ち時間（分）。対戦データに matchMinutes があればそれを優先（B1側で調整可能） */
const DEFAULT_MATCH_MINUTES = 30;

/* ライブ配信へのリンクは本部アプリ（B1）の設定から共有される。
   B1の「基本設定 → ライブ配信のURL」に入れた値がここに届く */
const LIVE_LABEL = "📺 ライブ配信";
function subscribeConfig(onValue) {
  const ref = db.ref("config");
  const handler = ref.on("value", (snap) => onValue(snap.val() || {}));
  return () => ref.off("value", handler);
}

/* 動作確認用：URLに &sec=15 を付けると、その試合の持ち時間を15秒にする。
   時間切れ・最終ラック・両者負けの挙動を数十秒で通しで確認するためのもの。
   本番ではURLに付けなければ従来どおり（分）で動く */
const TEST_SEC = (() => {
  const v = parseInt(new URLSearchParams(window.location.search).get("sec"), 10);
  return v > 0 ? v : 0;
})();
/* この試合の持ち時間（ミリ秒） */
function matchDurationMs(s) {
  if (TEST_SEC) return TEST_SEC * 1000;
  return ((s && s.matchMinutes) || DEFAULT_MATCH_MINUTES) * 60000;
}

const initialMatchState = (rt1, rt2, names, table) => ({
  version: 1,
  phase: "banking", // banking | play | done | finished
  brk: null, // 0 | 1 | null
  tot: [0, 0],
  rack: 1,
  balls: mkBalls(),
  lastResult: null,
  hist: [],
  raceTo: [rt1, rt2],
  names,
  table,
  startedAt: null, // スコアラーがバンキング勝者を選び、試合が実際に始まった時刻
  deadline: null, // タイマー開始時に確定させる「時間切れ時刻」（絶対時刻）。以後はこれを基準に逆算する
  finishedAt: null, // 決着した時刻
  elapsedMs: null, // 所要時間（ミリ秒）
  winner: null,
});

/* ========= 「対戦表」「テーブルの様子」タブ用の共通ヘルパー（全卓の対戦を購読） ========= */
function subscribeAllMatches(onValue, onError) {
  const ref = db.ref("matches");
  const handler = ref.on("value", (snap) => onValue(snap.val() || {}),
    (e) => onError && onError(e && e.message ? e.message : String(e)));
  return () => ref.off("value", handler);
}
const STALE_MS = 1000 * 60 * 60 * 6; // 6時間以上更新のない対戦は前日の残骸とみなして無視
function isMatchFinished(m) {
  if (m.bothLose) return true; // 時間切れでどちらも目標に届かなかった
  // スコアラー側で決着が確定した試合（9番以外で目標点に到達した場合など）
  if (m.winner === 0 || m.winner === 1) return true;
  const rt = m.raceTo || [0, 0], tot = m.tot || [0, 0];
  return (rt[0] > 0 && tot[0] >= rt[0]) || (rt[1] > 0 && tot[1] >= rt[1]);
}
function matchWinnerIndex(m) {
  if (m.bothLose) return null;
  if (m.winner === 0 || m.winner === 1) return m.winner;
  const rt = m.raceTo || [0, 0], tot = m.tot || [0, 0];
  const r0 = rt[0] > 0 && tot[0] >= rt[0], r1 = rt[1] > 0 && tot[1] >= rt[1];
  if (r0 && r1) { const last = (m.hist || []).slice(-1)[0]; return last ? last.w : 0; }
  if (r0) return 0;
  if (r1) return 1;
  return null;
}
/* 卓ごとの全対戦を作成順に並べる（「対戦表」タブ用） */
function getAllForTable(matches, tableNum) {
  const list = [];
  for (const id in matches) {
    const m = matches[id];
    if (!m || Number(m.table) !== tableNum) continue;
    if (!m.updatedAt || Date.now() - m.updatedAt > STALE_MS) continue;
    list.push({ ...normalizeMatch(m), id });
  }
  list.sort((a, b) => (a.createdAt || a.updatedAt) - (b.createdAt || b.updatedAt));
  return list;
}
/* 卓ごとの待機列：未終了の対戦だけを作成順に並べる。[0]が現在対戦中、[1]が次戦（「テーブルの様子」タブ用） */
function getQueueForTable(matches, tableNum) {
  const list = [];
  for (const id in matches) {
    const m = matches[id];
    if (!m || Number(m.table) !== tableNum) continue;
    if (!m.updatedAt || Date.now() - m.updatedAt > STALE_MS) continue;
    if (isMatchFinished(m)) continue;
    list.push({ ...normalizeMatch(m), id });
  }
  list.sort((a, b) => (a.createdAt || a.updatedAt) - (b.createdAt || b.updatedAt));
  return list;
}
/* 試合終了／試合中／呼び出し中（次に始める1試合だけ）／待機中 */
function annotateColumn(list) {
  let calledYet = false;
  return list.map((m) => {
    if (isMatchFinished(m)) return { m, st: "done" };
    if (m.startedAt) return { m, st: "live" };
    // 決勝トーナメントの「◯回戦①の勝者」枠。予定として卓には並べるが、まだ始められない
    if (m.pending) return { m, st: "pending" };
    if (!calledYet) { calledYet = true; return { m, st: "call" }; }
    return { m, st: "queued" };
  });
}


/* ========= 決勝トーナメント（本部B1で組んだブラケットを、選手側でも見られるようにする） ========= */
function getBracketMatches(matches) {
  return Object.values(matches || {}).filter((m) => m && m.bracket).map((m) => ({ ...normalizeMatch(m) }));
}
function bracketMatchesForRound(matches, round) {
  return Object.entries(matches || {})
    .filter(([, m]) => m && m.bracket && m.bracketRound === round)
    .map(([id, m]) => ({ ...normalizeMatch(m), id }))
    .sort((a, b) => (a.bracketPos || 0) - (b.bracketPos || 0));
}
function bracketTotalRounds(size) { return Math.round(Math.log2(size || 8)); }

/* ========= 対戦表タブ（B1のタイムラインと同じ見た目） ========= */
function TimelineTab({ myMatchId, onPick }) {
  const [cols, setCols] = useState([[], [], []]);
  const [raw, setRaw] = useState({});
  const [eta, setEta] = useState({}); // 各試合の開始見込み時刻
  const [foldPrelim, setFoldPrelim] = useState(null); // null=まだ自動判定していない
  const [err, setErr] = useState(null);

  useEffect(() => subscribeAllMatches(
    (matches) => {
      setRaw(matches || {});
      setCols([1, 2, 3].map((t) => annotateColumn(getAllForTable(matches, t))));
      setEta(buildEta(matches || {}, 5));
      setErr(null);
    },
    (e) => setErr(e)), []);

  const slots = Math.max(1, ...cols.map((c) => c.length));
  const total = cols.reduce((a, c) => a + c.length, 0);
  const doneCount = cols.reduce((a, c) => a + c.filter((e) => e.st === "done").length, 0);

  // 決勝トーナメントが始まるコマ。ここから下がトーナメント、上が予選
  let bracketStart = null;
  cols.forEach((col) => col.forEach((e, si) => {
    if (e && e.m.bracket && (bracketStart === null || si < bracketStart)) bracketStart = si;
  }));
  const prelimEntries = cols.flatMap((col) => col.filter((e, si) => bracketStart === null || si < bracketStart));
  const prelimDone = prelimEntries.length > 0 && prelimEntries.every((e) => e.st === "done");
  // 予選が全部終わったら、予選のカードは自動でたたむ（自分で開いたあとは勝手に閉じない）
  useEffect(() => {
    if (foldPrelim === null && prelimDone && bracketStart !== null) setFoldPrelim(true);
  }, [prelimDone, bracketStart, foldPrelim]);
  const folded = foldPrelim === true && bracketStart !== null;
  // その行の試合のうち、いちばん早い開始（見込み）時刻
  const rowStartAt = (si) => {
    const ts = [0, 1, 2].map((ti) => {
      const e = cols[ti][si];
      if (!e) return null;
      const info = eta[e.m.id];
      return (e.m.startedAt || (info && info.start)) || null;
    }).filter(Boolean);
    return ts.length ? Math.min(...ts) : null;
  };
  const rowStarted = (si) => [0, 1, 2].some((ti) => cols[ti][si] && cols[ti][si].m.startedAt);
  const firstVisibleRow = folded ? bracketStart : 0;

  return (
    <div style={{ padding: "16px 12px 32px", color: C.ink, fontFamily: FONT }}>
      <div style={{ position: "relative", textAlign: "center", marginBottom: 14 }}>
        <RulesButton style={{ position: "absolute", left: 0, top: -2 }} />
        <div style={{ fontSize: 18, color: C.ink, fontWeight: 800 }}>終了 {doneCount} / 全{total}試合</div>
        <div style={{ height: 8, background: C.line, borderRadius: 4, overflow: "hidden", marginTop: 8 }}>
          <div style={{ height: "100%", width: `${total ? Math.round((doneCount / total) * 100) : 0}%`, background: C.win, borderRadius: 4, transition: "width 400ms ease" }} />
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "46px repeat(3, minmax(0, 1fr))", columnGap: 5, rowGap: 22 }}>
        <div />
        {[1, 2, 3].map((t) => (
          <div key={t} style={{ textAlign: "center", fontSize: 20, fontWeight: 900, color: C.ink, paddingBottom: 2 }}>T{t}</div>
        ))}

        {/* 予選が終わったら、予選のコマはたたんで1行にまとめる */}
        {folded && (
          <div onClick={() => setFoldPrelim(false)} style={{
            gridColumn: "1 / -1", background: C.zone, border: `1px solid ${C.line}`, borderRadius: 12,
            padding: "11px 0", textAlign: "center", fontSize: 14, fontWeight: 800, color: C.sub, cursor: "pointer",
          }}>▼ 予選 {prelimEntries.length}試合（終了）を見る</div>
        )}

        {Array.from({ length: slots }, (_, s) => {
          const isBracketHead = bracketStart !== null && s === bracketStart;
          if (folded && bracketStart !== null && s < bracketStart) return null;
          return (
            <React.Fragment key={s}>
              {isBracketHead && (
                <>
                  <div style={{
                    gridColumn: "1 / -1", display: "flex", alignItems: "center", gap: 8,
                    fontSize: 14.5, fontWeight: 900, color: C.hill, marginTop: 4,
                  }}>
                    <span style={{ flex: 1, height: 2, background: C.hill, opacity: 0.35 }} />
                    <span style={{ whiteSpace: "nowrap" }}>🏆 ここから決勝トーナメント</span>
                    <span style={{ flex: 1, height: 2, background: C.hill, opacity: 0.35 }} />
                  </div>
                  {!folded && (
                    <div onClick={() => setFoldPrelim(true)} style={{
                      gridColumn: "1 / -1", textAlign: "center", fontSize: 12, fontWeight: 800,
                      color: C.sub, cursor: "pointer", marginTop: -2,
                    }}>▲ 予選をたたむ</div>
                  )}
                </>
              )}
              {/* 時刻はカードとカードの間（行の境目）に出す。
                  そこが「前の試合が終わる時刻」であり「次の試合が始まる時刻」でもあるため */}
              <div style={{ position: "relative", display: "flex", alignItems: "center", justifyContent: "center" }}>
                <span style={{ fontSize: 14, fontWeight: 800, color: C.sub }}>{s + 1}</span>
                {s === firstVisibleRow && rowStartAt(s) != null && (
                  <span style={{ position: "absolute", top: -17, left: 0, right: 0, textAlign: "center", fontSize: 12.5, fontWeight: 900, color: rowStarted(s) ? C.ink : C.sub, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>
                    {fmtClock(rowStartAt(s))}
                  </span>
                )}
                {rowStartAt(s + 1) != null && (
                  <span style={{ position: "absolute", bottom: -17, left: 0, right: 0, textAlign: "center", fontSize: 12.5, fontWeight: 900, color: rowStarted(s + 1) ? C.ink : C.sub, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>
                    {fmtClock(rowStartAt(s + 1))}
                  </span>
                )}
              </div>
              {[0, 1, 2].map((ti) => {
                const e = cols[ti][s];
                return <div key={ti}>{e
                  ? <TimelineSlotCard m={e.m} st={e.st} mine={e.m.id === myMatchId} onPick={onPick} />
                  : <div style={{ height: 108, boxSizing: "border-box", background: C.zone, border: `1px dashed ${C.line}`, borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "center", color: C.sub, fontSize: 15 }}>空き</div>}</div>;
              })}
            </React.Fragment>
          );
        })}
      </div>
      {err && <div style={{ textAlign: "center", fontSize: 13, color: C.minus, marginTop: 12 }}>同期エラー: {err}</div>}
    </div>
  );
}
function TimelineSlotCard({ m, st, mine, onPick }) {
  const names = m.names || ["", ""];
  const tot = m.tot || [0, 0];
  const rt = m.raceTo || [0, 0];
  const w = st === "done" ? matchWinnerIndex(m) : null;

  const style =
    st === "done"
      ? (m.bothLose
          ? { bg: "#fff", border: C.line, badgeBg: C.hillBg, badgeCol: C.hill, badge: "時間切れ" }
          : { bg: "#fff", border: C.line, badgeBg: C.zone, badgeCol: C.sub, badge: "試合終了" })
      : st === "live"
      ? { bg: C.lightBlue, border: C.blue, badgeBg: C.blue, badgeCol: "#fff", badge: "試合中" }
      : st === "call"
      ? { bg: "#fff", border: C.blue, badgeBg: "#fff", badgeCol: C.blue, badge: "呼び出し中" }
      : st === "pending"
      ? { bg: C.zone, border: C.line, badgeBg: "transparent", badgeCol: C.sub, badge: "勝者待ち" }
      : { bg: C.zone, border: C.line, badgeBg: "transparent", badgeCol: C.sub, badge: "待機中" };

  const won = (i) => !m.bothLose && w === i;

  // 呼び出し中・試合中のカードだけ、押すとその試合のスコアラーになれる。
  // 誤って別の卓に入ってしまわないよう、確認を1枚はさむ
  const clickable = (st === "call" || st === "live") && !!onPick;
  const handleClick = () => {
    if (!clickable) return;
    if (!window.confirm(`T${m.table}　${names[0]} 対 ${names[1]}\nこの試合のスコアを担当しますか？`)) return;
    onPick(m);
  };

  return (
    <div onClick={clickable ? handleClick : undefined} style={{
      cursor: clickable ? "pointer" : "default",
      position: "relative", height: 108, boxSizing: "border-box", background: style.bg,
      border: `${mine ? 3 : st === "live" || st === "call" ? 2 : 1}px solid ${mine ? C.win : style.border}`,
      borderRadius: 12, padding: "7px 4px", display: "flex", flexDirection: "column", justifyContent: "center", gap: 7,
      overflow: "hidden", opacity: st === "queued" ? 0.7 : 1,
    }}>
      {clickable && !mine && (
        <span style={{ position: "absolute", bottom: 2, left: 0, right: 0, textAlign: "center", fontSize: 10.5, fontWeight: 800, color: C.blue, whiteSpace: "nowrap" }}>▶ 担当する</span>
      )}
      {/* 担当中はカードの上に出すと枠で切れてしまうので、「▶ 担当する」と同じ下端に置く */}

/* 卓ごとに実際の進行を追って、各試合の開始見込み時刻を出す。
   終わった試合はその終了時刻を基準に、進行中は「開始＋持ち時間」で終わる想定、
   未開始は前の試合の終わり＋入替時間から積み上げる */
function buildEta(matches, changeoverMin) {
  const eta = {};
  const chg = (changeoverMin || 0) * 60000;
  [1, 2, 3].forEach((t) => {
    let cursor = null;
    getAllForTable(matches, t).forEach((m) => {
      const mins = m.matchMinutes || 30;
      if (isMatchFinished(m)) {
        eta[m.id] = { start: m.startedAt || null, end: m.finishedAt || m.updatedAt || null, done: true };
        cursor = m.finishedAt || m.updatedAt || cursor;
        return;
      }
      const start = m.startedAt ? m.startedAt : Math.max(cursor != null ? cursor + chg : Date.now(), Date.now());
      eta[m.id] = { start, end: start + mins * 60000, started: !!m.startedAt };
      cursor = start + mins * 60000;
    });
  });
  return eta;
}
const fmtClock = (ms) => {
  const d = new Date(ms);
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
};

/* 予選／準々決勝／準決勝／決勝。決勝トーナメントの試合だけ回戦名を出す */
function roundLabelOf(m) {
  if (!m || !m.bracket) return "予選";
  const total = Math.round(Math.log2(m.bracketSize || 8));
  const r = m.bracketRound || 1;
  if (r === total) return "決勝";
  if (total - r === 1) return "準決勝";
  if (total - r === 2) return "準々決勝";
  return `${r}回戦`;
}


/* ========= 隠しの順位表 =========
   本来は本部（B1）だけが見る情報。観戦ページからは表に出さないが、
   画面に散らした🐾を長押しすると開く。どれが当たりかは見た目では分からない */
function buildStandings(matches, roster) {
  const stats = {};
  const ensure = (name) => {
    if (!stats[name]) stats[name] = { name, win: 0, loss: 0, rates: [], pf: 0, pa: 0 };
    return stats[name];
  };
  roster.forEach((p) => { if (p.name) ensure(p.name); });

  for (const id in matches) {
    const m = matches[id];
    if (!m || !isMatchFinished(m)) continue;
    if (!m.updatedAt || Date.now() - m.updatedAt > STALE_MS) continue;
    const names = m.names || [];
    const tot = m.tot || [0, 0];
    const rt = m.raceTo || [0, 0];
    const w = matchWinnerIndex(m); // null なら両者負け
    [0, 1].forEach((i) => {
      if (!names[i]) return;
      const s = ensure(names[i]);
      s.pf += tot[i] || 0;
      s.pa += tot[1 - i] || 0;
      if (i === w) s.win++;
      else {
        s.loss++;
        if (rt[i] > 0) s.rates.push(Math.min(1, (tot[i] || 0) / rt[i])); // 100%を上限にする
      }
    });
  }

  const rows = Object.values(stats).map((s) => ({
    ...s,
    played: s.win + s.loss,
    avgRate: s.rates.length ? s.rates.reduce((a, b) => a + b, 0) / s.rates.length : null,
  }));
  rows.sort((a, b) => {
    if (b.win !== a.win) return b.win - a.win;
    // 負け試合がない（＝全勝）方を上に
    const ar = a.avgRate == null ? 2 : a.avgRate;
    const br = b.avgRate == null ? 2 : b.avgRate;
    if (br !== ar) return br - ar;
    return (b.pf - b.pa) - (a.pf - a.pa);
  });
  // 同着は同じ順位にし、次の順位は同着人数ぶん飛ばす（一般的な順位付け）
  rows.forEach((r, i) => {
    if (i > 0) {
      const p = rows[i - 1];
      const same = p.win === r.win && (p.avgRate == null ? 2 : p.avgRate) === (r.avgRate == null ? 2 : r.avgRate) && (p.pf - p.pa) === (r.pf - r.pa);
      r.rank = same ? p.rank : i + 1;
    } else {
      r.rank = 1;
    }
  });
  return rows;
}
const fmtRate = (v) => (v == null ? "–" : v.toFixed(3));

function subscribeRoster(onValue) {
  const ref = db.ref("roster");
  const handler = ref.on("value", (snap) => onValue(Array.isArray(snap.val()) ? snap.val() : []));

}

          勝ち数 → 負け試合の達成率の平均 → 得失点差 の順で並べています

/* このアプリの立場。バナーの投稿を止めるかどうかの判定に使う
   hq=本部(B1)／player=選手・スコアラー(B2)／viewer=観戦(B3) */
const APP_KIND = "viewer";
/* バナーへの書き込みが許されているか。本部は常に可。
   選手側・観戦側は本部の設定で個別に止められる（悪質な書き込みが続いた時のため） */
function useBannerPostAllowed() {
  const [ok, setOk] = useState(APP_KIND === "hq");
  useEffect(() => {
    if (APP_KIND === "hq") return;
    const ref = db.ref("config");
    const handler = ref.on("value", (snap) => {
      const c = snap.val() || {};
      const v = APP_KIND === "viewer" ? c.bannerPostViewer : c.bannerPostPlayer;
      setOk(v !== false && v !== "off"); // 既定は受け付ける
    });
    return () => ref.off("value", handler);
  }, []);
  return ok;
}

/* ========= 1行バナー =========
   本部（B1）の設定タブで編集した文言を、待機中の卓やスコアラー画面の下にランダムで出す。
   config/banners に改行区切りで入っている。空なら下の既定文言を使う */
const DEFAULT_BANNERS = [
  "本日のミカおすすめ→レバニラ",
  "初デートのおすすめ→ガスト",
  "NO！スポハラ！",
  "球場外は1回100円(常連のみ)",
  "モスセーフティにご注意",
  "コワーキングスペースNORA",
  "あれ、髪切りました？",
  "プレデターのネコ",
  "中野軽率署",
  "それはちょっとタランティーノ",
];
/* 🐾は表示するときに必ず先頭へ付ける。保存する文章には含めない
   （前に🐾込みで保存されたものが残っていても、ここで取り除く） */
const stripPaw = (x) => String(x || "").replace(/^[\s🐾]+/, "").trim();
function parseBanners(raw) {
  const arr = String(raw == null ? "" : raw).split("\n").map(stripPaw).filter(Boolean);
  return arr.length ? arr : DEFAULT_BANNERS;
}
/* 一定時間ごとに別の文言へ入れ替える */
function useBanner(intervalMs) {
  const [list, setList] = useState(DEFAULT_BANNERS);
  const [idx, setIdx] = useState(() => Math.floor(Math.random() * DEFAULT_BANNERS.length));
  useEffect(() => {
    const ref = db.ref("config/banners");
    const handler = ref.on("value", (snap) => {
      const arr = parseBanners(snap.val());
      setList(arr);
      setIdx(Math.floor(Math.random() * arr.length));
    });
    return () => ref.off("value", handler);
  }, []);
  useEffect(() => {
    if (list.length < 2) return;
    // 毎回リスト全体からランダムで選ぶ。ただし直前と同じものは避ける
    const iv = setInterval(() => setIdx((n) => {
      const r = Math.floor(Math.random() * (list.length - 1));
      return r >= n ? r + 1 : r;
    }), intervalMs || 15000);
    return () => clearInterval(iv);
  }, [list, intervalMs]);
  return list[idx % list.length] || "";
}
/* バナーを閉じる仕組み。うるさいと感じた人が✖️で消せるようにする。
   画面を読み込み直すとまた出る（設定として残さない）。
   同じアプリ内の他のバナーもまとめて消えるように、閉じたことを共有する */
let bannersClosed = false;
const bannerClosers = new Set();
function closeBanners() {
  bannersClosed = true;
  bannerClosers.forEach((fn) => fn(true));
}

function BannerLine({ style, boxed }) {
  const text = useBanner();
  // 画面が出た直後は出さず、3秒おいてからふわっと表示する。
  // 高さは最初から確保しておき、出た時に他のカードがずれないようにする
  const [ready, setReady] = useState(false);
  const [shown, setShown] = useState("");
  const [vis, setVis] = useState(false);
  const [shift, setShift] = useState(0); // 枠からはみ出した分（横に流す量）
  const [closed, setClosed] = useState(bannersClosed);
  const [editing, setEditing] = useState(false); // タップで開く入力窓
  const canPost = useBannerPostAllowed();
  const boxRef = useRef(null);
  const textRef = useRef(null);

  useEffect(() => {
    bannerClosers.add(setClosed);
    return () => { bannerClosers.delete(setClosed); };
  }, []);

  useEffect(() => {
    const t = setTimeout(() => setReady(true), 3000);
    return () => clearTimeout(t);
  }, []);
  useEffect(() => {
    if (!ready) return;
    setVis(false); // いったん消してから入れ替える（文言が変わる時もふわっと切り替わる）
    const t = setTimeout(() => { setShown(text); setVis(true); }, 260);
    return () => clearTimeout(t);
  }, [ready, text]);

  // 文字が枠に収まらない時は、左右にゆっくり流して最後まで読めるようにする
  useEffect(() => {
    const bx = boxRef.current, tx = textRef.current;
    if (!bx || !tx) return;
    const over = tx.scrollWidth - bx.clientWidth;
    setShift(over > 4 ? over + 8 : 0);
  }, [shown]);

  const h = boxed ? 50 : 26;
  const box = {
    height: "100%", boxSizing: "border-box",
    display: "flex", alignItems: "center", justifyContent: "center",
    overflow: "hidden",
    opacity: vis ? 1 : 0, transition: "opacity 600ms ease",
    ...(boxed ? {
      background: C.zone, border: `1px solid ${C.line}`, borderRadius: 12, padding: "0 12px",
    } : {}),
  };
  const inner = {
    fontSize: "clamp(14px, 4.3vw, 17px)", fontWeight: 800,
    color: boxed ? "#5A646E" : C.sub, whiteSpace: "nowrap",
    ...(shift > 0 ? {
      // はみ出す量に応じて時間を決める（速すぎると読めない）
      animation: `bannerScroll ${Math.max(6, Math.round(shift / 18) + 5)}s ease-in-out infinite alternate`,
      "--shift": `-${shift}px`,
    } : {}),
  };
  if (closed) return null;

  return (
    <div style={{ height: h, flexShrink: 0, ...style }}>
      <div ref={boxRef} onClick={() => { if (canPost) setEditing(true); }}
        style={{ ...box, position: "relative", paddingRight: boxed ? 38 : 26, cursor: canPost ? "pointer" : "default" }}>
        <span ref={textRef} style={inner}>{shown ? "🐾" + shown : ""}</span>
        {/* うるさい時はここで閉じられる。読み込み直せばまた出る */}
        <button onClick={(e) => { e.stopPropagation(); closeBanners(); }} aria-label="バナーを閉じる" style={{
          position: "absolute", right: 2, top: 0, bottom: 0, width: 34,
          background: "none", border: "none", color: C.sub, fontSize: 15, lineHeight: 1,
          cursor: "pointer", fontFamily: FONT, opacity: vis ? 0.7 : 0, transition: "opacity 600ms ease",
        }}>✕</button>
      </div>
      {editing && <BannerCompose onClose={() => setEditing(false)} />}
    </div>
  );
}

/* バナーをタップした時に出る入力窓。登録するとリストのいちばん上に入る。
   🐾は表示するときに自動で付くので、ここでは書かない */
function BannerCompose({ onClose }) {
  const [value, setValue] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const save = async () => {
    const line = stripPaw(value);
    if (!line) { onClose(); return; }
    setBusy(true);
    try {
      const cur = (await db.ref("config/banners").once("value")).val();
      const list = String(cur == null ? DEFAULT_BANNERS.join("\n") : cur)
        .split("\n").map(stripPaw).filter(Boolean);
      const next = [line, ...list.filter((x) => x !== line)]; // 新しいものを先頭に
      await db.ref("config").update({ banners: next.join("\n") });
      onClose();
    } catch (e) {
      setErr(String(e && e.message ? e.message : e));
      setBusy(false);
    }
  };

  return (
    <div onClick={onClose} style={{

        <div style={{ fontSize: 13, color: "#5A646E", lineHeight: 1.7, marginBottom: 10 }}>
          みんなの画面に出ます。先頭の🐾は自動で付きます
        </div>
        <input value={value} onChange={(e) => setValue(e.target.value.slice(0, 40))} autoFocus
          placeholder="例：本日のミカおすすめ→レバニラ"
          onKeyDown={(e) => { if (e.key === "Enter") save(); }}
          style={{
            width: "100%", boxSizing: "border-box", background: "#fff", border: `1px solid ${C.line}`,
            borderRadius: 10, color: C.ink, fontSize: 16, padding: "12px", outline: "none", fontFamily: FONT,
          }} />

          {err ? <span style={{ color: C.minus, fontWeight: 700 }}>{err}</span> : `${value.length}/40　プレビュー：🐾${stripPaw(value)}`}
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
          <button onClick={onClose} style={{

            padding: "12px 0", fontSize: 15, fontWeight: 800, color: C.ink, fontFamily: FONT, cursor: "pointer",
          }}>やめる</button>
          <button onClick={save} disabled={busy || !stripPaw(value)} style={{

            padding: "12px 0", fontSize: 15, fontWeight: 800, fontFamily: FONT, cursor: busy ? "wait" : "pointer",
          }}>{busy ? "登録中…" : "登録する"}</button>
        </div>
      </div>
    </div>
  );
}

/* 対戦データに入っている各選手のファーゴレート */

/* ========= テーブルの様子：卓ごとの1試合を、ラック履歴つきで見せる =========
   左右が選手カード、真ん中がここまでのラック履歴。履歴の下に現在のスコア。

   古いラックは直近5件を残して畳む（タップで開閉） */
const SHOW_RACKS = 5;

function LiveTablePanel({ tableNum, m }) {
  const [nowTs, setNowTs] = useState(Date.now());
  const [openHist, setOpenHist] = useState(false);
  const [flashing, setFlashing] = useState(false);
  const lastLiveRef = useRef(null);
  const flashTimerRef = useRef(null);

  useEffect(() => { const iv = setInterval(() => setNowTs(Date.now()), 1000); return () => clearInterval(iv); }, []);

  const balls = (m && m.balls) || [];
  const live = [
    balls.filter((b) => b.loc === "p1" && !b.dead).length,
    balls.filter((b) => b.loc === "p2" && !b.dead).length,
  ];
  const liveKey = m ? `${m.id}:${m.rack}:${live[0]}/${live[1]}` : "";

  // 進行中ラックの点数が変わったら点滅。試合や卓が切り替わった時は点滅させない
  useEffect(() => {
    if (!m || m.phase !== "play") { lastLiveRef.current = liveKey; return; }
    if (lastLiveRef.current !== null && lastLiveRef.current !== liveKey) {
      setFlashing(true);
      clearTimeout(flashTimerRef.current);
      flashTimerRef.current = setTimeout(() => setFlashing(false), 5000);
    }
    lastLiveRef.current = liveKey;
  }, [liveKey]);
  useEffect(() => () => clearTimeout(flashTimerRef.current), []);

  const panelBox = {
    background: "#fff", border: `3px solid ${C.ink}`, borderRadius: 14,
    padding: "10px 12px", marginBottom: 14, boxSizing: "border-box",
    opacity: m && m.pending ? 0.75 : 1, // 勝者待ちの予定はまだ始められないので薄く
  };
  const tBadge = {
    display: "inline-block", background: C.ink, color: "#fff", borderRadius: 6,
    padding: "2px 10px", fontSize: 13.5, fontWeight: 900, letterSpacing: 2, whiteSpace: "nowrap",
  };

  if (!m) {
    // 予定のない卓は情報が無いので、場所を取らないように1行だけにする
    return (
      <div style={{ ...panelBox, padding: "8px 12px", display: "flex", alignItems: "center", gap: 10 }}>
        <span style={tBadge}>T{tableNum}</span>
        <span style={{ fontSize: 14, fontWeight: 800, color: C.sub }}>予定なし</span>
      </div>
    );
  }

  const names = m.names || ["", ""];
  const raceTo = m.raceTo || [0, 0];
  const tot = m.tot || [0, 0];
  const hist = m.hist || [];
  const bothLose = !!m.bothLose;
  const reached = [raceTo[0] > 0 && tot[0] >= raceTo[0], raceTo[1] > 0 && tot[1] >= raceTo[1]];
  const winner = bothLose ? null
    : (m.winner === 0 || m.winner === 1) ? m.winner
    : (reached[0] && reached[1]) ? ((hist.slice(-1)[0] || { w: 0 }).w)
    : reached[0] ? 0 : reached[1] ? 1 : null;
  const finished = winner != null || bothLose;
  // ヒルヒル＝両者とも残り14点以下（確定分で判定）。このラックの9番で決まるので、残り点数は出さない
  const hillHill = !finished && m.phase === "play" &&
    raceTo[0] > 0 && raceTo[1] > 0 && raceTo[0] - tot[0] <= 14 && raceTo[1] - tot[1] <= 14;
  // 得点は台上の球を含めて常にライブ更新する。ヒルヒルに入ったら、その9番で決着が付くまで確定分で止める
  const disp = (m.phase === "play" && !hillHill) ? [tot[0] + live[0], tot[1] + live[1]] : tot;

  const rateOf = (i) => (raceTo[i] > 0 ? Math.min(1, tot[i] / raceTo[i]) : 0);
  const badgeOf = (i) => {
    if (m.phase === "banking") return null;
    // 達成率は本部（B1）だけが見る情報。ここでは出さない
    if (bothLose) return { t: "時間切れ", gray: true };
    if (winner != null) return winner === i ? { t: "勝ち" } : { t: "負け", gray: true };
    if (hillHill) return { t: i === 0 ? "ヒルヒル！" : "9番勝負！" };
    const rem = raceTo[i] - disp[i];
    if (rem <= 0) return { t: "達成" };
    const toHill = rem - 14;
    return toHill > 0 ? { t: `あと${toHill}でヒル` } : { t: `あと${rem}で勝ち` };
  };

  // 残り時間。deadline（絶対時刻）から逆算し、決着したらその時点で止める
  const clockJsx = (() => {
    if (m.pending) return <span style={{ fontSize: 13.5, fontWeight: 900, color: C.sub, whiteSpace: "nowrap" }}>⏰ {m.matchMinutes || 30}分</span>;
    if (m.phase === "banking") {
      return <span style={{ fontSize: 13.5, fontWeight: 900, color: C.sub, whiteSpace: "nowrap" }}>⏰ 持ち時間 {m.matchMinutes || 30}分</span>;
    }
    if (!m.deadline) return null;
    const left = m.deadline - (m.finishedAt || nowTs);
    if (left <= 0) return <span style={{ fontSize: 14, fontWeight: 900, color: C.minus, whiteSpace: "nowrap" }}>⏰ 時間切れ</span>;
    const sec = Math.floor(left / 1000);
    const txt = `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
    const col = finished ? C.sub : left < 5 * 60 * 1000 ? C.hill : C.ink;
    return <span style={{ fontSize: 14, fontWeight: 900, color: col, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>⏰ {txt}</span>;
  })();

  const stateTxt = m.pending ? "勝者待ち" : m.phase === "banking" ? "バンキング中" : finished ? "試合終了" : "";

  const card = (i) => {
    const pc = i === 0 ? C.blue : C.red;
    const b = badgeOf(i);
    const isBrk = m.brk === i;
    const isWinner = finished && !bothLose && winner === i;
    return (
      <div style={{
        flex: 1, minWidth: 0, background: pc, borderRadius: 14, padding: "8px 5px 6px",
        textAlign: "center", color: "#fff",
        boxShadow: isWinner
          ? "0 0 0 3px #FFD54A, inset 0 0 0 3px rgba(255,255,255,0.65)"
          : isBrk ? "inset 0 0 0 3px rgba(255,255,255,0.65)" : "none",
      }}>
        <div style={{
          fontSize: 15, fontWeight: 800, background: "rgba(0,0,0,0.16)", borderRadius: 7,
          padding: "2px 4px", marginBottom: 2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
        }}>{names[i]}</div>
        {/* ファーゴレート。数字を読みやすくするため、FRの文字は小さく、数字は大きく太く。
            運営が暫定で決めた人もいるので、無い時は出さない */}
        <div style={{ minHeight: 17, marginBottom: 2, display: "flex", alignItems: "baseline", justifyContent: "center", gap: 2 }}>
          {rateOfPlayer(m, i) && (
            <>
              <span style={{ fontSize: 10, fontWeight: 800, opacity: 0.6 }}>FR</span>
              <span style={{ fontSize: 15, fontWeight: 900, letterSpacing: 0.4, fontVariantNumeric: "tabular-nums", opacity: 0.95 }}>
                {rateOfPlayer(m, i)}
              </span>
            </>
          )}
        </div>
        <div style={{ fontSize: 36, fontWeight: 800, lineHeight: 1.05, fontVariantNumeric: "tabular-nums" }}>
          {m.pending ? "–" : m.phase === "banking" ? "–" : disp[i]}
          {!m.pending && <span style={{ fontSize: 19, fontWeight: 700, opacity: 0.75 }}>/{raceTo[i]}</span>}
        </div>
        <div style={{ height: 24, marginTop: 4, display: "flex", alignItems: "stretch" }}>
          {b && (
            <span style={{
              flex: 1, minWidth: 0, background: isWinner ? "#FFD54A" : "#fff", color: isWinner ? "#5A4400" : b.gray ? C.sub : pc, borderRadius: 8,
              display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 12.5, fontWeight: 800, whiteSpace: "nowrap", overflow: "hidden", padding: "0 2px",
            }}>{b.t}</span>
          )}
        </div>
        <div style={{ minHeight: 17, marginTop: 4, fontSize: 11.5, fontWeight: 800, letterSpacing: 1, visibility: isBrk ? "visible" : "hidden" }}>● ブレイク</div>
      </div>
    );
  };

  // 中央：ラック履歴
  const hidden = Math.max(0, hist.length - SHOW_RACKS);
  const shown = openHist ? hist : hist.slice(hidden);
  const rowStyle = { display: "flex", alignItems: "center", justifyContent: "center", gap: 3, fontSize: 13.5, fontWeight: 700, fontVariantNumeric: "tabular-nums", lineHeight: 1.35 };
  const numStyle = (side, strong) => ({ width: 22, textAlign: side === "a" ? "right" : "left", color: side === "a" ? C.blue : C.red, fontWeight: strong ? 900 : 700 });

  const histJsx = (
    <div style={{ width: 72, flexShrink: 0, background: "#fff", border: `1.5px solid ${C.line}`, borderRadius: 12, padding: "5px 4px", display: "flex", flexDirection: "column" }}>
      <div style={{ fontSize: 10, fontWeight: 800, color: C.sub, textAlign: "center", marginBottom: 3, letterSpacing: 1 }}>ラック</div>
      {m.pending || m.phase === "banking" ? (
        <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", color: C.sub, fontSize: 11, textAlign: "center" }}>
          {m.pending ? <>前の試合<br />待ち</> : <>まだ<br />ありません</>}
        </div>
      ) : (
        <>
          <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 1, overflow: "hidden" }}>
            {hidden > 0 && (
              <div onClick={() => setOpenHist((v) => !v)} style={{
                fontSize: 10.5, fontWeight: 800, color: C.sub, textAlign: "center", lineHeight: 1.6,
                border: `1px solid ${C.line}`, borderRadius: 5, marginBottom: 2, cursor: "pointer", background: C.zone,
              }}>{openHist ? "▲ 畳む" : `▼ 前の${hidden}ラック`}</div>
            )}
            {shown.map((h, k) => {
              const add = h.add || [0, 0];
              return (
                <div key={k} style={rowStyle}>
                  <span style={numStyle("a", h.w === 0)}>{add[0]}</span>
                  <span style={{ color: "#B8BFC6", fontSize: 11 }}>-</span>
                  <span style={numStyle("b", h.w === 1)}>{add[1]}</span>
                </div>
              );
            })}
            {m.phase === "play" && (
              <div style={{ ...rowStyle, background: flashing ? undefined : "#FFF6CC", borderRadius: 5, animation: flashing ? "rackFlash 0.45s steps(1) 0s 11" : "none" }}>
                <span style={numStyle("a")}>{live[0]}</span>
                <span style={{ color: "#B8BFC6", fontSize: 11 }}>-</span>
                <span style={numStyle("b")}>{live[1]}</span>
              </div>
            )}
          </div>
          <div style={{ marginTop: 4, paddingTop: 4, borderTop: `1.5px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", gap: 4, fontSize: 17, fontWeight: 900, fontVariantNumeric: "tabular-nums" }}>
            <span style={{ color: C.blue }}>{disp[0]}</span>
            <span style={{ color: C.sub, fontSize: 13 }}>-</span>
            <span style={{ color: C.red }}>{disp[1]}</span>
          </div>
        </>
      )}
    </div>
  );

  return (
    <div style={panelBox}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <span style={{ display: "flex", alignItems: "baseline", gap: 7, minWidth: 0 }}>
          <span style={tBadge}>T{tableNum}</span>
          <span style={{ fontSize: 13, fontWeight: 900, color: m.bracket ? C.hill : C.sub, whiteSpace: "nowrap" }}>{roundLabelOf(m)}</span>
        </span>
        <span style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, fontWeight: 900, color: C.ink }}>
          {stateTxt}{clockJsx}
        </span>
      </div>
      <div style={{ display: "flex", gap: 5, alignItems: "stretch" }}>
        {card(0)}
        {histJsx}
        {card(1)}
      </div>
      {bothLose ? (
        <div style={{ marginTop: 8, textAlign: "center", fontSize: 15, fontWeight: 900, color: "#fff", background: C.hill, borderRadius: 8, padding: "3px 0" }}>時間切れ</div>
      ) : winner != null ? (
        <div style={{ marginTop: 8, textAlign: "center", fontSize: 15, fontWeight: 900, color: "#fff", background: C.win, borderRadius: 8, padding: "3px 0" }}>🏆 {names[winner]} 勝利</div>
      ) : null}
    </div>
  );
}

/* ========= テーブルの様子タブ（B3の観戦ディスプレイと同じ見た目。スマホなので縦積み） ========= */
// 卓に今どの試合を出すか決める。次の試合がまだバンキング中（先攻未決定）の間は、
// その卓で直近に終わった試合のスコアを出し続ける（次のバンキング結果が出た瞬間に切り替わる）
function pickDisplayMatch(matches, tableNum) {
  const queue = getQueueForTable(matches, tableNum);
  const next = queue[0] || null;
  if (!next) return null;
  if (next.phase === "banking" && !next.pending) {
    const finished = getAllForTable(matches, tableNum).filter(isMatchFinished);
    if (finished.length) {
      finished.sort((a, b) => (b.finishedAt || b.updatedAt || 0) - (a.finishedAt || a.updatedAt || 0));
      return finished[0];
    }
  }
  return next;
}
function TablesTab() {
  const [matches, setMatches] = useState({});
  const [err, setErr] = useState(null);

  useEffect(() => subscribeAllMatches(
    (m) => { setMatches(m || {}); setErr(null); },
    (e) => setErr(e)), []);

  const queues = [1, 2, 3].map((t) => getQueueForTable(matches, t));
  const display = [1, 2, 3].map((t) => pickDisplayMatch(matches, t));
  const nextMatches = queues
    .map((q, i) => (q[1] ? { ...q[1], tableNum: i + 1 } : null))
    .filter(Boolean);

  return (
    <div style={{ padding: "16px 12px 32px", fontFamily: FONT }}>
      {[0, 1, 2].map((i) => (
        <LiveTablePanel key={i} tableNum={i + 1} m={display[i]} />
      ))}
      <NextList matches={nextMatches} />
      {err && <div style={{ textAlign: "center", fontSize: 13, color: C.minus, marginTop: 12 }}>同期エラー: {err}</div>}
      {/* バナーはこの画面で1つだけ。下までスクロールした時に目に入る位置に置く */}
      <BannerLine boxed style={{ marginTop: 18 }} />
    </div>
  );
}
/* B3（観戦ディスプレイ）と同じ見た目にするための配色。
   薄いグレーの面や細い線を使わず、太い黒枠とベタ塗りで区切る */
const DC = {
  ink: "#0E1216", sub: "#3C454E", line: "#0E1216", lineSoft: "#B8BFC6",
  blue: "#12508F", red: "#A3211A", win: "#1E6B36", hill: "#8A4B0B",
};
function TitleBadge({ children }) {
  return (
    <span style={{
      display: "inline-block", background: DC.ink, color: "#fff", borderRadius: 6,
      padding: "2px 10px", fontSize: 13.5, fontWeight: 900, letterSpacing: 2, whiteSpace: "nowrap",
    }}>{children}</span>
  );
}

function NextList({ matches }) {
  return (
    <div style={{ background: "#fff", border: `3px solid ${DC.line}`, borderRadius: 14, padding: "10px 14px", boxSizing: "border-box" }}>
      <div style={{ marginBottom: 8 }}><TitleBadge>次の試合</TitleBadge></div>
      {matches.length === 0 && <div style={{ color: DC.sub, fontSize: 15, fontWeight: 800, textAlign: "center", padding: "12px 0" }}>予定なし</div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {matches.map((m, i) => (
          <div key={m.id || i} style={{ display: "flex", alignItems: "center", gap: 8, border: `2px solid ${DC.line}`, borderRadius: 10, padding: "6px 10px" }}>
            <span style={{ fontSize: 12, fontWeight: 900, color: "#fff", background: DC.ink, borderRadius: 5, padding: "1px 7px", flexShrink: 0 }}>T{m.tableNum}</span>
            <span style={{ fontSize: 15.5, fontWeight: 800, color: DC.ink, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {(m.names || ["", ""])[0]} <span style={{ color: DC.sub, fontWeight: 700 }}>対</span> {(m.names || ["", ""])[1]}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}
/* ========= プロジェクター投影モード =========
   横向き専用。店内が明るい想定なので白地に濃い色文字。名前・スコアに加えてラック履歴と
   進行中ラックもリアルタイムで出す（LiveTablePanelの中央カラムと同じ考え方をvw単位に拡大）。
   縦向きのままだと文字が小さいままなので、縦向きを検知したら回転を促す案内に切り替える */
const PROJ_SHOW_RACKS = 6;

function ProjectorCard({ tableNum, m }) {
  const [openHist, setOpenHist] = useState(false);
  const [flashing, setFlashing] = useState(false);
  const lastLiveRef = useRef(null);
  const flashTimerRef = useRef(null);

  const tBadge = {
    display: "inline-block", background: C.ink, color: "#fff", borderRadius: "0.6vw",
    padding: "0.3vw 1vw", fontSize: "1.6vw", fontWeight: 900, letterSpacing: 2,
  };

  const balls = (m && m.balls) || [];
  const live = [
    balls.filter((b) => b.loc === "p1" && !b.dead).length,
    balls.filter((b) => b.loc === "p2" && !b.dead).length,
  ];
  const liveKey = m ? `${m.id}:${m.rack}:${live[0]}/${live[1]}` : "";

  // 進行中ラックの点数が変わったら点滅（他卓を横目で見ても気づけるように）
  useEffect(() => {
    if (!m || m.phase !== "play") { lastLiveRef.current = liveKey; return; }
    if (lastLiveRef.current !== null && lastLiveRef.current !== liveKey) {
      setFlashing(true);
      clearTimeout(flashTimerRef.current);
      flashTimerRef.current = setTimeout(() => setFlashing(false), 5000);
    }
    lastLiveRef.current = liveKey;
  }, [liveKey]);
  useEffect(() => () => clearTimeout(flashTimerRef.current), []);

  if (!m) {
    return (
      <div style={{ flex: 1, minHeight: 0, boxSizing: "border-box", background: C.zone, border: `0.25vw dashed ${C.line}`, borderRadius: "1vw", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: "1vw" }}>
        <span style={{ ...tBadge, background: C.sub }}>T{tableNum}</span>
        <div style={{ fontSize: "2.2vw", fontWeight: 900, color: C.sub }}>予定なし</div>
      </div>
    );
  }

  const names = m.names || ["", ""];
  const raceTo = m.raceTo || [0, 0];
  const tot = m.tot || [0, 0];
  const hist = m.hist || [];
  const bothLose = !!m.bothLose;
  const reached = [raceTo[0] > 0 && tot[0] >= raceTo[0], raceTo[1] > 0 && tot[1] >= raceTo[1]];
  const winner = bothLose ? null
    : (m.winner === 0 || m.winner === 1) ? m.winner
    : (reached[0] && reached[1]) ? (hist.slice(-1)[0] || { w: 0 }).w
    : reached[0] ? 0 : reached[1] ? 1 : null;
  const finished = winner != null || bothLose;
  const hillHill = !finished && m.phase === "play" &&
    raceTo[0] > 0 && raceTo[1] > 0 && raceTo[0] - tot[0] <= 14 && raceTo[1] - tot[1] <= 14;
  const disp = (m.phase === "play" && !hillHill) ? [tot[0] + live[0], tot[1] + live[1]] : tot;
  const stateTxt = m.pending ? "勝者待ち" : m.phase === "banking" ? "バンキング中" : finished ? "試合終了" : "";

  const card = (i) => {
    const pc = i === 0 ? C.blue : C.red;
    const isBrk = m.brk === i;
    const isWinner = finished && !bothLose && winner === i;
    let badge = null;
    if (m.pending) badge = null;
    else if (finished) badge = winner === i ? "勝ち" : `あと${Math.max(0, raceTo[i] - disp[i])}`;
    else if (hillHill) badge = i === 0 ? "ヒルヒル！" : "9番勝負！";
    else if (m.phase === "play") {
      const rem = raceTo[i] - disp[i];
      badge = rem <= 0 ? "達成" : `あと${rem}`;
    }
    return (
      <div style={{
        flex: 1, minWidth: 0, background: pc, borderRadius: "0.9vw", padding: "0.6vw 0.4vw",
        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", position: "relative",
        boxShadow: isWinner
          ? "0 0 0 0.3vw #FFD54A, inset 0 0 0 0.25vw rgba(255,255,255,0.7)"
          : isBrk ? "inset 0 0 0 0.25vw rgba(255,255,255,0.7)" : "none",
      }}>
        <div style={{ position: "absolute", top: "0.3vw", fontSize: "1.15vw", fontWeight: 900, color: "#fff", letterSpacing: 2, visibility: isBrk ? "visible" : "hidden" }}>● ブレイク</div>
        <div style={{ width: "94%", marginTop: "1.2vw" }}>
          <div style={{
            fontSize: "2.9vw", fontWeight: 900, color: "#fff", textAlign: "center", lineHeight: 1.15,
            overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
          }}>{names[i]}</div>
          {rateOfPlayer(m, i) && (
            <div style={{ textAlign: "center", marginTop: "0.1vw" }}>
              <span style={{ fontSize: "1vw", fontWeight: 800, color: "#fff", opacity: 0.65 }}>FR</span>
              <span style={{ fontSize: "1.5vw", fontWeight: 900, color: "#fff", opacity: 0.95, fontVariantNumeric: "tabular-nums", marginLeft: "0.15vw" }}>
                {rateOfPlayer(m, i)}
              </span>
            </div>
          )}
        </div>
        <div style={{ fontSize: "4.6vw", fontWeight: 900, color: "#fff", lineHeight: 1, fontVariantNumeric: "tabular-nums" }}>
          {m.pending || m.phase === "banking" ? "–" : disp[i]}
          {!m.pending && <span style={{ fontSize: "0.34em", opacity: 0.75 }}>/{raceTo[i]}</span>}
        </div>
        <div style={{ minHeight: "2vw", marginTop: "0.5vw" }}>
          {badge && (
            <div style={{
              background: isWinner ? "#FFD54A" : "#fff",
              color: isWinner ? "#5A4400" : pc,
              borderRadius: "0.6vw", padding: "0.25vw 1vw", fontSize: "1.5vw", fontWeight: 900, whiteSpace: "nowrap",
            }}>{badge}</div>
          )}
        </div>
      </div>
    );
  };

  // 中央：ラック履歴＋進行中ラック（LiveTablePanelと同じ考え方）
  const hidden = Math.max(0, hist.length - PROJ_SHOW_RACKS);
  const shown = openHist ? hist : hist.slice(hidden);
  const rowStyle = { display: "flex", alignItems: "center", justifyContent: "center", gap: "0.15vw", fontSize: "1.3vw", fontWeight: 700, fontVariantNumeric: "tabular-nums", lineHeight: 1.35 };
  const numStyle = (side, strong) => ({ width: "2vw", textAlign: side === "a" ? "right" : "left", color: side === "a" ? C.blue : C.red, fontWeight: strong ? 900 : 700 });

  const histJsx = (
    <div style={{ width: "6.5vw", flexShrink: 0, background: "#fff", border: `0.15vw solid ${C.line}`, borderRadius: "0.9vw", padding: "0.4vw 0.2vw", display: "flex", flexDirection: "column" }}>
      <div style={{ fontSize: "0.85vw", fontWeight: 800, color: C.sub, textAlign: "center", marginBottom: "0.3vw", letterSpacing: 1 }}>ラック</div>
      {m.pending || m.phase === "banking" ? (
        <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", color: C.sub, fontSize: "0.9vw", textAlign: "center" }}>
          {m.pending ? <>前の試合<br />待ち</> : <>まだ<br />ありません</>}
        </div>
      ) : (
        <>
          <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: "0.1vw", overflow: "hidden" }}>
            {hidden > 0 && (
              <div onClick={() => setOpenHist((v) => !v)} style={{
                fontSize: "0.8vw", fontWeight: 800, color: C.sub, textAlign: "center", lineHeight: 1.6,
                border: `0.1vw solid ${C.line}`, borderRadius: "0.4vw", marginBottom: "0.2vw", cursor: "pointer", background: C.zone,
              }}>{openHist ? "▲ 畳む" : `▼ 前${hidden}`}</div>
            )}
            {shown.map((h, k) => {
              const add = h.add || [0, 0];
              return (
                <div key={k} style={rowStyle}>
                  <span style={numStyle("a", h.w === 0)}>{add[0]}</span>
                  <span style={{ color: "#B8BFC6", fontSize: "1vw" }}>-</span>
                  <span style={numStyle("b", h.w === 1)}>{add[1]}</span>
                </div>
              );
            })}
            {m.phase === "play" && (
              <div style={{ ...rowStyle, background: flashing ? undefined : "#FFF6CC", borderRadius: "0.4vw", animation: flashing ? "rackFlash 0.45s steps(1) 0s 11" : "none" }}>
                <span style={numStyle("a")}>{live[0]}</span>
                <span style={{ color: "#B8BFC6", fontSize: "1vw" }}>-</span>
                <span style={numStyle("b")}>{live[1]}</span>
              </div>
            )}
          </div>
          <div style={{ marginTop: "0.3vw", paddingTop: "0.3vw", borderTop: `0.15vw solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", gap: "0.3vw", fontSize: "1.3vw", fontWeight: 900, fontVariantNumeric: "tabular-nums" }}>
            <span style={{ color: C.blue }}>{disp[0]}</span>
            <span style={{ color: C.sub, fontSize: "1vw" }}>-</span>
            <span style={{ color: C.red }}>{disp[1]}</span>
          </div>
        </>
      )}
    </div>
  );

  return (
    <div style={{ flex: 1, minHeight: 0, boxSizing: "border-box", background: "#fff", border: `0.2vw solid ${C.ink}`, borderRadius: "1vw", padding: "0.8vw", display: "flex", flexDirection: "column", minWidth: 0 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "0.4vw" }}>
        <span style={tBadge}>T{tableNum}</span>
        <span style={{ fontSize: "1.2vw", fontWeight: 900, color: C.ink, textAlign: "right" }}>
          {stateTxt}{m.bracket ? `・${roundLabelOf(m)}` : ""}
        </span>
      </div>
      <div style={{ flex: 1, display: "flex", gap: "0.5vw", minHeight: 0 }}>
        {card(0)}
        {histJsx}
        {card(1)}
      </div>
      <div style={{ minHeight: "2.2vw", marginTop: "0.4vw" }}>
        {bothLose ? (
          <div style={{ textAlign: "center", fontSize: "1.6vw", fontWeight: 900, color: "#fff", background: C.hill, borderRadius: "0.6vw", padding: "0.35vw 0" }}>時間切れ</div>
        ) : winner != null ? (
          <div style={{ textAlign: "center", fontSize: "1.6vw", fontWeight: 900, color: "#fff", background: C.win, borderRadius: "0.6vw", padding: "0.35vw 0" }}>🏆 {names[winner]} 勝利</div>
        ) : null}
      </div>
    </div>
  );
}

function ProjectorNextCard({ tableNum, m }) {
  const tBadge = {
    display: "inline-block", background: C.ink, color: "#fff", borderRadius: "0.5vw",
    padding: "0.2vw 0.8vw", fontSize: "1.1vw", fontWeight: 900, letterSpacing: 1.5,
  };
  return (
    <div style={{
      flexShrink: 0, boxSizing: "border-box", background: "#fff", border: `0.15vw solid ${C.line}`,
      borderRadius: "0.9vw", padding: "0.6vw 1vw", display: "flex", alignItems: "center", gap: "0.8vw",
    }}>
      <span style={{ ...tBadge, flexShrink: 0 }}>次 T{tableNum}</span>
      {m ? (
        <span style={{
          fontSize: "1.7vw", fontWeight: 800, color: C.ink, overflow: "hidden",
          textOverflow: "ellipsis", whiteSpace: "nowrap",
        }}>
          {(m.names || ["", ""])[0]} <span style={{ color: C.sub, fontWeight: 700 }}>対</span> {(m.names || ["", ""])[1]}
        </span>
      ) : (
        <span style={{ fontSize: "1.4vw", fontWeight: 800, color: C.sub }}>次の予定なし</span>
      )}
    </div>
  );
}

function ProjectorMode({ onExit }) {
  const [matches, setMatches] = useState({});
  const [portrait, setPortrait] = useState(() => window.innerWidth < window.innerHeight);
  const [faded, setFaded] = useState(false);
  useEffect(() => subscribeAllMatches((m) => setMatches(m || {}), () => {}), []);
  useEffect(() => {
    const onResize = () => setPortrait(window.innerWidth < window.innerHeight);
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", onResize);
    return () => {
      window.removeEventListener("resize", onResize);
      window.removeEventListener("orientationchange", onResize);
    };
  }, []);
  // 終了ボタンは投影の邪魔にならないよう、数秒したら小さく薄くする（触れた時だけ元に戻す）
  useEffect(() => {
    const t = setTimeout(() => setFaded(true), 2500);
    return () => clearTimeout(t);
  }, []);
  const display = [1, 2, 3].map((t) => pickDisplayMatch(matches, t));
  const queues = [1, 2, 3].map((t) => getQueueForTable(matches, t));

  return (
    <div style={{ position: "fixed", inset: 0, background: "#fff", zIndex: 3000, fontFamily: FONT }}>
      <button
        onClick={onExit}
        onTouchStart={() => setFaded(false)}
        onMouseEnter={() => setFaded(false)}
        style={{
          position: "absolute", top: 10, right: 10, zIndex: 10, background: C.ink,
          color: "#fff", border: "none", borderRadius: faded ? 16 : 8,
          padding: faded ? "6px 8px" : "6px 12px",
          fontSize: 13, fontWeight: 800, cursor: "pointer", fontFamily: FONT,
          opacity: faded ? 0.12 : 1, transition: "opacity 0.8s ease, padding 0.3s ease, border-radius 0.3s ease",
        }}>{faded ? "✕" : "✕ 投影モードを終了"}</button>
      {portrait ? (
        <div style={{ height: "100%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", color: C.ink, textAlign: "center", padding: 24 }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>📱⟳</div>
          <div style={{ fontSize: 20, fontWeight: 800 }}>端末を横向きにしてください</div>
        </div>
      ) : (
        <div style={{ height: "100%", boxSizing: "border-box", padding: "1.2vw", display: "flex", gap: "1vw" }}>
          {[0, 1, 2].map((i) => (
            <div key={i} style={{ flex: 1, height: "100%", display: "flex", flexDirection: "column", gap: "0.7vw", minWidth: 0 }}>
              <ProjectorCard tableNum={i + 1} m={display[i]} />
              {/* 次の対戦：現在表示中の試合の次にその卓へ入るカード。横向きは縦に余裕があるので常設表示 */}
              <ProjectorNextCard tableNum={i + 1} m={queues[i][1] || null} />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const TABS = [["timeline", "🗓 対戦表"], ["tables", "🐾 テーブル"]];

/* ========= 外枠：観戦用。対戦表とテーブルの様子を見るだけで、スコアは付けられない ========= */
function Shell() {
  const [tab, setTab] = useState("tables");
  const [config, setConfig] = useState({});
  const [showStandings, setShowStandings] = useState(false);
  const [projectorMode, setProjectorMode] = useState(false);
  const startRef = useRef(null);   // タブをなぞり始めた位置
  const swipedRef = useRef(false); // なぞった直後のタップでタブが切り替わらないようにする
  useEffect(() => subscribeConfig(setConfig), []);
  const liveUrl = (config.liveUrl || "").trim();

  if (projectorMode) {
    return <ProjectorMode onExit={() => setProjectorMode(false)} />;
  }

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", fontFamily: FONT, background: C.bg }}>
      <div style={{ display: "flex", alignItems: "center", borderBottom: `1px solid ${C.line}`, background: "#fff", flexShrink: 0 }}>
        {TABS.map(([key, label]) => (
          <button key={key}
            onClick={() => { if (swipedRef.current) { swipedRef.current = false; return; } setTab(key); }}
            onTouchStart={(e) => { const t = e.touches[0]; startRef.current = { x: t.clientX, y: t.clientY }; swipedRef.current = false; }}
            onTouchEnd={(e) => {
              // 🐾のタブを右へなぞると順位表が出る（本部だけが知っている抜け道）
              const st = startRef.current; const t = e.changedTouches[0];
              if (!st || !t) return;
              const dx = t.clientX - st.x, dy = Math.abs(t.clientY - st.y);
              // バナーを✕で消してある時だけ開く（ふたつ揃って初めての抜け道）
              if (key === "tables" && bannersClosed && dx > 60 && dy < 40) { swipedRef.current = true; setShowStandings(true); }
              startRef.current = null;
            }}
            style={{ flexShrink: 0, padding: "12px 18px", background: "none", border: "none", fontSize: "clamp(12px, 3.6vw, 15px)", whiteSpace: "nowrap", fontWeight: tab === key ? 800 : 600, color: tab === key ? C.blue : C.sub, cursor: "pointer", fontFamily: FONT, touchAction: "pan-y" }}>
            {label}
          </button>
        ))}
        <span style={{ flex: 1 }} />
        <button onClick={() => setProjectorMode(true)} style={{
          flexShrink: 0, marginRight: 10, fontSize: 11, fontWeight: 800, color: C.ink,
          background: "#fff", border: `1px solid ${C.line}`, borderRadius: 8, padding: "5px 9px",
          whiteSpace: "nowrap", cursor: "pointer", fontFamily: FONT,
        }}>🖥 投影モード</button>
        {liveUrl ? (
          <a href={liveUrl} target="_blank" rel="noopener noreferrer" style={{
            flexShrink: 0, marginRight: 10, fontSize: 11, fontWeight: 800, color: "#fff", background: "#C6392E",
            borderRadius: 8, padding: "5px 9px", whiteSpace: "nowrap", textDecoration: "none",
          }}>{LIVE_LABEL}</a>
        ) : (
          <span style={{ flexShrink: 0, marginRight: 10, fontSize: 10.5, fontWeight: 800, color: C.sub, border: `1px solid ${C.line}`, borderRadius: 8, padding: "3px 7px", whiteSpace: "nowrap" }}>観戦用</span>
        )}
      </div>
      <div style={{ flex: 1, minHeight: 0, position: "relative" }}>
        <div style={{ position: "absolute", inset: 0, overflowY: "auto", display: tab === "timeline" ? "block" : "none" }}>
          <TimelineTab myMatchId={null} onPick={null} />
        </div>
        <div style={{ position: "absolute", inset: 0, overflowY: "auto", display: tab === "tables" ? "block" : "none" }}>
          <TablesTab />
        </div>
      </div>
      {showStandings && <StandingsSheet onClose={() => setShowStandings(false)} />}
    </div>
  );
}

/* ========= ルート ========= */
function App() {
  return <Shell />;
}


try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  showCrash(e.message + "\n" + (e.stack || ""));
}
</script>
</body>
</html>
