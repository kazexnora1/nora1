<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
<!-- ホーム画面から起動するとSafariのバーが消えて全画面になる（プロジェクター投影用） -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="スコア表示" />
<title>JCL9Match B3 観戦ディスプレイ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; background: #FFFFFF; }
</style>
<script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<div id="crashlog" style="display:none; position:fixed; inset:0; background:#fff3f3; color:#7A2E2E; padding:16px; font-family:monospace; font-size:13px; white-space:pre-wrap; overflow:auto; z-index:9999;"></div>
<script>
  function showCrash(msg) {
    const el = document.getElementById("crashlog");
    el.style.display = "block";
    el.textContent = "エラーが発生しました:\n\n" + msg;
  }
  window.onerror = function (msg, src, line, col, err) {
    showCrash(msg + "\n" + (src || "") + ":" + line + ":" + col + "\n" + (err && err.stack ? err.stack : ""));
  };
  window.addEventListener("unhandledrejection", function (e) {
    showCrash("Promise rejected: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const FONT = "'M PLUS Rounded 1c', system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif";
/* ===== 明るい部屋でのプロジェクター投影に合わせた配色 =====
   ・背景は白のまま（明るい室内では黒背景が灰色に浮いて逆に読めなくなるため）
   ・薄いグレーの面と細い線は投影で消えるので使わない。区切りは太い黒線で表現する
   ・文字は白抜き・フチ取り・影を使わず、黒か濃色のベタ塗りで出す */
const C = {
  bg: "#FFFFFF", ink: "#0E1216", sub: "#3C454E", line: "#0E1216", lineSoft: "#B8BFC6",
  blue: "#12508F", red: "#A3211A", win: "#1E6B36", hill: "#8A4B0B",
};

/* ========= 共有バックエンド：Firebase Realtime Database（読み取り専用） =========
   ↓ B1・B2 とまったく同じ値を貼ってください */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB587L7xl4fcl63QPbpgCRmoxLh4xMwEnQ",
  authDomain: "nora1kaze-247f3.firebaseapp.com",
  databaseURL: "https://nora1kaze-247f3-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "nora1kaze-247f3",
  storageBucket: "nora1kaze-247f3.firebasestorage.app",
  messagingSenderId: "965985901209",
  appId: "1:965985901209:web:5f99e023c1492d50a0f608",
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

/* 対戦データの変更を購読する。ポーリングしないので、スコアが動いた瞬間に画面へ反映される */
function subscribeMatches(onValue, onError) {
  const ref = db.ref("matches");
  const handler = ref.on("value", (snap) => onValue(snap.val() || {}),
    (e) => onError && onError(e && e.message ? e.message : String(e)));
  return () => ref.off("value", handler);
}

const STALE_MS = 1000 * 60 * 60 * 6; // 6時間以上更新のない試合は無視（前日の残骸対策）

/* Firebaseは空の配列を保存しない（キーごと消える）ので、読み込み側で補う */
function normalizeMatch(m) {
  if (!m) return m;
  return {
    ...m,
    names: Array.isArray(m.names) ? m.names : ["P1", "P2"],
    tot: Array.isArray(m.tot) ? m.tot : [0, 0],
    raceTo: Array.isArray(m.raceTo) ? m.raceTo : [0, 0],
    balls: Array.isArray(m.balls) ? m.balls : [],
    hist: Array.isArray(m.hist) ? m.hist : [],
    rack: m.rack || 1,
  };
}
function isMatchFinished(m) {
  if (m.bothLose) return true; // 時間切れ・最終ラック終了時にどちらも目標に届かなかった場合
  const rt = m.raceTo || [0, 0], tot = m.tot || [0, 0];
  return (rt[0] > 0 && tot[0] >= rt[0]) || (rt[1] > 0 && tot[1] >= rt[1]);
}
// 卓ごとの待機列：未終了の対戦を作成順に並べる。[0]が現在対戦中、[1]が次戦
function getQueueForTable(matches, tableNum) {
  const list = [];
  for (const id in matches) {
    const m = matches[id];
    if (!m || Number(m.table) !== tableNum) continue;
    if (!m.updatedAt || Date.now() - m.updatedAt > STALE_MS) continue;
    if (isMatchFinished(m)) continue;
    list.push({ ...normalizeMatch(m), id });
  }
  list.sort((a, b) => (a.createdAt || a.updatedAt) - (b.createdAt || b.updatedAt));
  return list;
}

/* 投影中に画面が消えるとプロジェクターも真っ暗になるので、スリープを止める。
   iOS 16.4以降のSafariで有効。効かない端末では「設定 → 画面表示と明るさ → 自動ロック → なし」で運用する */
function useKeepAwake() {
  useEffect(() => {
    let lock = null;
    const request = async () => {
      try {
        if (navigator.wakeLock && document.visibilityState === "visible") {
          lock = await navigator.wakeLock.request("screen");
        }
      } catch {}
    };
    request();
    // 一度バックグラウンドに行くと解除されるので、戻ってきたら取り直す
    const onVisible = () => { if (document.visibilityState === "visible") request(); };
    document.addEventListener("visibilitychange", onVisible);
    return () => {
      document.removeEventListener("visibilitychange", onVisible);
      if (lock) { try { lock.release(); } catch {} }
    };
  }, []);
}

function App() {
  const [queues, setQueues] = useState([[], [], []]);
  const [err, setErr] = useState(null);
  useKeepAwake();

  // 縦画面なら3段（テーブルを縦に積む）、横画面なら従来の2x2レイアウト。
  // プロジェクターへは横向きで繋ぐと画面いっぱいに映る（縦だと左右に黒帯が出て小さくなる）
  const [portrait, setPortrait] = useState(() => window.innerHeight >= window.innerWidth);
  useEffect(() => {
    const onResize = () => setPortrait(window.innerHeight >= window.innerWidth);
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", onResize);
    return () => {
      window.removeEventListener("resize", onResize);
      window.removeEventListener("orientationchange", onResize);
    };
  }, []);

  // ===== 自由なピンチズーム・パン =====
  // scale：拡大率。tx, ty：ステージのずらし量(px)。指の下の点がそのまま拡大の中心になるよう、
  // タッチ位置から逆算してtx/tyを決める。txRef等はイベントハンドラから最新値を読むための参照
  const [scale, setScaleState] = useState(1);
  const [tx, setTxState] = useState(0);
  const [ty, setTyState] = useState(0);
  const scaleRef = useRef(1), txRef = useRef(0), tyRef = useRef(0);
  const setScale = (v) => { scaleRef.current = v; setScaleState(v); };
  const setTx = (v) => { txRef.current = v; setTxState(v); };
  const setTy = (v) => { tyRef.current = v; setTyState(v); };

  const viewportRef = useRef(null);
  const gestureRef = useRef(null); // 現在進行中のジェスチャー（1本指パン／2本指ピンチ）の基準値

  // 画面に収まりきらない時に引けるよう、1倍より小さくも縮められるようにしている
  const MIN_SCALE = 0.35, MAX_SCALE = 8;

  const beginGesture = (touches) => {
    const rect = viewportRef.current.getBoundingClientRect();
    if (touches.length === 1) {
      gestureRef.current = {
        mode: "pan",
        startX: touches[0].clientX, startY: touches[0].clientY,
        startTx: txRef.current, startTy: tyRef.current,
      };
    } else if (touches.length >= 2) {
      const [a, b] = touches;
      const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const midX = (a.clientX + b.clientX) / 2 - rect.left;
      const midY = (a.clientY + b.clientY) / 2 - rect.top;
      // anchor：ピンチの中心が「拡大されていないステージ」上のどこに当たるかを固定しておく
      gestureRef.current = {
        mode: "pinch", rect,
        startDist: dist, startScale: scaleRef.current,
        anchorX: (midX - txRef.current) / scaleRef.current,
        anchorY: (midY - tyRef.current) / scaleRef.current,
      };
    }
  };

  useEffect(() => {
    const el = viewportRef.current;
    if (!el) return;

    const onStart = (e) => { beginGesture(e.touches); };

    const onMove = (e) => {
      const g = gestureRef.current;
      if (!g) return;
      e.preventDefault();
      if (e.touches.length === 1) {
        if (g.mode !== "pan") { beginGesture(e.touches); return; }
        setTx(g.startTx + (e.touches[0].clientX - g.startX));
        setTy(g.startTy + (e.touches[0].clientY - g.startY));
      } else if (e.touches.length >= 2) {
        if (g.mode !== "pinch") { beginGesture(e.touches); return; }
        const [a, b] = e.touches;
        const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, g.startScale * (dist / g.startDist)));
        const midX = (a.clientX + b.clientX) / 2 - g.rect.left;
        const midY = (a.clientY + b.clientY) / 2 - g.rect.top;
        setScale(newScale);
        setTx(midX - g.anchorX * newScale);
        setTy(midY - g.anchorY * newScale);
      }
    };

    // 指の本数が変わった（片方だけ離した等）時は、基準値を今の状態から取り直して座標が飛ばないようにする
    const onEnd = (e) => {
      if (e.touches.length === 0) gestureRef.current = null;
      else beginGesture(e.touches);
    };

    el.addEventListener("touchstart", onStart, { passive: false });
    el.addEventListener("touchmove", onMove, { passive: false });
    el.addEventListener("touchend", onEnd);
    el.addEventListener("touchcancel", onEnd);
    return () => {
      el.removeEventListener("touchstart", onStart);
      el.removeEventListener("touchmove", onMove);
      el.removeEventListener("touchend", onEnd);
      el.removeEventListener("touchcancel", onEnd);
    };
  }, []);

  // ＋／－ボタン：画面中央を中心に拡大縮小する
  const stepZoom = (delta) => {
    const rect = viewportRef.current.getBoundingClientRect();
    const cx = rect.width / 2, cy = rect.height / 2;
    const anchorX = (cx - txRef.current) / scaleRef.current;
    const anchorY = (cy - tyRef.current) / scaleRef.current;
    const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, +(scaleRef.current + delta).toFixed(2)));
    setScale(newScale);
    setTx(cx - anchorX * newScale);
    setTy(cy - anchorY * newScale);
  };
  const resetZoom = () => { setScale(1); setTx(0); setTy(0); };

  useEffect(() => subscribeMatches(
    (matches) => { setQueues([1, 2, 3].map((t) => getQueueForTable(matches, t))); setErr(null); },
    (e) => setErr(e)), []);

  const nextMatches = queues
    .map((q, i) => (q[1] ? { ...q[1], tableNum: i + 1 } : null))
    .filter(Boolean);

  return (
    <div style={{ height: "100vh", background: C.bg, fontFamily: FONT, padding: "10px", boxSizing: "border-box", position: "relative", overflow: "hidden" }}>
      <div style={{ position: "absolute", top: 6, right: 8, display: "flex", gap: 6, zIndex: 10 }}>
        <button onClick={() => stepZoom(-0.25)} style={zoomBtn}>−</button>
        <button onClick={resetZoom} style={{ ...zoomBtn, width: "auto", padding: "6px 10px" }}>{Math.round(scale * 100)}%</button>
        <button onClick={() => stepZoom(0.25)} style={zoomBtn}>＋</button>
      </div>

      {/* ここから下が、好きな場所を好きなだけピンチで拡大・1本指でドラッグして動かせる範囲 */}
      <div ref={viewportRef} style={{ position: "relative", width: "100%", height: "calc(100vh - 20px)", overflow: "hidden", touchAction: "none" }}>
        <div style={{
          position: "absolute", left: 0, top: 0, width: "100%", height: "100%",
          transform: `translate(${tx}px, ${ty}px) scale(${scale})`, transformOrigin: "0 0",
        }}>
          {portrait ? (
            <div style={{ display: "flex", flexDirection: "column", gap: 10, height: "100%", maxWidth: 900, margin: "0 auto" }}>
              <div style={{ flex: 1, minHeight: 0 }}><TablePanel tableNum={1} m={queues[0][0]} /></div>
              <div style={{ flex: 1, minHeight: 0 }}><TablePanel tableNum={2} m={queues[1][0]} /></div>
              <div style={{ flex: 1, minHeight: 0 }}><TablePanel tableNum={3} m={queues[2][0]} /></div>
            </div>
          ) : (
            <div style={{
              display: "grid", gridTemplateColumns: "1fr 1fr", gridTemplateRows: "1fr 1fr",
              gridTemplateAreas: `"t1 t2" "next t3"`, gap: 10,
              height: "100%", maxWidth: 1600, margin: "0 auto",
            }}>
              <div style={{ gridArea: "t1" }}><TablePanel tableNum={1} m={queues[0][0]} /></div>
              <div style={{ gridArea: "t2" }}><TablePanel tableNum={2} m={queues[1][0]} /></div>
              <div style={{ gridArea: "t3" }}><TablePanel tableNum={3} m={queues[2][0]} /></div>
              <div style={{ gridArea: "next" }}><NextList matches={nextMatches} /></div>
            </div>
          )}
        </div>
      </div>
      {err && <div style={{ position: "absolute", left: 0, right: 0, bottom: 4, color: C.red, textAlign: "center", fontSize: 14, fontWeight: 800, zIndex: 10 }}>同期エラー: {err}</div>}
    </div>
  );
}
const zoomBtn = {
  width: 34, height: 28, background: "#fff", border: `2px solid ${C.line}`, borderRadius: 6,
  color: C.ink, fontSize: 14, fontWeight: 900, cursor: "pointer", fontFamily: FONT,
  display: "flex", alignItems: "center", justifyContent: "center", padding: 0,
};

/* 見出しの黒ベタ帯。薄いグレーの面より投影で確実に残る */
function TitleBadge({ children }) {
  return (
    <span style={{
      display: "inline-block", background: C.ink, color: "#fff", borderRadius: 6,
      padding: "3px 12px", fontSize: "clamp(15px, 1.7vw, 26px)", fontWeight: 900, letterSpacing: 2, whiteSpace: "nowrap",
    }}>{children}</span>
  );
}

function NextList({ matches }) {
  return (
    <div style={{ height: "100%", background: "#fff", border: `3px solid ${C.line}`, borderRadius: 14, padding: "10px 14px", boxSizing: "border-box", overflow: "hidden" }}>
      <div style={{ marginBottom: 8 }}><TitleBadge>次の試合</TitleBadge></div>
      {matches.length === 0 && <div style={{ color: C.sub, fontSize: "clamp(16px, 1.8vw, 26px)", fontWeight: 800, textAlign: "center", marginTop: 18 }}>予定なし</div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {matches.map((m, i) => (
          <div key={m.id || i} style={{ display: "flex", alignItems: "center", gap: 10, border: `2px solid ${C.line}`, borderRadius: 10, padding: "6px 12px" }}>
            <span style={{ fontSize: "clamp(14px, 1.5vw, 22px)", fontWeight: 900, color: "#fff", background: C.ink, borderRadius: 5, padding: "1px 8px", flexShrink: 0 }}>卓{m.tableNum}</span>
            <span style={{ fontSize: "clamp(17px, 2vw, 30px)", fontWeight: 800, color: C.ink, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {(m.names || ["", ""])[0]} <span style={{ color: C.sub, fontWeight: 700 }}>対</span> {(m.names || ["", ""])[1]}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

function hillInfo(rt, disp) {
  if (rt <= 0) return null;
  const rem = rt - disp;
  if (rem <= 0) return { label: "達成", value: null };
  const toHill = rem - 14;
  return toHill > 0 ? { label: "ヒルまで", value: toHill } : { label: "勝ちまで", value: rem };
}
function TablePanel({ tableNum, m }) {
  if (!m) {
    return (
      <div style={{ height: "100%", boxSizing: "border-box", background: "#fff", border: `3px solid ${C.line}`, borderRadius: 14, padding: "16px 18px", color: C.ink, textAlign: "center", display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", gap: 14 }}>
        <TitleBadge>卓 {tableNum}</TitleBadge>
        <div style={{ fontSize: "clamp(22px, 3vw, 44px)", fontWeight: 900, color: C.sub }}>待機中</div>
      </div>
    );
  }

  const names = m.names || ["プレイヤー1", "プレイヤー2"];
  const raceTo = m.raceTo || [0, 0];
  const tot = m.tot || [0, 0];
  const balls = m.balls || [];
  const live = [
    balls.filter((b) => b.loc === "p1" && !b.dead).length,
    balls.filter((b) => b.loc === "p2" && !b.dead).length,
  ];
  const disp = m.phase === "play" ? [tot[0] + live[0], tot[1] + live[1]] : tot;
  const hillHill = raceTo[0] > 0 && raceTo[1] > 0 && raceTo[0] - tot[0] <= 14 && raceTo[1] - tot[1] <= 14;
  const bothLose = !!m.bothLose; // 時間切れでどちらも目標に届かなかった
  const reached = [raceTo[0] > 0 && tot[0] >= raceTo[0], raceTo[1] > 0 && tot[1] >= raceTo[1]];
  const matchWinner = bothLose || m.phase === "banking" ? null :
    (m.winner === 0 || m.winner === 1) ? m.winner :
    // ヒルヒルで両者が目標に達した場合は、そのラックで9番を落とした方が勝ち
    (reached[0] && reached[1]) ? ((m.hist || []).slice(-1)[0] || { w: 0 }).w :
    reached[0] ? 0 :
    reached[1] ? 1 :
    (!hillHill && disp[0] >= raceTo[0] && raceTo[0] > 0) ? 0 :
    (!hillHill && disp[1] >= raceTo[1] && raceTo[1] > 0) ? 1 : null;
  const rate = (i) => (raceTo[i] > 0 ? Math.min(1, tot[i] / raceTo[i]) : 0);

  return (
    <div style={{ height: "100%", boxSizing: "border-box", background: "#fff", border: `3px solid ${C.line}`, borderRadius: 14, padding: "10px 14px", color: C.ink, display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
        <TitleBadge>卓 {tableNum}</TitleBadge>
        <span style={{ fontSize: "clamp(14px, 1.6vw, 24px)", color: C.ink, fontWeight: 900 }}>
          {m.phase === "banking" ? "バンキング中" : (matchWinner != null || bothLose) ? "試合終了" : ""}
        </span>
      </div>

      {hillHill && matchWinner == null && !bothLose && m.phase === "play" && (
        <div style={{ background: C.hill, color: "#fff", borderRadius: 8, padding: "3px 10px", textAlign: "center", fontSize: "clamp(15px, 1.8vw, 26px)", fontWeight: 900, marginBottom: 6, letterSpacing: 2 }}>
          ヒルヒル
        </div>
      )}

      <div style={{ display: "flex", gap: 10, flex: 1, minHeight: 0 }}>
        {[0, 1].map((i) => {
          const pc = i === 0 ? C.blue : C.red;
          const hi = m.phase !== "banking" ? hillInfo(raceTo[i], disp[i]) : null;
          const isBreaker = m.brk === i;
          return (
            <div key={i} style={{
              flex: 1, textAlign: "center", borderRadius: 10, padding: "6px 4px",
              border: `3px solid ${isBreaker ? pc : C.lineSoft}`,
              display: "flex", flexDirection: "column", justifyContent: "flex-start", overflow: "hidden",
            }}>
              <div style={{
                fontSize: "clamp(19px, 2.4vw, 36px)", fontWeight: 900, color: "#fff", background: pc,
                borderRadius: 6, padding: "2px 6px", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
              }}>{names[i]}</div>

              <div style={{ flex: 1, minHeight: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <div style={{ fontSize: "min(13vw, 19vh)", fontWeight: 900, lineHeight: 1.05, fontVariantNumeric: "tabular-nums", color: C.ink }}>
                  {m.phase === "banking" ? "–" : disp[i]}
                  <span style={{ fontSize: "0.42em", color: C.sub }}>/{raceTo[i]}</span>
                </div>
              </div>

              {/* バッジ行とブレイク行は、中身の有無に関わらず同じ高さを確保する。
                  ブレイクの有無やバンキング中かどうかで、名前とスコアの位置が動かないようにするため */}
              <div style={{ minHeight: "clamp(24px, 2.6vw, 36px)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                {bothLose ? (
                  <span style={{ background: C.hill, color: "#fff", borderRadius: 7, padding: "2px 12px", fontSize: "clamp(14px, 1.6vw, 24px)", fontWeight: 900, whiteSpace: "nowrap" }}>
                    達成率 {(rate(i) * 100).toFixed(0)}％
                  </span>
                ) : hi ? (
                  <span style={{ background: pc, color: "#fff", borderRadius: 7, padding: "2px 12px", fontSize: "clamp(14px, 1.6vw, 24px)", fontWeight: 900, whiteSpace: "nowrap" }}>
                    {hi.value != null ? `${hi.label} ${hi.value}` : hi.label}
                  </span>
                ) : null}
              </div>
              <div style={{
                minHeight: "clamp(18px, 1.9vw, 28px)", marginTop: 3,
                fontSize: "clamp(13px, 1.4vw, 22px)", fontWeight: 900, color: pc, letterSpacing: 1,
                visibility: isBreaker ? "visible" : "hidden",
              }}>● ブレイク</div>
            </div>
          );
        })}
      </div>

      {bothLose ? (
        <div style={{ marginTop: 6, textAlign: "center", fontSize: "clamp(18px, 2.2vw, 34px)", fontWeight: 900, color: "#fff", background: C.hill, borderRadius: 8, padding: "2px 0" }}>
          時間切れ・両者負け
        </div>
      ) : matchWinner != null && (
        <div style={{ marginTop: 6, textAlign: "center", fontSize: "clamp(18px, 2.2vw, 34px)", fontWeight: 900, color: "#fff", background: C.win, borderRadius: 8, padding: "2px 0" }}>
          🏆 {names[matchWinner]} 勝利
        </div>
      )}
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  showCrash(e.message + "\n" + (e.stack || ""));
}
</script>
</body>
</html>
