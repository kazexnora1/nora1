/* ========= 試合画面（バンキング＋スコアリング、2台同期） ========= */
function MatchScreen({ setupInfo, onExit }) {
  const { matchId, names, lenPct, table } = setupInfo;
  const [res] = useState(() => setupInfo.raceToParam
    ? { rt1: setupInfo.raceToParam[0], rt2: setupInfo.raceToParam[1] }
    : computeRace(setupInfo.ratings[0], setupInfo.ratings[1], lenPct));
  const [state, setState] = useState(() => initialMatchState(res.rt1, res.rt2, names, table));
  const [loaded, setLoaded] = useState(false);
  const [syncStatus, setSyncStatus] = useState(null);
  const [nowTs, setNowTs] = useState(Date.now());
  useEffect(() => {
    const iv = setInterval(() => setNowTs(Date.now()), 1000);
    return () => clearInterval(iv);
  }, []);

  // 球エリア内では画面スクロール（スワイプ）を無効化し、球の操作だけ効くようにする
  const playAreaRef = useRef(null);
  useEffect(() => {
    const el = playAreaRef.current;
    if (!el) return;
    const block = (e) => e.preventDefault();
    el.addEventListener("touchmove", block, { passive: false });
    return () => el.removeEventListener("touchmove", block, { passive: false });
  });
  const [pressed, setPressed] = useState(null);
  const [undoStack, setUndoStack] = useState([]);
  const [toolsOpen, setToolsOpen] = useState(false); // タイマー操作（一時停止／延長／降りる）の下シート
  const lastTapRef = useRef({});
  const dirtyRef = useRef(false);
  const stateRef = useRef(state);
  stateRef.current = state;
  const pushTimer = useRef(null);

  const pl = [{ name: names[0], raceTo: String(state.raceTo[0]) }, { name: names[1], raceTo: String(state.raceTo[1]) }];

  const applyLocal = (updater) => {
    setState((s) => {
      const next = typeof updater === "function" ? updater(s) : updater;
      return { ...next, version: s.version + 1 };
    });
    dirtyRef.current = true;
  };

  const [resetDetected, setResetDetected] = useState(false); // 本部が対戦表を組み直し、この対戦が無くなった時に立てる

  // 初回：既存の共有stateを取り込む。ここでは絶対に新規作成しない——
  // 対戦は必ずB1（本部）が先に作成しているので、無ければ「本部が対戦表を組み直した」等でこの対戦が
  // 無くなったということ。ここで作り直してしまうと、消えたはずの対戦が復活してB1側を汚してしまう
  useEffect(() => {
    (async () => {
      try {
        const remote = await loadMatchRemote(matchId);
        if (remote) {
          setState(remote);
        } else {
          setResetDetected(true);
        }
        setSyncStatus({ ok: true });
      } catch (err) {
        setSyncStatus({ ok: false, err: String(err && err.message ? err.message : err) });
      }
      setLoaded(true);
    })();
  }, []);

  // 相手の端末の変更を購読する（ポーリングしないので通信量がほぼゼロ）。
  // 本部が対戦表を組み直すと、この対戦IDのデータが丸ごと消えて null が届く——その場合はリセット扱いにする
  useEffect(() => {
    if (!loaded) return;
    return subscribeMatch(matchId,
      (remote) => {
        if (!remote) { setResetDetected(true); return; }
        if (remote.version > stateRef.current.version) setState(remote);
        setSyncStatus({ ok: true });
      },
      (err) => setSyncStatus({ ok: false, err }));
  }, [loaded, matchId]);

  // 自分の操作で変わった時だけ、少し待ってから共有先に書き込む（リセット後は何も書き込まない）
  useEffect(() => {
    if (!loaded || !dirtyRef.current || resetDetected) return;
    clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(async () => {
      dirtyRef.current = false;
      try {
        await saveMatchRemote(matchId, stateRef.current);
        setSyncStatus({ ok: true });
      } catch (err) {
        setSyncStatus({ ok: false, err: String(err && err.message ? err.message : err) });
      }
    }, 500);
  }, [state, loaded, resetDetected]);

  const rt = (i) => state.raceTo[i] || 0;
  const { tot, rack, brk, balls, phase, lastResult, hist } = state;
  const live = [balls.filter((b) => b.loc === "p1" && !b.dead).length, balls.filter((b) => b.loc === "p2" && !b.dead).length];
  // 得点・目標点・ヒントは「ラックが終わって確定した分」だけを出す（ラック中は動かない）。
  // 勝敗の判定だけは台上の球を足した値で見る（目標に届いた時点で決着させるため）
  const disp = [tot[0], tot[1]];
  const liveTot = phase === "play" ? [tot[0] + live[0], tot[1] + live[1]] : [tot[0], tot[1]];
  const hillHill = rt(0) > 0 && rt(1) > 0 && rt(0) - tot[0] <= 14 && rt(1) - tot[1] <= 14;

  // ===== 持ち時間タイマー =====
  // deadline はタイマー開始時に確定した「時間切れ時刻」（絶対時刻）。以後はこれを基準に逆算するだけで、
  // matchMinutes を後から変えても既に始まっている試合の残り時間は動かない
  const deadline = state.deadline || null;
  const paused = !!state.pauseStart;
  // 勝敗が決まったらその時点で停止（finishedAt で固定）。一時停止中は pauseStart の時点で止めて見せる
  const msLeft = deadline ? deadline - (state.finishedAt || (paused ? state.pauseStart : nowTs)) : null;
  const isTimeUp = msLeft != null && msLeft <= 0;
  const timeParts = msLeft == null ? ["--", "--"] : (() => {
    const s = Math.max(0, Math.floor(msLeft / 1000));
    return [String(Math.floor(s / 60)).padStart(2, "0"), String(s % 60).padStart(2, "0")];
  })();
  // 目標達成率（確定分のみ）。100%を超えることがあるが、成績では100%を上限とする
  const rate = (i) => (rt(i) > 0 ? Math.min(1, tot[i] / rt(i)) : 0);

  // 9番以外（ラック途中で目標に到達）で決着した直後に訂正した時、
  // 台上の球がそのままだとまたすぐ決着してしまうので、球を直すまで判定を止める
  const [suppressWin, setSuppressWin] = useState(false);

  // ===== 勝敗判定 =====
  // ・通常どおり、目標点に到達した方が勝ち
  // ・ヒルヒルで両者が到達した場合は、そのラックで9番を落とした方（最終ラックの勝者）が勝ち
  const reached = [rt(0) > 0 && tot[0] >= rt(0), rt(1) > 0 && tot[1] >= rt(1)];
  let matchWinner = null;
  if (reached[0] && reached[1]) matchWinner = lastResult ? lastResult.w : 0;
  else if (reached[0]) matchWinner = 0;
  else if (reached[1]) matchWinner = 1;
  else if (phase === "play" && !hillHill && !suppressWin) {
    if (liveTot[0] >= rt(0) && rt(0) > 0) matchWinner = 0;
    else if (liveTot[1] >= rt(1) && rt(1) > 0) matchWinner = 1;
  }
  // 時間切れ後は、今やっているラックが最終ラック。
  // そのラックが終わってもどちらも目標に届かなければ両者負け（それぞれ達成率で評価される）
  const bothLose = matchWinner == null && isTimeUp && phase === "done";
  const isFinalRack = isTimeUp && matchWinner == null && !bothLose;

  // 試合が決まった時点で所要時間を記録（画面には出さない）。訂正で決着が戻ったら記録も消す
  useEffect(() => {
    if (!loaded) return;
    if ((matchWinner != null || bothLose) && !state.finishedAt) {
      const fin = Date.now();
      // 9番を落とす前に目標点へ到達して決着した場合、その時点で台上にある球はまだ tot に入っていない。
      // ここで確定させておかないと、本部（B1）や観戦画面（B3）が「試合中」のままになる
      const midRackWin = matchWinner != null && phase === "play" && !reached[matchWinner];
      // 9番を落とさずに目標へ届いた決着。あとで訂正できるように直前の状態を控える
      if (midRackWin) { pushUndo(); saveMatchHistory(matchId, stateRef.current, "9番以外で決着の前"); }
      applyLocal((s) => ({
        ...s,
        ...(midRackWin ? { tot: [liveTot[0], liveTot[1]], balls: mkBalls(), phase: "done", lastResult: null } : {}),
        finishedAt: fin,
        elapsedMs: s.startedAt ? fin - s.startedAt : null,
        winner: matchWinner,
        bothLose,
      }));
    } else if (matchWinner == null && !bothLose && state.finishedAt) {
      applyLocal((s) => ({ ...s, finishedAt: null, elapsedMs: null, winner: null, bothLose: false }));
    }
  }, [matchWinner, bothLose, loaded, state.finishedAt]);

  const pushUndo = () => setUndoStack((s) => [...s.slice(-19), state]);

  // 台上の球を直して目標に届かなくなったら、ふつうの判定に戻す
  useEffect(() => {
    if (!suppressWin) return;
    const over = (rt(0) > 0 && liveTot[0] >= rt(0)) || (rt(1) > 0 && liveTot[1] >= rt(1));
    if (!over) setSuppressWin(false);
  }, [suppressWin, liveTot[0], liveTot[1]]);

  const finish = (nb, w) => {
    pushUndo();
    const wl = w === 0 ? "p1" : "p2", ll = w === 0 ? "p2" : "p1";
    const winnerBalls = nb.filter((x) => x.loc === wl && !x.dead).length;
    const loserPts = nb.filter((x) => x.loc === ll && !x.dead).length;
    const add = [0, 0]; add[w] = 14; add[1 - w] = loserPts;
    const entry = { rack, w, add, brk, hill: hillHill, winnerBalls, loserPts };
    saveMatchHistory(matchId, stateRef.current, `第${rack}ラック確定の前`);
    applyLocal((s) => ({ ...s, balls: nb, tot: [s.tot[0] + add[0], s.tot[1] + add[1]], lastResult: entry, hist: [...s.hist, entry], phase: "done" }));
  };
  const move = (n, dir) => {
    if (phase !== "play") return;
    const b = balls.find((x) => x.n === n);
    let loc = b.loc;
    if (dir === "up") loc = b.loc === "c" ? "p1" : b.loc === "p2" ? "c" : "p1";
    else loc = b.loc === "c" ? "p2" : b.loc === "p1" ? "c" : "p2";
    const nb = balls.map((x) => (x.n === n ? { ...x, loc } : x));
    if (n === 9 && (loc === "p1" || loc === "p2") && !b.dead) finish(nb, loc === "p1" ? 0 : 1);
    else { pushUndo(); applyLocal((s) => ({ ...s, balls: nb })); }
  };
  const toggleDead = (n) => {
    if (phase !== "play") return;
    pushUndo();
    applyLocal((s) => ({ ...s, balls: s.balls.map((b) => (b.n === n ? { ...b, dead: !b.dead } : b)) }));
  };
  const correct = () => {
    // 9番以外で決まった時はラックの結果が無いので、決着する直前の状態へ戻す。
    // 戻したあとは台上の球を直せる（直すまで自動の決着はしない）
    if (!lastResult) {
      if (!undoStack.length) return;
      saveMatchHistory(matchId, stateRef.current, "訂正の前（9番以外の決着）");
      setSuppressWin(true);
      undoLast();
      return;
    }
    saveMatchHistory(matchId, stateRef.current, "訂正の前");
    pushUndo();
    applyLocal((s) => ({ ...s, tot: [s.tot[0] - s.lastResult.add[0], s.tot[1] - s.lastResult.add[1]], hist: s.hist.slice(0, -1), lastResult: null, phase: "play" }));
  };
  const nextRack = () => {
    pushUndo();
    applyLocal((s) => ({ ...s, balls: mkBalls(), rack: s.rack + 1, brk: 1 - s.brk, lastResult: null, phase: "play" }));
  };
  const undoRack = () => {
    saveMatchHistory(matchId, stateRef.current, "1ラック戻すの前");
    pushUndo();
    applyLocal((s) => {
      if (!s.hist.length) return s;
      const last = s.hist[s.hist.length - 1];
      return { ...s, tot: [s.tot[0] - last.add[0], s.tot[1] - last.add[1]], rack: last.rack, brk: last.brk, balls: mkBalls(), phase: "play", lastResult: null, hist: s.hist.slice(0, -1) };
    });
  };
  const undoLast = () => setUndoStack((s) => { if (!s.length) return s; const prev = s[s.length - 1]; applyLocal(prev); return s.slice(0, -1); });
  const rematch = () => {
    pushUndo();
    applyLocal((s) => {
      const now = Date.now();
      return { ...s, tot: [0, 0], rack: 1, brk: 0, balls: mkBalls(), phase: "play", lastResult: null, hist: [], startedAt: now, deadline: now + matchDurationMs(s), finishedAt: null, elapsedMs: null, winner: null, bothLose: false };
    });
  };
  const backToSetup = () => {
    window.history.replaceState({}, "", window.location.pathname);
    if (onExit) onExit(); else window.location.reload();
  };
  // 一時停止／再開。停止中はタイマー表示をその時点で凍結し、再開時に停止していた分だけ締切を後ろへずらす
  const togglePause = () => {
    applyLocal((s) => {
      if (s.pauseStart) {
        const pausedMs = Date.now() - s.pauseStart;
        return { ...s, deadline: (s.deadline || Date.now()) + pausedMs, pauseStart: null };
      }
      return { ...s, pauseStart: Date.now() };
    });
  };
  // 持ち時間を延長する。一時停止中でも押せる（延長してから再開できる）
  const addTime = (min) => {
    pushUndo();
    applyLocal((s) => ({ ...s, deadline: (s.deadline || Date.now()) + min * 60000 }));
  };
  // スコアラーを降りる。試合そのものは終わらせず、対戦表から選び直す画面に戻る。
  // 担当者が誰も居ない状態に戻すため、referee を空にしておく（B1側の担当表示も更新される）
  const stepDown = () => {
    if (!window.confirm("スコアラーを降ります。試合はまだ終わっていません。\nよろしいですか？")) return;
    applyLocal((s) => ({ ...s, referee: null }));
    setToolsOpen(false);
    backToSetup();
  };
  const swapBreak = () => {
    if (phase !== "play") return;
    if (window.confirm("ブレイク順を入れ替えますか？")) { pushUndo(); applyLocal((s) => ({ ...s, brk: 1 - s.brk })); }
  };
  // バンキング勝者を選んだ瞬間に試合開始を確定する（＝B1へ「試合中」を通知するトリガー）。
  // 既に他端末で開始済みなら startedAt/deadline は変更しない
  const chooseBreak = (i) => {
    applyLocal((s) => {
      if (s.startedAt) return { ...s, brk: i, phase: "play" };
      const now = Date.now();
      return { ...s, brk: i, phase: "play", startedAt: now, deadline: now + matchDurationMs(s) };
    });
  };

  const onPress = useCallback((n, isPressed) => { setPressed(isPressed ? n : null); }, []);
  const gestureImpl = (n, dy) => {
    if (Math.abs(dy) > 28) { move(n, dy < 0 ? "up" : "down"); lastTapRef.current[n] = 0; return; }
    const now = Date.now();
    if (lastTapRef.current[n] && now - lastTapRef.current[n] < 340) { toggleDead(n); lastTapRef.current[n] = 0; }
    else lastTapRef.current[n] = now;
  };
  const gestureRef = useRef(gestureImpl);
  gestureRef.current = gestureImpl;
  const onGesture = useCallback((n, dy) => gestureRef.current(n, dy), []);

  const hillInfoLocal = (i) => {
    if (matchWinner != null || bothLose) {
      if (matchWinner === i) return { txt: "勝ち", on: true };
      const rem = Math.max(0, rt(i) - disp[i]);
      return { txt: `あと${rem}`, on: false };
    }
    if (rt(i) <= 0) return { txt: "", on: false };
    const rem = rt(i) - disp[i];
    if (rem <= 0) return { txt: "達成", on: true };
    // ヒルヒルはこのラックの9番で決まるので、残り点数ではなくその旨を出す
    if (hillHill) return { txt: i === 0 ? "ヒルヒル！" : "9番勝負！", on: true };
    const toHill = rem - 14;
    return toHill > 0 ? { txt: `あと${toHill}でヒル`, on: false } : { txt: `あと${rem}で勝ち`, on: true };
  };
  const col = (loc) => balls.filter((b) => b.loc === loc);
  const winnerLoc = lastResult ? (lastResult.w === 0 ? "p1" : "p2") : null;
  let cum = [0, 0];
  const histRows = hist.map((h) => { cum = [cum[0] + h.add[0], cum[1] + h.add[1]]; return { ...h, cum: [...cum] }; });

  if (!loaded) {
    return <div style={{ minHeight: "100%", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FONT, color: C.sub }}>読み込み中…</div>;
  }

  if (resetDetected) {
    return (
      <div style={{ maxWidth: 480, margin: "0 auto", padding: "70px 24px", textAlign: "center", fontFamily: FONT, color: C.ink }}>
        <div style={{ fontSize: 20, fontWeight: 800, marginBottom: 10 }}>この対戦はリセットされました</div>
        <div style={{ fontSize: 14, color: C.sub, marginBottom: 28, lineHeight: 1.7 }}>
          本部が対戦表を組み直したようです。お手数ですが、「対戦表」から担当する試合を選び直してください。
        </div>
        {onExit && (
          <button onClick={onExit} style={{ background: C.blue, color: "#fff", border: "none", borderRadius: 14, padding: "16px 26px", fontSize: 15, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>
            🗓 対戦表にもどる
          </button>
        )}
      </div>
    );
  }

  if (phase === "banking") {
    return (
      <div style={{ maxWidth: 480, margin: "0 auto", padding: "24px 16px 80px", fontFamily: FONT, color: C.ink, textAlign: "center" }}>
        <div style={{ fontSize: 22, fontWeight: 800, marginBottom: 6 }}>バンキング</div>
        <div style={{ fontSize: 14, color: C.sub, marginBottom: 20 }}>先攻を選んでください（どちらの端末からでもOK）</div>
        <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
          <button onClick={() => chooseBreak(0)} style={{ flex: 1, background: C.blue, color: "#fff", border: "none", borderRadius: 14, padding: "22px 8px", fontSize: 17, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>{pl[0].name}<br />が先攻</button>
          <button onClick={() => chooseBreak(1)} style={{ flex: 1, background: C.red, color: "#fff", border: "none", borderRadius: 14, padding: "22px 8px", fontSize: 17, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>{pl[1].name}<br />が先攻</button>
        </div>
        <div style={{ fontSize: 13, color: C.sub, marginBottom: 16 }}>
          目標点：<b style={{ color: C.blue }}>{rt(0)}</b> 対 <b style={{ color: C.red }}>{rt(1)}</b>
        </div>
        <div style={{ fontSize: 13, color: C.sub, marginBottom: 16 }}>
          持ち時間 <b style={{ fontSize: 20, color: TEST_SEC ? C.minus : C.ink }}>{TEST_SEC ? `${TEST_SEC}秒` : `${state.matchMinutes || DEFAULT_MATCH_MINUTES}分`}</b>（先攻を選んだ時点から計測開始）
          {TEST_SEC ? <span style={{ color: C.minus, fontWeight: 800 }}>　※動作確認モード</span> : null}
        </div>
        <div style={{ fontSize: 12.5, color: C.sub, lineHeight: 1.7 }}>もう1台で同じ試合を開くときは、その端末の「対戦表」から同じカードを押してください</div>
        {syncStatus && !syncStatus.ok && <div style={{ marginTop: 10, fontSize: 12, color: C.minus }}>✗ 同期エラー: {syncStatus.err}</div>}
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "10px 12px 60px", boxSizing: "border-box", color: C.ink, fontFamily: FONT }}>
      <div style={{ position: "relative", display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
        <span style={{ width: 90 }}><RulesButton /></span>
        <div style={{
          position: "absolute", left: "50%", transform: "translateX(-50%)",
          display: "flex", alignItems: "center", pointerEvents: "none",
          fontSize: 17, fontWeight: 800, fontVariantNumeric: "tabular-nums",
          color: matchWinner != null ? C.sub : paused ? C.hill : isTimeUp ? C.minus : msLeft != null && msLeft < 5 * 60 * 1000 ? C.hill : C.ink,
        }}>
          {matchWinner == null && isTimeUp ? (
            <span>時間切れ</span>
          ) : (
            <>
              {paused && <span style={{ marginRight: 4, fontSize: 14 }}>⏸</span>}
              <span style={{ width: 26, textAlign: "right" }}>{timeParts[0]}</span>
              <span style={{ width: 8, textAlign: "center" }}>:</span>
              <span style={{ width: 26, textAlign: "left" }}>{timeParts[1]}</span>
            </>
          )}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          {matchWinner == null && !bothLose && (
            <button onClick={() => setToolsOpen(true)} style={{
              background: paused ? C.hillBg : "#fff", border: `1px solid ${paused ? C.hill : C.line}`,
              borderRadius: 8, padding: "3px 8px", fontSize: 12, fontWeight: 800,
              color: paused ? C.hill : C.sub, cursor: "pointer", fontFamily: FONT, whiteSpace: "nowrap",
            }}>{paused ? "⏸ 停止中" : "⏱ タイマー"}</button>
          )}
          <span style={{ fontSize: 12.5, color: C.sub }}>T{table}・第 {rack} ラック {syncStatus && !syncStatus.ok ? "（同期エラー）" : ""}</span>
        </div>
      </div>

      {toolsOpen && (
        <div onClick={() => setToolsOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.55)", zIndex: 2000, display: "flex", alignItems: "flex-end" }}>
          <div onClick={(e) => e.stopPropagation()} style={{
            background: "#fff", width: "100%", maxWidth: 480, margin: "0 auto", boxSizing: "border-box",
            borderRadius: "18px 18px 0 0", padding: "16px 18px calc(18px + env(safe-area-inset-bottom, 0px))",
          }}>
            <div style={{ width: 40, height: 4, background: C.line, borderRadius: 2, margin: "0 auto 14px" }} />
            <div style={{ fontSize: 16, fontWeight: 900, textAlign: "center", marginBottom: 14 }}>タイマー操作</div>
            <button onClick={togglePause} style={{
              width: "100%", background: paused ? C.win : "#fff", color: paused ? "#fff" : C.ink,
              border: `1.5px solid ${paused ? C.win : C.line}`, borderRadius: 12, padding: "13px 0",
              fontSize: 15, fontWeight: 800, cursor: "pointer", fontFamily: FONT, marginBottom: 10,
            }}>{paused ? "▶ 再開する" : "⏸ 一時停止する"}</button>
            <div style={{ fontSize: 13, fontWeight: 700, color: C.sub, textAlign: "center", marginBottom: 8 }}>持ち時間を延長</div>
            <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
              {[1, 3, 5].map((min) => (
                <button key={min} onClick={() => addTime(min)} style={{
                  flex: 1, background: "#fff", border: `1.5px solid ${C.blue}`, color: C.blue, borderRadius: 10,
                  padding: "11px 0", fontSize: 14.5, fontWeight: 800, cursor: "pointer", fontFamily: FONT,
                }}>+{min}分</button>
              ))}
            </div>
            <button onClick={stepDown} style={{
              width: "100%", background: "#fff", border: `1.5px solid ${C.minus}`, color: C.minus, borderRadius: 12,
              padding: "13px 0", fontSize: 14.5, fontWeight: 800, cursor: "pointer", fontFamily: FONT, marginBottom: 8,
            }}>🚫 スコアラーを降りる</button>
            <button onClick={() => setToolsOpen(false)} style={{
              width: "100%", background: C.zone, border: `1px solid ${C.line}`, borderRadius: 12,
              padding: "12px 0", fontSize: 14, fontWeight: 700, color: C.ink, cursor: "pointer", fontFamily: FONT,
            }}>閉じる</button>
          </div>
        </div>
      )}

      {isFinalRack && (
        <div style={{ background: C.hillBg, border: `1.5px solid ${C.hill}`, color: C.hill, borderRadius: 10, padding: "6px 10px", textAlign: "center", fontSize: 13.5, fontWeight: 800, marginBottom: 6 }}>
          時間切れ：このラックが最終ラック（届かなければ両者負け）
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
        {[0, 1].map((i) => {
          const pc = PC[i]; const hi = hillInfoLocal(i);
          return (
            <div key={i} style={{ flex: 1, background: pc, borderRadius: 14, padding: "8px 6px 6px", textAlign: "center", color: "#fff", boxShadow: brk === i ? "inset 0 0 0 3px rgba(255,255,255,0.65)" : "none" }}>
              <div style={{
                fontSize: 15, fontWeight: 800, borderRadius: 7, padding: "2px 0", marginBottom: 2,
                background: `linear-gradient(to right, rgba(255,255,255,0.42) ${Math.min(100, Math.round(rate(i) * 100))}%, rgba(0,0,0,0.14) ${Math.min(100, Math.round(rate(i) * 100))}%)`,
                textShadow: "0 1px 2px rgba(0,0,0,0.35)",
              }}>{pl[i].name}</div>
              <div style={{ fontSize: 40, fontWeight: 800, lineHeight: 1.05, fontVariantNumeric: "tabular-nums" }}>
                {disp[i]}<span style={{ fontSize: 20, fontWeight: 700, opacity: 0.75 }}>/{pl[i].raceTo}</span>
              </div>
              {hi.txt && <div style={{ display: "inline-block", background: "#fff", color: hi.on ? pc : C.ink, borderRadius: 8, padding: "2px 8px", fontSize: 13, fontWeight: 800, marginTop: 4, whiteSpace: "nowrap" }}>{hi.txt}</div>}
              {/* ラックが終わっている間は、次のラックでブレイクする側に「次ブレイク」を出す。
                  次のラックに入ったら通常の「ブレイク」表示に戻る */}
              <div style={{ minHeight: 18, marginTop: 4 }}>
                {matchWinner != null || bothLose ? null : phase === "done" && lastResult ? (
                  (1 - brk) === i && (
                    <span style={{ color: "#fff", fontSize: 11.5, fontWeight: 800, letterSpacing: 1 }}>● 次ブレイク</span>
                  )
                ) : brk === i && (
                  <button onClick={swapBreak} style={{ background: "none", border: "none", color: "#fff", fontSize: 11.5, fontWeight: 800, letterSpacing: 1, cursor: "pointer", textDecoration: "underline", padding: 0 }}>● ブレイク</button>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {hillHill && matchWinner == null && phase === "play" && (
        <div style={{ background: C.hillBg, border: `1.5px solid ${C.hill}`, color: C.hill, borderRadius: 10, padding: "6px 10px", textAlign: "center", fontSize: 13.5, fontWeight: 800, marginBottom: 6 }}>
          ヒルヒル：このラックで9番を落とした方が勝ち
        </div>
      )}

      {matchWinner != null || bothLose ? (
        <div style={{ marginBottom: 6 }}>
          {bothLose ? (
            <div style={{ background: C.hillBg, border: `1.5px solid ${C.hill}`, color: C.hill, borderRadius: 12, padding: "8px 10px", textAlign: "center" }}>
              <div style={{ fontSize: 17.5, fontWeight: 800 }}>時間切れ</div>
              <div style={{ fontSize: 13.5, marginTop: 2, color: C.ink, fontWeight: 700 }}>{disp[0]} － {disp[1]}</div>
            </div>
          ) : (
            <div style={{ background: matchWinner === 0 ? C.lightBlue : C.lightRed, border: `1.5px solid ${PC[matchWinner]}`, color: PC[matchWinner], borderRadius: 12, padding: "8px 10px", textAlign: "center" }}>
              <div style={{ fontSize: 17.5, fontWeight: 800 }}>🏆 {pl[matchWinner].name} 勝利</div>
              <div style={{ fontSize: 13.5, marginTop: 2, color: C.ink, fontWeight: 700 }}>{disp[0]} － {disp[1]}</div>
            </div>
          )}
          <div style={{ display: "flex", gap: 8, marginTop: 5 }}>
            <button onClick={correct} style={ctrl}>◀ 訂正</button>
            <button onClick={backToSetup} style={{ ...ctrl, background: C.ink, color: "#fff", border: "none" }}>終了</button>
          </div>
        </div>
      ) : (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 6 }}>
          {phase === "done" && lastResult ? (
            <button onClick={correct} style={{ ...ctrl, flex: 1 }}>◀ 訂正</button>
          ) : (
            <button onClick={undoLast} disabled={!undoStack.length} style={{ ...ctrl, flex: 1, opacity: undoStack.length ? 1 : 0.4 }}>↶ 1手戻す</button>
          )}
          {/* このラックの現在のスコア。ラック中は台上の球の数、ラックが終わったらその結果 */}
          <div style={{ minWidth: 70, textAlign: "center", fontSize: 24, fontWeight: 800, fontVariantNumeric: "tabular-nums" }}>
            {phase === "done" && lastResult ? (
              <>
                <span style={{ color: C.blue }}>{lastResult.add[0]}</span>
                <span style={{ color: C.sub, margin: "0 4px" }}>-</span>
                <span style={{ color: C.red }}>{lastResult.add[1]}</span>
              </>
            ) : phase === "play" ? (
              <>
                <span style={{ color: C.blue }}>{live[0]}</span>
                <span style={{ color: C.sub, margin: "0 4px" }}>-</span>
                <span style={{ color: C.red }}>{live[1]}</span>
              </>
            ) : null}
          </div>
          {phase === "done" && lastResult ? (
            <button onClick={nextRack} style={{ ...ctrl, flex: 1, background: C.ink, color: "#fff", border: "none" }}>次のラック ▶</button>
          ) : (
            <button onClick={undoRack} disabled={!hist.length} style={{ ...ctrl, flex: 1, opacity: hist.length ? 1 : 0.4 }}>◀ 1ラック戻す</button>
          )}
        </div>
      )}

      <div ref={playAreaRef} style={{ touchAction: "none" }}>
        <Zone label={pl[0].name} side="up" color={C.blue} balls={col("p1")} sub={phase === "done" && winnerLoc === "p1"} pressed={pressed} onPress={onPress} onGesture={onGesture} />

        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 4, padding: "10px 0", margin: "6px 0" }}>
          <div style={{ flex: 1, fontSize: 12, color: C.sub, textAlign: "right", lineHeight: 1.5, paddingRight: 6 }}>
            {matchWinner == null && phase === "play" && <>↑スワイプで<br />{pl[0].name}</>}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 52px)", gap: 7, flexShrink: 0 }}>
            {balls.map((b) => {
              const moved = b.loc !== "c";
              return <Ball key={b.n} b={b} big pressed={pressed === b.n} style={{ opacity: moved ? 0.2 : 1 }} onPress={onPress} onGesture={onGesture} />;
            })}
          </div>
          <div style={{ flex: 1, fontSize: 12, color: C.sub, textAlign: "left", lineHeight: 1.5, paddingLeft: 6 }}>
            {matchWinner == null && phase === "play" && <>↓スワイプで<br />{pl[1].name}<br /><span style={{ fontSize: 11 }}>2回タップで無効球</span></>}
          </div>
        </div>

        <Zone label={pl[1].name} side="down" color={C.red} balls={col("p2")} sub={phase === "done" && winnerLoc === "p2"} pressed={pressed} onPress={onPress} onGesture={onGesture} />
      </div>

      {histRows.length > 0 && (
        <div style={{ marginTop: 10 }}>
          <div style={{ fontSize: 13.5, fontWeight: 800, marginBottom: 5 }}>ラック毎のスコア（履歴 {histRows.length}）</div>
          {histRows.slice().reverse().map((h, k) => (
            <div key={k} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "6px 10px", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, marginBottom: 5 }}>
              <span style={{ fontSize: 13.5, color: C.sub }}>第{h.rack}R　<b style={{ color: PC[h.w] }}>{pl[h.w].name}</b>{h.hill ? " ⚑" : ""}</span>
              <span style={{ fontVariantNumeric: "tabular-nums", display: "flex", alignItems: "baseline", gap: 6 }}>
                <b style={{ fontSize: 16.5 }}><span style={{ color: C.blue }}>{h.add[0]}</span><span style={{ color: C.sub, margin: "0 2px" }}>–</span><span style={{ color: C.red }}>{h.add[1]}</span></b>
              </span>
            </div>
          ))}
        </div>
      )}

      {/* 画面のいちばん下に1行バナー */}
      <BannerLine boxed style={{ marginTop: 16 }} />
    </div>
  );
}

function Zone({ label, side, color, balls, sub, pressed, onPress, onGesture }) {
  return (
    <div style={{ background: C.zone, border: `1.5px solid ${C.line}`, borderRadius: 12, padding: "7px 8px", minHeight: 52, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
      <div style={{ fontSize: 12.5, fontWeight: 800, color }}>{label}</div>
      {balls.length === 0 && <div style={{ color: C.sub, fontSize: 11.5, textAlign: "center" }}>{side === "up" ? "↑ 上にスワイプ" : "↓ 下にスワイプ"}</div>}
      <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", gap: 5 }}>
        {balls.map((b) => <Ball key={b.n} b={b} sub={sub} pressed={pressed === b.n} onPress={onPress} onGesture={onGesture} />)}
      </div>
    </div>
  );
}
function Ball({ b, big, sub, pressed, style, onPress, onGesture }) {
  const size = big ? 52 : 34;
  const base = BALL[b.n]; const nine = b.n === 9;
  const ref = useRef(null);
  const startYRef = useRef(0);

  useEffect(() => {
    const el = ref.current; if (!el) return;
    const start = (e) => { e.preventDefault(); startYRef.current = e.touches[0].clientY; onPress(b.n, true); };
    const move = (e) => { e.preventDefault(); };
    const end = (e) => {
      e.preventDefault();
      onPress(b.n, false);
      const y = (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientY : startYRef.current);
      onGesture(b.n, y - startYRef.current);
    };
    const cancel = (e) => { e.preventDefault(); onPress(b.n, false); };
    const opts = { passive: false };
    el.addEventListener("touchstart", start, opts);
    el.addEventListener("touchmove", move, opts);
    el.addEventListener("touchend", end, opts);
    el.addEventListener("touchcancel", cancel, opts);
    return () => {
      el.removeEventListener("touchstart", start, opts);
      el.removeEventListener("touchmove", move, opts);
      el.removeEventListener("touchend", end, opts);
      el.removeEventListener("touchcancel", cancel, opts);
    };
  }, [b.n, onPress, onGesture]);

  return (
    <div ref={ref}
      onContextMenu={(e) => e.preventDefault()}
      style={{ width: size, height: size, borderRadius: size, flexShrink: 0,
        background: b.dead ? C.dead : nine ? "#fff" : base,
        border: nine && !b.dead ? `${Math.round(size * 0.16)}px solid ${base}` : "2px solid rgba(255,255,255,0.85)",
        boxShadow: pressed ? "0 0 0 5px rgba(0,0,0,0.12), 0 6px 16px rgba(0,0,0,0.3)" : b.dead || sub ? "none" : "0 2px 5px rgba(0,0,0,0.18)",
        color: nine && !b.dead ? base : "#fff",
        display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: big ? 20 : 15, fontWeight: 800, boxSizing: "border-box",
        touchAction: "none", cursor: "pointer", position: "relative",
        userSelect: "none", WebkitUserSelect: "none", WebkitTouchCallout: "none", WebkitTapHighlightColor: "transparent",
        transform: pressed ? "scale(1.25)" : "scale(1)",
        transition: "transform 130ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 130ms ease",
        zIndex: pressed ? 10 : 1,
        ...style }}>
      {b.n}
      {b.dead && <span style={{ position: "absolute", fontSize: Math.round(size * 0.7), color: "#7A2E2E" }}>×</span>}
      {sub && !b.dead && <span style={{ position: "absolute", top: -4, right: -4, background: C.minus, color: "#fff", width: 19, height: 19, borderRadius: 19, fontSize: 16.5, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center", lineHeight: 1 }}>−</span>}
    </div>
  );
}
const ctrl = { flex: 1, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "9px 2px", fontSize: 13.5, fontWeight: 700, color: C.ink, cursor: "pointer", fontFamily: FONT };

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  showCrash(e.message + "\n" + (e.stack || ""));
}
</script>
</body>
</html>
