async function dbGet(path) {

}
/* 変更を購読する。ポーリングと違い、変わった瞬間に届く。戻り値を呼ぶと解除 */
function dbSubscribe(path, onValue, onError) {
  const ref = db.ref(path);
  const handler = ref.on("value", (snap) => onValue(snap.val()),
    (e) => onError && onError(e && e.message ? e.message : String(e)));

}

function nameOfNum(num, roster) {

const STALE_MS = 1000 * 60 * 60 * 6;

function defaultSchedule() {

  st.setSeconds(0, 0);
  st.setMinutes(Math.ceil(st.getMinutes() / 5) * 5);

  return { startH: p2(st.getHours()), startM: p2(st.getMinutes()), endH: p2(en.getHours()), endM: p2(en.getMinutes()) };
}

/* ========= 復元のしくみ =========
   ・試合ごとの履歴：値を書き換える前に、その試合のスナップショットを history/<試合ID> に積む。
     間違えて消した・直したときに、その時点へ戻せる（直近HISTORY_KEEP件だけ残す）

const HISTORY_KEEP = 20;
const BACKUP_KEEP = 10;
async function dbPush(path, value) {
  const ref = db.ref(path).push();
  await ref.set(value);
  return ref.key;
}
async function pruneOldest(path, keep) {
  const all = (await dbGet(path)) || {};
  const keys = Object.keys(all).sort((a, b) => (all[a].at || 0) - (all[b].at || 0));
  const drop = keys.slice(0, Math.max(0, keys.length - keep));
  if (!drop.length) return;
  const upd = {};
  drop.forEach((k) => { upd[k] = null; });
  await dbUpdate(path, upd);
}
// 復元に必要な項目だけを控える（試合の中身がそのまま戻せる粒度）
function snapOfMatch(m) {
  if (!m) return null;
  const keep = ["names", "table", "slot", "tot", "raceTo", "hist", "rack", "brk", "balls", "phase",
    "lastResult", "lenPct", "matchMinutes", "scheduledAt", "startedAt", "deadline",
    "finishedAt", "elapsedMs", "winner", "bothLose", "referee", "createdAt", "version",
    "bracket", "bracketRound", "bracketPos", "bracketSize", "pending"];
  const o = {};
  keep.forEach((k) => { if (m[k] !== undefined && m[k] !== null) o[k] = m[k]; });
  return o;
}
async function saveMatchHistory(matchId, m, label) {
  try {
    const snap = snapOfMatch(m);
    if (!snap) return;
    await dbPush("history/" + matchId, { at: Date.now(), label, snap });
    await pruneOldest("history/" + matchId, HISTORY_KEEP);
  } catch {}
}
async function saveBackup(label) {
  try {
    const matches = (await dbGet("matches")) || {};
    await dbPush("backups", { at: Date.now(), label, count: Object.keys(matches).length, matches });
    await pruneOldest("backups", BACKUP_KEEP);
  } catch {}
}

function normalizeMatch(m) {
  if (!m) return m;
  return {
    ...m,
    names: Array.isArray(m.names) ? m.names : ["1", "2"],
    tot: Array.isArray(m.tot) ? m.tot : [0, 0],
    raceTo: Array.isArray(m.raceTo) ? m.raceTo : [ROUND_TARGET.prelim, ROUND_TARGET.prelim],
    balls: Array.isArray(m.balls) ? m.balls : [],
    hist: Array.isArray(m.hist) ? m.hist : [],
    rack: m.rack || 1,
  };
}
function isMatchFinished(m) {
  if (m.bothLose) return true;
  if (m.winner === 0 || m.winner === 1) return true;
  const rt = m.raceTo || [0, 0], tot = m.tot || [0, 0];
  return (rt[0] > 0 && tot[0] >= rt[0]) || (rt[1] > 0 && tot[1] >= rt[1]);
}
// 卓ごとの待機列：未終了の対戦を作成順に並べる。[0]が現在対戦中、[1]が次戦
function getQueueForTable(matches, tableNum) {
  const list = [];
  for (const id in matches) {
    const m = matches[id];
    if (!m || Number(m.table) !== tableNum) continue;
    if (!m.updatedAt || Date.now() - m.updatedAt > STALE_MS) continue;
    if (isMatchFinished(m)) continue;
    list.push({ ...normalizeMatch(m), id });
  }
  list.sort((a, b) => (a.createdAt || a.updatedAt) - (b.createdAt || b.updatedAt));
  return list;
}
// 調整対象＝未開始の試合すべて。先頭が開始済み（試合中）の時だけ先頭を除く
function adjustableMatches(q) { return q[0] && q[0].startedAt ? q.slice(1) : q; }

// 実際に開始済みの試合の残り時間だけを確保し、未開始の試合（呼び出し中を含む）すべてを
// 指定の終了予定時刻に収める持ち時間を逆算する（あずき杯は持ち時間固定30分・目安表示のみ）
function computeTableAdjustment(queueForTable, eH, eM, matchMinutes) {
  const cur = queueForTable[0];
  const curStarted = !!(cur && cur.startedAt);
  const future = curStarted ? queueForTable.slice(1) : queueForTable.slice(0);
  if (!future.length) return null;
  const targetD = new Date(); targetD.setHours(eH, eM, 0, 0);
  const availableMin = (targetD - Date.now()) / 60000;
  if (availableMin <= 0) return { error: "すでにその時刻を過ぎています" };
  let curRemainMin = 0;
  if (curStarted && cur.matchMinutes) {
    const elapsed = (Date.now() - cur.startedAt) / 60000;
    curRemainMin = Math.max(0, cur.matchMinutes - elapsed);
  }
  const availableForFuture = availableMin - curRemainMin;
  if (availableForFuture <= 0) return { error: "現在の対戦の残り時間だけで、指定時刻を超えています" };
  const perMatchMin = Math.max(5, Math.round(availableForFuture / future.length));
  return { future, newMinutes: perMatchMin, curRemainMin };
}

// 卓ごとの全対戦（終了分も含む）を作成順に並べる。タイムラインの「コマ」順の復元に使う
function getAllForTable(matches, tableNum) {
  const list = [];
  for (const id in matches) {
    const m = matches[id];
    if (!m || Number(m.table) !== tableNum) continue;
    if (!m.updatedAt || Date.now() - m.updatedAt > STALE_MS) continue;
    list.push({ ...normalizeMatch(m), id });
  }
  list.sort((a, b) => (a.createdAt || a.updatedAt) - (b.createdAt || b.updatedAt));
  return list;
}
function getPrelimForTable(matches, tableNum) {
  return getAllForTable(matches, tableNum).filter((m) => !m.bracket);
}

/* 卓ごとに実際の進行を追って、各試合の開始見込み時刻を出す */
function buildEta(matches, changeoverMin) {
  const eta = {};
  const chg = (changeoverMin || 0) * 60000;
  [1, 2, 3].forEach((t) => {
    let cursor = null;
    getAllForTable(matches, t).forEach((m) => {
      const mins = m.matchMinutes || 30;
      if (isMatchFinished(m)) {
        eta[m.id] = { start: m.startedAt || null, end: m.finishedAt || m.updatedAt || null, done: true };
        cursor = m.finishedAt || m.updatedAt || cursor;
        return;
      }
      const start = m.startedAt
        ? m.startedAt
        : Math.max(cursor != null ? cursor + chg : Date.now(), Date.now());
      eta[m.id] = { start, end: start + mins * 60000, started: !!m.startedAt };
      cursor = start + mins * 60000;
    });
  });
  return eta;
}

function annotateColumn(list) {
  let calledYet = false;
  return list.map((m) => {
    if (isMatchFinished(m)) return { m, st: "done" };
    if (m.startedAt) return { m, st: "live" };
    if (m.pending) return { m, st: "pending" };
    if (!calledYet) { calledYet = true; return { m, st: "call" }; }
    return { m, st: "queued" };
  });
}
/* ========= 決勝トーナメント（予選上位8人。抽選番号順に枠へ入れて組む） ========= */
function getBracketMatches(matches) {
  return Object.values(matches || {}).filter((m) => m && m.bracket).map((m) => ({ ...normalizeMatch(m) }));
}
function bracketMatchesForRound(matches, round) {
  return getBracketMatches(matches).filter((m) => m.bracketRound === round).sort((a, b) => a.bracketPos - b.bracketPos);
}
function bracketTotalRounds(size) { return Math.round(Math.log2(size)); }
function matchWinnerIndex(m) {
  if (m.bothLose) return null;
  if (m.winner === 0 || m.winner === 1) return m.winner;
  const rt = m.raceTo || [0, 0], tot = m.tot || [0, 0];
  const r0 = rt[0] > 0 && tot[0] >= rt[0];
  const r1 = rt[1] > 0 && tot[1] >= rt[1];
  if (r0 && r1) {
    const last = (m.hist || []).slice(-1)[0];
    return last ? last.w : 0;
  }
  if (r0) return 0;
  if (r1) return 1;
  return null;
}
function recomputeWinner(raceTo, tot, hist) {
  const r0 = raceTo[0] > 0 && tot[0] >= raceTo[0];
  const r1 = raceTo[1] > 0 && tot[1] >= raceTo[1];
  if (r0 && r1) { const last = (hist || []).slice(-1)[0]; return last ? last.w : 0; }
  if (r0) return 0;
  if (r1) return 1;
  return null;
}
// 成績集計（勝ち数 → 負け試合の達成率の平均 → 得失点差）
function buildStandings(matches, roster) {
  const stats = {};
  const ensure = (num) => {
    if (!stats[num]) stats[num] = { num, win: 0, loss: 0, rates: [], pf: 0, pa: 0 };
    return stats[num];
  };
  for (let i = 1; i <= 14; i++) ensure(i);

  for (const id in matches) {
    const m = matches[id];
    if (!m || m.bracket || !isMatchFinished(m)) continue;
    if (!m.updatedAt || Date.now() - m.updatedAt > STALE_MS) continue;
    const names = m.names || [];
    const tot = m.tot || [0, 0];
    const rt = m.raceTo || [0, 0];
    const w = matchWinnerIndex(m);
    [0, 1].forEach((i) => {
      const num = parseInt(names[i], 10);
      if (!num) return;
      const s = ensure(num);
      s.pf += tot[i] || 0;
      s.pa += tot[1 - i] || 0;
      if (i === w) s.win++;
      else {
        s.loss++;
        if (rt[i] > 0) s.rates.push(Math.min(1, (tot[i] || 0) / rt[i]));
      }
    });
  }

  const rows = Object.values(stats).map((s) => ({
    ...s,
    name: nameOfNum(s.num, roster),
    played: s.win + s.loss,
    avgRate: s.rates.length ? s.rates.reduce((a, b) => a + b, 0) / s.rates.length : null,
  }));
  rows.sort((a, b) => {
    if (b.win !== a.win) return b.win - a.win;
    const ar = a.avgRate == null ? 2 : a.avgRate;
    const br = b.avgRate == null ? 2 : b.avgRate;
    if (br !== ar) return br - ar;
    return (b.pf - b.pa) - (a.pf - a.pa);
  });
  rows.forEach((r, i) => {
    if (i > 0) {
      const p = rows[i - 1];
      const same = p.win === r.win && (p.avgRate == null ? 2 : p.avgRate) === (r.avgRate == null ? 2 : r.avgRate) && (p.pf - p.pa) === (r.pf - r.pa);
      r.rank = same ? p.rank : i + 1;
    } else {
      r.rank = 1;
    }
  });
  return rows;
}
const fmtRate = (v) => (v == null ? "–" : v.toFixed(3));

function buildDetailedStandings(matches, roster) {
  const base = buildStandings(matches, roster);
  const list = Object.values(matches || {})
    .filter((m) => m && Array.isArray(m.names) && !m.bracket)
    .map((m) => ({ ...m }));
  list.sort((a, b) => (a.slot != null && b.slot != null ? a.slot - b.slot : (a.createdAt || 0) - (b.createdAt || 0)));

  const byNum = {};
  base.forEach((r) => { byNum[r.num] = { ...r, games: [] }; });

  list.forEach((m) => {
    const names = m.names || [];
    const finished = isMatchFinished(m);
    const w = finished ? matchWinnerIndex(m) : null;
    [0, 1].forEach((i) => {
      const num = parseInt(names[i], 10);
      if (!num || !byNum[num]) return;
      const oppNum = parseInt(names[1 - i], 10);
      const opponent = oppNum ? nameOfNum(oppNum, roster) : "";
      if (!finished) {
        byNum[num].games.push({ opponent, display: "", pending: true });
      } else if (i === w) {
        byNum[num].games.push({ opponent, display: "W", isWin: true });
      } else {
        const tot = m.tot || [0, 0];
        const rt = m.raceTo || [0, 0];
        const rate = rt[i] > 0 ? Math.min(1, (tot[i] || 0) / rt[i]) : 0;
        byNum[num].games.push({ opponent, display: `${Math.round(rate * 100)}%`, isWin: false });
      }
    });
  });

  const rows = Object.values(byNum);
  rows.sort((a, b) => a.rank - b.rank);
  const maxGames = rows.reduce((m, r) => Math.max(m, r.games.length), 0);
  return { rows, maxGames };
}

  ];

  const tabBarJsx = (
    <div className="no-print" style={{ display: "flex", borderBottom: `1px solid ${C.line}`, background: "#fff", flexShrink: 0 }}>
      <div style={{ display: "flex", width: "100%", maxWidth: 820, margin: "0 auto" }}>
        {tabs.map(([key, label]) => (
          <button key={key} onClick={() => setTab(key)}
            style={{ flex: 1, padding: "13px 2px", background: "none", border: "none", fontSize: "clamp(10.5px, 3.6vw, 15px)", whiteSpace: "nowrap", fontWeight: tab === key ? 800 : 600, color: tab === key ? C.blue : C.sub, cursor: "pointer", fontFamily: FONT }}>
            {label}
          </button>
        ))}
      </div>
    </div>
  );

  return (
    <div style={{ height: "100%", background: C.bg, fontFamily: FONT, display: "flex", flexDirection: "column" }}>
      {tabBarJsx}
      <div className="print-fit" style={{ flex: 1, minHeight: 0, overflowY: (tab === "home") ? "hidden" : "auto" }}>
        <div style={{ maxWidth: (tab === "home") && isPc ? 1600 : 820, margin: "0 auto", height: (tab === "home") ? "100%" : "auto" }}>
          {tab === "home" && (isPc ? <PcMatchGridTab /> : <HomeTab />)}
          {tab === "tables" && <LiveTablesTab />}
          {tab === "player" && (isPc ? <PcStandingsTab /> : <div style={{ height: "100%", overflowY: "auto" }}><StandingsTab /></div>)}
          {tab === "settings" && (
            <SettingsTab roster={roster} setRoster={setRoster} onRefresh={refreshRoster} loaded={rosterLoaded} loadError={rosterError}
              deviceMode={deviceMode} onSetDeviceMode={(m) => { setDeviceMode(m); saveSettings({ deviceMode: m }); }} />
          )}
        </div>
      </div>
    </div>
  );
}

const menuBtn = {
  width: "100%", background: "#fff", border: `1.5px solid ${C.line}`, borderRadius: 12,
  padding: "13px 10px", fontSize: 14.5, fontWeight: 800, color: C.ink, cursor: "pointer", fontFamily: FONT, textAlign: "center",
};

const TL_CARD_H = 140;

function TimelineSlotCard({ m, roster, refereeEnabled, onEditReferee }) {
  const st = m.__st;
  const names = m.names || ["", ""];
  const tot = m.tot || [0, 0];
  const rt = m.raceTo || [0, 0];
  const w = st === "done" ? matchWinnerIndex(m) : null;
  const n0 = nameOfNum(names[0], roster), n1 = nameOfNum(names[1], roster);

  const [, forceTick] = useState(0);
  useEffect(() => {
    if (st !== "live") return;
    const iv = setInterval(() => forceTick((t) => t + 1), 15000);
    return () => clearInterval(iv);
  }, [st]);
  const scoreProgress = rt[0] > 0 && rt[1] > 0 ? Math.max(tot[0] / rt[0], tot[1] / rt[1]) : 0;
  let timeProgress = 0;
  if (m.startedAt && m.deadline && !m.finishedAt) {
    const totalMs = m.deadline - m.startedAt;
    const remainMs = m.deadline - Date.now();
    timeProgress = totalMs > 0 ? Math.min(1, Math.max(0, 1 - remainMs / totalMs)) : 1;
  }
  const finishProgress = Math.max(scoreProgress, timeProgress);
  const remainMin = m.deadline ? Math.max(0, (m.deadline - Date.now()) / 60000) : null;
  const closeToTarget = rt[0] > 0 && rt[1] > 0 && ((rt[0] - tot[0] <= 4) || (rt[1] - tot[1] <= 4));
  const urgent = closeToTarget || (remainMin != null && remainMin <= 3);
  const finishColor = urgent ? C.minus : finishProgress > 0.6 ? C.hill : C.win;

  const [menu, setMenu] = useState(null);
  const [draft, setDraft] = useState(["", ""]);
  const [saving, setSaving] = useState(false);
  const [hist, setHist] = useState(null);

  const openHistory = async () => {
    setMenu("history"); setHist(null);
    try {
      const all = (await dbGet("history/" + m.id)) || {};
      const list = Object.entries(all)
        .map(([k, v]) => ({ k, ...v }))
        .sort((a, b) => (b.at || 0) - (a.at || 0));
      setHist(list);
    } catch { setHist([]); }
  };
  const restoreFrom = async (entry) => {
    const sn = entry.snap || {};
    const t = sn.tot || [0, 0];
    if (!window.confirm(`${fmtStamp(entry.at)} の状態（${t[0]} - ${t[1]}）に戻します。\nいまのスコアは失われます。\n担当者が操作中なら、ひと声かけてから実行してください。\n\nよろしいですか？`)) return;
    setSaving(true);
    try {
      await saveMatchHistory(m.id, m, "元に戻す前");
      await dbSet("matches/" + m.id, { ...sn, version: (m.version || sn.version || 1) + 1, updatedAt: Date.now() });
      setMenu(null);
    } catch {}
    setSaving(false);
  };

  const openScore = () => { setDraft([String(tot[0]), String(tot[1])]); setMenu("score"); };
  const saveEdit = async () => {
    const v0 = Math.max(0, Math.min(999, parseInt(draft[0], 10) || 0));
    const v1 = Math.max(0, Math.min(999, parseInt(draft[1], 10) || 0));
    const newTot = [v0, v1];
    const newWinner = recomputeWinner(rt, newTot, m.hist);
    setSaving(true);
    try {
      await saveMatchHistory(m.id, m, "スコアを直す前");
      await dbUpdate("matches/" + m.id, {
        tot: newTot, winner: newWinner, version: (m.version || 1) + 1, updatedAt: Date.now(),
      });
      setMenu(null);
    } catch {}
    setSaving(false);
  };
  const finishAs = async (winner, bothLose) => {
    setSaving(true);
    try {
      await saveMatchHistory(m.id, m, "終了にする前");
      await dbUpdate("matches/" + m.id, {
        winner, bothLose: !!bothLose, finishedAt: Date.now(),
        version: (m.version || 1) + 1, updatedAt: Date.now(),
      });
      setMenu(null);
    } catch {}
    setSaving(false);
  };
  const reopen = async () => {
    setSaving(true);
    try {
      await saveMatchHistory(m.id, m, "終了を取り消す前");
      await dbUpdate("matches/" + m.id, {
        winner: null, bothLose: false, finishedAt: null,
        version: (m.version || 1) + 1, updatedAt: Date.now(),
      });
      setMenu(null);
    } catch {}
    setSaving(false);
  };
  const removeMatch = async () => {
    if (!window.confirm(`T${m.table}　${n0} 対 ${n1}\nこの試合を削除します。\n（あとで「🕘 元に戻す」から復元できます）\nよろしいですか？`)) return;
    setSaving(true);
    try {
      await saveMatchHistory(m.id, m, "削除する前");
      await dbSet("matches/" + m.id, null);
    } catch {}
    setSaving(false);
  };
  // まだ始まっていない試合を、別の空いている卓へ移す（4試合を3卓に組む決勝トーナメントなどで、
  // どの卓が先に空くか当日の進み具合次第なので、本部の判断で調整できるようにする）
  const moveTable = async (newTable) => {
    if (newTable === m.table) { setMenu("menu"); return; }
    setSaving(true);
    try {
      await saveMatchHistory(m.id, m, "卓移動の前");
      await dbUpdate("matches/" + m.id, {
        table: newTable, version: (m.version || 1) + 1, updatedAt: Date.now(),
      });
      setMenu(null);
    } catch {}
    setSaving(false);
  };

  const style =
    st === "done"
      ? (m.bothLose
          ? { bg: "#fff", border: C.line, badgeBg: C.hillBg, badgeCol: C.hill, badge: "時間切れ" }
          : { bg: "#fff", border: C.line, badgeBg: C.zone, badgeCol: C.sub, badge: "試合終了" })
      : st === "live"
      ? { bg: C.lightBlue, border: C.blue, badgeBg: C.blue, badgeCol: "#fff", badge: "試合中" }
      : st === "call"
      ? { bg: "#fff", border: C.blue, badgeBg: "#fff", badgeCol: C.blue, badge: "呼び出し中" }
      : st === "pending"
      ? { bg: C.zone, border: C.line, badgeBg: "transparent", badgeCol: C.sub, badge: "勝者待ち" }
      : { bg: C.zone, border: C.line, badgeBg: "transparent", badgeCol: C.sub, badge: "待機中" };

  const won = (i) => !m.bothLose && w === i;
  const handleClick = () => setMenu("menu");

  return (
    <div onClick={handleClick} style={{
      position: "relative", height: TL_CARD_H, boxSizing: "border-box", background: style.bg,
      border: `${st === "live" || st === "call" ? 2 : 1}px solid ${style.border}`, borderRadius: 12,
      padding: "8px 5px", display: "flex", flexDirection: "column", justifyContent: "space-between",
      overflow: "hidden", opacity: (st === "queued" || st === "pending") && !menu ? 0.7 : 1, cursor: "pointer",
    }}>
      {refereeEnabled && (st === "call" || st === "live") && (
        <button onClick={(e) => { e.stopPropagation(); onEditReferee && onEditReferee(m); }} style={{
          position: "absolute", top: 3, right: 3, zIndex: 2, background: "rgba(255,255,255,0.9)",
          border: `1px solid ${C.line}`, borderRadius: 20, width: 22, height: 22, fontSize: 12,
          display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", padding: 0,
        }} title={m.referee ? `スコアラー：${nameOfNum(m.referee, roster)}` : "スコアラーを選ぶ"}>📱</button>
      )}
      <div style={{ textAlign: "center" }}>
        <span style={{
          display: "inline-block", background: style.badgeBg, color: style.badgeCol,
          border: st === "call" ? `1.5px solid ${C.blue}` : "none",
          borderRadius: 12, padding: "3px 10px", fontSize: 13.5, fontWeight: 800, whiteSpace: "nowrap",
        }}>{style.badge}</span>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 4, padding: "0 4px" }}>
        {[n0, n1].map((nm, i) => (
          <div key={i} style={{
            textAlign: "left", fontSize: 17, fontWeight: won(i) ? 900 : 700,
            color: st === "done" ? (won(i) ? C.win : C.sub) : (i === 0 ? C.blue : C.red),
            whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", lineHeight: 1.25,
          }}>{nm}</div>
        ))}
      </div>

      <div style={{
        textAlign: "center", fontSize: 11.5, fontWeight: 700, color: C.sub, flexShrink: 0,
        whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", lineHeight: 1.3,
      }}>🎯{rt[0]}点 ⏰{m.matchMinutes || 30}分（目安）</div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: 14, flexShrink: 0 }}>
        {st === "done" && <span style={{ fontSize: 13, opacity: 0.6 }}>✏️</span>}
        {st === "live" && (
          <div style={{ width: "100%", height: 5, background: "rgba(0,0,0,0.1)", borderRadius: 3, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${Math.round(finishProgress * 100)}%`, background: finishColor, borderRadius: 3, transition: "width 400ms ease" }} />
          </div>
        )}
      </div>

      {menu && (
        <div onClick={(e) => { e.stopPropagation(); setMenu(null); }} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 22 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", borderRadius: 18, padding: "20px 18px", maxWidth: 340, width: "100%", maxHeight: "85vh", overflowY: "auto" }}>
            <div style={{ fontSize: 13.5, fontWeight: 800, color: C.sub, textAlign: "center" }}>T{m.table}・{style.badge}</div>
            <div style={{ fontSize: 18, fontWeight: 900, textAlign: "center", margin: "4px 0 16px", lineHeight: 1.4 }}>
              <span style={{ color: C.blue }}>{n0}</span>
              <span style={{ color: C.sub, fontSize: 13, margin: "0 6px" }}>対</span>
              <span style={{ color: C.red }}>{n1}</span>
            </div>

            {menu === "menu" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <button onClick={openScore} style={menuBtn}>✏️ スコアを修正する</button>
                {st !== "done" && <button onClick={() => setMenu("finish")} style={menuBtn}>🏁 この試合を終了にする</button>}
                {st === "done" && <button onClick={reopen} disabled={saving} style={menuBtn}>↩︎ 終了を取り消して試合中に戻す</button>}
                {(st === "call" || st === "queued" || st === "pending") && <button onClick={() => setMenu("move")} style={menuBtn}>🔀 卓を移動する</button>}
                <button onClick={openHistory} style={menuBtn}>🕘 前の状態に戻す</button>
                <button onClick={removeMatch} disabled={saving} style={{ ...menuBtn, color: C.minus, borderColor: C.minus }}>🗑 この試合を無かったことにする</button>
                <button onClick={() => setMenu(null)} style={{ ...menuBtn, background: C.zone, fontWeight: 700 }}>閉じる</button>
              </div>
            )}

            {menu === "move" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <div style={{ fontSize: 13.5, color: C.sub, textAlign: "center", marginBottom: 2 }}>
                  移動先の卓を選んでください（現在：T{m.table}）
                </div>
                {[1, 2, 3].map((t) => (
                  <button key={t} onClick={() => moveTable(t)} disabled={saving || t === m.table} style={{
                    ...menuBtn,
                    ...(t === m.table
                      ? { background: C.zone, color: C.sub, cursor: "default" }
                      : { borderColor: C.blue, color: C.blue }),
                  }}>{t === m.table ? `T${t}（現在地）` : `T${t} へ移動`}</button>
                ))}
                <button onClick={() => setMenu("menu")} style={{ ...menuBtn, background: C.zone, fontWeight: 700 }}>もどる</button>
              </div>
            )}

            {menu === "history" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <div style={{ fontSize: 13.5, color: C.sub, textAlign: "center", marginBottom: 2 }}>
                  値を書き換える前の状態を控えてあります。戻したい時点を選んでください
                </div>
                {hist === null && <div style={{ textAlign: "center", color: C.sub, fontSize: 13, padding: "14px 0" }}>読み込み中…</div>}
                {hist && hist.length === 0 && <div style={{ textAlign: "center", color: C.sub, fontSize: 13, padding: "14px 0" }}>まだ履歴がありません</div>}
                {hist && hist.map((h) => {
                  const t = (h.snap && h.snap.tot) || [0, 0];
                  return (
                    <button key={h.k} onClick={() => restoreFrom(h)} disabled={saving} style={{ ...menuBtn, textAlign: "left" }}>
                      <span style={{ fontVariantNumeric: "tabular-nums", fontWeight: 900 }}>{fmtStamp(h.at)}</span>
                      <span style={{ color: C.sub, fontSize: 13, marginLeft: 8 }}>{h.label || ""}</span>
                      <span style={{ float: "right", fontWeight: 900, fontVariantNumeric: "tabular-nums" }}>
                        <span style={{ color: C.blue }}>{t[0]}</span>
                        <span style={{ color: C.sub, margin: "0 3px" }}>-</span>
                        <span style={{ color: C.red }}>{t[1]}</span>
                      </span>
                    </button>
                  );
                })}
                <button onClick={() => setMenu("menu")} style={{ ...menuBtn, background: C.zone, fontWeight: 700 }}>もどる</button>
              </div>
            )}

            {menu === "finish" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <div style={{ fontSize: 13.5, color: C.sub, textAlign: "center", marginBottom: 2 }}>結果を選ぶと、その時点で試合終了になります</div>
                <button onClick={() => finishAs(0, false)} disabled={saving} style={{ ...menuBtn, borderColor: C.blue, color: C.blue }}>🏆 {n0} の勝ちで終了</button>
                <button onClick={() => finishAs(1, false)} disabled={saving} style={{ ...menuBtn, borderColor: C.red, color: C.red }}>🏆 {n1} の勝ちで終了</button>
                <button onClick={() => finishAs(null, true)} disabled={saving} style={{ ...menuBtn, borderColor: C.hill, color: C.hill }}>⏱ 時間切れ扱いで終了（本部判断・両者未達）</button>
                <button onClick={() => setMenu("menu")} style={{ ...menuBtn, background: C.zone, fontWeight: 700 }}>もどる</button>
              </div>
            )}

            {menu === "score" && (
              <>
                <div style={{ display: "flex", gap: 12, marginBottom: 6 }}>
                  {[0, 1].map((i) => (
                    <div key={i} style={{ flex: 1 }}>
                      <div style={{ fontSize: 13.5, fontWeight: 700, color: i === 0 ? C.blue : C.red, marginBottom: 6, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{[n0, n1][i]}</div>
                      <input
                        type="text" inputMode="numeric" value={draft[i]} autoFocus={i === 0}
                        onChange={(e) => {
                          const v = e.target.value.replace(/[^0-9]/g, "").slice(0, 3);
                          setDraft((arr) => (i === 0 ? [v, arr[1]] : [arr[0], v]));
                        }}
                        style={{ width: "100%", boxSizing: "border-box", textAlign: "center", border: `1.5px solid ${C.line}`, borderRadius: 10, padding: "10px 0", fontSize: 22, fontWeight: 800, color: C.ink, outline: "none", fontFamily: FONT }}
                      />
                      <div style={{ fontSize: 13, color: C.sub, marginTop: 4 }}>目標 {rt[i]}</div>
                    </div>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
                  <button onClick={() => setMenu("menu")} style={{ flex: 1, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 0", fontSize: 14.5, fontWeight: 700, color: C.ink, cursor: "pointer", fontFamily: FONT }}>もどる</button>
                  <button onClick={saveEdit} disabled={saving} style={{ flex: 1, background: C.blue, border: "none", borderRadius: 12, padding: "12px 0", fontSize: 14.5, fontWeight: 800, color: "#fff", cursor: "pointer", fontFamily: FONT }}>{saving ? "保存中…" : "保存"}</button>
                </div>
                <div style={{ fontSize: 14, color: "#3F4A55", marginTop: 10, lineHeight: 1.75 }}>
                  目標点に達していれば終了、届かなければ試合中に戻ります。
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ========= 成績タブ ========= */
function StandingsTab() {
  const [rows, setRows] = useState([]);
  const [err, setErr] = useState(null);

  useEffect(() => dbSubscribe("/",
    (rec) => { const r = normalizeRecord(rec); setRows(buildStandings(r.matches, r.roster)); setErr(null); },
    (e) => setErr(e)), []);

  return (
    <div style={{ padding: "16px 12px 32px", color: C.ink }}>
      <div style={{ display: "grid", gridTemplateColumns: "38px 1fr 48px 48px 76px", gap: 6, padding: "0 12px 8px", fontSize: 14.5, color: C.sub, fontWeight: 800 }}>
        <div>順</div><div>選手</div><div style={{ textAlign: "center" }}>勝</div><div style={{ textAlign: "center" }}>敗</div><div style={{ textAlign: "right" }}>達成率</div>
      </div>
      {rows.length === 0 && <div style={{ textAlign: "center", fontSize: 15, color: C.sub, padding: "28px 0" }}>まだ結果がありません</div>}
      {rows.map((r, ri) => {
        const top = r.rank <= 8 && r.played > 0;
        const prev = ri > 0 ? rows[ri - 1] : null;
        const cutAbove = prev && prev.played > 0 && prev.rank === 8 && r.rank > prev.rank;
        return (
          <React.Fragment key={r.num}>
          {cutAbove && (
            <div style={{ display: "flex", alignItems: "center", gap: 8, margin: "2px 0 10px" }}>
              <div style={{ flex: 1, height: 2, background: C.blue, opacity: 0.4 }} />
              <div style={{ fontSize: 12.5, fontWeight: 900, color: C.blue, whiteSpace: "nowrap" }}>ここまで{prev.rank}位</div>
              <div style={{ flex: 1, height: 2, background: C.blue, opacity: 0.4 }} />
            </div>
          )}
          <div style={{
            display: "grid", gridTemplateColumns: "38px 1fr 48px 48px 76px", gap: 6, alignItems: "center",
            background: top ? C.lightBlue : "#fff", border: `1.5px solid ${top ? C.blue : C.line}`,
            borderRadius: 12, padding: "15px 12px", marginBottom: 8,
          }}>
            <div style={{ fontSize: 21, fontWeight: 900, color: top ? C.blue : C.sub }}>{r.rank}</div>
            <div style={{ fontSize: 21, fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.name}</div>
            <div style={{ textAlign: "center", fontSize: 25, fontWeight: 900, color: C.win }}>{r.win}</div>
            <div style={{ textAlign: "center", fontSize: 25, fontWeight: 800, color: C.sub }}>{r.loss}</div>
            <div style={{ textAlign: "right", fontSize: 19, fontWeight: 800, fontVariantNumeric: "tabular-nums", color: C.ink }}>{fmtRate(r.avgRate)}</div>
          </div>
          </React.Fragment>
        );
      })}
      <div style={{ fontSize: 13.5, color: C.sub, marginTop: 16, lineHeight: 1.7 }}>
        並び順：勝ち数 → 負け試合の達成率（取得点÷20）の平均 → 得失点差。全勝の選手は達成率「–」で最上位に並びます。上位8人が決勝トーナメントへ進出。
      </div>
      {err && <div style={{ textAlign: "center", fontSize: 12, color: C.minus, marginTop: 12 }}>同期エラー: {err}</div>}
    </div>
  );
}

/* ========= PC対戦表タブ：列＝卓、行＝コマ ========= */
function PcMatchCard({ m, st, roster }) {
  const names = m.names || ["", ""];
  const tot = m.tot || [0, 0];
  const rt = m.raceTo || [0, 0];
  const w = st === "done" ? matchWinnerIndex(m) : null;
  const n0 = nameOfNum(names[0], roster), n1 = nameOfNum(names[1], roster);

  const box =
    st === "done" ? { background: "#EFF1F3", border: `1px solid ${C.line}` }
    : st === "live" ? { background: "#FFF8D6", border: "2px solid #D8B54A" }
    : st === "call" ? { background: "#fff", border: `2px solid ${C.blue}` }
    : { background: "#fff", border: `1px solid ${C.line}` };
  const divider = st === "live" ? "#D8B54A" : C.line;

  const nameColor = (i) =>
    st === "done" ? (w === i ? C.win : C.sub) : st === "queued" ? C.sub : C.ink;

  return (
    <div style={{
      ...box, borderRadius: 12, display: "flex", alignItems: "stretch", overflow: "hidden",
      minHeight: 0, position: "relative",
    }}>
      <div style={{
        flex: "0 0 46px", display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: 14, fontWeight: 900, color: C.sub, borderRight: `1px solid ${divider}`,
      }}>T{m.table}</div>

      <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", justifyContent: "center", padding: "4px 12px", gap: 2 }}>
        {[n0, n1].map((nm, i) => (
          <div key={i} style={{ display: "flex", alignItems: "baseline", gap: 8, minWidth: 0 }}>

}

/* ========= 決勝トーナメント（予選上位8人。抽選番号順に枠へ入れて組む） ========= */
function BracketTab({ roster }) {
  const s0 = useMemo(() => loadSettings(), []);
  const [size, setSize] = useState(s0.bracketSize === 4 ? 4 : 8);
  const [slotIdx, setSlotIdx] = useState(() => Array.from({ length: 8 }, () => 0));
  const [drawNo, setDrawNo] = useState(() => Array.from({ length: 8 }, (_, i) => String(i + 1)));
  const totalRounds = bracketTotalRounds(size);
  const d0 = useMemo(() => defaultSchedule(), []);
  const [startH, setStartH] = useState(d0.startH);
  const [startM, setStartM] = useState(d0.startM);
  const changeover = parseInt(s0.changeoverMin, 10) || 5;
  const [registering, setRegistering] = useState(false);
  const [msg, setMsg] = useState(null);
  const [matches, setMatches] = useState({});

  useEffect(() => dbSubscribe("matches", (m) => setMatches(m || {}), () => {}), []);
  useEffect(() => { saveSettings({ bracketSize: size }); }, [size]);
  useEffect(() => {
    setDrawNo(Array.from({ length: 8 }, (_, i) => String(i + 1)));
  }, [size]);

  const roundPlan = useMemo(() => {
    const st = new Date();
    st.setHours(parseInt(startH, 10) || 0, parseInt(startM, 10) || 0, 0, 0);
    let cursor = st.getTime();
    return Array.from({ length: totalRounds }, (_, i) => {
      const mins = 30;
      const startAt = cursor;
      cursor = startAt + (mins + changeover) * 60000;
      return { round: i + 1, mins, startAt };
    });
  }, [startH, startM]);

  const bracketMatches = useMemo(() => getBracketMatches(matches), [matches]);
  const started = bracketMatches.length > 0;

  const resetBracket = async () => {
    if (!window.confirm(`決勝トーナメントの対戦（${bracketMatches.length}試合）をすべて削除します。\n進行中・終了した試合も含めて消えます（バックアップからは戻せます）。\n\nよろしいですか？`)) return;
    if (!window.confirm("本当に削除しますか？")) return;
    setRegistering(true);
    try {
      await saveBackup("決勝トーナメントをリセットする前");
      const clearUpd = {};
      Object.entries(matches || {}).forEach(([id, m]) => { if (m && m.bracket) clearUpd[id] = null; });
      await dbUpdate("matches", clearUpd);
      setMsg({ ok: true, text: "決勝トーナメントを削除しました" });
    } catch (e) {
      setMsg({ ok: false, text: "削除に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setRegistering(false);
  };

  const standings = useMemo(() => buildStandings(matches, roster), [matches, roster]);
  const rankedNums = useMemo(() => {
    const played = standings.filter((r) => r.played > 0);
    const nums = played.map((r) => r.num);
    for (let i = 1; i <= 14; i++) if (!nums.includes(i)) nums.push(i);
    return nums;
  }, [standings]);
  const filledRef = useRef("");
  const rosterIndexOfNum = (num) => roster.findIndex((p) => p.num === num);

  useEffect(() => {
    if (started || rankedNums.length === 0) return;
    const key = rankedNums.slice(0, size).join(",");
    if (filledRef.current === key) return;
    filledRef.current = key;
    setSlotIdx((arr) => {
      const next = [...arr];
      for (let i = 0; i < 8; i++) {
        const idx = rosterIndexOfNum(rankedNums[i]);
        next[i] = idx >= 0 ? idx : 0;
      }
      return next;
    });
  }, [rankedNums, started]);

  const winnerInfo = (m) => {
    const w = matchWinnerIndex(m);
    if (w == null) return null;
    return { num: parseInt(m.names[w], 10) };
  };

  const allowedTables = size === 4 ? [1, 2] : [1, 2, 3];
  const assignTables = (count) => {
    const pending = {};
    allowedTables.forEach((t) => { pending[t] = 0; });
    Object.values(matches || {}).forEach((m) => {
      if (!m) return;
      const t = Number(m.table);
      if (!(t in pending)) return;
      if (!isMatchFinished(m)) pending[t]++;
    });
    const result = [];
    for (let i = 0; i < count; i++) {
      let best = allowedTables[0];
      allowedTables.forEach((t) => { if (pending[t] < pending[best]) best = t; });
      result.push(best);
      pending[best]++;
    }
    return result;
  };

  const CIRCLE = ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧"];
  const mkMatch = (extra) => ({
    version: 1, phase: "banking", brk: null, tot: [0, 0], rack: 1,
    balls: Array.from({ length: 9 }, (_, k) => ({ n: k + 1, loc: "c", dead: false })),
    lastResult: null, hist: [], ...extra,
  });

  const registerAll = async () => {
    if (registering) return;
    const entries = slotIdx.slice(0, size).map((idx, i) => ({ p: roster[idx], no: parseInt(drawNo[i], 10) }));
    if (entries.some((e) => !e.p)) { setMsg({ ok: false, text: "全ての枠に選手を割り当ててください" }); return; }
    const nums = entries.map((e) => e.p.num);
    if (new Set(nums).size !== nums.length) { setMsg({ ok: false, text: "同じ選手が2回入っています" }); return; }
    const nos = entries.map((e) => e.no);
    if (nos.some((n) => !(n >= 1 && n <= size))) { setMsg({ ok: false, text: `抽選番号は1〜${size}で入れてください` }); return; }
    if (new Set(nos).size !== nos.length) { setMsg({ ok: false, text: "抽選番号が重複しています" }); return; }
    const players = [...entries].sort((a, b) => a.no - b.no).map((e) => e.p);
    const totalMatches = size - 1;
    if (!window.confirm(`決勝トーナメント（${size}人）の全${totalMatches}試合を、予定時刻つきで登録します。よろしいですか？`)) return;
    setRegistering(true);
    try {
      const now = Date.now();
      const next = {};
      for (let r = 1; r <= totalRounds; r++) {
        const plan = roundPlan[r - 1];
        const count = size / Math.pow(2, r);
        const tables = r === totalRounds ? [1] : assignTables(count);
        const target = targetForRound(true, r, totalRounds);
        for (let i = 0; i < count; i++) {
          const id = randomMatchId();
          const common = {
            table: tables[i], matchMinutes: plan.mins,
            scheduledAt: plan.startAt,
            createdAt: now + r * 100 + i, updatedAt: now,
            bracket: true, bracketRound: r, bracketPos: i, bracketSize: size,
          };
          if (r === 1) {
            const p1 = players[i * 2], p2 = players[i * 2 + 1];
            next[id] = mkMatch({ ...common, names: [String(p1.num), String(p2.num)], raceTo: [target, target] });
          } else {
            const prevLabel = (r - 1) === totalRounds ? "決勝" : totalRounds - (r - 1) === 1 ? "準決勝" : "準々決勝";
            next[id] = mkMatch({
              ...common, pending: true, raceTo: [target, target],
              names: [`${prevLabel}${CIRCLE[i * 2]}の勝者`, `${prevLabel}${CIRCLE[i * 2 + 1]}の勝者`],
            });
          }
        }
      }
      await saveBackup("決勝トーナメントを登録する前");
      await dbUpdate("matches", next);
      setMsg({ ok: true, text: `全${totalMatches}試合を登録しました` });
    } catch (e) {
      setMsg({ ok: false, text: "登録に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setRegistering(false);
  };

  const advanceRound = async (fromRound) => {
    if (registering) return;
    const prev = bracketMatchesForRound(matches, fromRound);
    if (prev.length === 0 || prev.some((m) => !isMatchFinished(m))) { setMsg({ ok: false, text: "前のラウンドがまだ終わっていません" }); return; }
    const winners = prev.map(winnerInfo);
    if (winners.some((w) => !w)) { setMsg({ ok: false, text: "勝者が確定していない試合があります" }); return; }
    const nextRound = fromRound + 1;
    const placeholders = bracketMatchesForRound(matches, nextRound).filter((m) => m.pending);
    const label = nextRound === totalRounds ? "決勝" : totalRounds - nextRound === 1 ? "準決勝" : "準々決勝";
    if (!window.confirm(`${label}の${winners.length / 2}試合に、勝ち上がった選手を入れます。よろしいですか？`)) return;
    setRegistering(true);
    try {
      const now = Date.now();
      const next = {};
      const plan = roundPlan[nextRound - 1] || { mins: 30 };
      const tables = assignTables(winners.length / 2);
      const target = targetForRound(true, nextRound, totalRounds);
      for (let i = 0; i < winners.length / 2; i++) {
        const p1 = winners[i * 2], p2 = winners[i * 2 + 1];
        const ph = placeholders.find((m) => m.bracketPos === i);
        if (ph) {
          if (nextRound === totalRounds && Number(ph.table) !== 1) next[ph.id + "/table"] = 1;
          next[ph.id + "/names"] = [String(p1.num), String(p2.num)];
          next[ph.id + "/raceTo"] = [target, target];
          next[ph.id + "/pending"] = null;
          next[ph.id + "/updatedAt"] = now;
          next[ph.id + "/version"] = (ph.version || 1) + 1;
        } else {
          const id = randomMatchId();
          next[id] = {
            version: 1, phase: "banking", brk: null, tot: [0, 0], rack: 1,
            balls: Array.from({ length: 9 }, (_, k) => ({ n: k + 1, loc: "c", dead: false })),
            lastResult: null, hist: [], raceTo: [target, target],
            names: [String(p1.num), String(p2.num)], table: nextRound === totalRounds ? 1 : tables[i],
            matchMinutes: plan.mins,
            createdAt: now + i, updatedAt: now,
            bracket: true, bracketRound: nextRound, bracketPos: i, bracketSize: size,
          };
        }
      }
      await dbUpdate("matches", next);
      setMsg({ ok: true, text: `${label}の対戦を確定しました` });
    } catch (e) {
      setMsg({ ok: false, text: "登録に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setRegistering(false);
  };

  const roundLabel = (r) => (r === totalRounds ? "決勝" : totalRounds - r === 1 ? "準決勝" : "準々決勝");
  const targetLabel = (r) => targetForRound(true, r, totalRounds);

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "20px 16px 32px", color: C.ink }}>
      <div style={{ textAlign: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 22, fontWeight: 800 }}>決勝トーナメント</div>
        <div style={{ fontSize: 13, color: C.sub, marginTop: 4 }}>予選上位{size}人・抽選で引いた番号順に枠へ入れて組みます</div>
      </div>

      {bracketMatches.length > 0 && (
        <button onClick={resetBracket} disabled={registering} style={{
          width: "100%", background: "#fff", border: `1.5px solid ${C.minus}`, borderRadius: 12,
          color: C.minus, fontSize: 14.5, fontWeight: 800, padding: "13px 0", cursor: "pointer",
          fontFamily: FONT, marginBottom: 16,
        }}>🗑 決勝トーナメントをリセット（{bracketMatches.length}試合を削除）</button>
      )}

      {!started && (
        <>
          <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
            {[4, 8].map((n) => (
              <button key={n} onClick={() => setSize(n)} style={{ flex: 1, border: `2px solid ${size === n ? C.blue : C.line}`, background: size === n ? C.lightBlue : "#fff", borderRadius: 12, padding: "12px 0", fontSize: 15, fontWeight: 800, color: size === n ? C.blue : C.ink, cursor: "pointer", fontFamily: FONT }}>{n}人</button>
            ))}
          </div>

          <div style={{ fontSize: 13, fontWeight: 700, color: C.sub, marginBottom: 2 }}>出場者と抽選番号</div>
          <div style={{ fontSize: 14, color: "#3F4A55", marginBottom: 8, lineHeight: 1.75 }}>
            予選の上位{size}人を入れてあります。カードを引いたら、その番号を右の欄に入れてください（1〜{size}）。
            1番と2番、3番と4番…が1回戦（準々決勝）で当たります
          </div>
          {Array.from({ length: size }, (_, i) => {
            const st = standings.find((x) => x.num === (roster[slotIdx[i]] || {}).num);
            const no = parseInt(drawNo[i], 10);
            const dup = no >= 1 && no <= size && drawNo.slice(0, size).filter((v) => parseInt(v, 10) === no).length > 1;
            const bad = !(no >= 1 && no <= size) || dup;
            return (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                <div style={{ width: 34, textAlign: "center", fontSize: 12.5, fontWeight: 800, color: C.sub, flexShrink: 0 }}>
                  {st && st.played > 0 ? `${st.rank}位` : "－"}
                </div>
                <select value={slotIdx[i] ?? 0} onChange={(e) => setSlotIdx((arr) => { const next = [...arr]; next[i] = +e.target.value; return next; })} style={{ ...selectStyle, flex: 1, minWidth: 0 }}>
                  {roster.map((p, ri) => {
                    const s2 = standings.find((x) => x.num === p.num);
                    const rank = s2 && s2.played > 0 ? `${s2.rank}位 ` : "";
                    return <option key={p.id} value={ri}>{rank}{p.num != null ? `${p.num}番　` : ""}{p.name || "（未確定）"}</option>;
                  })}
                </select>
                <input inputMode="numeric" value={drawNo[i] ?? ""}
                  onChange={(e) => setDrawNo((arr) => { const nx = [...arr]; nx[i] = e.target.value.replace(/[^0-9]/g, "").slice(0, 1); return nx; })}
                  style={{ ...numBoxStyle, width: 46, textAlign: "center", flexShrink: 0, borderColor: bad ? C.minus : undefined, color: bad ? C.minus : C.ink }} />
              </div>
            );
          })}

          <div style={{ background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, margin: "16px 0" }}>
            <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 8 }}>準々決勝の開始予定</div>
            <TimeInput h={startH} m={startM} onH={setStartH} onM={setStartM} />
            <div style={{ fontSize: 14, color: "#3F4A55", marginTop: 6, lineHeight: 1.75 }}>
              以降の回戦は、前の回戦が終わってから入替{changeover}分を空けて始まる想定で計算します（持ち時間はどの回戦も30分の目安）
            </div>
          </div>

          <div style={{ background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, margin: "16px 0" }}>
            <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 8 }}>回戦ごとの目標点</div>
            {roundPlan.map((pl) => (
              <div key={pl.round} style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
                <span style={{ fontSize: 14, fontWeight: 800 }}>{roundLabel(pl.round)}</span>
                <span style={{ fontSize: 13, fontWeight: 800, fontVariantNumeric: "tabular-nums" }}>
                  <span style={{ color: C.sub, marginRight: 8 }}>{fmtClock(pl.startAt)}〜</span>
                  🎯{targetLabel(pl.round)}点
                </span>
              </div>
            ))}
          </div>

          <div style={{ background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, margin: "16px 0" }}>
            <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 8 }}>1回戦（準々決勝）の組み合わせ</div>
            {(() => {
              const entries = Array.from({ length: size }, (_, i) => ({ p: roster[slotIdx[i]], no: parseInt(drawNo[i], 10) }));
              const nos = entries.map((e) => e.no);
              const ok = nos.every((n) => n >= 1 && n <= size) && new Set(nos).size === size;
              if (!ok) return <div style={{ fontSize: 12.5, color: C.minus, fontWeight: 700 }}>抽選番号を1〜{size}で重複なく入れてください</div>;
              const sorted = [...entries].sort((a, b) => a.no - b.no);
              return sorted.filter((_, i) => i % 2 === 0).map((e, k) => (
                <div key={k} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13.5, fontWeight: 700, marginBottom: 4 }}>
                  <span style={{ color: C.blue, fontWeight: 900 }}>{e.no}</span>
                  <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{(e.p || {}).name || `${(e.p || {}).num}番`}</span>
                  <span style={{ color: C.sub }}>対</span>
                  <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", textAlign: "right" }}>{(sorted[k * 2 + 1] || {}).p ? ((sorted[k * 2 + 1].p.name) || `${sorted[k * 2 + 1].p.num}番`) : ""}</span>
                  <span style={{ color: C.red, fontWeight: 900 }}>{(sorted[k * 2 + 1] || {}).no}</span>
                </div>
              ));
            })()}
          </div>

          <button onClick={registerAll} disabled={registering} style={{ width: "100%", background: registering ? C.line : C.blue, color: "#fff", border: "none", borderRadius: 14, padding: "15px 0", fontSize: 16, fontWeight: 800, cursor: registering ? "wait" : "pointer", fontFamily: FONT }}>
            {registering ? "登録中…" : `全${size - 1}試合をまとめて登録する`}
          </button>
          <div style={{ fontSize: 14, color: "#3F4A55", marginTop: 8, lineHeight: 1.75 }}>
            2回戦以降は「◯回戦①の勝者」の枠で押さえておき、前の回戦が終わった時点で対戦相手が入ります。
            相手が決まるまでは卓の待機列やタイムラインには出ません。
          </div>
        </>
      )}

      {msg && <div style={{ textAlign: "center", fontSize: 13, fontWeight: 700, color: msg.ok ? C.win : C.minus, marginTop: 12 }}>{msg.ok ? "✓ " : "✗ "}{msg.text}</div>}

      {started && (
        <div style={{ marginTop: started ? 0 : 16 }}>
          {Array.from({ length: totalRounds }, (_, ri) => ri + 1).map((r) => {
            const ms = bracketMatchesForRound(matches, r);
            if (ms.length === 0) return null;
            const allDone = ms.every((m) => isMatchFinished(m));
            const readyToFill = ms.every((m) => m.pending) && bracketMatchesForRound(matches, r - 1).length > 0
              && bracketMatchesForRound(matches, r - 1).every((m) => isMatchFinished(m));
            const isLastShown = r === Math.max(...bracketMatches.map((m) => m.bracketRound));
            const head = ms[0] || {};
            return (
              <div key={r} style={{ marginBottom: 18 }}>
                <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 8 }}>
                  <span style={{ fontSize: 15, fontWeight: 800, color: C.blue }}>{roundLabel(r)}</span>
                  <span style={{ fontSize: 12, fontWeight: 800, color: C.sub, fontVariantNumeric: "tabular-nums" }}>
                    {head.scheduledAt ? `${fmtClock(head.scheduledAt)}〜　` : ""}🎯{targetLabel(r)}点
                  </span>
                </div>
                {ms.map((m) => {
                  const w = isMatchFinished(m) ? matchWinnerIndex(m) : null;
                  return (
                    <div key={m.id} style={{
                      display: "flex", gap: 8, alignItems: "center", background: m.pending ? C.zone : "#fff",
                      border: `1px solid ${C.line}`, borderRadius: 10, padding: "8px 10px", marginBottom: 6,
                    }}>
                      <span style={{ fontSize: 11, fontWeight: 900, color: "#fff", background: m.pending ? C.sub : C.ink, borderRadius: 5, padding: "1px 6px", flexShrink: 0 }}>T{m.table}</span>
                      {[0, 1].map((i) => (
                        <div key={i} style={{
                          flex: 1, textAlign: "center", fontSize: 14,
                          fontWeight: w === i ? 900 : 600,
                          color: m.pending ? C.sub : w === i ? C.win : w == null ? C.ink : C.sub,
                          whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                        }}>
                          {m.pending ? m.names[i] : nameOfNum(m.names[i], roster)}{isMatchFinished(m) && ` (${(m.tot || [0, 0])[i]})`}
                        </div>
                      ))}
                    </div>
                  );
                })}
                {readyToFill && (
                  <button onClick={() => advanceRound(r - 1)} disabled={registering} style={{ width: "100%", background: C.win, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT, marginTop: 4 }}>
                    {registering ? "反映中…" : `${roundLabel(r)}に勝ち上がった選手を入れる`}
                  </button>
                )}
                {allDone && isLastShown && r < totalRounds && (
                  <button onClick={() => advanceRound(r)} disabled={registering} style={{ width: "100%", background: C.win, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT, marginTop: 4 }}>
                    {registering ? "登録中…" : `${roundLabel(r + 1)}を組む`}
                  </button>
                )}
                {allDone && r === totalRounds && (
                  <div style={{ textAlign: "center", fontSize: 15, fontWeight: 800, color: C.win, marginTop: 6 }}>
                    🏆 優勝：{nameOfNum(ms[0].names[matchWinnerIndex(ms[0])], roster)}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ========= 接続診断 ========= */
function ConnectionTest() {
  const [log, setLog] = useState(null);
  const [busy, setBusy] = useState(false);

  const run = async () => {
    setBusy(true);
    const lines = [];
    lines.push(`接続先：${FIREBASE_CONFIG.databaseURL}`);
    try {
      const t0 = Date.now();
      const rec = (await dbGet("/")) || {};
      lines.push(`① 読み込み：成功（${Date.now() - t0}ms）`);
      lines.push(`   データ量：${(JSON.stringify(rec).length / 1024).toFixed(1)} KB`);
      lines.push(`   メンバー：${(rec.roster || []).length}人`);
      lines.push(`   対戦データ：${Object.keys(rec.matches || {}).length}件`);
      const t1 = Date.now();
      await dbSet("_healthcheck", Date.now());
      lines.push(`② 書き込み：成功（${Date.now() - t1}ms）`);
      lines.push("→ 読み書きとも正常です");
    } catch (e) {
      const msg = e && e.message ? e.message : String(e);
      lines.push(`エラー：${msg}`);
      if (/permission|Permission/.test(msg)) lines.push("→ Realtime Databaseのルールが許可になっていません");
      else if (/FIREBASE_CONFIG|Invalid|invalid/.test(msg)) lines.push("→ databaseURL の値を確認してください");
      else lines.push("→ オフライン、または設定値が違う可能性があります");
    }
    setLog(lines);
    setBusy(false);
  };

  return (
    <div style={{ marginTop: 14 }}>
      <button onClick={run} disabled={busy} style={{ width: "100%", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.ink, fontSize: 13.5, fontWeight: 700, padding: "11px 0", cursor: "pointer", fontFamily: FONT }}>
        {busy ? "確認中…" : "🔌 保存できるか接続を確認する"}
      </button>
      {log && (
        <pre style={{ marginTop: 8, background: C.zone, border: `1px solid ${C.line}`, borderRadius: 10, padding: 10, fontSize: 11, lineHeight: 1.7, color: C.ink, whiteSpace: "pre-wrap", wordBreak: "break-all", fontFamily: "monospace" }}>{log.join("\n")}</pre>
      )}
    </div>
  );
}

/* ========= 抽選（本名の確定）タブ =========
   すでに1〜14番で組まれている対戦表に、当日引いた番号ぶんの本名を入力する。
   番号は動かさず（対戦データはこの番号を永久に参照する）、名前だけを入力・修正する */
function DrawTab({ roster, setRoster, onRefresh, loaded, loadError }) {
  const [saving, setSaving] = useState(false);
  const [saveMsg, setSaveMsg] = useState(null);
  const saveTimer = useRef(null);
  const rosterRef = useRef(roster);
  rosterRef.current = roster;

  const persist = (allowEmpty) => {
    if (!loaded) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      setSaving(true);
      try {
        await saveRoster(rosterRef.current, allowEmpty !== false);
        setSaveMsg(null);
      } catch (e) {
        setSaveMsg(String(e && e.message ? e.message : e));
      }
      setSaving(false);
    }, 500);
  };

  const updateName = (id, v) => {
    setRoster((rs) => rs.map((p) => (p.id === id ? { ...p, name: v } : p)));
    persist();
  };
  const updateNum = (id, v) => {
    const n = v === "" ? null : Math.max(1, Math.min(30, parseInt(v, 10) || 0));
    setRoster((rs) => rs.map((p) => (p.id === id ? { ...p, num: n } : p)));
    persist();
  };
  const addRow = () => {
    if (roster.length >= 20) return;
    setRoster((rs) => [...rs, { id: nid(), num: null, name: "" }]);
    persist();
  };
  const removeRow = (id) => {
    setRoster((rs) => rs.filter((p) => p.id !== id));
    persist(true);
  };

  const filledCount = roster.filter((p) => p.name).length;
  const numberedCount = roster.filter((p) => p.num != null).length;
  const usedNums = new Set(roster.map((p) => p.num).filter((n) => n != null));
  const remainingNums = Array.from({ length: roster.length }, (_, i) => i + 1).filter((n) => !usedNums.has(n));
  const dupNums = (() => {
    const seen = new Set(), dup = new Set();
    roster.forEach((p) => { if (p.num == null) return; if (seen.has(p.num)) dup.add(p.num); seen.add(p.num); });
    return dup;
  })();

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "10px 16px 24px", color: C.ink }}>
      <div style={{ textAlign: "center", marginBottom: 14 }}>
        <div style={{ fontSize: 13, color: C.sub, marginTop: 4 }}>
          {saving ? "保存中…" : `名前 ${filledCount}人／番号 ${numberedCount}/${roster.length}`}
        </div>
        <button onClick={() => Promise.resolve(onRefresh()).catch(() => {})} style={{ marginTop: 8, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.ink, fontSize: 13, fontWeight: 700, padding: "7px 12px", cursor: "pointer", fontFamily: FONT }}>🔄 更新</button>
      </div>

      {loadError && (
        <Notice>メンバーの読み込みに失敗しました。通信を確認して「🔄 更新」を押してください。（{loadError}）</Notice>
      )}
      {saveMsg && <Notice>{saveMsg}</Notice>}

      <div style={{ ...HELP, marginBottom: 12 }}>
        出場者の本名が決まっているなら、先に名前だけ登録しておけます。
        当日、選手にカードを引いてもらったら、その人の行に引いた番号を入力してください。
        対戦表はすでに番号で組んであるので、番号を入れた瞬間に本人の対戦表・タイムライン・成績が反映されます。
      </div>

      {dupNums.size > 0 && (
        <Notice>番号が重複しています（{[...dupNums].join("・")}番）。同じ番号が2人にならないよう直してください。</Notice>
      )}

      {roster.length > 0 && (
        <div style={{ display: "flex", gap: 8, marginBottom: 6, padding: "0 2px" }}>
          <div style={{ flex: 1, fontSize: 11, color: C.sub, fontWeight: 700 }}>名前</div>
          <div style={{ width: 64, fontSize: 11, color: C.sub, fontWeight: 700, textAlign: "center" }}>番号</div>
          <div style={{ width: 40 }} />
        </div>
      )}

      {roster.map((p) => {
        const bad = p.num != null && dupNums.has(p.num);
        return (
          <div key={p.id} style={{ display: "flex", gap: 8, marginBottom: 8, alignItems: "center" }}>
            <input value={p.name} onChange={(e) => updateName(p.id, e.target.value.slice(0, 12))}
              placeholder="本名を入力"
              style={{ flex: 1, minWidth: 0, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.ink, fontSize: 16, padding: "10px 12px", outline: "none", fontFamily: FONT }} />
            <input inputMode="numeric" value={p.num == null ? "" : String(p.num)} onChange={(e) => updateNum(p.id, e.target.value.replace(/[^0-9]/g, "").slice(0, 2))}
              placeholder="―"
              style={{
                width: 64, background: p.num != null ? C.lightBlue : "#fff", border: `1.5px solid ${bad ? C.minus : p.num != null ? C.blue : C.line}`,
                borderRadius: 10, color: bad ? C.minus : p.num != null ? C.blue : C.ink, fontSize: 17, fontWeight: 800, padding: "10px 0",
                textAlign: "center", outline: "none", fontFamily: FONT,
              }} />
            <button onClick={() => removeRow(p.id)} style={{ width: 40, height: 40, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.sub, fontSize: 18, cursor: "pointer" }}>×</button>
          </div>
        );
      })}

      {roster.length < 20 && (
        <button onClick={addRow} style={{ width: "100%", background: "#fff", border: `2px dashed ${C.blue}`, borderRadius: 10, color: C.blue, fontSize: 14.5, fontWeight: 700, padding: "12px 0", cursor: "pointer", fontFamily: FONT, marginTop: 4 }}>
          ＋ 選手を追加（{roster.length}人）
        </button>
      )}

      {roster.length > 0 && remainingNums.length > 0 && (
        <div style={{ ...HELP, marginTop: 12 }}>
          まだ引かれていない番号：{remainingNums.join("・")}
        </div>
      )}
    </div>
  );
}

/* ========= 予選を組む =========
   人数と1人あたりの試合数を指定して、その場で総当たり風の組み合わせを自動生成する
   （3卓・同卓2連投はOKだが3連投は避ける）。総当たりモードON時は全員と1回ずつ対戦する。
   ハンデが無いので目標点は常に予選の固定値。識別は番号方式（登録後、メンバーの番号は
   いったんリセットされるので「🎲 抽選」で振り直す） */
const BULK_TABLES = 3;

function bulkMakePlan(N, G, relaxed) {
  const total = (N * G) / 2;
  if (!Number.isInteger(total)) return { error: "人数と試合数の積が奇数です。総試合数が半端になります。" };
  const cap0 = Math.min(BULK_TABLES, Math.floor(N / 2));
  if (cap0 < 1) return { error: "人数が少なすぎて試合を組めません（最低3人必要です）。" };
  const slots = Math.ceil(total / cap0);
  const sizes = [];
  for (let s = 0; s < slots; s++) sizes.push(s < slots - 1 ? cap0 : total - cap0 * (slots - 1));
  let lower = 0;
  for (let s = 0; s < slots - 1; s++) {
    const need = sizes[s] * 2 + sizes[s + 1] * 2 - N;
    const cap = Math.min(sizes[s], sizes[s + 1]);
    if (!relaxed && need > cap) {
      return { error: `この人数では成立しません。1コマに${sizes[s] * 2}人必要ですが、同じ卓でしか連投できないため次コマへ持ち越せるのは最大${cap}人です。人数を変えてください。` };
    }
    if (need > 0) lower += need;
  }
  return { total, slots, sizes, lower };
}
function bulkMulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function bulkAttempt(N, G, plan, rng, ceiling, nodeLimit, relaxed) {
  const { total, slots, sizes } = plan;
  const pos = [];
  for (let s = 0; s < slots; s++) for (let t = 0; t < sizes[s]; t++) pos.push([s, t]);

  const deg = new Int32Array(N + 1);
  const used = new Set();
  const seat = Array.from({ length: slots }, () => new Map());
  const board = [];
  let cost = 0, nodes = 0, best = null;

  const viable = (s) => {
    if (relaxed) return true;
    const left = slots - s - 1;
    for (let x = 1; x <= N; x++) {
      const need = G - deg[x];
      if (!need) continue;
      let room = left;
      if (seat[s].has(x) && s > 0 && seat[s - 1].has(x)) room -= 1;
      if (need > room - Math.floor(room / 3)) return false;
    }
    if (left > 0) {
      let free = 0;
      for (let x = 1; x <= N; x++) {
        if (deg[x] >= G) continue;
        if (seat[s].has(x) && s > 0 && seat[s - 1].has(x)) continue;
        free++;
      }
      if (free < sizes[s + 1] * 2) return false;
    }
    return true;
  };

  const walk = (p) => {
    if (nodes++ > nodeLimit) throw new Error("budget");
    if (p === total) { best = { board: board.map((m) => ({ ...m })), cost }; return true; }
    const [s, t] = pos[p];
    const here = seat[s], prev = s > 0 ? seat[s - 1] : null, back = s > 1 ? seat[s - 2] : null;

    const cands = [];
    for (let a = 1; a <= N; a++) {
      if (deg[a] >= G || here.has(a)) continue;
      for (let b = a + 1; b <= N; b++) {
        if (deg[b] >= G || here.has(b) || used.has(a * 32 + b)) continue;
        let carry = 0, ok = true;
        for (const x of [a, b]) {
          if (prev && prev.has(x)) {
            if (!relaxed && prev.get(x) !== t) { ok = false; break; }
            if (!relaxed && back && back.has(x)) { ok = false; break; }
            carry++;
          }
        }
        if (!ok || cost + carry >= ceiling) continue;
        cands.push({ a, b, carry, score: carry * 1000 - (2 * G - deg[a] - deg[b]) * 10 + rng() * 5 });
      }
    }
    cands.sort((x, y) => x.score - y.score);

    for (const c of cands) {
      deg[c.a]++; deg[c.b]++;
      used.add(c.a * 32 + c.b);
      here.set(c.a, t); here.set(c.b, t);
      cost += c.carry;
      board.push({ slot: s, table: t, a: c.a, b: c.b, carry: c.carry });
      if (t !== sizes[s] - 1 || viable(s)) { if (walk(p + 1)) return true; }
      board.pop(); cost -= c.carry;
      here.delete(c.a); here.delete(c.b);
      used.delete(c.a * 32 + c.b);
      deg[c.a]--; deg[c.b]--;
    }
    return false;
  };

  try { walk(0); } catch (e) { if (e.message !== "budget") throw e; }
  return best;
}
function bulkGenerate(N, G, relaxed) {
  const plan = bulkMakePlan(N, G, relaxed);
  if (plan.error) return { error: plan.error };
  let best = null, ceiling = Infinity;
  const start = Date.now();
  for (let r = 0; r < 400; r++) {
    if (Date.now() - start > 2500) break;
    const got = bulkAttempt(N, G, plan, bulkMulberry(r * 7919 + 13), ceiling, 40000, relaxed);
    if (got && got.cost < ceiling) { best = got; ceiling = got.cost; if (best.cost <= plan.lower) break; }
  }
  if (!best) return { error: relaxed ? "条件を緩和しても組み合わせが見つかりませんでした。人数か試合数を変えてください。" : "条件を満たす組み合わせが見つかりませんでした。" };
  return { plan, board: best.board, cost: best.cost, optimal: best.cost <= plan.lower };
}
function bulkGenerateAuto(N, G) {
  const strict = bulkGenerate(N, G, false);
  if (!strict.error) return { ...strict, usedRelaxed: false };
  const relaxed = bulkGenerate(N, G, true);
  if (!relaxed.error) return { ...relaxed, usedRelaxed: true };
  return { error: relaxed.error || strict.error };
}

function BulkStepper({ label, value, min, max, onChange }) {
  const btn = { width: 38, height: 38, borderRadius: 10, border: `1px solid ${C.line}`, background: "#fff", color: C.ink, fontSize: 19, cursor: "pointer", fontFamily: FONT };
  return (
    <div style={{ flex: 1, background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: "10px 10px 12px" }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: C.sub, marginBottom: 6, textAlign: "center" }}>{label}</div>
      <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
        <button style={btn} onClick={() => onChange(Math.max(min, value - 1))}>−</button>
        <div style={{ flex: 1, textAlign: "center", fontSize: 22, fontWeight: 800 }}>{value}</div>
        <button style={btn} onClick={() => onChange(Math.min(max, value + 1))}>＋</button>
      </div>
    </div>
  );
}
function ReshuffleCard({ m }) {
  return (
    <div style={{ background: m.carry ? C.lightBlue : C.zone, border: `1.5px solid ${m.carry ? C.blue : C.line}`, borderRadius: 14, padding: "10px 5px", position: "relative", textAlign: "center" }}>
      {m.carry > 0 && <div style={{ position: "absolute", top: 4, right: 5, fontSize: 9, fontWeight: 800, color: C.blue }}>連投</div>}
      <span style={{ fontSize: 18, fontWeight: 900, color: C.blue }}>{m.a}</span>
      <span style={{ fontSize: 13, color: C.sub, margin: "0 4px" }}>対</span>
      <span style={{ fontSize: 18, fontWeight: 900, color: C.red }}>{m.b}</span>
    </div>
  );
}

function ReshuffleTab() {
  const s0 = useMemo(() => loadSettings(), []);
  const [players, setPlayers] = useState(s0.reshufflePlayers || 13);
  const [games, setGames] = useState(s0.reshuffleGames || 3);
  const [roundRobin, setRoundRobin] = useState(!!s0.reshuffleRoundRobin);
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState(false);
  const [registering, setRegistering] = useState(false);
  const [msg, setMsg] = useState(null);
  const [existing, setExisting] = useState({});
  const d0 = useMemo(() => defaultSchedule(), []);
  const [startH, setStartH] = useState(d0.startH);
  const [startM, setStartM] = useState(d0.startM);
  const [matchMinutes, setMatchMinutes] = useState(String(loadSettings().matchMinutes || 30));
  const [changeoverMin, setChangeoverMin] = useState(String(loadSettings().changeoverMin || 5));

  useEffect(() => dbSubscribe("matches", (m) => setExisting(m || {}), () => {}), []);
  const existingPrelimCount = useMemo(
    () => Object.values(existing || {}).filter((m) => m && !m.bracket).length,
    [existing]
  );

  useEffect(() => {
    saveSettings({ reshufflePlayers: players, reshuffleGames: games, reshuffleRoundRobin: roundRobin });
  }, [players, games, roundRobin]);

  const effectiveGames = roundRobin ? players - 1 : games;

  const resetPrelim = async () => {
    if (!window.confirm(`予選の対戦（${existingPrelimCount}試合）をすべて削除します。\n進行中・終了した試合も含めて消えます（バックアップからは戻せます）。\n\nよろしいですか？`)) return;
    if (!window.confirm("本当に削除しますか？")) return;
    setRegistering(true);
    try {
      await saveBackup("予選をリセットする前");
      const clearUpd = {};
      Object.entries(existing || {}).forEach(([id, m]) => { if (m && !m.bracket) clearUpd[id] = null; });
      await dbUpdate("matches", clearUpd);
      setMsg({ ok: true, text: "予選の対戦を削除しました" });
    } catch (e) {
      setMsg({ ok: false, text: "削除に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setRegistering(false);
  };

  const run = () => {
    setBusy(true); setMsg(null);
    setTimeout(() => { setResult(bulkGenerateAuto(players, effectiveGames)); setBusy(false); }, 20);
  };

  const rows = useMemo(() => {
    if (!result || result.error) return null;
    const base = Date.now();
    const mins = parseInt(matchMinutes, 10) || 30;
    return result.board.map((m, i) => ({
      ...m, seq: i, matchId: randomMatchId(), createdAt: base + i * 1000, matchMinutes: mins,
    }));
  }, [result, matchMinutes]);

  const grid = useMemo(() => {
    if (!rows) return null;
    const map = new Map();
    for (const m of rows) {
      if (!map.has(m.slot)) map.set(m.slot, [null, null, null]);
      map.get(m.slot)[m.table] = m;
    }
    return [...map.entries()].sort((a, b) => a[0] - b[0]);
  }, [rows]);

  const register = async () => {
    if (!rows || registering) return;
    if (!window.confirm(`${players}人・1人${effectiveGames}試合・全${rows.length}試合で予選を組みます。\n現在の予選対戦（決勝トーナメント以外）はすべて置き換わり、メンバーの番号（抽選結果）もいったんリセットされます。\n\nよろしいですか？`)) return;
    setRegistering(true);
    try {
      const chg = (parseInt(changeoverMin, 10) || 5) * 60000;
      const mins = parseInt(matchMinutes, 10) || 30;
      const st = new Date();
      st.setHours(parseInt(startH, 10) || 0, parseInt(startM, 10) || 0, 0, 0);
      const slots = Math.max(...rows.map((m) => m.slot)) + 1;
      const slotStart = [];
      let cursor = st.getTime();
      for (let s = 0; s < slots; s++) { slotStart.push(cursor); cursor += (mins + chg) * 60000; }

      const now = Date.now();
      const next = {};
      rows.forEach((m) => {
        next[m.matchId] = {
          version: 1, phase: "banking", brk: null, tot: [0, 0], rack: 1,
          balls: Array.from({ length: 9 }, (_, k) => ({ n: k + 1, loc: "c", dead: false })),
          lastResult: null, hist: [], raceTo: [ROUND_TARGET.prelim, ROUND_TARGET.prelim],
          names: [String(m.a), String(m.b)], table: m.table + 1, slot: m.slot,
          matchMinutes: mins, scheduledAt: slotStart[m.slot],
          createdAt: m.createdAt, updatedAt: now,
        };
      });
      await saveBackup("予選を組む前");
      const cur = (await dbGet("matches")) || {};
      const clearUpd = {};
      Object.entries(cur).forEach(([id, mm]) => { if (mm && !mm.bracket) clearUpd[id] = null; });
      if (Object.keys(clearUpd).length) await dbUpdate("matches", clearUpd);
      await dbUpdate("matches", next);
      // 番号の組み合わせが変わるので、rosterの番号（抽選結果）はいったんリセットする。
      // 名前は残るので「🎲 抽選」でそのまま振り直せる
      const curRoster = (await dbGet("roster")) || [];
      const resetRoster = curRoster.map((p) => ({ ...p, num: null }));
      await dbSet("roster", resetRoster);
      saveSettings({ matchMinutes, changeoverMin });
      setMsg({ ok: true, text: `${players}人・${rows.length}試合で登録しました。「🎲 抽選」タブで番号を振り直してください` });
    } catch (e) {
      setMsg({ ok: false, text: "登録に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setRegistering(false);
  };

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "10px 16px 24px", color: C.ink }}>
      <div style={{ ...HELP, marginBottom: 14 }}>
        人数と1人あたりの試合数を指定して、その場で組み合わせを自動生成します（3卓・同卓2連投まではOK、3連投は避けます）。目標点は予選固定値（{ROUND_TARGET.prelim}点）です。
      </div>

      {existingPrelimCount > 0 && (
        <button onClick={resetPrelim} disabled={registering} style={{
          width: "100%", background: "#fff", border: `1.5px solid ${C.minus}`, borderRadius: 12,
          color: C.minus, fontSize: 14.5, fontWeight: 800, padding: "13px 0", cursor: "pointer",
          fontFamily: FONT, marginBottom: 16,
        }}>🗑 今の予選をリセット（{existingPrelimCount}試合を削除）</button>
      )}

      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <BulkStepper label="人数" value={players} min={3} max={16} onChange={setPlayers} />
        {roundRobin ? (
          <div style={{ flex: 1, background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: "10px 10px 12px", display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center" }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: C.sub, marginBottom: 6, textAlign: "center" }}>1人の試合数</div>
            <div style={{ fontSize: 15, fontWeight: 800, color: C.blue, textAlign: "center" }}>総当たり戦（{players - 1}）</div>
          </div>
        ) : (
          <BulkStepper label="1人の試合数" value={games} min={2} max={4} onChange={setGames} />
        )}
      </div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: roundRobin ? C.lightBlue : C.zone, border: `1.5px solid ${roundRobin ? C.blue : C.line}`, borderRadius: 12, padding: "12px 14px", marginBottom: 16 }}>
        <div>
          <div style={{ fontSize: 14, fontWeight: 800, color: C.ink }}>総当たりモード</div>
          <div style={{ fontSize: 14, color: "#3F4A55", marginTop: 2, lineHeight: 1.7 }}>ONの間は全員と1回ずつ対戦する総当たり戦で組みます</div>
        </div>
        <button onClick={() => setRoundRobin((v) => !v)} style={{
          background: roundRobin ? C.blue : C.line, color: roundRobin ? "#fff" : C.sub,
          border: "none", borderRadius: 20, padding: "8px 16px", fontSize: 13, fontWeight: 800,
          cursor: "pointer", fontFamily: FONT, flexShrink: 0,
        }}>
          {roundRobin ? "ON" : "OFF"}
        </button>
      </div>

      <div style={{ background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, marginBottom: 14 }}>
        <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 10 }}>1コマ目の開始予定</div>
        <TimeInput h={startH} m={startM} onH={setStartH} onM={setStartM} />
        <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, color: C.sub, marginBottom: 4 }}>持ち時間（目安・分）</div>
            <input inputMode="numeric" value={matchMinutes} onChange={(e) => setMatchMinutes(e.target.value.replace(/[^0-9]/g, "").slice(0, 3))} style={{ ...numBoxStyle, textAlign: "center", width: "100%" }} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, color: C.sub, marginBottom: 4 }}>入替（分）</div>
            <input inputMode="numeric" value={changeoverMin} onChange={(e) => setChangeoverMin(e.target.value.replace(/[^0-9]/g, "").slice(0, 3))} style={{ ...numBoxStyle, textAlign: "center", width: "100%" }} />
          </div>
        </div>
      </div>

      <button onClick={run} disabled={busy}
        style={{ width: "100%", background: busy ? C.line : C.ink, color: busy ? C.sub : "#fff", border: "none", borderRadius: 14, padding: "15px 0", fontSize: 16, fontWeight: 800, cursor: busy ? "wait" : "pointer", fontFamily: FONT, marginBottom: 16 }}>
        {busy ? "計算中…" : "組む ▶"}
      </button>

      {result?.error && <Notice>{result.error}</Notice>}

      {grid && (
        <>
          <Notice>下書きができました。まだ保存されていません。内容を確認して、一番下の青いボタンで登録してください。</Notice>
          <div style={{ display: "flex", flexWrap: "wrap", gap: "6px 18px", fontSize: 12.5, color: C.sub, marginBottom: 14, justifyContent: "center" }}>
            <span>総試合 <b style={{ color: C.ink }}>{result.plan.total}</b></span>
            <span>コマ <b style={{ color: C.ink }}>{result.plan.slots}</b></span>
            <span>同卓2連 <b style={{ color: C.ink }}>{result.cost}</b> / 下限 {result.plan.lower}</span>
            {result.optimal && <span style={{ color: C.win, fontWeight: 800 }}>最小</span>}
          </div>
          {result.usedRelaxed && <Notice>人数の都合で同卓縛り・3連投禁止の条件を一部緩和して組みました（自動判定）。</Notice>}

          <div style={{ display: "grid", gridTemplateColumns: "22px 1fr 1fr 1fr", gap: 6, marginBottom: 6 }}>
            <div />
            {[1, 2, 3].map((t) => <div key={t} style={{ textAlign: "center", fontSize: 12.5, fontWeight: 800, color: C.sub }}>T{t}</div>)}
          </div>
          {grid.map(([slot, cells]) => (
            <div key={slot} style={{ display: "grid", gridTemplateColumns: "22px 1fr 1fr 1fr", gap: 6, marginBottom: 6, alignItems: "stretch" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10.5, fontWeight: 800, color: C.sub }}>{slot + 1}</div>
              {cells.map((m, i) => m ? <ReshuffleCard key={i} m={m} /> : (
                <div key={i} style={{ background: C.zone, border: `1px dashed ${C.line}`, borderRadius: 14, display: "flex", alignItems: "center", justifyContent: "center", color: C.sub, fontSize: 11, padding: "14px 4px" }}>空き</div>
              ))}
            </div>
          ))}

          <div style={{ position: "sticky", bottom: 0, background: "linear-gradient(to top, #fff 70%, rgba(255,255,255,0))", paddingTop: 14, paddingBottom: 8, marginTop: 16 }}>
            <button onClick={register} disabled={registering}
              style={{ width: "100%", background: registering ? C.line : C.blue, color: "#fff", border: "none", borderRadius: 14, padding: "16px 0", fontSize: 16, fontWeight: 800, cursor: registering ? "wait" : "pointer", fontFamily: FONT, boxShadow: "0 4px 14px rgba(46,109,181,0.35)" }}>
              {registering ? "登録中…" : "▲ この対戦表をタイムラインに登録する"}
            </button>
            <div style={{ textAlign: "center", fontSize: 11, color: C.sub, marginTop: 6 }}>
              「組む」だけでは保存されません。このボタンで登録するとタイムライン・メンバーの番号（リセット）に反映されます
            </div>
            {msg && <div style={{ textAlign: "center", fontSize: 13, fontWeight: 700, color: msg.ok ? C.win : C.minus, marginTop: 8 }}>{msg.ok ? "✓ " : "✗ "}{msg.text}</div>}
          </div>
        </>
      )}
    </div>
  );
}

/* ========= ルールのメモ ========= */
function RulesPanel() {
  const [text, setText] = useState(null);
  const [open, setOpen] = useState(false);
  const [saved, setSaved] = useState(false);
  const timer = useRef(null);

  useEffect(() => {
    (async () => {
      try { const cur = await dbGet("config/rules"); setText(cur == null ? "" : String(cur)); }
      catch { setText(""); }
    })();
  }, []);
  const update = (v) => {
    setText(v); setSaved(false);
    clearTimeout(timer.current);
    timer.current = setTimeout(async () => {
      try { await dbUpdate("config", { rules: v }); setSaved(true); } catch {}
    }, 600);
  };
  useEffect(() => () => clearTimeout(timer.current), []);
  const lines = String(text || "").split("\n").filter((x) => x.trim()).length;

  return (
    <div style={{ marginTop: 18 }}>
      <button onClick={() => setOpen((v) => !v)} style={{
        width: "100%", background: "none", border: "none", padding: "2px 0 7px",

function PostSwitch({ label, k }) {
  const [on, setOn] = useState(true);
  const [loaded, setLoaded] = useState(false);

    (async () => {

    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: C.zone, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 14px", marginTop: 8 }}>

  const restore = async (b) => {
