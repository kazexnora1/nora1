<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telop Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent; /* Larixの合成用に透明 */
    overflow: hidden;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  }

  #wrap {
    position: absolute;
    left: 4%;
    bottom: 6%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #wrap.show { opacity: 1; }

  #label {
    background: rgba(20,20,20,0.85);
    color: #FFD54A;
    font-size: 22px;
    font-weight: bold;
    padding: 4px 16px;
    border-radius: 6px 6px 0 0;
    letter-spacing: 2px;
  }

  #board {
    display: flex;
    background: rgba(15,15,15,0.88);
    border-radius: 0 10px 10px 10px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  }

  .player {
    display: flex;
    align-items: center;
    padding: 10px 26px;
  }

  .name {
    color: #fff;
    font-size: 30px;
    font-weight: bold;
    margin-right: 18px;
    white-space: nowrap;
  }

  .score {
    color: #FFD54A;
    font-size: 40px;
    font-weight: 900;
    min-width: 50px;
    text-align: center;
  }

  .divider {
    width: 2px;
    background: rgba(255,255,255,0.25);
    margin: 8px 0;
  }
</style>
</head>
<body>

<div id="wrap">
  <div id="label" style="display:none;"></div>
  <div id="board">
    <div class="player">
      <span class="name" id="name1">-</span>
      <span class="score" id="score1">0</span>
    </div>
    <div class="divider"></div>
    <div class="player">
      <span class="score" id="score2">0</span>
      <span class="name" id="name2" style="margin-right:0; margin-left:18px;">-</span>
    </div>
  </div>
</div>

<script>
  // ▼▼▼ ここを自分のFirebase Realtime DatabaseのURLに書き換える（control.htmlと同じ値） ▼▼▼
  const FIREBASE_URL = "https://nora1kaze-247f3-default-rtdb.asia-southeast1.firebasedatabase.app";
  // ▲▲▲ ここまで ▲▲▲

  const POLL_INTERVAL_MS = 3000;

  async function poll() {
    try {
      const res = await fetch(`${FIREBASE_URL}/telop/current.json?_=${Date.now()}`, { cache: 'no-store' });
      const data = await res.json();
      if (data) render(data);
    } catch (e) {
      // 配信中はエラーを画面に出さず、次のポーリングに任せる
      console.error('telop fetch error', e);
    }
  }

  function render(data) {
    const wrap = document.getElementById('wrap');
    const labelEl = document.getElementById('label');

    document.getElementById('name1').textContent = data.name1 || '-';
    document.getElementById('score1').textContent = data.score1 ?? '0';
    document.getElementById('name2').textContent = data.name2 || '-';
    document.getElementById('score2').textContent = data.score2 ?? '0';

    if (data.label) {
      labelEl.textContent = data.label;
      labelEl.style.display = 'block';
    } else {
      labelEl.style.display = 'none';
    }

    if (data.visible) {
      wrap.classList.add('show');
    } else {
      wrap.classList.remove('show');
    }
  }

  poll();
  setInterval(poll, POLL_INTERVAL_MS);
</script>

</body>
</html>
