<script>
  function showCrash(msg) {
    const el = document.getElementById("crashlog");
    el.style.display = "block";
    el.textContent = "エラーが発生しました:\n\n" + msg;
  }
  window.onerror = function (msg, src, line, col, err) {
    showCrash(msg + "\n" + (src || "") + ":" + line + ":" + col + "\n" + (err && err.stack ? err.stack : ""));
  };
  window.addEventListener("unhandledrejection", function (e) {
    showCrash("Promise rejected: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ========= ハンデ計算（App A/B2と共通） ========= */
function roundHalfToEven(v) {
  const w = Math.floor(v);
  const d = v - w;
  if (Math.abs(d - 0.5) > 1e-9) return d > 0.5 ? w + 1 : w;
  return w % 2 === 1 ? w + 1 : w;
}
function normalizeRace(rt1, rt2, lowClamp) {
  const highClamp = 99.0;
  const p1IsHigh = rt1 >= rt2;
  const highRace = Math.max(rt1, rt2), lowRace = Math.min(rt1, rt2);
  let highC = highRace > highClamp ? highClamp : highRace;
  let lowC = highRace > highClamp ? lowRace - lowRace * ((highRace - highClamp) / highRace) : lowRace;
  highC = Math.min(lowRace < lowClamp ? highC + highC * ((lowClamp - lowRace) / lowC) : highC, highClamp);
  lowC = Math.max(lowC < lowClamp ? lowClamp : lowC, lowClamp);
  return { rt1: p1IsHigh ? highC : lowC, rt2: p1IsHigh ? lowC : highC };
}
function computeRace(R1, R2, lenPct) {
  const dampFactor = lenPct / 100;
  const avg = (R1 + R2) / 2;
  const gp = 0.018 * avg - 1.4;
  const delta = R1 - R2;
  const p1 = 1 - 1 / (1 + Math.pow(2, delta / 100));
  const p2 = 1 - p1;
  const p1AvgPts = p1 * 14.0 + p2 * (7.4 - 0.0062 * R2);
  const p2AvgPts = p2 * 14.0 + p1 * (7.4 - 0.0062 * R1);
  const rt1raw = p1AvgPts * gp * dampFactor;
  const rt2raw = p2AvgPts * gp * dampFactor;
  const lowClamp = 0.16 * lenPct + 12;
  const norm = normalizeRace(rt1raw, rt2raw, lowClamp);
  return { rt1: roundHalfToEven(norm.rt1), rt2: roundHalfToEven(norm.rt2), p1, p2 };
}

const FONT = "system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif";

/* ========= 共有バックエンド（App A/B2と同じBin） ========= */
const JSONBIN_ID = "6a59da56da38895dfe69af82";
const JSONBIN_KEY = "$2a$10$4387m6BO917eu5kfVN//hOwH0O4g1IHkX5sjqUfgj5Jf2t4VNUnwK";

async function jsonbinRead() {
  const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest`, {
    headers: { "X-Master-Key": JSONBIN_KEY },
  });
  const data = await res.json();
  const record = data && data.record ? data.record : {};
  return {
    roster: Array.isArray(record.roster) ? record.roster : [],
    results: Array.isArray(record.results) ? record.results : [],
    matches: record.matches && typeof record.matches === "object" ? record.matches : {},
  };
}
async function jsonbinWrite(record) {
  await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_KEY },
    body: JSON.stringify(record),
  });
}
async function saveRoster(roster) {
  const record = await jsonbinRead().catch(() => ({ roster: [], results: [], matches: {} }));
  record.roster = roster;
  await jsonbinWrite(record);
}
async function saveMatch(matchId, state) {
  const record = await jsonbinRead().catch(() => ({ roster: [], results: [], matches: {} }));
  record.matches = record.matches || {};
  record.matches[matchId] = { ...state, updatedAt: Date.now() };
  await jsonbinWrite(record);
}
function randomMatchId() {
  return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
}
const STALE_MS = 1000 * 60 * 60 * 6;
function isMatchFinished(m) {
  const rt = m.raceTo || [0, 0], tot = m.tot || [0, 0];
  return (rt[0] > 0 && tot[0] >= rt[0]) || (rt[1] > 0 && tot[1] >= rt[1]);
}
// 卓ごとの待機列：未終了の対戦を作成順に並べる。[0]が現在対戦中、[1]が次戦
function getQueueForTable(matches, tableNum) {
  const list = [];
  for (const id in matches) {
    const m = matches[id];
    if (!m || Number(m.table) !== tableNum) continue;
    if (!m.updatedAt || Date.now() - m.updatedAt > STALE_MS) continue;
    if (isMatchFinished(m)) continue;
    list.push({ ...m, id });
  }
  list.sort((a, b) => (a.createdAt || a.updatedAt) - (b.createdAt || b.updatedAt));
  return list;
}

let _id = 1;
const nid = () => _id++;

/* ========= 設定の永続化（端末ローカル）。人数・試合数・時間割などを次回起動時も復元 ========= */
const SETTINGS_KEY = "jcl9_b1_settings_v1";
function loadSettings() {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch { return {}; }
}
function saveSettings(patch) {
  try {
    const cur = loadSettings();
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({ ...cur, ...patch }));
  } catch {}
}

/* 対戦1件だけを読み書きする（目標点編集・タイマー調整用） */
async function patchMatch(matchId, patchFn) {
  const record = await jsonbinRead().catch(() => ({ roster: [], results: [], matches: {} }));
  const m = record.matches && record.matches[matchId];
  if (!m) return false;
  record.matches[matchId] = { ...patchFn(m), version: (m.version || 1) + 1, updatedAt: Date.now() };
  await jsonbinWrite(record);
  return true;
}

}

/* ========= 設定タブ：メンバー（常時）＋試合割り＋個別に対戦を追加 ========= */

/* ========= メンバータブ ========= */
function MembersTab({ roster, setRoster, onRefresh, loaded }) {
  const [saving, setSaving] = useState(false);
  const saveTimer = useRef(null);
  const rosterRef = useRef(roster);
  rosterRef.current = roster;

  const update = (id, k, v) => setRoster((rs) => rs.map((p) => (p.id === id ? { ...p, [k]: v } : p)));
  const remove = (id) => setRoster((rs) => rs.filter((p) => p.id !== id));
  const add = () => roster.length < 40 && setRoster((rs) => [...rs, { id: nid(), name: `選手${rs.length + 1}`, r: "" }]);

  const persist = () => {
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      setSaving(true);
      await saveRoster(rosterRef.current).catch(() => {});
      setSaving(false);
    }, 500);
  };

  useEffect(() => { if (loaded) persist(); }, [roster]);

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "20px 16px 24px", color: C.ink }}>
      <div style={{ textAlign: "center", marginBottom: 14 }}>
        <div style={{ fontSize: 22, fontWeight: 800 }}>メンバーリスト</div>
        <div style={{ fontSize: 13, color: C.sub, marginTop: 4 }}>{saving ? "保存中…" : "名前とファーゴレート（共有）"}</div>
        <button onClick={onRefresh} style={{ marginTop: 8, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.ink, fontSize: 13, fontWeight: 700, padding: "7px 12px", cursor: "pointer", fontFamily: FONT }}>🔄 更新</button>
      </div>
      {roster.map((p) => (
        <div key={p.id} style={{ display: "flex", gap: 8, marginBottom: 8, alignItems: "center" }}>
          <input value={p.name} onChange={(e) => update(p.id, "name", e.target.value.slice(0, 12))}
            style={{ flex: 1, minWidth: 0, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.ink, fontSize: 15, padding: "10px 12px", outline: "none", fontFamily: FONT }} />
          <input inputMode="numeric" value={p.r} onChange={(e) => update(p.id, "r", e.target.value.replace(/[^0-9]/g, "").slice(0, 3))}
            style={{ width: 80, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.ink, fontSize: 15, fontWeight: 700, padding: "10px 0", textAlign: "center", outline: "none", fontFamily: FONT }} />
          <button onClick={() => remove(p.id)} style={{ width: 40, height: 40, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.sub, fontSize: 18, cursor: "pointer" }}>×</button>
        </div>
      ))}
      {roster.length < 40 && (
        <button onClick={add} style={{ width: "100%", background: "#fff", border: `2px dashed ${C.blue}`, borderRadius: 10, color: C.blue, fontSize: 14.5, fontWeight: 700, padding: "12px 0", cursor: "pointer", fontFamily: FONT }}>＋ 選手を追加</button>
      )}
    </div>
  );
}

/* ========= 対戦表タブ（対戦作成＝実質のB1本体） ========= */
/* ========= 試合割りタブ：総当たり風スケジュールを自動生成して一括登録 ========= */
const BULK_TABLES = 3;

function bulkMakePlan(N, G) {
  const total = (N * G) / 2;
  if (!Number.isInteger(total)) return { error: "人数と試合数の積が奇数です。総試合数が半端になります。" };
  const slots = Math.ceil(total / BULK_TABLES);
  const sizes = [];
  for (let s = 0; s < slots; s++) sizes.push(s < slots - 1 ? BULK_TABLES : total - BULK_TABLES * (slots - 1));
  let lower = 0;
  for (let s = 0; s < slots - 1; s++) {
    const need = sizes[s] * 2 + sizes[s + 1] * 2 - N;
    const cap = Math.min(sizes[s], sizes[s + 1]);
    if (need > cap) {
      return { error: `この人数では成立しません。1コマに${sizes[s] * 2}人必要ですが、同じ卓でしか連投できないため次コマへ持ち越せるのは最大${cap}人です。` };
    }
    if (need > 0) lower += need;
  }
  return { total, slots, sizes, lower };
}
function bulkMulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function bulkAttempt(N, G, plan, rng, ceiling, nodeLimit) {
  const { total, slots, sizes } = plan;
  const pos = [];
  for (let s = 0; s < slots; s++) for (let t = 0; t < sizes[s]; t++) pos.push([s, t]);

  const deg = new Int32Array(N + 1);
  const used = new Set();
  const seat = Array.from({ length: slots }, () => new Map());
  const board = [];
  let cost = 0, nodes = 0, best = null;

  const viable = (s) => {
    const left = slots - s - 1;
    for (let x = 1; x <= N; x++) {
      const need = G - deg[x];
      if (!need) continue;
      let room = left;
      if (seat[s].has(x) && s > 0 && seat[s - 1].has(x)) room -= 1;
      if (need > room - Math.floor(room / 3)) return false;
    }
    if (left > 0) {
      let free = 0;
      for (let x = 1; x <= N; x++) {
        if (deg[x] >= G) continue;
        if (seat[s].has(x) && s > 0 && seat[s - 1].has(x)) continue;
        free++;
      }
      if (free < sizes[s + 1] * 2) return false;
    }
    return true;
  };

  const walk = (p) => {
    if (nodes++ > nodeLimit) throw new Error("budget");
    if (p === total) { best = { board: board.map((m) => ({ ...m })), cost }; return true; }
    const [s, t] = pos[p];
    const here = seat[s], prev = s > 0 ? seat[s - 1] : null, back = s > 1 ? seat[s - 2] : null;

    const cands = [];
    for (let a = 1; a <= N; a++) {
      if (deg[a] >= G || here.has(a)) continue;
      for (let b = a + 1; b <= N; b++) {
        if (deg[b] >= G || here.has(b) || used.has(a * 32 + b)) continue;
        let carry = 0, ok = true;
        for (const x of [a, b]) {
          if (prev && prev.has(x)) {
            if (prev.get(x) !== t) { ok = false; break; }
            if (back && back.has(x)) { ok = false; break; }
            carry++;
          }
        }
        if (!ok || cost + carry >= ceiling) continue;
        cands.push({ a, b, carry, score: carry * 1000 - (2 * G - deg[a] - deg[b]) * 10 + rng() * 5 });
      }
    }
    cands.sort((x, y) => x.score - y.score);

    for (const c of cands) {
      deg[c.a]++; deg[c.b]++;
      used.add(c.a * 32 + c.b);
      here.set(c.a, t); here.set(c.b, t);
      cost += c.carry;
      board.push({ slot: s, table: t, a: c.a, b: c.b, carry: c.carry });
      if (t !== sizes[s] - 1 || viable(s)) { if (walk(p + 1)) return true; }
      board.pop(); cost -= c.carry;
      here.delete(c.a); here.delete(c.b);
      used.delete(c.a * 32 + c.b);
      deg[c.a]--; deg[c.b]--;
    }
    return false;
  };

  try { walk(0); } catch (e) { if (e.message !== "budget") throw e; }
  return best;
}
function bulkGenerate(N, G) {
  const plan = bulkMakePlan(N, G);
  if (plan.error) return { error: plan.error };
  let best = null, ceiling = Infinity;
  const start = Date.now();
  for (let r = 0; r < 400; r++) {
    if (Date.now() - start > 2500) break;
    const got = bulkAttempt(N, G, plan, bulkMulberry(r * 7919 + 13), ceiling, 40000);
    if (got && got.cost < ceiling) { best = got; ceiling = got.cost; if (best.cost <= plan.lower) break; }
  }
  if (!best) return { error: "条件を満たす組み合わせが見つかりませんでした。人数か試合数を変えてください。" };
  return { plan, board: best.board, cost: best.cost, optimal: best.cost <= plan.lower };
}

function BulkScheduleTab({ roster }) {
  const s0 = useMemo(() => loadSettings(), []);
  const [players, setPlayers] = useState(s0.players || Math.max(6, Math.min(16, roster.length || 12)));
  const [games, setGames] = useState(s0.games || 4);
  const [lenPct, setLenPct] = useState(s0.lenPct || 100);
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState(false);
  const [registering, setRegistering] = useState(false);
  const [msg, setMsg] = useState(null);
  const [startH, setStartH] = useState(s0.startH || "11");
  const [startM, setStartM] = useState(s0.startM || "00");
  const [endH, setEndH] = useState(s0.endH || "17");
  const [endM, setEndM] = useState(s0.endM || "00");
  const [changeoverMin, setChangeoverMin] = useState(s0.changeoverMin || "5");
  const [per100Min, setPer100Min] = useState(s0.per100Min || "60");

  // 変更のたびに端末へ保存し、次回起動時に復元できるようにする
  useEffect(() => {
    saveSettings({ players, games, lenPct, startH, startM, endH, endM, changeoverMin, per100Min });
  }, [players, games, lenPct, startH, startM, endH, endM, changeoverMin, per100Min]);

  const timeEstimate = useMemo(() => {
    if (!result || result.error) return null;
    const sH = parseInt(startH, 10), sM = parseInt(startM, 10);
    const eH = parseInt(endH, 10), eM = parseInt(endM, 10);
    const chg = parseInt(changeoverMin, 10) || 0;
    const per100 = parseInt(per100Min, 10) || 0;
    if ([sH, sM, eH, eM].some((v) => isNaN(v))) return null;
    const matchMin = per100 * (lenPct / 100);
    const slots = result.plan.slots;
    const totalMin = slots * matchMin + (slots - 1) * chg;
    const startTotal = sH * 60 + sM;
    const endTotal = eH * 60 + eM;
    const finishTotal = startTotal + totalMin;
    const fits = finishTotal <= endTotal;
    const fmt = (mins) => {
      const m = Math.round(mins);
      const h = Math.floor(((m % 1440) + 1440) % 1440 / 60);
      const mm = ((m % 60) + 60) % 60;
      return `${String(h).padStart(2, "0")}:${String(Math.round(mm)).padStart(2, "0")}`;
    };
    return { matchMin, totalMin, finishTotal, fits, diff: Math.abs(endTotal - finishTotal), finishLabel: fmt(finishTotal) };
  }, [result, startH, startM, endH, endM, changeoverMin, per100Min, lenPct]);

  // 終了時刻ちょうどに収まる「試合の長さ（%）」を逆算
  const idealLenPct = useMemo(() => {
    if (!result || result.error) return null;
    const sH = parseInt(startH, 10), sM = parseInt(startM, 10);
    const eH = parseInt(endH, 10), eM = parseInt(endM, 10);
    const chg = parseInt(changeoverMin, 10) || 0;
    const per100 = parseInt(per100Min, 10) || 0;
    if ([sH, sM, eH, eM].some((v) => isNaN(v)) || per100 <= 0) return null;
    const slots = result.plan.slots;
    const available = (eH * 60 + eM) - (sH * 60 + sM) - (slots - 1) * chg;
    if (available <= 0) return { pct: 40, clampedLow: true };
    const raw = (available / slots / per100) * 100;
    const rounded = Math.round(raw / 5) * 5;
    if (rounded > 140) return { pct: 140, clampedHigh: true };
    if (rounded < 40) return { pct: 40, clampedLow: true };
    return { pct: rounded };
  }, [result, startH, startM, endH, endM, changeoverMin, per100Min]);

  const run = () => {
    setBusy(true); setMsg(null);
    setTimeout(() => { setResult(bulkGenerate(players, games)); setBusy(false); }, 20);
  };

  const rows = useMemo(() => {
    if (!result || result.error) return null;
    const base = Date.now();
    return result.board.map((m, i) => {
      const p1 = roster[m.a - 1] || { name: `選手${m.a}`, r: "" };
      const p2 = roster[m.b - 1] || { name: `選手${m.b}`, r: "" };
      const R1 = parseInt(p1.r, 10), R2 = parseInt(p2.r, 10);
      const race = R1 > 0 && R2 > 0 ? computeRace(R1, R2, lenPct) : { rt1: 0, rt2: 0 };
      const mins = Math.round((parseInt(per100Min, 10) || 60) * (lenPct / 100));
      return { ...m, seq: i, matchId: randomMatchId(), createdAt: base + i * 1000, n1: p1.name, n2: p2.name, r1: R1 || 0, r2: R2 || 0, rt1: race.rt1, rt2: race.rt2, lenPct, matchMinutes: mins };
    });

        </div>
        <input type="range" min={40} max={140} step={5} value={lenPct} onChange={(e) => setLenPct(+e.target.value)} style={{ width: "100%", accentColor: C.blue }} />
        <div style={{ display: "flex", gap: 6, marginTop: 8 }}>

function Notice({ children }) {

const selectStyle = { width: "100%", boxSizing: "border-box", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.ink, fontSize: 15, padding: "11px 12px", outline: "none", fontFamily: FONT };

/* ========= タイムラインタブ：対戦カードを作成順（古い→新しい）に縦並び。進行中はリアルタイムスコア、タップでQR ========= */
function fmtElapsed(ms) {
  if (!ms || ms < 0) return "";
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}分${String(s % 60).padStart(2, "0")}秒`;
}
function getFinishedMatches(matches) {
  const list = [];
  for (const id in matches) {
    const m = matches[id];
    if (!m || !isMatchFinished(m)) continue;
    list.push({ ...m, id });
  }
  list.sort((a, b) => (b.finishedAt || b.updatedAt || 0) - (a.finishedAt || a.updatedAt || 0));
  return list;
}

const homeStepBtn = { width: 40, height: 40, borderRadius: 10, border: `1px solid ${C.line}`, background: "#fff", color: C.ink, fontSize: 20, cursor: "pointer", fontFamily: FONT, touchAction: "manipulation" };

function HomeTab() {
  const [queues, setQueues] = useState([[], [], []]);
  const [finished, setFinished] = useState([]);
  const [totalActive, setTotalActive] = useState(0);
  const [openMatch, setOpenMatch] = useState(null);
  const [editRt, setEditRt] = useState(null); // [rt1, rt2] 編集中の値
  const [busyAction, setBusyAction] = useState(false);
  const [editingEnd, setEditingEnd] = useState(false);
  const [showBulkAdjust, setShowBulkAdjust] = useState(false);
  const [bulkBusy, setBulkBusy] = useState(false);
  const [bulkMsg, setBulkMsg] = useState(null);
  const s0 = useMemo(() => loadSettings(), []);
  const [bulkLenPct, setBulkLenPct] = useState(s0.lenPct || 100);
  const [bulkMinutes, setBulkMinutes] = useState(Math.round((parseInt(s0.per100Min, 10) || 60) * ((s0.lenPct || 100) / 100)));
  const [endH, setEndH] = useState(s0.endH || "17");
  const [endM, setEndM] = useState(s0.endM || "00");

  const refresh = async () => {
    try {
      const r = await jsonbinRead();
      setQueues([1, 2, 3].map((t) => getQueueForTable(r.matches, t)));
      setFinished(getFinishedMatches(r.matches));
      setTotalActive(Object.keys(r.matches || {}).filter((id) => r.matches[id] && Date.now() - (r.matches[id].updatedAt || 0) <= STALE_MS).length);
    } catch {}
  };
  useEffect(() => { refresh(); const iv = setInterval(refresh, 3000); return () => clearInterval(iv); }, []);

  useEffect(() => { saveSettings({ endH, endM }); }, [endH, endM]);

  // 今後の全対戦（未終了）に、試合の長さ・持ち時間をまとめて反映する
  const applyBulkAdjust = async () => {
    if (bulkBusy) return;
    if (!window.confirm(`未終了の対戦すべてに、試合の長さ${bulkLenPct}%・持ち時間${bulkMinutes}分を反映します。よろしいですか？`)) return;
    setBulkBusy(true);
    try {
      const record = await jsonbinRead().catch(() => ({ roster: [], results: [], matches: {} }));
      const now = Date.now();
      let count = 0;
      for (const id in record.matches) {
        const m = record.matches[id];
        if (!m || isMatchFinished(m)) continue;
        const R1 = m.r1 || 0, R2 = m.r2 || 0;
        const rt = R1 > 0 && R2 > 0 ? computeRace(R1, R2, bulkLenPct) : { rt1: m.raceTo[0], rt2: m.raceTo[1] };
        record.matches[id] = { ...m, raceTo: [rt.rt1, rt.rt2], lenPct: bulkLenPct, matchMinutes: bulkMinutes, version: (m.version || 1) + 1, updatedAt: now };
        count++;
      }
      await jsonbinWrite(record);
      setBulkMsg({ ok: true, text: `${count}件の対戦に反映しました` });
      refresh();
    } catch (e) {
      setBulkMsg({ ok: false, text: "反映に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setBulkBusy(false);
  };

  // 終了目安：現在登録されている総試合数と設定（100%の目安・入替・試合の長さ）から概算
  const estimate = useMemo(() => {
    const per100 = parseInt(s0.per100Min, 10) || 60;
    const chg = parseInt(s0.changeoverMin, 10) || 5;
    const lenPct = s0.lenPct || 100;
    const eH = parseInt(endH, 10), eM = parseInt(endM, 10);
    if (!totalActive || isNaN(eH) || isNaN(eM)) return null;
    const slots = Math.ceil(totalActive / 3);
    const matchMin = per100 * (lenPct / 100);
    const remainingSlots = Math.max(1, slots - Math.floor(finished.length / 3));
    const totalMin = remainingSlots * matchMin + Math.max(0, remainingSlots - 1) * chg;
    const nowD = new Date();
    const finishD = new Date(nowD.getTime() + totalMin * 60000);
    const endD = new Date(nowD); endD.setHours(eH, eM, 0, 0);
    const diffMin = Math.round((endD - finishD) / 60000);
    const fmt = (d) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    return { finishLabel: fmt(finishD), fits: diffMin >= 0, diff: Math.abs(diffMin) };
  }, [totalActive, finished.length, endH, endM, s0]);

  const urlFor = (m) => {
    const rt = m.raceTo || [0, 0];
    const url = new URL(B2_URL);
    url.searchParams.set("m", m.id);
    url.searchParams.set("p1", m.names[0]);
    url.searchParams.set("p2", m.names[1]);
    url.searchParams.set("r1", 0);
    url.searchParams.set("r2", 0);
    url.searchParams.set("len", 100);
    url.searchParams.set("t", m.table);
    url.searchParams.set("rt1", rt[0]);
    url.searchParams.set("rt2", rt[1]);
    return url.toString();
  };

  const openAction = (m) => { setOpenMatch(m); setEditRt([m.raceTo[0], m.raceTo[1]]); };
  const closeAction = () => { setOpenMatch(null); setEditRt(null); };

  const applyRaceTo = async () => {
    if (!openMatch || busyAction) return;
    setBusyAction(true);
    await patchMatch(openMatch.id, (m) => ({ ...m, raceTo: [editRt[0], editRt[1]] })).catch(() => {});
    setBusyAction(false);
    closeAction();
    refresh();
  };
  const adjustTimer = async (deltaMin) => {
    if (!openMatch || busyAction) return;
    setBusyAction(true);
    await patchMatch(openMatch.id, (m) => ({ ...m, startedAt: (m.startedAt || Date.now()) + deltaMin * 60000 })).catch(() => {});
    setBusyAction(false);
    refresh();
  };

  return (
    <div style={{ padding: "16px 12px 24px", color: C.ink }}>
      <div style={{ background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: "10px 14px", marginBottom: 10, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        {estimate ? (
          <div onClick={() => setEditingEnd((v) => !v)} style={{ cursor: "pointer", fontSize: 13, fontWeight: 700, color: estimate.fits ? C.win : C.minus }}>
            終了目安 <b style={{ fontSize: 15 }}>{estimate.finishLabel}</b>
            {estimate.fits ? `（余裕${estimate.diff}分）` : `（${estimate.diff}分オーバー）`}
            <span style={{ color: C.sub, marginLeft: 6 }}>✎</span>
          </div>
        ) : (
          <div style={{ fontSize: 13, color: C.sub }}>試合が始まると終了目安を表示します</div>
        )}
        <div style={{ fontSize: 12.5, color: C.sub, fontWeight: 700 }}>終了 {finished.length} / 全{totalActive}試合</div>
      </div>
      {editingEnd && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, justifyContent: "center" }}>
          <span style={{ fontSize: 12.5, color: C.sub }}>終了時刻</span>
          <input inputMode="numeric" value={endH} onChange={(e) => setEndH(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} style={{ width: 50, textAlign: "center", border: `1px solid ${C.line}`, borderRadius: 8, padding: "6px 0", fontSize: 15, fontWeight: 800, fontFamily: FONT }} />
          <span>:</span>
          <input inputMode="numeric" value={endM} onChange={(e) => setEndM(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} style={{ width: 50, textAlign: "center", border: `1px solid ${C.line}`, borderRadius: 8, padding: "6px 0", fontSize: 15, fontWeight: 800, fontFamily: FONT }} />
          <button onClick={() => setEditingEnd(false)} style={{ background: C.ink, color: "#fff", border: "none", borderRadius: 8, padding: "7px 12px", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>OK</button>
        </div>
      )}

      <button onClick={() => setShowBulkAdjust((v) => !v)} style={{ width: "100%", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.ink, fontSize: 13, fontWeight: 700, padding: "9px 0", cursor: "pointer", fontFamily: FONT, marginBottom: showBulkAdjust ? 8 : 16 }}>
        ⚙ 以降の試合をまとめて調整 {showBulkAdjust ? "▲" : "▼"}
      </button>
      {showBulkAdjust && (
        <div style={{ background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, marginBottom: 16 }}>
          <div style={{ fontSize: 12, color: C.sub, marginBottom: 10, lineHeight: 1.6 }}>
            まだ終わっていない対戦すべて（進行中・待機中）に、試合の長さと参加者の持ち時間を一括で反映します。
          </div>

          <div style={{ background: C.lightBlue, border: `1.5px solid ${C.blue}`, borderRadius: 12, padding: 10, marginBottom: 12 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: C.blue, marginBottom: 8 }}>卓ごとの残り（この設定を反映した場合）</div>
            <div style={{ display: "flex", gap: 8 }}>
              {queues.map((q, ti) => {
                const remain = q.length;
                const estMin = remain * bulkMinutes;
                const finishD = new Date(Date.now() + estMin * 60000);
                const fmt = (d) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
                return (
                  <div key={ti} style={{ flex: 1, background: "#fff", borderRadius: 10, padding: "8px 4px", textAlign: "center" }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: C.sub }}>卓{ti + 1}</div>
                    <div style={{ fontSize: 13, color: C.ink }}>{remain}試合</div>
                    <div style={{ fontSize: 17, fontWeight: 800, color: C.ink }}>{remain ? fmt(finishD) : "–"}</div>
                  </div>
                );
              })}
            </div>
          </div>

          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: 12, marginBottom: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
              <span style={{ fontSize: 13, fontWeight: 700 }}>試合の長さ</span>
              <span style={{ fontSize: 16, fontWeight: 800 }}>{bulkLenPct}%</span>
            </div>
            <input type="range" min={40} max={140} step={5} value={bulkLenPct}
              onChange={(e) => setBulkLenPct(+e.target.value)} style={{ width: "100%", accentColor: C.blue }} />
          </div>
          <div style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: C.sub, marginBottom: 6, textAlign: "center" }}>持ち時間（分）</div>
            <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
              <button onClick={() => setBulkMinutes((v) => Math.max(5, v - 5))} style={homeStepBtn}>−</button>
              <div style={{ flex: 1, textAlign: "center", fontSize: 22, fontWeight: 800 }}>{bulkMinutes}</div>
              <button onClick={() => setBulkMinutes((v) => Math.min(120, v + 5))} style={homeStepBtn}>＋</button>
            </div>
          </div>
          <button onClick={applyBulkAdjust} disabled={bulkBusy} style={{ width: "100%", background: bulkBusy ? C.line : C.blue, color: "#fff", border: "none", borderRadius: 10, padding: "11px 0", fontSize: 14, fontWeight: 800, cursor: bulkBusy ? "wait" : "pointer", fontFamily: FONT }}>
            {bulkBusy ? "反映中…" : "未終了の対戦すべてに反映する"}
          </button>
          {bulkMsg && <div style={{ marginTop: 8, textAlign: "center", fontSize: 12.5, fontWeight: 700, color: bulkMsg.ok ? C.win : C.minus }}>{bulkMsg.ok ? "✓ " : "✗ "}{bulkMsg.text}</div>}
        </div>
      )}

      <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
        {[0, 1, 2].map((ti) => (
          <div key={ti} style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", gap: 7 }}>
            <div style={{ textAlign: "center", fontSize: 13, fontWeight: 800, color: C.sub, marginBottom: 2 }}>卓{ti + 1}</div>
            {queues[ti].length === 0 && <EmptySlot label="予定なし" />}
            {queues[ti].map((m, k) => (
              <TimelineCard key={m.id} m={m} current={k === 0} order={k} onOpen={() => openAction(m)} />
            ))}
          </div>
        ))}
      </div>

      {finished.length > 0 && (
        <div style={{ marginTop: 24 }}>
          <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 8 }}>結果（{finished.length}試合）</div>
          <div style={{ maxHeight: 300, overflowY: "auto", border: `1px solid ${C.line}`, borderRadius: 12 }}>
            {finished.map((m) => {
              const names = m.names || ["P1", "P2"];
              const tot = m.tot || [0, 0];
              const rt = m.raceTo || [0, 0];
              const w = m.winner != null ? m.winner : (tot[0] >= rt[0] ? 0 : 1);
              return (
                <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 12px", borderBottom: `1px solid ${C.line}` }}>
                  <span style={{ fontSize: 11, fontWeight: 800, color: C.sub, flexShrink: 0, width: 26 }}>卓{m.table}</span>
                  <span style={{ flex: 1, minWidth: 0, fontSize: 13.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    <b style={{ color: w === 0 ? C.win : C.sub, fontWeight: w === 0 ? 800 : 600 }}>{names[0]}</b>
                    <span style={{ color: C.sub, margin: "0 5px" }}>対</span>
                    <b style={{ color: w === 1 ? C.win : C.sub, fontWeight: w === 1 ? 800 : 600 }}>{names[1]}</b>
                  </span>
                  <span style={{ fontSize: 13.5, fontWeight: 800, fontVariantNumeric: "tabular-nums", flexShrink: 0 }}>
                    <span style={{ color: C.blue }}>{tot[0]}</span>
                    <span style={{ color: C.sub, margin: "0 2px" }}>-</span>
                    <span style={{ color: C.red }}>{tot[1]}</span>
                  </span>
                  <span style={{ fontSize: 10.5, color: C.sub, flexShrink: 0, width: 52, textAlign: "right" }}>{fmtElapsed(m.elapsedMs)}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {openMatch && (
        <div onClick={closeAction} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 24 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", borderRadius: 18, padding: "24px 20px", textAlign: "center", maxWidth: 320, width: "100%" }}>
            <div style={{ fontSize: 16, fontWeight: 800, marginBottom: 12 }}>卓{openMatch.table}：{openMatch.names.join(" 対 ")}</div>
            <img src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(urlFor(openMatch))}`} style={{ width: 200, height: 200, margin: "0 auto" }} />

            <div style={{ marginTop: 18, paddingTop: 16, borderTop: `1px solid ${C.line}` }}>
              <div style={{ fontSize: 12.5, color: C.sub, marginBottom: 8, fontWeight: 700 }}>目標点を編集</div>
              <div style={{ display: "flex", gap: 10, justifyContent: "center", marginBottom: 10 }}>
                {[0, 1].map((i) => (
                  <input key={i} inputMode="numeric" value={editRt ? editRt[i] : ""}
                    onChange={(e) => setEditRt((r) => { const n = [...r]; n[i] = e.target.value.replace(/[^0-9]/g, "").slice(0, 3); return n; })}
                    style={{ width: 64, textAlign: "center", border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px 0", fontSize: 17, fontWeight: 800, fontFamily: FONT, color: i === 0 ? C.blue : C.red }} />
                ))}
              </div>
              <button onClick={applyRaceTo} disabled={busyAction} style={{ width: "100%", background: C.blue, color: "#fff", border: "none", borderRadius: 10, padding: "10px 0", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>この目標点にする</button>
            </div>

            {openMatch.startedAt && (
              <div style={{ marginTop: 16, paddingTop: 16, borderTop: `1px solid ${C.line}` }}>
                <div style={{ fontSize: 12.5, color: C.sub, marginBottom: 8, fontWeight: 700 }}>参加者のタイマーを調整</div>
                <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
                  <button onClick={() => adjustTimer(-5)} disabled={busyAction} style={{ flex: 1, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "10px 0", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>−5分</button>
                  <button onClick={() => adjustTimer(5)} disabled={busyAction} style={{ flex: 1, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "10px 0", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>＋5分</button>
                </div>
              </div>
            )}

            <button onClick={closeAction} style={{ marginTop: 16, width: "100%", background: C.ink, color: "#fff", border: "none", borderRadius: 12, padding: "12px 0", fontSize: 15, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>閉じる</button>
          </div>
        </div>
      )}
    </div>
  );
}
function EmptySlot({ label, small }) {
  return (
    <div style={{ background: C.zone, border: `1px dashed ${C.line}`, borderRadius: 14, padding: small ? "10px 4px" : "20px 4px", textAlign: "center", color: C.sub, fontSize: small ? 11 : 13 }}>
      {label}
    </div>
  );
}
function TimelineCard({ m, current, order, onOpen }) {
  const names = m.names || ["P1", "P2"];
  const raceTo = m.raceTo || [0, 0];
  const tot = m.tot || [0, 0];
  const balls = m.balls || [];
  const live = [balls.filter((b) => b.loc === "p1" && !b.dead).length, balls.filter((b) => b.loc === "p2" && !b.dead).length];
  const disp = current && m.phase === "play" ? [tot[0] + live[0], tot[1] + live[1]] : tot;
  const awaitingCall = current && !m.startedAt;
  const statusLabel = !current ? `${order + 1}戦後` : awaitingCall ? "📣 呼び出してください" : m.phase === "banking" ? "バンキング中" : m.phase === "done" ? "ラック終了" : `第${m.rack}R`;
  const accent = awaitingCall ? C.hill : C.blue;
  return (
    <div onClick={onOpen} style={{
      background: current ? (awaitingCall ? C.hillBg : C.lightBlue) : "#fff",
      border: current ? `3px solid ${accent}` : `1px solid ${C.line}`,
      boxShadow: current ? `0 2px 10px rgba(46,109,181,0.25)` : "none",
      borderRadius: 14, padding: current ? "10px 6px" : "7px 5px", cursor: "pointer",
      opacity: current ? 1 : 0.85,
    }}>
      <div style={{ textAlign: "center", fontSize: current ? 11 : 9.5, color: current ? accent : C.sub, fontWeight: 800, marginBottom: current ? 6 : 4 }}>{statusLabel}</div>
      <div style={{ display: "flex", gap: 4 }}>
        {[0, 1].map((i) => (
          <div key={i} style={{ flex: 1, textAlign: "center", minWidth: 0 }}>
            <div style={{ fontSize: current ? 11.5 : 10.5, fontWeight: 700, color: i === 0 ? C.blue : C.red, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{names[i]}</div>
            <div style={{ fontSize: current ? 22 : 13, fontWeight: 800, color: C.ink }}>
              {current ? (m.phase === "banking" ? "–" : disp[i]) : ""}
              <span style={{ fontSize: current ? 11 : 11, opacity: 0.5 }}>{current ? "/" : ""}{raceTo[i]}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  showCrash(e.message + "\n" + (e.stack || ""));
}
</script>
</body>
</html>
