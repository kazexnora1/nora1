function roundHalfToEven(v) {
  const w = Math.floor(v);
  const d = v - w;
  if (Math.abs(d - 0.5) > 1e-9) return d > 0.5 ? w + 1 : w;
  return w % 2 === 1 ? w + 1 : w;
}
function normalizeRace(rt1, rt2, lowClamp) {
  const highClamp = 99.0;
  const p1IsHigh = rt1 >= rt2;
  const highRace = Math.max(rt1, rt2), lowRace = Math.min(rt1, rt2);
  let highC = highRace > highClamp ? highClamp : highRace;
  let lowC = highRace > highClamp ? lowRace - lowRace * ((highRace - highClamp) / highRace) : lowRace;
  highC = Math.min(lowRace < lowClamp ? highC + highC * ((lowClamp - lowRace) / lowC) : highC, highClamp);
  lowC = Math.max(lowC < lowClamp ? lowClamp : lowC, lowClamp);
  return { rt1: p1IsHigh ? highC : lowC, rt2: p1IsHigh ? lowC : highC };
}
function computeRace(R1, R2, lenPct) {
  const dampFactor = lenPct / 100;
  const avg = (R1 + R2) / 2;
  const gp = 0.018 * avg - 1.4;
  const delta = R1 - R2;
  const p1 = 1 - 1 / (1 + Math.pow(2, delta / 100));
  const p2 = 1 - p1;
  const p1AvgPts = p1 * 14.0 + p2 * (7.4 - 0.0062 * R2);
  const p2AvgPts = p2 * 14.0 + p1 * (7.4 - 0.0062 * R1);
  const rt1raw = p1AvgPts * gp * dampFactor;
  const rt2raw = p2AvgPts * gp * dampFactor;
  const lowClamp = 0.16 * lenPct + 12;
  const norm = normalizeRace(rt1raw, rt2raw, lowClamp);
  return { rt1: roundHalfToEven(norm.rt1), rt2: roundHalfToEven(norm.rt2), p1, p2 };

function getQueueForTable(matches, tableNum) {

  for (const id in matches) {
    const m = matches[id];
    if (!m || Number(m.table) !== tableNum) continue;
    if (!m.updatedAt || Date.now() - m.updatedAt > STALE_MS) continue;

// 指定の終了予定時刻に収める試合の長さ・持ち時間を逆算する
function computeTableAdjustment(queueForTable, eH, eM, per100) {
  const cur = queueForTable[0];
  const curStarted = !!(cur && cur.startedAt);
  // 先頭が未開始（呼び出し中）なら、それも調整対象に含める。開始済みの試合だけは設定が確定しているので触らない

  if (!future.length) return null;
  const targetD = new Date(); targetD.setHours(eH, eM, 0, 0);
  const availableMin = (targetD - Date.now()) / 60000;
  if (availableMin <= 0) return { error: "すでにその時刻を過ぎています" };
  let curRemainMin = 0;
  if (curStarted && cur.matchMinutes) {

    curRemainMin = Math.max(0, cur.matchMinutes - elapsed);

  const availableForFuture = availableMin - curRemainMin;
  if (availableForFuture <= 0) return { error: "現在の対戦の残り時間だけで、指定時刻を超えています" };

  const rawPct = Math.round((perMatchMin / per100) * 100 / 5) * 5;
  const hitFloor = rawPct < 40;

function buildStandings(matches, roster) {

function buildDetailedStandings(matches, roster) {
  const base = buildStandings(matches, roster);
  const list = Object.values(matches || {})
    .filter((m) => m && Array.isArray(m.names))
    .map((m) => ({ ...m }));
  list.sort((a, b) => (a.slot != null && b.slot != null ? a.slot - b.slot : (a.createdAt || 0) - (b.createdAt || 0)));

  const byName = {};
  base.forEach((r) => { byName[r.name] = { ...r, games: [] }; });

  list.forEach((m) => {
    const names = m.names || [];
    const finished = isMatchFinished(m);
    const w = finished ? matchWinnerIndex(m) : null; // null: 未終了 or 両者負け
    [0, 1].forEach((i) => {
      const name = names[i];
      if (!name || !byName[name]) return;
      const opponent = names[1 - i] || "";
      if (!finished) {
        byName[name].games.push({ opponent, display: "", pending: true });
      } else if (i === w) {
        byName[name].games.push({ opponent, display: "W", isWin: true });
      } else {
        const tot = m.tot || [0, 0];
        const rt = m.raceTo || [0, 0];
        const rate = rt[i] > 0 ? Math.min(1, (tot[i] || 0) / rt[i]) : 0;

        fillScrollRef.current.scrollTo({ top: fillTargetRef.current.offsetTop, behavior: "auto" });
      }
    }, 30);
    return () => clearTimeout(t);
  }, [fillMode, pcPlayerView]);

  const _idsOf = (rs) => rs.map((p) => p.id || 0);
  const refreshRoster = async () => {
    // 失敗は握り潰さない。握り潰すと「空のまま読み込み完了」になり、空リストで上書きしてしまう
    const r = await readAll();
    if (r.roster.length) {
      _id = Math.max(..._idsOf(r.roster)) + 1;
      backupRoster(r.roster);
    }
    setRoster(r.roster);
    setRosterLoaded(true);
    setRosterError(null);
  };

  useEffect(() => {
    (async () => {
      try { await refreshRoster(); }
      catch (e) { setRosterError(String(e && e.message ? e.message : e)); }
    })();
  }, []);

  const tabs = [
    ["home", "🗓 タイムライン"],
    ["tables", "🖥 テーブル"],
    ["player", "🧑‍🤝‍🧑 プレイヤー"],
    ["settings", "⚙️ 設定"],
  ];

  const tabBarJsx = (
    <div className="no-print" style={{ display: "flex", borderBottom: `1px solid ${C.line}`, background: "#fff", flexShrink: 0 }}>
      <div style={{ display: "flex", width: "100%", maxWidth: 820, margin: "0 auto" }}>
        {tabs.map(([key, label]) => (
          <button key={key} onClick={() => setTab(key)}
            style={{ flex: 1, padding: "13px 2px", background: "none", border: "none", fontSize: "clamp(10.5px, 3.6vw, 15px)", whiteSpace: "nowrap", fontWeight: tab === key ? 800 : 600, color: tab === key ? C.blue : C.sub, cursor: "pointer", fontFamily: FONT }}>
            {label}
          </button>
        ))}
      </div>
    </div>
  );

  const playerContent = isPc ? (
    roundRobin ? (
      fillMode ? (
        <div ref={fillScrollRef} style={{ height: "100%", overflowY: "auto", background: C.bg, fontFamily: FONT }}>
          {tabBarJsx}
          <div style={{ display: "flex", gap: 8, padding: "12px 20px 0", maxWidth: 1600, margin: "0 auto" }}>
            <button onClick={() => setPcPlayerView("matrix")} style={{
              background: pcPlayerView === "matrix" ? C.blue : "#fff", color: pcPlayerView === "matrix" ? "#fff" : C.ink,
              border: `1.5px solid ${C.blue}`, borderRadius: 10, padding: "8px 16px", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT,
            }}>対戦表（総当たり）</button>
            <button onClick={() => setPcPlayerView("standings")} style={{
              background: pcPlayerView === "standings" ? C.blue : "#fff", color: pcPlayerView === "standings" ? "#fff" : C.ink,
              border: `1.5px solid ${C.blue}`, borderRadius: 10, padding: "8px 16px", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT,
            }}>個人成績</button>
          </div>
          <div ref={fillTargetRef} style={{ height: "100vh", boxSizing: "border-box", padding: "12px 20px 20px", maxWidth: 1600, margin: "0 auto" }}>
            {pcPlayerView === "matrix" ? <RoundRobinMatrix fill /> : <PcStandingsTab />}
          </div>
        </div>
      ) : null
    ) : (
      <div style={{ height: "100%" }}><PcStandingsTab /></div>
    )
  ) : (
    <div style={{ height: "100%", overflowY: "auto" }}>
      {roundRobin && (
        <div style={{ padding: "16px 12px 0" }}>
          <div style={{ fontSize: 14.5, fontWeight: 800, color: C.ink, marginBottom: 8 }}>対戦表（総当たり）</div>
          <RoundRobinMatrix compact />
        </div>
      )}
      <StandingsTab />
    </div>
  );

  if (fillMode) {
    return playerContent;
  }

  return (
    <div style={{ height: "100%", background: C.bg, fontFamily: FONT, display: "flex", flexDirection: "column" }}>
      {tabBarJsx}
      <div className="print-fit" style={{ flex: 1, minHeight: 0, overflowY: (tab === "home" || tab === "player") ? "hidden" : "auto" }}>
        <div style={{ maxWidth: (tab === "home" || tab === "player") && isPc ? 1600 : 820, margin: "0 auto", height: (tab === "home" || tab === "player") ? "100%" : "auto" }}>
          {tab === "home" && (isPc ? <PcMatchGridTab simple={roundRobin} /> : <HomeTab />)}
          {tab === "tables" && <LiveTablesTab />}
          {tab === "player" && playerContent}
          {tab === "settings" && (
            <SettingsTab roster={roster} setRoster={setRoster} onRefresh={refreshRoster} loaded={rosterLoaded} loadError={rosterError}
              deviceMode={deviceMode} onSetDeviceMode={(m) => { setDeviceMode(m); saveSettings({ deviceMode: m }); }}
              roundRobin={roundRobin} onSetRoundRobin={(v) => { setRoundRobin(v); saveSettings({ roundRobinMode: v }); }} />
          )}
        </div>
      </div>
    </div>
  );
}

const menuBtn = {
  width: "100%", background: "#fff", border: `1.5px solid ${C.line}`, borderRadius: 12,
  padding: "13px 10px", fontSize: 14.5, fontWeight: 800, color: C.ink, cursor: "pointer", fontFamily: FONT, textAlign: "center",
};

/* ========= スマホ操作用タイムラインのカード =========
   選手名は横書きのまま上下2段に並べる（B2の対戦表と同じ形）。
   横並びだと3列レイアウトでは名前が見切れるため、1人ぶんの幅をカード全体に使い、
   同じ行の右側にスコアと目標点を置く */
const TL_CARD_H = 128; // 空きカードとも高さを揃える。中身が入りきる高さにする（呼び出し中は枠が太いぶん背が高くなる）

function TimelineSlotCard({ m, st, refereeEnabled, onEditReferee }) {
  const names = m.names || ["", ""];
  const tot = m.tot || [0, 0];
  const rt = m.raceTo || [0, 0];
  const w = st === "done" ? matchWinnerIndex(m) : null;

  // 試合中の進行バー用：残り時間だけは時間経過そのものでも変わるので、定期的に再描画する
  const [, forceTick] = useState(0);
  useEffect(() => {
    if (st !== "live") return;
    const iv = setInterval(() => forceTick((t) => t + 1), 15000);
    return () => clearInterval(iv);
  }, [st]);
  const scoreProgress = rt[0] > 0 && rt[1] > 0 ? Math.max(tot[0] / rt[0], tot[1] / rt[1]) : 0;
  let timeProgress = 0;
  if (m.startedAt && m.deadline && !m.finishedAt) {
    const totalMs = m.deadline - m.startedAt;
    const remainMs = m.deadline - Date.now();
    timeProgress = totalMs > 0 ? Math.min(1, Math.max(0, 1 - remainMs / totalMs)) : 1;
  }
  const finishProgress = Math.max(scoreProgress, timeProgress);
  const remainMin = m.deadline ? Math.max(0, (m.deadline - Date.now()) / 60000) : null;
  // 片方でもヒル（目標まで14点以内）、または残り3分を切ったら「そろそろ終わる」の赤にする
  const oneHill = rt[0] > 0 && rt[1] > 0 && ((rt[0] - tot[0] <= 14) || (rt[1] - tot[1] <= 14));
  const urgent = oneHill || (remainMin != null && remainMin <= 3);
  const finishColor = urgent ? C.minus : finishProgress > 0.6 ? C.hill : C.win;

  // カードを押すと操作メニューが開く（スコア修正／終了にする／試合を無かったことにする）。
  // 誤タップでいきなり値が変わらないよう、必ずメニューを経由させている
  const [menu, setMenu] = useState(null); // null | "menu" | "score" | "finish"
  const [draft, setDraft] = useState(["", ""]);
  const [saving, setSaving] = useState(false);

  const openScore = () => { setDraft([String(tot[0]), String(tot[1])]); setMenu("score"); };
  const saveEdit = async () => {
    const v0 = Math.max(0, Math.min(999, parseInt(draft[0], 10) || 0));
    const v1 = Math.max(0, Math.min(999, parseInt(draft[1], 10) || 0));
    const newTot = [v0, v1];
    const newWinner = recomputeWinner(rt, newTot, m.hist);
    setSaving(true);
    try {
      await dbUpdate("matches/" + m.id, {
        tot: newTot, winner: newWinner, version: (m.version || 1) + 1, updatedAt: Date.now(),
      });
      setMenu(null);
    } catch {}
    setSaving(false);
  };
  // 勝者を決めてその場で終了にする。点数が目標に届いていなくても、この指定が優先される
  const finishAs = async (winner, bothLose) => {
    setSaving(true);
    try {
      await dbUpdate("matches/" + m.id, {
        winner, bothLose: !!bothLose, finishedAt: Date.now(),
        version: (m.version || 1) + 1, updatedAt: Date.now(),
      });
      setMenu(null);
    } catch {}
    setSaving(false);
  };
  // 終了を取り消して試合中に戻す。点数が目標に達している場合は、先にスコアを直す必要がある
  const reopen = async () => {
    setSaving(true);
    try {
      await dbUpdate("matches/" + m.id, {
        winner: null, bothLose: false, finishedAt: null,
        version: (m.version || 1) + 1, updatedAt: Date.now(),
      });
      setMenu(null);
    } catch {}
    setSaving(false);
  };
  // 試合そのものを消す。タイムラインからも成績からも消え、元には戻せない
  const removeMatch = async () => {
    if (!window.confirm(`T${m.table}　${names[0]} 対 ${names[1]}\nこの試合を削除します。元に戻せません。よろしいですか？`)) return;
    setSaving(true);
    try { await dbSet("matches/" + m.id, null); } catch {}
    setSaving(false);
  };

  const style =
    st === "done"
      ? (m.bothLose
          ? { bg: "#fff", border: C.line, badgeBg: C.hillBg, badgeCol: C.hill, badge: "両者負け" }
          : { bg: "#fff", border: C.line, badgeBg: C.zone, badgeCol: C.sub, badge: "試合終了" })
      : st === "live"
      ? { bg: C.lightBlue, border: C.blue, badgeBg: C.blue, badgeCol: "#fff", badge: "試合中" }
      : st === "call"
      ? { bg: "#fff", border: C.blue, badgeBg: "#fff", badgeCol: C.blue, badge: "呼び出し中" }
      : { bg: C.zone, border: C.line, badgeBg: "transparent", badgeCol: C.sub, badge: "待機中" };

  // 終了した試合は勝敗だけを出す。点数は大小で勝敗が決まるわけではないので出さない
  const won = (i) => !m.bothLose && w === i;
  const clickable = true; // どの状態のカードからも操作メニューを開ける
  const handleClick = () => setMenu("menu");

  return (
    <div onClick={clickable ? handleClick : undefined} style={{
      position: "relative", height: TL_CARD_H, boxSizing: "border-box", background: style.bg,
      border: `${st === "live" || st === "call" ? 2 : 1}px solid ${style.border}`, borderRadius: 12,
      padding: "8px 5px", display: "flex", flexDirection: "column", justifyContent: "space-between",
      overflow: "hidden", opacity: st === "queued" && !menu ? 0.7 : 1, cursor: clickable ? "pointer" : "default",
    }}>
      {refereeEnabled && (st === "call" || st === "live") && (
        <button onClick={(e) => { e.stopPropagation(); onEditReferee && onEditReferee(m); }} style={{
          position: "absolute", top: 3, right: 3, zIndex: 2, background: "rgba(255,255,255,0.9)",
          border: `1px solid ${C.line}`, borderRadius: 20, width: 22, height: 22, fontSize: 12,
          display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", padding: 0,
        }} title={m.referee ? `スコアラー：${m.referee}` : "スコアラーを選ぶ"}>📱</button>
      )}
      {/* 1: バッジ */}
      <div style={{ textAlign: "center" }}>
        <span style={{
          display: "inline-block", background: style.badgeBg, color: style.badgeCol,
          border: st === "call" ? `1.5px solid ${C.blue}` : "none",
          borderRadius: 12, padding: "3px 10px", fontSize: 13.5, fontWeight: 800, whiteSpace: "nowrap",
        }}>{style.badge}</span>
      </div>

      {/* 2: 選手（名前は横書きのまま上下2段。スコアと目標点は出さず、名前だけを大きく見せる。
             スコアはカードをタップ→「✏️ スコアを修正する」で確認・修正できる） */}
      <div style={{ display: "flex", flexDirection: "column", gap: 4, padding: "0 4px" }}>
        {[0, 1].map((i) => (
          <div key={i} style={{
            textAlign: "left", fontSize: 16.5, fontWeight: won(i) ? 900 : 700,
            color: st === "done" ? (won(i) ? C.win : C.sub) : (i === 0 ? C.blue : C.red),
            whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", lineHeight: 1.25,
          }}>{names[i]}</div>
        ))}
      </div>

      {/* 3: この試合の設定（試合の長さ％と持ち時間）。卓見出しと同じ書き方に揃える */}
      <div style={{
        textAlign: "center", fontSize: 11.5, fontWeight: 700, color: C.sub, flexShrink: 0,
        whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", lineHeight: 1.3,
      }}>🎱{m.lenPct || 100}% ⏰{m.matchMinutes || 30}分</div>

      {/* 4: 中央揃えでヒント（終了=✏️）かステータスバー（試合中） */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: 14, flexShrink: 0 }}>
        {st === "done" && <span style={{ fontSize: 12, opacity: 0.6 }}>✏️</span>}
        {st === "live" && (
          <div style={{ width: "100%", height: 5, background: "rgba(0,0,0,0.1)", borderRadius: 3, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${Math.round(finishProgress * 100)}%`, background: finishColor, borderRadius: 3, transition: "width 400ms ease" }} />
          </div>
        )}
      </div>

      {menu && (
        <div onClick={(e) => { e.stopPropagation(); setMenu(null); }} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 22 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", borderRadius: 18, padding: "20px 18px", maxWidth: 340, width: "100%", maxHeight: "85vh", overflowY: "auto" }}>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: C.sub, textAlign: "center" }}>T{m.table}・{style.badge}</div>
            <div style={{ fontSize: 16.5, fontWeight: 900, textAlign: "center", margin: "4px 0 16px", lineHeight: 1.4 }}>
              <span style={{ color: C.blue }}>{names[0]}</span>
              <span style={{ color: C.sub, fontSize: 13, margin: "0 6px" }}>対</span>
              <span style={{ color: C.red }}>{names[1]}</span>
            </div>

            {menu === "menu" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <button onClick={openScore} style={menuBtn}>✏️ スコアを修正する</button>
                {st !== "done" && <button onClick={() => setMenu("finish")} style={menuBtn}>🏁 この試合を終了にする</button>}
                {st === "done" && <button onClick={reopen} disabled={saving} style={menuBtn}>↩︎ 終了を取り消して試合中に戻す</button>}
                <button onClick={removeMatch} disabled={saving} style={{ ...menuBtn, color: C.minus, borderColor: C.minus }}>🗑 この試合を無かったことにする</button>
                <button onClick={() => setMenu(null)} style={{ ...menuBtn, background: C.zone, fontWeight: 700 }}>閉じる</button>
              </div>
            )}

            {menu === "finish" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <div style={{ fontSize: 12.5, color: C.sub, textAlign: "center", marginBottom: 2 }}>結果を選ぶと、その時点で試合終了になります</div>
                <button onClick={() => finishAs(0, false)} disabled={saving} style={{ ...menuBtn, borderColor: C.blue, color: C.blue }}>🏆 {names[0]} の勝ちで終了</button>
                <button onClick={() => finishAs(1, false)} disabled={saving} style={{ ...menuBtn, borderColor: C.red, color: C.red }}>🏆 {names[1]} の勝ちで終了</button>
                <button onClick={() => finishAs(null, true)} disabled={saving} style={{ ...menuBtn, borderColor: C.hill, color: C.hill }}>⏱ 両者負けで終了（時間切れ）</button>
                <button onClick={() => setMenu("menu")} style={{ ...menuBtn, background: C.zone, fontWeight: 700 }}>もどる</button>
              </div>
            )}

            {menu === "score" && (
              <>
                <div style={{ display: "flex", gap: 12, marginBottom: 6 }}>
                  {[0, 1].map((i) => (
                    <div key={i} style={{ flex: 1 }}>
                      <div style={{ fontSize: 12.5, fontWeight: 700, color: i === 0 ? C.blue : C.red, marginBottom: 6, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{names[i]}</div>
                      <input
                        type="text" inputMode="numeric" value={draft[i]} autoFocus={i === 0}
                        onChange={(e) => {
                          const v = e.target.value.replace(/[^0-9]/g, "").slice(0, 3);
                          setDraft((arr) => (i === 0 ? [v, arr[1]] : [arr[0], v]));
                        }}
                        style={{ width: "100%", boxSizing: "border-box", textAlign: "center", border: `1.5px solid ${C.line}`, borderRadius: 10, padding: "10px 0", fontSize: 22, fontWeight: 800, color: C.ink, outline: "none", fontFamily: FONT }}
                      />
                      <div style={{ fontSize: 12, color: C.sub, marginTop: 4 }}>目標 {rt[i]}</div>
                    </div>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
                  <button onClick={() => setMenu("menu")} style={{ flex: 1, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 0", fontSize: 14.5, fontWeight: 700, color: C.ink, cursor: "pointer", fontFamily: FONT }}>もどる</button>
                  <button onClick={saveEdit} disabled={saving} style={{ flex: 1, background: C.blue, border: "none", borderRadius: 12, padding: "12px 0", fontSize: 14.5, fontWeight: 800, color: "#fff", cursor: "pointer", fontFamily: FONT }}>{saving ? "保存中…" : "保存"}</button>
                </div>
                <div style={{ fontSize: 11.5, color: C.sub, marginTop: 10, lineHeight: 1.6 }}>
                  目標点に達していれば終了、届かなければ試合中に戻ります。
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ========= 成績タブ：勝ち数→負け試合の達成率平均の順に並べる ========= */
function StandingsTab() {
  const [rows, setRows] = useState([]);
  const [err, setErr] = useState(null);

  useEffect(() => dbSubscribe("/",
    (rec) => { const r = normalizeRecord(rec); setRows(buildStandings(r.matches, r.roster)); setErr(null); },
    (e) => setErr(e)), []);

  return (
    <div style={{ padding: "16px 12px 32px", color: C.ink }}>
      <div style={{ display: "grid", gridTemplateColumns: "38px 1fr 48px 48px 76px", gap: 6, padding: "0 12px 8px", fontSize: 14.5, color: C.sub, fontWeight: 800 }}>
        <div>順</div><div>選手</div><div style={{ textAlign: "center" }}>勝</div><div style={{ textAlign: "center" }}>敗</div><div style={{ textAlign: "right" }}>達成率</div>
      </div>
      {rows.length === 0 && <div style={{ textAlign: "center", fontSize: 15, color: C.sub, padding: "28px 0" }}>まだ結果がありません</div>}
      {rows.map((r) => {
        const top = r.rank <= 8 && r.played > 0;
        return (
          <div key={r.name} style={{
            display: "grid", gridTemplateColumns: "38px 1fr 48px 48px 76px", gap: 6, alignItems: "center",
            background: top ? C.lightBlue : "#fff", border: `1.5px solid ${top ? C.blue : C.line}`,
            borderRadius: 12, padding: "15px 12px", marginBottom: 8,
          }}>
            <div style={{ fontSize: 21, fontWeight: 900, color: top ? C.blue : C.sub }}>{r.rank}</div>
            <div style={{ fontSize: 21, fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.name}</div>
            <div style={{ textAlign: "center", fontSize: 25, fontWeight: 900, color: C.win }}>{r.win}</div>
            <div style={{ textAlign: "center", fontSize: 25, fontWeight: 800, color: C.sub }}>{r.loss}</div>
            <div style={{ textAlign: "right", fontSize: 19, fontWeight: 800, fontVariantNumeric: "tabular-nums", color: C.ink }}>{fmtRate(r.avgRate)}</div>
          </div>
        );
      })}
      <div style={{ fontSize: 13.5, color: C.sub, marginTop: 16, lineHeight: 1.7 }}>
        並び順：勝ち数 → 負け試合の達成率（取得点÷目標点）の平均 → 得失点差。全勝の選手は達成率「–」で最上位に並びます。
      </div>
      {err && <div style={{ textAlign: "center", fontSize: 12, color: C.minus, marginTop: 12 }}>同期エラー: {err}</div>}
    </div>
  );
}

/* ========= 総当たり表：a×bの正方マトリクス。行＝自分、列＝相手。セルはその視点でのスコア（勝ちは色付け）。
   単体でも他タブに埋め込んでも使えるよう、自前でデータ購読する ========= */
function RoundRobinMatrix({ compact, fill }) {
  const [matches, setMatches] = useState({});
  const [roster, setRoster] = useState([]);
  const [err, setErr] = useState(null);

  useEffect(() => dbSubscribe("matches",
    (m) => { setMatches(m || {}); setErr(null); },
    (e) => setErr(e)), []);
  useEffect(() => dbSubscribe("roster",
    (r) => setRoster(Array.isArray(r) ? r : []),
    () => {}), []);

  const matrix = useMemo(() => {
    const all = Object.values(matches || {}).filter((m) => m && !m.bracket).map((m) => normalizeMatch(m));
    const names = [];
    const seen = new Set();
    roster.forEach((p) => {
      if (p && p.name && !seen.has(p.name) && all.some((m) => (m.names || []).includes(p.name))) {
        names.push(p.name); seen.add(p.name);
      }
    });
    all.forEach((m) => (m.names || []).forEach((n) => { if (n && !seen.has(n)) { names.push(n); seen.add(n); } }));
    const idx = new Map(names.map((n, i) => [n, i]));
    const grid = names.map(() => names.map(() => null));
    all.forEach((m) => {
      const [n1, n2] = m.names || [];
      if (idx.has(n1) && idx.has(n2)) {
        const i = idx.get(n1), j = idx.get(n2);
        grid[i][j] = { m, mine: 0 };
        grid[j][i] = { m, mine: 1 };
      }
    });
    return { names, grid };
  }, [matches, roster]);

  const cellH = compact ? 30 : 40;
  const cellFont = compact ? 12 : 16;
  const headFont = compact ? 11 : 13;

  if (matrix.names.length === 0) {
    return <div style={{ color: C.sub, fontSize: 14, textAlign: "center", padding: "20px 0" }}>対戦がまだ登録されていません</div>;
  }

  return (
    <div style={{ overflowX: "auto", height: fill ? "100%" : "auto", boxSizing: "border-box" }}>
      {err && <div style={{ color: C.minus, fontSize: 12, marginBottom: 6 }}>同期エラー: {err}</div>}
      <div style={{
        display: "grid", height: fill ? "100%" : "auto",
        gridTemplateColumns: `${compact ? 60 : 84}px repeat(${matrix.names.length}, minmax(${compact ? 44 : 64}px, 1fr))`,
        gridTemplateRows: fill ? `${compact ? 28 : 34}px repeat(${matrix.names.length}, 1fr)` : undefined,
        border: `1px solid ${C.line}`, boxSizing: "border-box",
      }}>
        <div style={{ border: `1px solid ${C.line}`, background: "#fafafa" }} />
        {matrix.names.map((n, j) => (
          <div key={"h" + j} style={{ border: `1px solid ${C.line}`, background: "#fafafa", display: "flex", alignItems: "center", justifyContent: "center", fontSize: headFont, fontWeight: 800, color: C.sub, padding: "5px 2px", textAlign: "center", wordBreak: "break-all" }}>
            {n}
          </div>
        ))}
        {matrix.names.map((rowName, i) => (
          <React.Fragment key={"r" + i}>
            <div style={{ border: `1px solid ${C.line}`, background: "#fafafa", display: "flex", alignItems: "center", justifyContent: "center", fontSize: headFont, fontWeight: 800, color: C.sub, padding: "5px 4px", textAlign: "center", wordBreak: "break-all" }}>
              {rowName}
            </div>
            {matrix.names.map((colName, j) => {
              if (i === j) {
                return <div key={"c" + j} style={{ border: `1px solid ${C.line}`, background: "#EEF0F2" }} />;
              }
              const cell = matrix.grid[i][j];
              if (!cell) {
                return <div key={"c" + j} style={{ border: `1px solid ${C.line}`, background: "#fff" }} />;
              }
              const { m, mine } = cell;
              const done = isMatchFinished(m);
              const live = !done && !!m.startedAt;
              const bg = done ? "#DADDE1" : live ? "#FFF3B0" : "#fff";
              const tot = m.tot || [0, 0];
              const w = done ? matchWinnerIndex(m) : null;
              const win = w != null && w === mine;
              return (
                <div key={"c" + j} style={{ border: `1px solid ${C.line}`, background: bg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: cellFont, fontWeight: win ? 900 : 600, color: win ? C.win : C.ink, minHeight: fill ? 0 : cellH }}>
                  {done ? `${tot[mine]}-${tot[1 - mine]}` : live ? "●" : ""}
                </div>
              );
            })}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

/* ========= PC対戦表タブ：列＝卓、行＝コマ（下に行くほど後の試合）。
   1試合＝1カードで、対戦相手を上下に並べる。行は 1fr なので、コマ数が変わっても常に1画面に収まる。
   開きっぱなしで見せる用の表示なので、カードの操作はスマホ操作用のタイムライン側で行う ========= */
function PcMatchCard({ m, st }) {
  const names = m.names || ["", ""];
  const tot = m.tot || [0, 0];
  const rt = m.raceTo || [0, 0];
  const w = st === "done" ? matchWinnerIndex(m) : null;

  const box =
    st === "done" ? { background: "#EFF1F3", border: `1px solid ${C.line}` }
    : st === "live" ? { background: "#FFF8D6", border: "2px solid #D8B54A" }
    : st === "call" ? { background: "#fff", border: `2px solid ${C.blue}` }
    : { background: "#fff", border: `1px solid ${C.line}` };
  const divider = st === "live" ? "#D8B54A" : C.line;

  const nameColor = (i) =>
    st === "done" ? (w === i ? C.win : C.sub) : st === "queued" ? C.sub : C.ink;

  return (
    <div style={{
      ...box, borderRadius: 12, display: "flex", alignItems: "stretch", overflow: "hidden",
      minHeight: 0, position: "relative",
    }}>
      <div style={{
        flex: "0 0 46px", display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: 14, fontWeight: 900, color: C.sub, borderRight: `1px solid ${divider}`,
      }}>T{m.table}</div>

      <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", justifyContent: "center", padding: "4px 12px", gap: 2 }}>
        {[0, 1].map((i) => (
          <div key={i} style={{ display: "flex", alignItems: "baseline", gap: 8, minWidth: 0 }}>
            <span style={{
              flex: 1, minWidth: 0, fontSize: 18, fontWeight: w === i ? 900 : 700, color: nameColor(i),
              whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
            }}>{names[i]}</span>
            {st === "done" || st === "live" ? (
              <span style={{
                fontSize: 21, fontWeight: 900, fontVariantNumeric: "tabular-nums",
                color: st === "done" ? (w === i ? C.win : C.sub) : C.ink,
              }}>{tot[i]}</span>
            ) : (
              <span style={{ fontSize: 19, fontWeight: 800, color: C.sub }}>–</span>
            )}
            <span style={{ fontSize: 13, fontWeight: 700, color: C.sub, fontVariantNumeric: "tabular-nums", minWidth: 30, textAlign: "right" }}>/{rt[i]}</span>
          </div>
        ))}
      </div>

      {st === "done" && m.bothLose && (
        <div style={{ position: "absolute", bottom: 2, right: 8, fontSize: 10.5, fontWeight: 800, color: C.hill, whiteSpace: "nowrap" }}>両者負け</div>
      )}
    </div>
  );
}

        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, flexShrink: 0 }}>
          <button onClick={() => setView("prelim")} style={{
            background: view === "prelim" ? C.blue : "#fff", color: view === "prelim" ? "#fff" : C.ink,
            border: `1.5px solid ${C.blue}`, borderRadius: 10, padding: "8px 16px", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT,
          }}>予選（表）</button>
          <button onClick={() => setView("bracket")} disabled={!hasBracket} style={{
            background: view === "bracket" ? C.blue : "#fff", color: !hasBracket ? C.line : view === "bracket" ? "#fff" : C.ink,
            border: `1.5px solid ${!hasBracket ? C.line : C.blue}`, borderRadius: 10, padding: "8px 16px", fontSize: 14, fontWeight: 800,
            cursor: hasBracket ? "pointer" : "default", fontFamily: FONT,
          }}>🏆 決勝トーナメント{!hasBracket ? "（未登録）" : ""}</button>
        </div>
      )}

      {effectiveView === "prelim" ? (
        <div style={{
          flex: 1, minHeight: 0, display: "grid",
          gridTemplateColumns: "22px repeat(3, 1fr)",
          gridTemplateRows: `repeat(${rowCount}, 1fr)`,
          columnGap: 10, rowGap: 8,
        }}>
          {Array.from({ length: rowCount }, (_, s) => (
            <React.Fragment key={s}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 800, color: C.sub }}>{s + 1}</div>
              {[0, 1, 2].map((ti) => {
                const e = cols[ti][s];
                if (!e) {
                  return (
                    <div key={ti} style={{
                      background: C.zone, border: `1px dashed ${C.line}`, borderRadius: 12,
                      display: "flex", alignItems: "center", justifyContent: "center", color: C.sub, fontSize: 13, minHeight: 0,
                    }}>空き</div>
                  );
                }
                return <PcMatchCard key={ti} m={e.m} st={e.st} />;
              })}
            </React.Fragment>
          ))}
          {rowCount === 1 && cols.every((c) => c.length === 0) && (
            <div style={{ gridColumn: "1 / -1", display: "flex", alignItems: "center", justifyContent: "center", color: C.sub, fontSize: 16 }}>
              対戦がまだ登録されていません

      ) : (
        <div style={{ flex: 1, minHeight: 0, overflowY: "auto", display: "flex", gap: 18 }}>
          {Array.from({ length: bracketTotal }, (_, ri) => ri + 1).map((r) => {
            const ms = bracketMatchesForRound(matches, r);
            if (ms.length === 0) return null;
            return (
              <div key={r} style={{ flex: 1, minWidth: 200, display: "flex", flexDirection: "column", justifyContent: "space-around" }}>
                <div style={{ textAlign: "center", fontSize: 16, fontWeight: 900, color: C.blue, marginBottom: 10 }}>{roundLabel(r)}</div>

                  const w = done ? matchWinnerIndex(m) : null;

                    <div key={m.id} style={{ background: "#fff", border: `1.5px solid ${C.line}`, borderRadius: 10, padding: "10px 12px", marginBottom: 14 }}>
                      {[0, 1].map((i) => (
                        <div key={i} style={{ fontSize: 18, fontWeight: w === i ? 900 : 600, color: w === i ? C.win : w == null ? C.ink : C.sub, textAlign: "center", padding: "3px 0" }}>

                        </div>
                      ))}
                    </div>
                  );
                })}
              </div>
            );
          })}
          {!hasBracket && <div style={{ margin: "auto", color: C.sub, fontSize: 16 }}>決勝トーナメントはまだ登録されていません</div>}
        </div>
      )}
    </div>
  );
}

/* ========= 決勝トーナメント（4人 or 8人の抽選ブラケット。予選と同じハンデ・試合の長さで組む） ========= */
function BracketTab({ roster }) {
  const s0 = useMemo(() => loadSettings(), []);
  const [size, setSize] = useState(s0.bracketSize === 4 ? 4 : 8);
  const [slotIdx, setSlotIdx] = useState(() => Array.from({ length: 8 }, () => 0));
  const [lenPct, setLenPct] = useState(100);
  const [registering, setRegistering] = useState(false);
  const [msg, setMsg] = useState(null);
  const [matches, setMatches] = useState({});

  useEffect(() => dbSubscribe("matches", (m) => setMatches(m || {}), () => {}), []);
  useEffect(() => { saveSettings({ bracketSize: size }); }, [size]);

  const bracketMatches = useMemo(() => getBracketMatches(matches), [matches]);
  const totalRounds = bracketTotalRounds(size);
  const started = bracketMatches.length > 0;

  const winnerInfo = (m) => {
    const w = matchWinnerIndex(m);
    if (w == null) return null;
    return { name: m.names[w], r: w === 0 ? (m.r1 || 0) : (m.r2 || 0) };
  };

  // 4人の時はT1・T2だけ使う。空いている（未終了の対戦を持たない）卓を優先し、
  // 一度に複数試合を組む時は割り当てるごとに数を数えて偏らないようにする
  const allowedTables = size === 4 ? [1, 2] : [1, 2, 3];
  const assignTables = (count) => {
    const pending = {};
    allowedTables.forEach((t) => { pending[t] = 0; });
    Object.values(matches || {}).forEach((m) => {
      if (!m) return;
      const t = Number(m.table);
      if (!(t in pending)) return;
      if (!isMatchFinished(m)) pending[t]++;
    });
    const result = [];
    for (let i = 0; i < count; i++) {
      let best = allowedTables[0];
      allowedTables.forEach((t) => { if (pending[t] < pending[best]) best = t; });
      result.push(best);
      pending[best]++;
    }
    return result;
  };

  const registerRound1 = async () => {
    if (registering) return;
    const names = slotIdx.slice(0, size).map((idx) => roster[idx]).filter(Boolean);
    if (names.length < size) { setMsg({ ok: false, text: "全ての枠に選手を割り当ててください" }); return; }
    if (!window.confirm(`決勝トーナメント（${size}人）の1回戦、${size / 2}試合を登録します。よろしいですか？`)) return;
    setRegistering(true);
    try {
      const now = Date.now();
      const next = {};
      const tables = assignTables(size / 2);
      for (let i = 0; i < size / 2; i++) {
        const p1 = names[i * 2], p2 = names[i * 2 + 1];
        const R1 = parseInt(p1.r, 10) || 0, R2 = parseInt(p2.r, 10) || 0;
        const race = R1 > 0 && R2 > 0 ? computeRace(R1, R2, lenPct) : { rt1: 0, rt2: 0 };
        const id = randomMatchId();
        next[id] = {
          version: 1, phase: "banking", brk: null, tot: [0, 0], rack: 1,
          balls: Array.from({ length: 9 }, (_, k) => ({ n: k + 1, loc: "c", dead: false })),
          lastResult: null, hist: [], raceTo: [race.rt1, race.rt2],
          names: [p1.name, p2.name], table: tables[i],
          r1: R1, r2: R2, lenPct, matchMinutes: Math.round((parseInt(loadSettings().per100Min, 10) || 60) * (lenPct / 100)),
          createdAt: now + i, updatedAt: now,
          bracket: true, bracketRound: 1, bracketPos: i, bracketSize: size,
        };
      }
      await dbUpdate("matches", next);
      setMsg({ ok: true, text: `1回戦 ${size / 2}試合を登録しました` });
    } catch (e) {
      setMsg({ ok: false, text: "登録に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setRegistering(false);
  };

  const advanceRound = async (fromRound) => {
    if (registering) return;
    const prev = bracketMatchesForRound(matches, fromRound);
    if (prev.length === 0 || prev.some((m) => !isMatchFinished(m))) { setMsg({ ok: false, text: "前のラウンドがまだ終わっていません" }); return; }
    const winners = prev.map(winnerInfo);
    if (winners.some((w) => !w)) { setMsg({ ok: false, text: "勝者が確定していない試合があります" }); return; }
    const nextRound = fromRound + 1;
    if (!window.confirm(`${nextRound}回戦、${winners.length / 2}試合を登録します。よろしいですか？`)) return;
    setRegistering(true);
    try {
      const now = Date.now();
      const next = {};
      const tables = assignTables(winners.length / 2);
      for (let i = 0; i < winners.length / 2; i++) {
        const p1 = winners[i * 2], p2 = winners[i * 2 + 1];
        const race = p1.r > 0 && p2.r > 0 ? computeRace(p1.r, p2.r, lenPct) : { rt1: 0, rt2: 0 };
        const id = randomMatchId();
        next[id] = {
          version: 1, phase: "banking", brk: null, tot: [0, 0], rack: 1,
          balls: Array.from({ length: 9 }, (_, k) => ({ n: k + 1, loc: "c", dead: false })),
          lastResult: null, hist: [], raceTo: [race.rt1, race.rt2],
          names: [p1.name, p2.name], table: tables[i],
          r1: p1.r, r2: p2.r, lenPct, matchMinutes: Math.round((parseInt(loadSettings().per100Min, 10) || 60) * (lenPct / 100)),
          createdAt: now + i, updatedAt: now,
          bracket: true, bracketRound: nextRound, bracketPos: i, bracketSize: size,
        };
      }
      await dbUpdate("matches", next);
      setMsg({ ok: true, text: `${nextRound}回戦 ${winners.length / 2}試合を登録しました` });
    } catch (e) {
      setMsg({ ok: false, text: "登録に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setRegistering(false);
  };

  const roundLabel = (r) => (r === totalRounds ? "決勝" : totalRounds - r === 1 ? "準決勝" : `${r}回戦`);

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "20px 16px 32px", color: C.ink }}>
      <div style={{ textAlign: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 22, fontWeight: 800 }}>決勝トーナメント</div>
        <div style={{ fontSize: 13, color: C.sub, marginTop: 4 }}>抽選で引いた番号順に枠へ入れて組みます</div>
      </div>

      {!started && (
        <>
          <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
            {[4, 8].map((n) => (
              <button key={n} onClick={() => setSize(n)} style={{ flex: 1, border: `2px solid ${size === n ? C.blue : C.line}`, background: size === n ? C.lightBlue : "#fff", borderRadius: 12, padding: "12px 0", fontSize: 15, fontWeight: 800, color: size === n ? C.blue : C.ink, cursor: "pointer", fontFamily: FONT }}>{n}人</button>
            ))}
          </div>

          <div style={{ fontSize: 13, fontWeight: 700, color: C.sub, marginBottom: 8 }}>抽選番号ごとの選手</div>
          {Array.from({ length: size }, (_, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
              <div style={{ width: 28, textAlign: "center", fontSize: 14, fontWeight: 800, color: C.blue, flexShrink: 0 }}>{i + 1}</div>
              <select value={slotIdx[i] ?? 0} onChange={(e) => setSlotIdx((arr) => { const next = [...arr]; next[i] = +e.target.value; return next; })} style={{ ...selectStyle, flex: 1 }}>
                {roster.map((p, ri) => <option key={p.id} value={ri}>{p.name || "（無名）"}　{p.r ? `Fargo ${p.r}` : ""}</option>)}
              </select>
            </div>
          ))}

          <div style={{ background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, margin: "16px 0" }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
              <span style={{ fontSize: 14, fontWeight: 700 }}>ボールハンデ</span>
              <span style={{ fontSize: 16, fontWeight: 800 }}>{lenPct}%</span>
            </div>
            <input type="range" min={40} max={140} step={5} value={lenPct} onChange={(e) => setLenPct(+e.target.value)} style={{ width: "100%", accentColor: C.blue }} />
          </div>

          <button onClick={registerRound1} disabled={registering} style={{ width: "100%", background: registering ? C.line : C.blue, color: "#fff", border: "none", borderRadius: 14, padding: "15px 0", fontSize: 16, fontWeight: 800, cursor: registering ? "wait" : "pointer", fontFamily: FONT }}>
            {registering ? "登録中…" : `1回戦（${size / 2}試合）を登録する`}
          </button>
        </>
      )}

      {msg && <div style={{ textAlign: "center", fontSize: 13, fontWeight: 700, color: msg.ok ? C.win : C.minus, marginTop: 12 }}>{msg.ok ? "✓ " : "✗ "}{msg.text}</div>}

      {started && (
        <div style={{ marginTop: started ? 0 : 16 }}>
          {Array.from({ length: totalRounds }, (_, ri) => ri + 1).map((r) => {
            const ms = bracketMatchesForRound(matches, r);
            if (ms.length === 0) return null;
            const allDone = ms.every((m) => isMatchFinished(m));
            const isLastShown = r === Math.max(...bracketMatches.map((m) => m.bracketRound));
            return (
              <div key={r} style={{ marginBottom: 18 }}>
                <div style={{ fontSize: 15, fontWeight: 800, color: C.blue, marginBottom: 8 }}>{roundLabel(r)}</div>
                {ms.map((m) => {
                  const w = isMatchFinished(m) ? matchWinnerIndex(m) : null;
                  return (
                    <div key={m.id} style={{ display: "flex", gap: 8, alignItems: "center", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "8px 10px", marginBottom: 6 }}>
                      {[0, 1].map((i) => (
                        <div key={i} style={{ flex: 1, textAlign: "center", fontSize: 14, fontWeight: w === i ? 900 : 600, color: w === i ? C.win : w == null ? C.ink : C.sub }}>
                          {m.names[i]}{isMatchFinished(m) && ` (${(m.tot || [0, 0])[i]})`}
                        </div>
                      ))}
                    </div>
                  );
                })}
                {allDone && isLastShown && r < totalRounds && (
                  <button onClick={() => advanceRound(r)} disabled={registering} style={{ width: "100%", background: C.win, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT, marginTop: 4 }}>
                    {registering ? "登録中…" : `${roundLabel(r + 1)}を組む`}
                  </button>
                )}
                {allDone && r === totalRounds && (
                  <div style={{ textAlign: "center", fontSize: 15, fontWeight: 800, color: C.win, marginTop: 6 }}>
                    🏆 優勝：{ms[0].names[matchWinnerIndex(ms[0])]}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ========= 接続診断：保存できない原因（通信・上限・データ量）をその場で確認する ========= */
function ConnectionTest() {
  const [log, setLog] = useState(null);
  const [busy, setBusy] = useState(false);

  const run = async () => {
    setBusy(true);
    const lines = [];
    lines.push(`接続先：${FIREBASE_CONFIG.databaseURL}`);
    try {
      const t0 = Date.now();
      const rec = (await dbGet("/")) || {};
      lines.push(`① 読み込み：成功（${Date.now() - t0}ms）`);
      lines.push(`   データ量：${(JSON.stringify(rec).length / 1024).toFixed(1)} KB`);
      lines.push(`   メンバー：${(rec.roster || []).length}人`);
      lines.push(`   対戦データ：${Object.keys(rec.matches || {}).length}件`);
      // 実データには触れず、確認用の場所に書き込んで権限をチェックする
      const t1 = Date.now();
      await dbSet("_healthcheck", Date.now());
      lines.push(`② 書き込み：成功（${Date.now() - t1}ms）`);
      lines.push("→ 読み書きとも正常です");
    } catch (e) {
      const msg = e && e.message ? e.message : String(e);
      lines.push(`エラー：${msg}`);
      if (/permission|Permission/.test(msg)) lines.push("→ Realtime Databaseのルールが許可になっていません");
      else if (/FIREBASE_CONFIG|Invalid|invalid/.test(msg)) lines.push("→ databaseURL の値を確認してください");
      else lines.push("→ オフライン、または設定値が違う可能性があります");
    }
    setLog(lines);
    setBusy(false);
  };

  return (
    <div style={{ marginTop: 14 }}>
      <button onClick={run} disabled={busy} style={{ width: "100%", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.ink, fontSize: 13.5, fontWeight: 700, padding: "11px 0", cursor: "pointer", fontFamily: FONT }}>
        {busy ? "確認中…" : "🔌 保存できるか接続を確認する"}
      </button>
      {log && (
        <pre style={{ marginTop: 8, background: C.zone, border: `1px solid ${C.line}`, borderRadius: 10, padding: 10, fontSize: 11, lineHeight: 1.7, color: C.ink, whiteSpace: "pre-wrap", wordBreak: "break-all", fontFamily: "monospace" }}>{log.join("\n")}</pre>
      )}
    </div>
  );
}

/* ========= レート変更を未開始の試合に反映する =========
   公式ファーゴレートを持たない選手は運営側で暫定レートを入れる。
   試合の合間にその値を直しても、既に組まれた対戦の目標点は作成時に確定しているので変わらない。
   ここで「まだ始まっていない試合」だけを、今のメンバーリストのレートで組み直す。
   進行中・終了した試合には一切触らない（途中で目標点が動くと不公平になるため） */
function RateApplyPanel({ roster }) {
  const [scanning, setScanning] = useState(false);
  const [diffs, setDiffs] = useState(null);
  const [msg, setMsg] = useState(null);

  const rateOf = (name) => {
    const p = roster.find((x) => x.name === name);
    const v = p ? parseInt(p.r, 10) : NaN;
    return isNaN(v) ? 0 : v;
  };

  const scan = async () => {
    setScanning(true); setMsg(null); setDiffs(null);
    try {
      const matches = (await dbGet("matches")) || {};
      const list = [];
      for (const id in matches) {
        const m = matches[id];
        if (!m || m.startedAt || isMatchFinished(m)) continue; // 進行中・終了済みは対象外
        const names = m.names || ["", ""];
        const R1 = rateOf(names[0]), R2 = rateOf(names[1]);
        if (!(R1 > 0 && R2 > 0)) continue; // レート未入力の対戦は組み直せない
        const lenPct = m.lenPct || 100;
        const race = computeRace(R1, R2, lenPct);
        const cur = m.raceTo || [0, 0];
        if (race.rt1 === cur[0] && race.rt2 === cur[1]) continue;
        list.push({ id, table: m.table, names, before: [cur[0], cur[1]], after: [race.rt1, race.rt2],
                    R1, R2, lenPct, version: m.version || 1 });
      }
      list.sort((a, b) => (a.table - b.table));
      setDiffs(list);
      if (list.length === 0) setMsg({ ok: true, text: "組み直しが必要な試合はありません" });
    } catch (e) {
      setMsg({ ok: false, text: String(e && e.message ? e.message : e) });
    }
    setScanning(false);
  };

  const apply = async () => {
    if (!diffs || !diffs.length) return;
    if (!window.confirm(`${diffs.length}試合の目標点を組み直します。よろしいですか？\n（進行中・終了した試合は変わりません）`)) return;
    setScanning(true);
    try {
      const now = Date.now();
      const upd = {};
      diffs.forEach((d) => {
        upd[d.id + "/raceTo"] = d.after;
        upd[d.id + "/r1"] = d.R1;
        upd[d.id + "/r2"] = d.R2;
        upd[d.id + "/updatedAt"] = now;
        upd[d.id + "/version"] = d.version + 1; // 選手の端末（B2）に確実に届くよう版を上げる
      });
      await dbUpdate("matches", upd);
      setMsg({ ok: true, text: `${diffs.length}試合の目標点を組み直しました` });
      setDiffs(null);
    } catch (e) {
      setMsg({ ok: false, text: String(e && e.message ? e.message : e) });
    }
    setScanning(false);
  };

  return (
    <div style={{ marginTop: 18, border: `1.5px solid ${C.line}`, borderRadius: 12, padding: "12px 12px 14px" }}>
      <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 4 }}>レート変更を試合に反映</div>
      <div style={{ fontSize: 11.5, color: C.sub, lineHeight: 1.6, marginBottom: 10 }}>
        上でレートを直したあとに押してください。<b>まだ始まっていない試合</b>だけを、今のレートで組み直します。
        進行中・終了した試合の目標点は変わりません。
      </div>
      <button onClick={scan} disabled={scanning} style={{
        width: "100%", background: "#fff", border: `1.5px solid ${C.blue}`, borderRadius: 10,
        color: C.blue, fontSize: 14, fontWeight: 800, padding: "11px 0", cursor: "pointer", fontFamily: FONT,
        opacity: scanning ? 0.5 : 1,
      }}>{scanning ? "確認中…" : "🔍 変わる試合を確認する"}</button>

      {msg && <div style={{ marginTop: 8, fontSize: 12.5, fontWeight: 700, color: msg.ok ? C.win : C.minus }}>{msg.text}</div>}

      {diffs && diffs.length > 0 && (
        <div style={{ marginTop: 10 }}>
          <div style={{ fontSize: 12.5, color: C.sub, fontWeight: 700, marginBottom: 6 }}>{diffs.length}試合が変わります</div>
          {diffs.map((d) => (
            <div key={d.id} style={{ border: `1px solid ${C.line}`, borderRadius: 10, padding: "7px 10px", marginBottom: 6 }}>
              <div style={{ fontSize: 13, fontWeight: 800, marginBottom: 2 }}>T{d.table}　{d.names[0]} 対 {d.names[1]}</div>
              <div style={{ fontSize: 13, color: C.sub, fontVariantNumeric: "tabular-nums" }}>
                目標点 <s>{d.before[0]} / {d.before[1]}</s>
                <b style={{ color: C.ink, marginLeft: 8 }}>→ {d.after[0]} / {d.after[1]}</b>
              </div>
            </div>
          ))}
          <button onClick={apply} disabled={scanning} style={{
            width: "100%", marginTop: 4, background: C.win, color: "#fff", border: "none", borderRadius: 10,
            fontSize: 14.5, fontWeight: 800, padding: "12px 0", cursor: "pointer", fontFamily: FONT,
            opacity: scanning ? 0.5 : 1,
          }}>この内容で組み直す</button>
        </div>
      )}
    </div>
  );
}

function MembersTab({ roster, setRoster, onRefresh, loaded, loadError }) {
  const [saving, setSaving] = useState(false);
  const [saveMsg, setSaveMsg] = useState(null);
  const saveTimer = useRef(null);
  const rosterRef = useRef(roster);
  rosterRef.current = roster;
  const backup = useRef(loadRosterBackup()).current;

  // 保存は「ユーザーが実際に編集した時」だけ走らせる。
  // 以前は roster の変化を useEffect で監視していたため、読み込みに失敗して空のままこのタブを開くと、
  // マウント時に空リストで上書き保存されてしまっていた
  const persist = (allowEmpty) => {
    if (!loaded) return; // 読み込みに成功していない間は絶対に保存しない
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      setSaving(true);
      try {
        await saveRoster(rosterRef.current, allowEmpty);
        setSaveMsg(null);
      } catch (e) {
        setSaveMsg(String(e && e.message ? e.message : e));
      }
      setSaving(false);
    }, 600);
  };

  const update = (id, k, v) => { setRoster((rs) => rs.map((p) => (p.id === id ? { ...p, [k]: v } : p))); persist(); };
  const remove = (id) => { setRoster((rs) => rs.filter((p) => p.id !== id)); persist(true); };
  const add = () => {
    if (roster.length >= 40) return;
    setRoster((rs) => [...rs, { id: nid(), name: `選手${rs.length + 1}`, r: "" }]);
    persist();
  };
  const restoreBackup = () => {
    if (!backup.length) return;
    if (!window.confirm(`この端末に残っている${backup.length}人分のバックアップで復元します。よろしいですか？`)) return;
    setRoster(backup);
    _id = Math.max(...backup.map((p) => p.id || 0)) + 1;
    persist(true);
  };
  // 当日の抽選番号順に並び替える。番号未入力の人は元の順序のまま最後にまとめる
  const sortByDraw = () => {
    const numbered = roster.filter((p) => p.draw !== undefined && p.draw !== "" && p.draw != null);
    const unnumbered = roster.filter((p) => !(p.draw !== undefined && p.draw !== "" && p.draw != null));
    numbered.sort((a, b) => parseInt(a.draw, 10) - parseInt(b.draw, 10));
    setRoster([...numbered, ...unnumbered]);
    persist();
  };
  const hasAnyDraw = roster.some((p) => p.draw !== undefined && p.draw !== "" && p.draw != null);

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "10px 16px 24px", color: C.ink }}>
      <div style={{ textAlign: "center", marginBottom: 14 }}>
        <div style={{ fontSize: 13, color: C.sub, marginTop: 4 }}>{saving ? "保存中…" : "名前とファーゴレート（共有）"}</div>
        <button onClick={() => Promise.resolve(onRefresh()).catch(() => {})} style={{ marginTop: 8, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.ink, fontSize: 13, fontWeight: 700, padding: "7px 12px", cursor: "pointer", fontFamily: FONT }}>🔄 更新</button>
      </div>

      {loadError && (
        <Notice>メンバーの読み込みに失敗しました。データを守るため編集の保存を停止しています。通信を確認して「🔄 更新」を押してください。（{loadError}）</Notice>
      )}
      {saveMsg && <Notice>{saveMsg}</Notice>}
      {loaded && roster.length === 0 && backup.length > 0 && (
        <div style={{ marginBottom: 12 }}>
          <Notice>共有リストが空です。この端末に{backup.length}人分のバックアップが残っています。</Notice>
          <button onClick={restoreBackup} style={{ width: "100%", background: C.win, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontSize: 14.5, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>↺ バックアップから復元する</button>
        </div>
      )}
      {roster.length > 0 && (
        <div style={{ display: "flex", gap: 8, marginBottom: 6, padding: "0 2px" }}>
          <div style={{ flex: 1, fontSize: 11, color: C.sub, fontWeight: 700 }}>名前</div>
          <div style={{ width: 80, fontSize: 11, color: C.sub, fontWeight: 700, textAlign: "center" }}>レート</div>
          <div style={{ width: 64, fontSize: 11, color: C.sub, fontWeight: 700, textAlign: "center" }}>抽選番号</div>
          <div style={{ width: 40 }} />
        </div>
      )}
      {roster.map((p) => (
        <div key={p.id} style={{ display: "flex", gap: 8, marginBottom: 8, alignItems: "center" }}>
          <input value={p.name} onChange={(e) => update(p.id, "name", e.target.value.slice(0, 12))}
            style={{ flex: 1, minWidth: 0, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.ink, fontSize: 15, padding: "10px 12px", outline: "none", fontFamily: FONT }} />
          <input inputMode="numeric" value={p.r} onChange={(e) => update(p.id, "r", e.target.value.replace(/[^0-9]/g, "").slice(0, 3))}
            style={{ width: 80, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.ink, fontSize: 15, fontWeight: 700, padding: "10px 0", textAlign: "center", outline: "none", fontFamily: FONT }} />
          <input inputMode="numeric" value={p.draw || ""} onChange={(e) => update(p.id, "draw", e.target.value.replace(/[^0-9]/g, "").slice(0, 3))}
            placeholder="―"
            style={{ width: 64, background: "#fff", border: `1.5px solid ${C.blue}`, borderRadius: 10, color: C.blue, fontSize: 15, fontWeight: 800, padding: "10px 0", textAlign: "center", outline: "none", fontFamily: FONT }} />
          <button onClick={() => remove(p.id)} style={{ width: 40, height: 40, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.sub, fontSize: 18, cursor: "pointer" }}>×</button>
        </div>
      ))}
      {roster.length < 40 && (
        <button onClick={add} style={{ width: "100%", background: "#fff", border: `2px dashed ${C.blue}`, borderRadius: 10, color: C.blue, fontSize: 14.5, fontWeight: 700, padding: "12px 0", cursor: "pointer", fontFamily: FONT }}>＋ 選手を追加</button>
      )}
      {hasAnyDraw && (
        <button onClick={sortByDraw} style={{ width: "100%", marginTop: 10, background: C.blue, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>
          🎲 抽選番号順に並び替える
        </button>
      )}
      <div style={{ fontSize: 11.5, color: C.sub, marginTop: 8, lineHeight: 1.6 }}>
        当日カードを引く抽選をする場合は、各選手の「抽選番号」欄に引いた数字を入力してから並び替えてください。並び替え後のリストの順番のまま、下の「試合割り」で組まれます。
      </div>

      <RateApplyPanel roster={roster} />
    </div>
  );
}

/* ========= 試合割りタブ：総当たり風スケジュールを自動生成して一括登録 ========= */
const BULK_TABLES = 3;

function bulkMakePlan(N, G, relaxed) {
  const total = (N * G) / 2;
  if (!Number.isInteger(total)) return { error: "人数と試合数の積が奇数です。総試合数が半端になります。" };
  const cap0 = Math.min(BULK_TABLES, Math.floor(N / 2));
  if (cap0 < 1) return { error: "人数が少なすぎて試合を組めません（最低3人必要です）。" };
  const slots = Math.ceil(total / cap0);
  const sizes = [];
  for (let s = 0; s < slots; s++) sizes.push(s < slots - 1 ? cap0 : total - cap0 * (slots - 1));
  let lower = 0;
  for (let s = 0; s < slots - 1; s++) {
    const need = sizes[s] * 2 + sizes[s + 1] * 2 - N;
    const cap = Math.min(sizes[s], sizes[s + 1]);
    if (!relaxed && need > cap) {
      return { error: `この人数では成立しません。1コマに${sizes[s] * 2}人必要ですが、同じ卓でしか連投できないため次コマへ持ち越せるのは最大${cap}人です。人数を変えてください。` };
    }
    if (need > 0) lower += need;
  }
  return { total, slots, sizes, lower };
}
function bulkMulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function bulkAttempt(N, G, plan, rng, ceiling, nodeLimit, relaxed) {
  const { total, slots, sizes } = plan;
  const pos = [];
  for (let s = 0; s < slots; s++) for (let t = 0; t < sizes[s]; t++) pos.push([s, t]);

  const deg = new Int32Array(N + 1);
  const used = new Set();
  const seat = Array.from({ length: slots }, () => new Map());
  const board = [];
  let cost = 0, nodes = 0, best = null;

  const viable = (s) => {
    if (relaxed) return true; // 緩和モードでは「毎回全員が対戦する」総当たりも組むため、この事前枝刈りの前提が成立しない
    const left = slots - s - 1;
    for (let x = 1; x <= N; x++) {
      const need = G - deg[x];
      if (!need) continue;
      let room = left;
      if (seat[s].has(x) && s > 0 && seat[s - 1].has(x)) room -= 1;
      if (need > room - Math.floor(room / 3)) return false;
    }
    if (left > 0) {
      let free = 0;
      for (let x = 1; x <= N; x++) {
        if (deg[x] >= G) continue;
        if (seat[s].has(x) && s > 0 && seat[s - 1].has(x)) continue;
        free++;
      }
      if (free < sizes[s + 1] * 2) return false;
    }
    return true;
  };

  const walk = (p) => {
    if (nodes++ > nodeLimit) throw new Error("budget");
    if (p === total) { best = { board: board.map((m) => ({ ...m })), cost }; return true; }
    const [s, t] = pos[p];
    const here = seat[s], prev = s > 0 ? seat[s - 1] : null, back = s > 1 ? seat[s - 2] : null;

    const cands = [];
    for (let a = 1; a <= N; a++) {
      if (deg[a] >= G || here.has(a)) continue;
      for (let b = a + 1; b <= N; b++) {
        if (deg[b] >= G || here.has(b) || used.has(a * 32 + b)) continue;
        let carry = 0, ok = true;
        for (const x of [a, b]) {
          if (prev && prev.has(x)) {
            if (!relaxed && prev.get(x) !== t) { ok = false; break; }
            if (!relaxed && back && back.has(x)) { ok = false; break; }
            carry++;
          }
        }
        if (!ok || cost + carry >= ceiling) continue;
        cands.push({ a, b, carry, score: carry * 1000 - (2 * G - deg[a] - deg[b]) * 10 + rng() * 5 });
      }
    }
    cands.sort((x, y) => x.score - y.score);

    for (const c of cands) {
      deg[c.a]++; deg[c.b]++;
      used.add(c.a * 32 + c.b);
      here.set(c.a, t); here.set(c.b, t);
      cost += c.carry;
      board.push({ slot: s, table: t, a: c.a, b: c.b, carry: c.carry });
      if (t !== sizes[s] - 1 || viable(s)) { if (walk(p + 1)) return true; }
      board.pop(); cost -= c.carry;
      here.delete(c.a); here.delete(c.b);
      used.delete(c.a * 32 + c.b);
      deg[c.a]--; deg[c.b]--;
    }
    return false;
  };

  try { walk(0); } catch (e) { if (e.message !== "budget") throw e; }
  return best;
}
function bulkGenerate(N, G, relaxed) {
  const plan = bulkMakePlan(N, G, relaxed);
  if (plan.error) return { error: plan.error };
  let best = null, ceiling = Infinity;
  const start = Date.now();
  for (let r = 0; r < 400; r++) {
    if (Date.now() - start > 2500) break;
    const got = bulkAttempt(N, G, plan, bulkMulberry(r * 7919 + 13), ceiling, 40000, relaxed);
    if (got && got.cost < ceiling) { best = got; ceiling = got.cost; if (best.cost <= plan.lower) break; }
  }
  if (!best) return { error: relaxed ? "条件を緩和しても組み合わせが見つかりませんでした。人数か試合数を変えてください。" : "条件を満たす組み合わせが見つかりませんでした。" };
  return { plan, board: best.board, cost: best.cost, optimal: best.cost <= plan.lower };
}
// 条件（同卓縛り・3連投禁止）はまず厳密に組もうとし、成立しなければ自動的に緩和して再試行する
function bulkGenerateAuto(N, G) {
  const strict = bulkGenerate(N, G, false);
  if (!strict.error) return { ...strict, usedRelaxed: false };
  const relaxed = bulkGenerate(N, G, true);
  if (!relaxed.error) return { ...relaxed, usedRelaxed: true };
  return { error: relaxed.error || strict.error };
}

function BulkScheduleTab({ roster, roundRobin, onSetRoundRobin }) {
  const s0 = useMemo(() => loadSettings(), []);
  const [players, setPlayers] = useState(s0.players || Math.max(3, Math.min(16, roster.length || 12)));
  const [games, setGames] = useState(s0.games || 4);
  const [lenPct, setLenPct] = useState(s0.lenPct || 100);
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState(false);
  const [registering, setRegistering] = useState(false);
  const [msg, setMsg] = useState(null);
  const d0 = defaultSchedule();
  const [startH, setStartH] = useState(d0.startH);
  const [startM, setStartM] = useState(d0.startM);
  const [endH, setEndH] = useState(d0.endH);
  const [endM, setEndM] = useState(d0.endM);
  const [changeoverMin, setChangeoverMin] = useState(s0.changeoverMin || "5");
  const [per100Min, setPer100Min] = useState(s0.per100Min || "60");

  // 変更のたびに端末へ保存し、次回起動時に復元できるようにする
  useEffect(() => {
    saveSettings({ players, games, lenPct, startH, startM, endH, endM, changeoverMin, per100Min });
  }, [players, games, lenPct, startH, startM, endH, endM, changeoverMin, per100Min]);

  const timeEstimate = useMemo(() => {
    if (!result || result.error) return null;
    const sH = parseInt(startH, 10), sM = parseInt(startM, 10);
    const eH = parseInt(endH, 10), eM = parseInt(endM, 10);
    const chg = parseInt(changeoverMin, 10) || 0;
    const per100 = parseInt(per100Min, 10) || 0;
    if ([sH, sM, eH, eM].some((v) => isNaN(v))) return null;
    const matchMin = per100 * (lenPct / 100);
    const slots = result.plan.slots;
    const totalMin = slots * matchMin + (slots - 1) * chg;
    const startTotal = sH * 60 + sM;
    const endTotal = eH * 60 + eM;
    const finishTotal = startTotal + totalMin;
    const fits = finishTotal <= endTotal;
    const fmt = (mins) => {
      const m = Math.round(mins);
      const h = Math.floor(((m % 1440) + 1440) % 1440 / 60);
      const mm = ((m % 60) + 60) % 60;
      return `${String(h).padStart(2, "0")}:${String(Math.round(mm)).padStart(2, "0")}`;
    };
    return { matchMin, totalMin, finishTotal, fits, diff: Math.abs(endTotal - finishTotal), finishLabel: fmt(finishTotal) };
  }, [result, startH, startM, endH, endM, changeoverMin, per100Min, lenPct]);

  // 終了時刻ちょうどに収まる「試合の長さ（%）」を逆算
  const idealLenPct = useMemo(() => {
    if (!result || result.error) return null;
    const sH = parseInt(startH, 10), sM = parseInt(startM, 10);
    const eH = parseInt(endH, 10), eM = parseInt(endM, 10);
    const chg = parseInt(changeoverMin, 10) || 0;
    const per100 = parseInt(per100Min, 10) || 0;
    if ([sH, sM, eH, eM].some((v) => isNaN(v)) || per100 <= 0) return null;
    const slots = result.plan.slots;
    const available = (eH * 60 + eM) - (sH * 60 + sM) - (slots - 1) * chg;
    if (available <= 0) return { pct: 40, clampedLow: true };
    const raw = (available / slots / per100) * 100;
    const rounded = Math.round(raw / 5) * 5;
    if (rounded > 140) return { pct: 140, clampedHigh: true };
    if (rounded < 40) return { pct: 40, clampedLow: true };
    return { pct: rounded };
  }, [result, startH, startM, endH, endM, changeoverMin, per100Min]);

  // 総当たりモードの時は「1人の試合数」を使わず、全員と1回ずつ当たる総当たり戦として組む
  const effectiveGames = roundRobin ? players - 1 : games;

  const run = () => {
    setBusy(true); setMsg(null);
    setTimeout(() => { setResult(bulkGenerateAuto(players, effectiveGames)); setBusy(false); }, 20);
  };

  const rows = useMemo(() => {
    if (!result || result.error) return null;
    const base = Date.now();
    return result.board.map((m, i) => {
      const p1 = roster[m.a - 1] || { name: `選手${m.a}`, r: "" };
      const p2 = roster[m.b - 1] || { name: `選手${m.b}`, r: "" };
      const R1 = parseInt(p1.r, 10), R2 = parseInt(p2.r, 10);
      const race = R1 > 0 && R2 > 0 ? computeRace(R1, R2, lenPct) : { rt1: 0, rt2: 0 };
      const mins = Math.round((parseInt(per100Min, 10) || 60) * (lenPct / 100));
      return { ...m, seq: i, matchId: randomMatchId(), createdAt: base + i * 1000, n1: p1.name, n2: p2.name, r1: R1 || 0, r2: R2 || 0, rt1: race.rt1, rt2: race.rt2, lenPct, matchMinutes: mins };
    });
  }, [result, roster, lenPct, per100Min]);

  const grid = useMemo(() => {
    if (!rows) return null;
    const map = new Map();
    for (const m of rows) {
      if (!map.has(m.slot)) map.set(m.slot, [null, null, null]);
      map.get(m.slot)[m.table] = m;
    }
    return [...map.entries()].sort((a, b) => a[0] - b[0]);
  }, [rows]);

  const register = async () => {
    if (!rows || registering) return;
    if (!window.confirm(`${rows.length}件の対戦を登録します。\n現在の対戦とスコアラーの担当回数はすべてリセットされます。よろしいですか？`)) return;
    setRegistering(true);
    try {
      const now = Date.now();
      const next = {};
      rows.forEach((m) => {
        next[m.matchId] = {
          version: 1, phase: "banking", brk: null, tot: [0, 0], rack: 1,
          balls: Array.from({ length: 9 }, (_, i) => ({ n: i + 1, loc: "c", dead: false })),
          lastResult: null, hist: [], raceTo: [m.rt1, m.rt2],
          names: [m.n1, m.n2], table: m.table + 1, slot: m.slot,
          r1: m.r1 || 0, r2: m.r2 || 0, lenPct: m.lenPct || 100, matchMinutes: m.matchMinutes || 30,
          createdAt: m.createdAt, updatedAt: now,
        };
      });
      await dbSet("matches", next);
      // 対戦表を組み直したら、スコアラーの担当回数も新しい大会として0からやり直す
      await dbSet("refereeCounts", {});
      // 書き込めたつもりで消えている事故を防ぐため、読み直して実際に保存されたか確認する
      const savedMatches = (await dbGet("matches")) || {};
      const saved = Object.keys(savedMatches).filter((id) => next[id]).length;
      if (saved !== rows.length) {
        throw new Error(`保存を確認できませんでした（${saved}/${rows.length}件）。もう一度お試しください`);
      }
      setMsg({ ok: true, text: `${rows.length}件をタイムラインに登録しました` });
    } catch (e) {
      setMsg({ ok: false, text: "登録に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setRegistering(false);
  };

  const noRatings = rows && rows.some((m) => !m.rt1 && !m.rt2);

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "20px 16px 32px", color: C.ink }}>
      <div style={{ textAlign: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 22, fontWeight: 800 }}>試合割り</div>
        <div style={{ fontSize: 13, color: C.sub, marginTop: 4 }}>空き卓は最終コマのみ／3連続なし／連投は同卓のみ</div>
      </div>

      {roster.length < players && (
        <Notice>メンバーが{roster.length}人しかいません。先頭から{players}人分を使うので、メンバータブで人数を確認してください。</Notice>
      )}

      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        <BulkStepper label="人数" value={players} min={3} max={16} onChange={setPlayers} />
        {roundRobin ? (
          <div style={{ flex: 1, background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: "10px 10px 12px", display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center" }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: C.sub, marginBottom: 6, textAlign: "center" }}>1人の試合数</div>
            <div style={{ fontSize: 15, fontWeight: 800, color: C.blue, textAlign: "center" }}>総当たり戦（{players - 1}）</div>
          </div>
        ) : (
          <BulkStepper label="1人の試合数" value={games} min={2} max={4} onChange={setGames} />
        )}
      </div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: roundRobin ? C.lightBlue : C.zone, border: `1.5px solid ${roundRobin ? C.blue : C.line}`, borderRadius: 12, padding: "12px 14px", marginBottom: 16 }}>
        <div>
          <div style={{ fontSize: 14, fontWeight: 800, color: C.ink }}>総当たりモード</div>
          <div style={{ fontSize: 11.5, color: C.sub, marginTop: 2 }}>ONの間は全員と1回ずつ対戦する総当たり戦で組みます。プレイヤータブに対戦表も表示されます</div>
        </div>
        <button onClick={() => onSetRoundRobin(!roundRobin)} style={{
          background: roundRobin ? C.blue : C.line, color: roundRobin ? "#fff" : C.sub,
          border: "none", borderRadius: 20, padding: "8px 16px", fontSize: 13, fontWeight: 800,
          cursor: "pointer", fontFamily: FONT, flexShrink: 0,
        }}>
          {roundRobin ? "ON" : "OFF"}
        </button>
      </div>

      {result && !result.error && result.usedRelaxed && (
        <Notice>人数の都合で同卓縛り・3連投禁止の条件を一部緩和して組みました（自動判定）。</Notice>
      )}

      <div style={{ background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
          <span style={{ fontSize: 14, fontWeight: 700 }}>ロングゲームの時間設定</span>
          <span style={{ fontSize: 16, fontWeight: 800 }}>🎱100%（{per100Min}分）</span>
        </div>
        <input type="range" min={10} max={180} step={5} value={per100Min || 60} onChange={(e) => setPer100Min(e.target.value)} style={{ width: "100%", accentColor: C.blue }} />
      </div>

      <div style={{ background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
          <span style={{ fontSize: 14, fontWeight: 700 }}>ショートゲームの割合設定</span>
          <span style={{ fontSize: 16, fontWeight: 800 }}>🎱{lenPct}%（{Math.round((parseInt(per100Min, 10) || 60) * (lenPct / 100))}分）</span>
        </div>
        <input type="range" min={40} max={140} step={5} value={lenPct} onChange={(e) => setLenPct(+e.target.value)} style={{ width: "100%", accentColor: C.blue }} />
      </div>

      <div style={{ background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, marginBottom: 16 }}>
        <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 10 }}>時間割</div>
        <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, color: C.sub, marginBottom: 4 }}>開始</div>
            <TimeInput h={startH} m={startM} onH={setStartH} onM={setStartM} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, color: C.sub, marginBottom: 4 }}>終了</div>
            <TimeInput h={endH} m={endM} onH={setEndH} onM={setEndM} />
          </div>
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 12, color: C.sub, marginBottom: 4 }}>入替（分）</div>
          <input inputMode="numeric" value={changeoverMin} onChange={(e) => setChangeoverMin(e.target.value.replace(/[^0-9]/g, "").slice(0, 3))} style={{ ...numBoxStyle, textAlign: "center", width: "100%" }} />
        </div>
      </div>

      <button onClick={run} disabled={busy}

        {busy ? "計算中…" : "組む ▶"}
      </button>

      {result?.error && <Notice>{result.error}</Notice>}

      {grid && (
        <>
          <Notice>下書きができました。まだ保存されていません。内容を確認して、一番下の青いボタンで登録してください。</Notice>
          <div style={{ display: "flex", flexWrap: "wrap", gap: "6px 18px", fontSize: 12.5, color: C.sub, marginBottom: 14, justifyContent: "center" }}>
            <span>総試合 <b style={{ color: C.ink }}>{result.plan.total}</b></span>
            <span>コマ <b style={{ color: C.ink }}>{result.plan.slots}</b></span>
            <span>同卓2連 <b style={{ color: C.ink }}>{result.cost}</b> / 下限 {result.plan.lower}</span>
            {result.optimal && <span style={{ color: C.win, fontWeight: 800 }}>最小</span>}
          </div>

          {timeEstimate && (
            <div style={{ textAlign: "center", marginBottom: 10, fontSize: 13, color: timeEstimate.fits ? C.win : C.minus, fontWeight: 700 }}>
              終了目安 <b style={{ fontSize: 16 }}>{timeEstimate.finishLabel}</b>
              {timeEstimate.fits ? `（終了予定まで${Math.round(timeEstimate.diff)}分の余裕）` : `（終了予定を${Math.round(timeEstimate.diff)}分オーバー）`}
            </div>
          )}

          {idealLenPct && (
            <div style={{ textAlign: "center", marginBottom: 14 }}>
              <button onClick={() => setLenPct(idealLenPct.pct)}
                style={{ background: lenPct === idealLenPct.pct ? C.win : "#fff", color: lenPct === idealLenPct.pct ? "#fff" : C.blue, border: `1.5px solid ${lenPct === idealLenPct.pct ? C.win : C.blue}`, borderRadius: 10, padding: "9px 16px", fontSize: 13.5, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>

              {idealLenPct.clampedLow && <div style={{ fontSize: 11.5, color: C.hill, marginTop: 6 }}>40%（下限）にしても間に合わない可能性があります</div>}
            </div>

          <div style={{ display: "grid", gridTemplateColumns: "22px 1fr 1fr 1fr", gap: 6, marginBottom: 6 }}>
            <div />
            {[1, 2, 3].map((t) => <div key={t} style={{ textAlign: "center", fontSize: 12.5, fontWeight: 800, color: C.sub }}>T{t}</div>)}
          </div>
          {grid.map(([slot, cells]) => (
            <div key={slot} style={{ display: "grid", gridTemplateColumns: "22px 1fr 1fr 1fr", gap: 6, marginBottom: 6, alignItems: "stretch" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10.5, fontWeight: 800, color: C.sub }}>{slot + 1}</div>
              {cells.map((m, i) => m ? <BulkCard key={i} m={m} /> : (
                <div key={i} style={{ background: C.zone, border: `1px dashed ${C.line}`, borderRadius: 14, display: "flex", alignItems: "center", justifyContent: "center", color: C.sub, fontSize: 11, padding: "14px 4px" }}>空き</div>
              ))}
            </div>
          ))}

          <div style={{ position: "sticky", bottom: 0, background: "linear-gradient(to top, #fff 70%, rgba(255,255,255,0))", paddingTop: 14, paddingBottom: 8, marginTop: 16 }}>
            <button onClick={register} disabled={registering}
              style={{ width: "100%", background: registering ? C.line : C.blue, color: "#fff", border: "none", borderRadius: 14, padding: "16px 0", fontSize: 16, fontWeight: 800, cursor: registering ? "wait" : "pointer", fontFamily: FONT, boxShadow: "0 4px 14px rgba(46,109,181,0.35)" }}>

      )}

  );
}

function ScheduleTab({ roster }) {
  const [i1, setI1] = useState(0);
  const [i2, setI2] = useState(roster.length > 1 ? 1 : 0);
  const [table, setTable] = useState(1);
  const [lenPct, setLenPct] = useState(100);
  const [tableStatus, setTableStatus] = useState([null, null, null]);
  const [creating, setCreating] = useState(false);
  const [createdInfo, setCreatedInfo] = useState(null);

  const refreshStatus = async () => {
    try {
      const matches = await dbGet("matches");
      setTableStatus([1, 2, 3].map((t) => getQueueForTable(matches || {}, t)[0] || null));
    } catch {}
  };
  useEffect(() => dbSubscribe("matches",
    (matches) => setTableStatus([1, 2, 3].map((t) => getQueueForTable(matches || {}, t)[0] || null)),
    () => {}), []);

  const p1 = roster[i1], p2 = roster[i2];
  const R1 = p1 ? parseInt(p1.r, 10) : 0, R2 = p2 ? parseInt(p2.r, 10) : 0;
  const valid = p1 && p2 && i1 !== i2 && R1 > 0 && R2 > 0;
  const res = valid ? computeRace(R1, R2, lenPct) : null;

  const create = async () => {
    if (!valid || creating) return;
    setCreating(true);
    const matchId = randomMatchId();
    const state = {
      version: 1, phase: "banking", brk: null, tot: [0, 0], rack: 1,
      balls: Array.from({ length: 9 }, (_, i) => ({ n: i + 1, loc: "c", dead: false })),
      lastResult: null, hist: [], raceTo: [res.rt1, res.rt2],
      names: [p1.name, p2.name], table, createdAt: Date.now(),
      r1: R1, r2: R2, lenPct, matchMinutes: Math.round((parseInt(loadSettings().per100Min, 10) || 60) * (lenPct / 100)),
    };
    await saveMatch(matchId, state).catch(() => {});
    setCreatedInfo({ table, names: [p1.name, p2.name], raceTo: [res.rt1, res.rt2] });
    setCreating(false);
    refreshStatus();

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "20px 16px 24px", color: C.ink }}>
      <div style={{ textAlign: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 22, fontWeight: 800 }}>対戦表</div>
        <div style={{ fontSize: 13, color: C.sub, marginTop: 4 }}>卓と対戦者を決めて対戦を作成します</div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        {[1, 2, 3].map((t) => {

          return (
            <div key={t} style={{ flex: 1, background: C.zone, border: `2px solid ${table === t ? C.blue : C.line}`, borderRadius: 12, padding: "10px 6px", textAlign: "center", cursor: "pointer" }} onClick={() => setTable(t)}>
              <div style={{ fontSize: 13, fontWeight: 800, color: table === t ? C.blue : C.ink }}>T{t}</div>
              <div style={{ fontSize: 10.5, color: st ? C.win : C.sub, marginTop: 4 }}>{label}</div>
              {st && <div style={{ fontSize: 9.5, color: C.sub, marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{st.names ? st.names.join(" / ") : ""}</div>}
            </div>

      <Field label="プレイヤー1">

          {roster.map((p, i) => <option key={p.id} value={i}>{p.name || "（無名）"}　{p.r ? `Fargo ${p.r}` : ""}</option>)}
        </select>
      </Field>
      <Field label="プレイヤー2">
        <select value={i2} onChange={(e) => setI2(+e.target.value)} style={selectStyle}>
          {roster.map((p, i) => <option key={p.id} value={i}>{p.name || "（無名）"}　{p.r ? `Fargo ${p.r}` : ""}</option>)}
        </select>
      </Field>

      <div style={{ background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, margin: "14px 0" }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
          <span style={{ fontSize: 14, fontWeight: 700 }}>試合の長さ</span>
          <span style={{ fontSize: 16, fontWeight: 800 }}>{lenPct}%</span>
        </div>
        <input type="range" min={40} max={140} step={5} value={lenPct} onChange={(e) => setLenPct(+e.target.value)} style={{ width: "100%", accentColor: C.blue }} />
        <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
          {[["ショート", 75], ["ロング", 100], ["長め", 120]].map(([t, v]) => (
            <button key={t} onClick={() => setLenPct(v)} style={{ flex: 1, border: `2px solid ${lenPct === v ? C.blue : C.line}`, background: lenPct === v ? C.lightBlue : "#fff", borderRadius: 8, padding: "8px 0", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>{t}</button>
          ))}
