/* ========= ハンデ計算（App A/B2と共通） ========= */
function roundHalfToEven(v) {
  const w = Math.floor(v);
  const d = v - w;
  if (Math.abs(d - 0.5) > 1e-9) return d > 0.5 ? w + 1 : w;
  return w % 2 === 1 ? w + 1 : w;
}
function normalizeRace(rt1, rt2, lowClamp) {
  const highClamp = 99.0;
  const p1IsHigh = rt1 >= rt2;
  const highRace = Math.max(rt1, rt2), lowRace = Math.min(rt1, rt2);
  let highC = highRace > highClamp ? highClamp : highRace;
  let lowC = highRace > highClamp ? lowRace - lowRace * ((highRace - highClamp) / highRace) : lowRace;
  highC = Math.min(lowRace < lowClamp ? highC + highC * ((lowClamp - lowRace) / lowC) : highC, highClamp);
  lowC = Math.max(lowC < lowClamp ? lowClamp : lowC, lowClamp);
  return { rt1: p1IsHigh ? highC : lowC, rt2: p1IsHigh ? lowC : highC };
}
function computeRace(R1, R2, lenPct) {
  const dampFactor = lenPct / 100;
  const avg = (R1 + R2) / 2;
  const gp = 0.018 * avg - 1.4;
  const delta = R1 - R2;
  const p1 = 1 - 1 / (1 + Math.pow(2, delta / 100));
  const p2 = 1 - p1;
  const p1AvgPts = p1 * 14.0 + p2 * (7.4 - 0.0062 * R2);
  const p2AvgPts = p2 * 14.0 + p1 * (7.4 - 0.0062 * R1);
  const rt1raw = p1AvgPts * gp * dampFactor;
  const rt2raw = p2AvgPts * gp * dampFactor;
  const lowClamp = 0.16 * lenPct + 12;
  const norm = normalizeRace(rt1raw, rt2raw, lowClamp);
  return { rt1: roundHalfToEven(norm.rt1), rt2: roundHalfToEven(norm.rt2), p1, p2 };
}

/* 1回だけ読む */
async function dbGet(path) {
  const snap = await db.ref(path).once("value");
  return snap.val();
}
/* 変更を購読する。ポーリングと違い、変わった瞬間に届く。戻り値を呼ぶと解除 */
function dbSubscribe(path, onValue, onError) {
  const ref = db.ref(path);
  const handler = ref.on("value", (snap) => onValue(snap.val()),
    (e) => onError && onError(e && e.message ? e.message : String(e)));
  return () => ref.off("value", handler);
}
async function dbSet(path, value) { await db.ref(path).set(value); }
/* 複数の場所をまとめて更新する。指定した項目だけが変わるので、
   スコアラーが入力中の値を本部側が上書きしてしまう事故が起きない */
async function dbUpdate(path, values) { await db.ref(path).update(values); }

function normalizeRecord(rec) {
  rec = rec || {};
  return {
    roster: Array.isArray(rec.roster) ? rec.roster : [],
    results: Array.isArray(rec.results) ? rec.results : [],
    matches: rec.matches && typeof rec.matches === "object" ? rec.matches : {},
    refereeCounts: rec.refereeCounts && typeof rec.refereeCounts === "object" ? rec.refereeCounts : {},
  };
}
/* 全体を1回読む（従来のjsonbinReadと同じ形で返す） */
async function readAll() {

}
const ROSTER_BACKUP_KEY = "jcl9_b1_roster_backup_v1";
function backupRoster(roster) {

}
function loadRosterBackup() {

}
async function saveRoster(roster, allowEmpty) {
  // 通信不良などでメンバーが空のまま保存が走り、共有リストを消してしまう事故を防ぐ
  if (!allowEmpty && (!roster || roster.length === 0)) {

  }

  backupRoster(roster);
}
async function saveMatch(matchId, state) {
  // その対戦だけを書き換える（他の卓のデータには触れない）
  await dbSet("matches/" + matchId, { ...state, updatedAt: Date.now() });
}
function randomMatchId() {
  return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
}
const STALE_MS = 1000 * 60 * 60 * 6;
/* Firebaseは空の配列を保存しない（キーごと消える）ので、読み込み側で補う */
function normalizeMatch(m) {
  if (!m) return m;
  return {
    ...m,
    names: Array.isArray(m.names) ? m.names : ["P1", "P2"],
    tot: Array.isArray(m.tot) ? m.tot : [0, 0],
    raceTo: Array.isArray(m.raceTo) ? m.raceTo : [0, 0],
    balls: Array.isArray(m.balls) ? m.balls : [],
    hist: Array.isArray(m.hist) ? m.hist : [],
    rack: m.rack || 1,
  };
}
function isMatchFinished(m) {
  if (m.bothLose) return true; // 時間切れ・最終ラック終了時にどちらも目標に届かなかった場合
  const rt = m.raceTo || [0, 0], tot = m.tot || [0, 0];
  return (rt[0] > 0 && tot[0] >= rt[0]) || (rt[1] > 0 && tot[1] >= rt[1]);
}
// 卓ごとの待機列：未終了の対戦を作成順に並べる。[0]が現在対戦中、[1]が次戦
function getQueueForTable(matches, tableNum) {
  const list = [];
  for (const id in matches) {
    const m = matches[id];
    if (!m || Number(m.table) !== tableNum) continue;
    if (!m.updatedAt || Date.now() - m.updatedAt > STALE_MS) continue;
    if (isMatchFinished(m)) continue;
    list.push({ ...normalizeMatch(m), id });
  }
  list.sort((a, b) => (a.createdAt || a.updatedAt) - (b.createdAt || b.updatedAt));
  return list;
}
// 現在対戦中の残り時間を確保した上で、次戦以降を指定の終了予定時刻に収める試合の長さ・持ち時間を逆算する
function computeTableAdjustment(queueForTable, eH, eM, per100) {
  const cur = queueForTable[0];
  const future = queueForTable.slice(1);
  if (!future.length) return null;
  const targetD = new Date(); targetD.setHours(eH, eM, 0, 0);
  const availableMin = (targetD - Date.now()) / 60000;
  if (availableMin <= 0) return { error: "すでにその時刻を過ぎています" };
  let curRemainMin = 0;
  if (cur) {
    if (cur.startedAt && cur.matchMinutes) {
      const elapsed = (Date.now() - cur.startedAt) / 60000;
      curRemainMin = Math.max(0, cur.matchMinutes - elapsed);
    } else {
      curRemainMin = cur.matchMinutes || 30;
    }
  }
  const availableForFuture = availableMin - curRemainMin;
  if (availableForFuture <= 0) return { error: "現在の対戦の残り時間だけで、指定時刻を超えています" };
  const perMatchMin = availableForFuture / future.length;
  const rawPct = Math.round((perMatchMin / per100) * 100 / 5) * 5;
  const hitFloor = rawPct < 40;
  const newLenPct = Math.min(140, Math.max(40, rawPct));
  const newMinutes = Math.max(5, Math.round(per100 * (newLenPct / 100)));
  return { future, newLenPct, newMinutes, hitFloor, curRemainMin };
}

// 卓ごとの全対戦（終了分も含む）を作成順に並べる。タイムラインの「コマ」順の復元に使う
function getAllForTable(matches, tableNum) {
  const list = [];
  for (const id in matches) {
    const m = matches[id];
    if (!m || Number(m.table) !== tableNum) continue;
    if (!m.updatedAt || Date.now() - m.updatedAt > STALE_MS) continue;
    list.push({ ...normalizeMatch(m), id });
  }
  list.sort((a, b) => (a.createdAt || a.updatedAt) - (b.createdAt || b.updatedAt));
  return list;
}
// 卓ごとの一覧に状態を付ける。
// 終了／試合中（スコアラーがバンキング勝者を選んだ）／呼び出し中（次に始める1試合だけ）／待機中（それより先）
function annotateColumn(list) {
  let calledYet = false;
  return list.map((m) => {
    if (isMatchFinished(m)) return { m, st: "done" };
    if (m.startedAt) return { m, st: "live" };
    if (!calledYet) { calledYet = true; return { m, st: "call" }; }
    return { m, st: "queued" };
  });
}
function matchWinnerIndex(m) {
  if (m.bothLose) return null; // 両者負け
  if (m.winner === 0 || m.winner === 1) return m.winner;
  const rt = m.raceTo || [0, 0], tot = m.tot || [0, 0];
  const r0 = rt[0] > 0 && tot[0] >= rt[0];
  const r1 = rt[1] > 0 && tot[1] >= rt[1];
  // ヒルヒルで両者が目標に達した場合は、そのラックで9番を落とした方（＝最終ラックの勝者）が勝ち
  if (r0 && r1) {
    const last = (m.hist || []).slice(-1)[0];
    return last ? last.w : 0;
  }
  if (r0) return 0;
  if (r1) return 1;
  return null;
}
// 成績集計
// ・勝ちがつかなかった試合は、目標点に対する取得点の割合（達成率、上限100%）を記録
// ・時間切れでどちらも目標に届かなかった試合は両者負け扱いで、双方に達成率を記録
// ・並び順は 勝ち数 → 達成率の平均 → 得失点差
function buildStandings(matches, roster) {
  const stats = {};
  const ensure = (name) => {
    if (!stats[name]) stats[name] = { name, win: 0, loss: 0, rates: [], pf: 0, pa: 0 };
    return stats[name];
  };
  roster.forEach((p) => { if (p.name) ensure(p.name); });

  for (const id in matches) {
    const m = matches[id];
    if (!m || !isMatchFinished(m)) continue;
    if (!m.updatedAt || Date.now() - m.updatedAt > STALE_MS) continue;
    const names = m.names || [];
    const tot = m.tot || [0, 0];
    const rt = m.raceTo || [0, 0];
    const w = matchWinnerIndex(m); // null なら両者負け
    [0, 1].forEach((i) => {
      if (!names[i]) return;
      const s = ensure(names[i]);
      s.pf += tot[i] || 0;
      s.pa += tot[1 - i] || 0;
      if (i === w) s.win++;
      else {
        s.loss++;
        if (rt[i] > 0) s.rates.push(Math.min(1, (tot[i] || 0) / rt[i])); // 100%を上限にする
      }
    });
  }

  const rows = Object.values(stats).map((s) => ({
    ...s,
    played: s.win + s.loss,
    avgRate: s.rates.length ? s.rates.reduce((a, b) => a + b, 0) / s.rates.length : null,
  }));
  rows.sort((a, b) => {
    if (b.win !== a.win) return b.win - a.win;
    // 負け試合がない（＝全勝）方を上に
    const ar = a.avgRate == null ? 2 : a.avgRate;
    const br = b.avgRate == null ? 2 : b.avgRate;
    if (br !== ar) return br - ar;
    return (b.pf - b.pa) - (a.pf - a.pa);
  });
  return rows;
}
const fmtRate = (v) => (v == null ? "–" : v.toFixed(3));

/* ========= タイムラインタブ：試合割りに、終わった試合のスコアを書き入れて全体の進行を見る ========= */
function TimelineTab() {
  const [cols, setCols] = useState([[], [], []]);
  const [err, setErr] = useState(null);

  // ポーリングせず、matches の変更を購読する
  useEffect(() => dbSubscribe("matches",
    (matches) => { setCols([1, 2, 3].map((t) => annotateColumn(getAllForTable(matches || {}, t)))); setErr(null); },
    (e) => setErr(e)), []);

  const slots = Math.max(1, ...cols.map((c) => c.length));
  const total = cols.reduce((s, c) => s + c.length, 0);
  const doneCount = cols.reduce((s, c) => s + c.filter((e) => e.st === "done").length, 0);

  return (

        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "26px repeat(3, minmax(0, 1fr))", columnGap: 5, rowGap: 9 }}>
        <div />
        {[1, 2, 3].map((t) => (

        ))}

        {Array.from({ length: slots }, (_, s) => (
          <React.Fragment key={s}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, fontWeight: 800, color: C.sub }}>{s + 1}</div>
            {[0, 1, 2].map((ti) => {
              const e = cols[ti][s];
              return <div key={ti}>{e ? <TimelineSlotCard m={e.m} st={e.st} /> : <div style={{ height: 128, boxSizing: "border-box", background: C.zone, border: `1px dashed ${C.line}`, borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "center", color: C.sub, fontSize: 15 }}>空き</div>}</div>;
            })}
          </React.Fragment>
        ))}
      </div>
      {err && <div style={{ textAlign: "center", fontSize: 12, color: C.minus, marginTop: 12 }}>同期エラー: {err}</div>}
    </div>
  );
}
function TimelineSlotCard({ m, st }) {
  const names = m.names || ["", ""];
  const tot = m.tot || [0, 0];
  const rt = m.raceTo || [0, 0];
  const w = st === "done" ? matchWinnerIndex(m) : null;

  const style =
    st === "done"
      ? (m.bothLose
          ? { bg: "#fff", border: C.line, badgeBg: C.hillBg, badgeCol: C.hill, badge: "両者負け" }
          : { bg: "#fff", border: C.line, badgeBg: C.zone, badgeCol: C.sub, badge: "試合終了" })
      : st === "live"
      ? { bg: C.lightBlue, border: C.blue, badgeBg: C.blue, badgeCol: "#fff", badge: "試合中" }
      : st === "call"
      ? { bg: "#fff", border: C.blue, badgeBg: "#fff", badgeCol: C.blue, badge: "呼び出し中" }
      : { bg: C.zone, border: C.line, badgeBg: "transparent", badgeCol: C.sub, badge: "待機中" };

  // 終了した試合は勝敗だけを出す。点数は大小で勝敗が決まるわけではないので出さない
  const won = (i) => !m.bothLose && w === i;

  return (
    <div style={{
      height: 128, boxSizing: "border-box", background: style.bg,
      border: `${st === "live" || st === "call" ? 2 : 1}px solid ${style.border}`, borderRadius: 12,
      padding: "7px 4px", display: "flex", flexDirection: "column", justifyContent: "space-between",
      overflow: "hidden", opacity: st === "queued" ? 0.7 : 1,

      <div style={{ textAlign: "center" }}>
        <span style={{
          display: "inline-block", background: style.badgeBg, color: style.badgeCol,
          border: st === "call" ? `1.5px solid ${C.blue}` : "none",
          borderRadius: 12, padding: "3px 10px", fontSize: 13.5, fontWeight: 800, whiteSpace: "nowrap",
        }}>{style.badge}</span>
      </div>
      <div style={{ display: "flex", gap: 3 }}>
        {[0, 1].map((i) => (
          <div key={i} style={{ flex: 1, minWidth: 0, textAlign: "center" }}>
            <div style={{
              fontSize: 15.5, fontWeight: won(i) ? 900 : 700,
              color: st === "done" ? (won(i) ? C.win : C.sub) : (i === 0 ? C.blue : C.red),
              whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
            }}>{names[i]}</div>

            {st === "done" ? (
              <div style={{ fontSize: 26, fontWeight: 900, lineHeight: 1.3, color: won(i) ? C.win : C.sub }}>
                {won(i) ? "勝" : "負"}
              </div>

/* ========= 接続診断：保存できない原因（通信・上限・データ量）をその場で確認する ========= */
function ConnectionTest() {
  const [log, setLog] = useState(null);
  const [busy, setBusy] = useState(false);

  const run = async () => {
    setBusy(true);
    const lines = [];
    lines.push(`接続先：${FIREBASE_CONFIG.databaseURL}`);
    try {
      const t0 = Date.now();
      const rec = (await dbGet("/")) || {};
      lines.push(`① 読み込み：成功（${Date.now() - t0}ms）`);
      lines.push(`   データ量：${(JSON.stringify(rec).length / 1024).toFixed(1)} KB`);
      lines.push(`   メンバー：${(rec.roster || []).length}人`);
      lines.push(`   対戦データ：${Object.keys(rec.matches || {}).length}件`);
      // 実データには触れず、確認用の場所に書き込んで権限をチェックする
      const t1 = Date.now();
      await dbSet("_healthcheck", Date.now());
      lines.push(`② 書き込み：成功（${Date.now() - t1}ms）`);
      lines.push("→ 読み書きとも正常です");
    } catch (e) {
      const msg = e && e.message ? e.message : String(e);
      lines.push(`エラー：${msg}`);
      if (/permission|Permission/.test(msg)) lines.push("→ Realtime Databaseのルールが許可になっていません");
      else if (/FIREBASE_CONFIG|Invalid|invalid/.test(msg)) lines.push("→ databaseURL の値を確認してください");
      else lines.push("→ オフライン、または設定値が違う可能性があります");
    }
    setLog(lines);
    setBusy(false);
  };

  return (
    <div style={{ marginTop: 14 }}>
      <button onClick={run} disabled={busy} style={{ width: "100%", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.ink, fontSize: 13.5, fontWeight: 700, padding: "11px 0", cursor: "pointer", fontFamily: FONT }}>
        {busy ? "確認中…" : "🔌 保存できるか接続を確認する"}
      </button>
      {log && (
        <pre style={{ marginTop: 8, background: C.zone, border: `1px solid ${C.line}`, borderRadius: 10, padding: 10, fontSize: 11, lineHeight: 1.7, color: C.ink, whiteSpace: "pre-wrap", wordBreak: "break-all", fontFamily: "monospace" }}>{log.join("\n")}</pre>
      )}
    </div>
  );
}

  const [saving, setSaving] = useState(false);
  const [saveMsg, setSaveMsg] = useState(null);
  const saveTimer = useRef(null);
  const rosterRef = useRef(roster);
  rosterRef.current = roster;
  const backup = useRef(loadRosterBackup()).current;

  // 保存は「ユーザーが実際に編集した時」だけ走らせる。
  // 以前は roster の変化を useEffect で監視していたため、読み込みに失敗して空のままこのタブを開くと、
  // マウント時に空リストで上書き保存されてしまっていた
  const persist = (allowEmpty) => {
    if (!loaded) return; // 読み込みに成功していない間は絶対に保存しない
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      setSaving(true);
      try {
        await saveRoster(rosterRef.current, allowEmpty);
        setSaveMsg(null);
      } catch (e) {
        setSaveMsg(String(e && e.message ? e.message : e));
      }
      setSaving(false);
    }, 600);
  };

  const update = (id, k, v) => { setRoster((rs) => rs.map((p) => (p.id === id ? { ...p, [k]: v } : p))); persist(); };
  const remove = (id) => { setRoster((rs) => rs.filter((p) => p.id !== id)); persist(true); };
  const add = () => {
    if (roster.length >= 40) return;
    setRoster((rs) => [...rs, { id: nid(), name: `選手${rs.length + 1}`, r: "" }]);
    persist();
  };
  const restoreBackup = () => {
    if (!backup.length) return;
    if (!window.confirm(`この端末に残っている${backup.length}人分のバックアップで復元します。よろしいですか？`)) return;
    setRoster(backup);
    _id = Math.max(...backup.map((p) => p.id || 0)) + 1;
    persist(true);
  };

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "20px 16px 24px", color: C.ink }}>
      <div style={{ textAlign: "center", marginBottom: 14 }}>
        <div style={{ fontSize: 22, fontWeight: 800 }}>メンバーリスト</div>
        <div style={{ fontSize: 13, color: C.sub, marginTop: 4 }}>{saving ? "保存中…" : "名前とファーゴレート（共有）"}</div>

      </div>

      {loadError && (
        <Notice>メンバーの読み込みに失敗しました。データを守るため編集の保存を停止しています。通信を確認して「🔄 更新」を押してください。（{loadError}）</Notice>
      )}
      {saveMsg && <Notice>{saveMsg}</Notice>}
      {loaded && roster.length === 0 && backup.length > 0 && (
        <div style={{ marginBottom: 12 }}>
          <Notice>共有リストが空です。この端末に{backup.length}人分のバックアップが残っています。</Notice>
          <button onClick={restoreBackup} style={{ width: "100%", background: C.win, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontSize: 14.5, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>↺ バックアップから復元する</button>
        </div>
      )}
      {roster.map((p) => (
        <div key={p.id} style={{ display: "flex", gap: 8, marginBottom: 8, alignItems: "center" }}>
          <input value={p.name} onChange={(e) => update(p.id, "name", e.target.value.slice(0, 12))}
            style={{ flex: 1, minWidth: 0, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.ink, fontSize: 15, padding: "10px 12px", outline: "none", fontFamily: FONT }} />

        </div>

  );

/* ========= 対戦表タブ（対戦作成＝実質のB1本体） ========= */
/* ========= 試合割りタブ：総当たり風スケジュールを自動生成して一括登録 ========= */
const BULK_TABLES = 3;

function bulkMakePlan(N, G) {
  const total = (N * G) / 2;
  if (!Number.isInteger(total)) return { error: "人数と試合数の積が奇数です。総試合数が半端になります。" };
  const slots = Math.ceil(total / BULK_TABLES);
  const sizes = [];
  for (let s = 0; s < slots; s++) sizes.push(s < slots - 1 ? BULK_TABLES : total - BULK_TABLES * (slots - 1));
  let lower = 0;
  for (let s = 0; s < slots - 1; s++) {
    const need = sizes[s] * 2 + sizes[s + 1] * 2 - N;
    const cap = Math.min(sizes[s], sizes[s + 1]);
    if (need > cap) {
      return { error: `この人数では成立しません。1コマに${sizes[s] * 2}人必要ですが、同じ卓でしか連投できないため次コマへ持ち越せるのは最大${cap}人です。` };
    }
    if (need > 0) lower += need;
  }
  return { total, slots, sizes, lower };
}
function bulkMulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function bulkAttempt(N, G, plan, rng, ceiling, nodeLimit) {
  const { total, slots, sizes } = plan;
  const pos = [];
  for (let s = 0; s < slots; s++) for (let t = 0; t < sizes[s]; t++) pos.push([s, t]);

  const deg = new Int32Array(N + 1);
  const used = new Set();
  const seat = Array.from({ length: slots }, () => new Map());
  const board = [];
  let cost = 0, nodes = 0, best = null;

  const viable = (s) => {
    const left = slots - s - 1;
    for (let x = 1; x <= N; x++) {
      const need = G - deg[x];
      if (!need) continue;
      let room = left;
      if (seat[s].has(x) && s > 0 && seat[s - 1].has(x)) room -= 1;
      if (need > room - Math.floor(room / 3)) return false;
    }
    if (left > 0) {
      let free = 0;
      for (let x = 1; x <= N; x++) {
        if (deg[x] >= G) continue;
        if (seat[s].has(x) && s > 0 && seat[s - 1].has(x)) continue;
        free++;
      }
      if (free < sizes[s + 1] * 2) return false;
    }
    return true;
  };

  const walk = (p) => {
    if (nodes++ > nodeLimit) throw new Error("budget");
    if (p === total) { best = { board: board.map((m) => ({ ...m })), cost }; return true; }
    const [s, t] = pos[p];
    const here = seat[s], prev = s > 0 ? seat[s - 1] : null, back = s > 1 ? seat[s - 2] : null;

    const cands = [];
    for (let a = 1; a <= N; a++) {
      if (deg[a] >= G || here.has(a)) continue;
      for (let b = a + 1; b <= N; b++) {
        if (deg[b] >= G || here.has(b) || used.has(a * 32 + b)) continue;
        let carry = 0, ok = true;
        for (const x of [a, b]) {
          if (prev && prev.has(x)) {
            if (prev.get(x) !== t) { ok = false; break; }
            if (back && back.has(x)) { ok = false; break; }
            carry++;
          }
        }
        if (!ok || cost + carry >= ceiling) continue;
        cands.push({ a, b, carry, score: carry * 1000 - (2 * G - deg[a] - deg[b]) * 10 + rng() * 5 });
      }
    }
    cands.sort((x, y) => x.score - y.score);

    for (const c of cands) {
      deg[c.a]++; deg[c.b]++;
      used.add(c.a * 32 + c.b);
      here.set(c.a, t); here.set(c.b, t);
      cost += c.carry;
      board.push({ slot: s, table: t, a: c.a, b: c.b, carry: c.carry });
      if (t !== sizes[s] - 1 || viable(s)) { if (walk(p + 1)) return true; }
      board.pop(); cost -= c.carry;
      here.delete(c.a); here.delete(c.b);
      used.delete(c.a * 32 + c.b);
      deg[c.a]--; deg[c.b]--;
    }
    return false;
  };

  try { walk(0); } catch (e) { if (e.message !== "budget") throw e; }
  return best;
}
function bulkGenerate(N, G) {
  const plan = bulkMakePlan(N, G);
  if (plan.error) return { error: plan.error };
  let best = null, ceiling = Infinity;
  const start = Date.now();
  for (let r = 0; r < 400; r++) {
    if (Date.now() - start > 2500) break;
    const got = bulkAttempt(N, G, plan, bulkMulberry(r * 7919 + 13), ceiling, 40000);
    if (got && got.cost < ceiling) { best = got; ceiling = got.cost; if (best.cost <= plan.lower) break; }
  }
  if (!best) return { error: "条件を満たす組み合わせが見つかりませんでした。人数か試合数を変えてください。" };
  return { plan, board: best.board, cost: best.cost, optimal: best.cost <= plan.lower };
}

function BulkScheduleTab({ roster }) {
  const s0 = useMemo(() => loadSettings(), []);
  const [players, setPlayers] = useState(s0.players || Math.max(6, Math.min(16, roster.length || 12)));
  const [games, setGames] = useState(s0.games || 4);
  const [lenPct, setLenPct] = useState(s0.lenPct || 100);
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState(false);
  const [registering, setRegistering] = useState(false);
  const [msg, setMsg] = useState(null);
  const [startH, setStartH] = useState(s0.startH || "11");
  const [startM, setStartM] = useState(s0.startM || "00");
  const [endH, setEndH] = useState(s0.endH || "17");
  const [endM, setEndM] = useState(s0.endM || "00");
  const [changeoverMin, setChangeoverMin] = useState(s0.changeoverMin || "5");
  const [per100Min, setPer100Min] = useState(s0.per100Min || "60");

  // 変更のたびに端末へ保存し、次回起動時に復元できるようにする
  useEffect(() => {
    saveSettings({ players, games, lenPct, startH, startM, endH, endM, changeoverMin, per100Min });
  }, [players, games, lenPct, startH, startM, endH, endM, changeoverMin, per100Min]);

  const timeEstimate = useMemo(() => {
    if (!result || result.error) return null;
    const sH = parseInt(startH, 10), sM = parseInt(startM, 10);
    const eH = parseInt(endH, 10), eM = parseInt(endM, 10);
    const chg = parseInt(changeoverMin, 10) || 0;
    const per100 = parseInt(per100Min, 10) || 0;
    if ([sH, sM, eH, eM].some((v) => isNaN(v))) return null;
    const matchMin = per100 * (lenPct / 100);
    const slots = result.plan.slots;
    const totalMin = slots * matchMin + (slots - 1) * chg;
    const startTotal = sH * 60 + sM;
    const endTotal = eH * 60 + eM;
    const finishTotal = startTotal + totalMin;
    const fits = finishTotal <= endTotal;
    const fmt = (mins) => {
      const m = Math.round(mins);
      const h = Math.floor(((m % 1440) + 1440) % 1440 / 60);
      const mm = ((m % 60) + 60) % 60;
      return `${String(h).padStart(2, "0")}:${String(Math.round(mm)).padStart(2, "0")}`;
    };
    return { matchMin, totalMin, finishTotal, fits, diff: Math.abs(endTotal - finishTotal), finishLabel: fmt(finishTotal) };
  }, [result, startH, startM, endH, endM, changeoverMin, per100Min, lenPct]);

  // 終了時刻ちょうどに収まる「試合の長さ（%）」を逆算
  const idealLenPct = useMemo(() => {
    if (!result || result.error) return null;
    const sH = parseInt(startH, 10), sM = parseInt(startM, 10);
    const eH = parseInt(endH, 10), eM = parseInt(endM, 10);
    const chg = parseInt(changeoverMin, 10) || 0;
    const per100 = parseInt(per100Min, 10) || 0;
    if ([sH, sM, eH, eM].some((v) => isNaN(v)) || per100 <= 0) return null;
    const slots = result.plan.slots;
    const available = (eH * 60 + eM) - (sH * 60 + sM) - (slots - 1) * chg;
    if (available <= 0) return { pct: 40, clampedLow: true };
    const raw = (available / slots / per100) * 100;
    const rounded = Math.round(raw / 5) * 5;
    if (rounded > 140) return { pct: 140, clampedHigh: true };
    if (rounded < 40) return { pct: 40, clampedLow: true };
    return { pct: rounded };
  }, [result, startH, startM, endH, endM, changeoverMin, per100Min]);

  const run = () => {
    setBusy(true); setMsg(null);
    setTimeout(() => { setResult(bulkGenerate(players, games)); setBusy(false); }, 20);
  };

  const rows = useMemo(() => {
    if (!result || result.error) return null;
    const base = Date.now();
    return result.board.map((m, i) => {
      const p1 = roster[m.a - 1] || { name: `選手${m.a}`, r: "" };
      const p2 = roster[m.b - 1] || { name: `選手${m.b}`, r: "" };
      const R1 = parseInt(p1.r, 10), R2 = parseInt(p2.r, 10);
      const race = R1 > 0 && R2 > 0 ? computeRace(R1, R2, lenPct) : { rt1: 0, rt2: 0 };
      const mins = Math.round((parseInt(per100Min, 10) || 60) * (lenPct / 100));
      return { ...m, seq: i, matchId: randomMatchId(), createdAt: base + i * 1000, n1: p1.name, n2: p2.name, r1: R1 || 0, r2: R2 || 0, rt1: race.rt1, rt2: race.rt2, lenPct, matchMinutes: mins };
    });
  }, [result, roster, lenPct, per100Min]);

  const grid = useMemo(() => {
    if (!rows) return null;
    const map = new Map();
    for (const m of rows) {
      if (!map.has(m.slot)) map.set(m.slot, [null, null, null]);
      map.get(m.slot)[m.table] = m;
    }
    return [...map.entries()].sort((a, b) => a[0] - b[0]);
  }, [rows]);

  const register = async () => {
    if (!rows || registering) return;
    if (!window.confirm(`${rows.length}件の対戦を登録します。\n現在の対戦はすべて置き換えられます。よろしいですか？`)) return;
    setRegistering(true);
    try {
      const now = Date.now();
      const next = {};
      rows.forEach((m) => {
        next[m.matchId] = {
          version: 1, phase: "banking", brk: null, tot: [0, 0], rack: 1,
          balls: Array.from({ length: 9 }, (_, i) => ({ n: i + 1, loc: "c", dead: false })),
          lastResult: null, hist: [], raceTo: [m.rt1, m.rt2],
          names: [m.n1, m.n2], table: m.table + 1,

/* ========= タイムラインタブ：対戦カードを作成順（古い→新しい）に縦並び。進行中はリアルタイムスコア、タップでQR ========= */
function fmtElapsed(ms) {
  if (!ms || ms < 0) return "";
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}分${String(s % 60).padStart(2, "0")}秒`;
}
function getFinishedMatches(matches) {
  const list = [];
  for (const id in matches) {
    const m = matches[id];
    if (!m || !isMatchFinished(m)) continue;
    list.push({ ...normalizeMatch(m), id });
  }
  list.sort((a, b) => (b.finishedAt || b.updatedAt || 0) - (a.finishedAt || a.updatedAt || 0));
  return list;
}

// 対戦の「試合の長さ・持ち時間・目標点」だけを部分更新するための組み立て。
// 対戦データ全体を書き戻さないので、スコアラーが入力中のスコアを消してしまわない
function planMatchUpdate(updates, qm, lenPct, minutes, now) {
  const R1 = qm.r1 || 0, R2 = qm.r2 || 0;
  const base = qm.raceTo || [0, 0];
  const rt = R1 > 0 && R2 > 0 ? computeRace(R1, R2, lenPct) : { rt1: base[0], rt2: base[1] };
  updates[qm.id + "/raceTo"] = [rt.rt1, rt.rt2];
  updates[qm.id + "/lenPct"] = lenPct;
  updates[qm.id + "/matchMinutes"] = minutes;
  updates[qm.id + "/version"] = (qm.version || 1) + 1;
  updates[qm.id + "/updatedAt"] = now;
}

    queues.forEach((q) => { if (q[0]) q[0].names.forEach((n) => playingNow.add(n)); });
    const refereeingNow = new Set();
    queues.forEach((q) => { if (q[0] && q[0].referee) refereeingNow.add(q[0].referee); });
    const nextAtThisTable = new Set(queues[ti][1] ? queues[ti][1].names : []);
    const nextAtOtherTable = new Set();
    queues.forEach((q, qi) => { if (qi !== ti && q[1]) q[1].names.forEach((n) => nextAtOtherTable.add(n)); });

    return roster
      .filter((p) => p.name && !playingNow.has(p.name) && !refereeingNow.has(p.name))
      .map((p) => {
        // 0: 次試合なし（優先）／1: 同卓の次試合／2: 別卓の次試合（後回し）
        const tier = nextAtThisTable.has(p.name) ? 1 : nextAtOtherTable.has(p.name) ? 2 : 0;
        const count = refereeCounts[p.name] || 0;
        return { ...p, tier, count };
      })
      .sort((a, b) => a.tier - b.tier || a.count - b.count);
  };

  const [refereeQR, setRefereeQR] = useState(null); // 呼び出し中のレフェリー { name, match }
  const assignReferee = async (ti, name, target) => {
    if (!target || refereeBusy) return;
    setRefereeBusy(true);
    try {
      // 対戦の一部だけを更新する。スコアラーが入力中の値には触れない
      await dbUpdate("matches/" + target.id, {
        referee: name, version: (target.version || 1) + 1, updatedAt: Date.now(),
      });
      const prevCount = (await dbGet("refereeCounts/" + name)) || 0;
      await dbSet("refereeCounts/" + name, prevCount + 1);
      setRefereeOpen(null);
      setRefereeQR({ name, match: target });
      refresh();
    } catch {}
    setRefereeBusy(false);
  };

  const [snapBusy, setSnapBusy] = useState(null);
  const [snapMsg, setSnapMsg] = useState(null);

  const perTableEstimate = (ti) => {
    const q = queues[ti];
    if (!q.length) return null;
    let totalMin = 0;
    q.forEach((m, idx) => {
      if (idx === 0 && m.startedAt && m.matchMinutes) {
        const elapsed = (Date.now() - m.startedAt) / 60000;
        totalMin += Math.max(0, m.matchMinutes - elapsed);
      } else {
        totalMin += m.matchMinutes || 30;
      }
    });
    return new Date(Date.now() + totalMin * 60000);
  };

  // 終了予定時刻に対して、この卓は順調か・押しているかを判定
  const tableScheduleStatus = (ti) => {
    const est = perTableEstimate(ti);
    if (!est) return null;
    const cfg = loadSettings();
    const eH = parseInt(cfg.endH, 10), eM = parseInt(cfg.endM, 10);
    if (isNaN(eH) || isNaN(eM)) return null;
    const targetD = new Date(); targetD.setHours(eH, eM, 0, 0);
    const diffMin = Math.round((targetD - est) / 60000);
    // 表示上、前後5分の誤差は「順調」扱いにする（自動調整の計算自体は誤差ゼロを狙う従来通り）
    return diffMin >= -5
      ? { ok: true, text: `余裕${Math.max(0, diffMin)}分` }
      : { ok: false, text: `押し${Math.abs(diffMin)}分` };
  };

  // 現在対戦中は既に組まれているので対象外。次戦以降だけを、指定した最終試合の終了予定時刻から逆算して調整する
  const applyTableEndTime = async (ti) => {
    if (snapBusy != null) return;
    const eH = parseInt(tEndH, 10), eM = parseInt(tEndM, 10);
    if (isNaN(eH) || isNaN(eM)) { setSnapMsg({ ok: false, text: "終了予定時刻を入力してください" }); return; }
    const cfg = loadSettings();
    const per100 = parseInt(cfg.per100Min, 10) || 60;
    const calc = computeTableAdjustment(queues[ti], eH, eM, per100);
    if (!calc) { setSnapMsg({ ok: false, text: "次の試合がありません" }); return; }
    if (calc.error) { setSnapMsg({ ok: false, text: calc.error }); return; }
    setSnapBusy(ti);
    try {
      const now = Date.now();
      const updates = {};
      calc.future.forEach((qm) => planMatchUpdate(updates, qm, calc.newLenPct, calc.newMinutes, now));
      await dbUpdate("matches", updates);
      setTLenPct(calc.newLenPct);

      let finalEndH = String(eH).padStart(2, "0"), finalEndM = String(eM).padStart(2, "0");
      let msg = `卓${ti + 1}：次戦以降を${calc.newLenPct}%・${calc.newMinutes}分に設定しました`;
      if (calc.hitFloor) {
        // 下限40%でも指定時刻に間に合わないので、最終試合の終了予定時刻自体を現実的な時刻へ更新する
        const realFinish = new Date(Date.now() + calc.curRemainMin * 60000 + calc.future.length * calc.newMinutes * 60000);
        finalEndH = String(realFinish.getHours()).padStart(2, "0");
        finalEndM = String(realFinish.getMinutes()).padStart(2, "0");
        setTEndH(finalEndH); setTEndM(finalEndM);
        msg += `（40%が下限のため終了予定を${finalEndH}:${finalEndM}に更新）`;
      }
      saveSettings({ endH: finalEndH, endM: finalEndM });
      setSnapMsg({ ok: true, text: msg });
      refresh();
    } catch (e) {
      setSnapMsg({ ok: false, text: "反映に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setSnapBusy(null);
  };

  const [tEndH, setTEndH] = useState("17");
  const [tEndM, setTEndM] = useState("00");

  const openTableAdjust = (ti) => {
    setRefereeOpen(null);
    setShowMoreTi(null);
    setShowGlobalAdjust(false);
    const future = queues[ti].slice(1); // 現在対戦中は対象外
    const avgLen = future.length ? Math.round(future.reduce((s, m) => s + (m.lenPct || 100), 0) / future.length / 5) * 5 : 100;
    setTLenPct(avgLen);
    const cfg = loadSettings();
    setTPer100(parseInt(cfg.per100Min, 10) || 60);
    setTEndH(cfg.endH || "17");
    setTEndM(cfg.endM || "00");
    setTableAdjust(ti);
  };
  // 100%のときの時間（分）は全卓共通の基準値。ここで変えたら全卓の次戦以降にまとめて反映する
  const applyTableAdjust = async () => {
    if (tableAdjust == null || snapBusy != null) return;
    const newMinutes = Math.max(1, Math.round(tPer100 * (tLenPct / 100)));
    setSnapBusy(tableAdjust);
    try {
      const now = Date.now();
      const updates = {};
      let count = 0;
      [0, 1, 2].forEach((oi) => {
        queues[oi].slice(1).forEach((qm) => { planMatchUpdate(updates, qm, tLenPct, newMinutes, now); count++; });
      });
      if (count === 0) { setSnapMsg({ ok: false, text: "次の試合がありません" }); setSnapBusy(null); return; }
      await dbUpdate("matches", updates);
      saveSettings({ per100Min: String(tPer100) });
      setSnapMsg({ ok: true, text: `全卓（${count}試合）を${tLenPct}%・${newMinutes}分（100%基準${tPer100}分）に反映しました` });
      refresh();
    } catch (e) {
      setSnapMsg({ ok: false, text: "反映に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setSnapBusy(null);
  };

  // 終了予定時刻は全卓共通。この時刻に対して、卓ごとに押し／順調／余裕を見て、それぞれ自動調整する
  const applyAllTables = async () => {
    if (tableAdjust == null || snapBusy != null) return;
    const ti = tableAdjust;
    const eH = parseInt(tEndH, 10), eM = parseInt(tEndM, 10);
    if (isNaN(eH) || isNaN(eM)) { setSnapMsg({ ok: false, text: "終了予定時刻を入力してください" }); return; }
    setSnapBusy(ti);
    try {
      const cfg = loadSettings();
      const per100 = parseInt(cfg.per100Min, 10) || 60;
      const now = Date.now();
      const updates = {};
      let count = 0;
      const skipped = [];
      let latestFinish = null; // 40%下限に達した卓の中で、一番遅い現実的な終了時刻
      [0, 1, 2].forEach((oi) => {
        const calc = computeTableAdjustment(queues[oi], eH, eM, per100);
        if (!calc || calc.error) { skipped.push(oi + 1); return; }
        calc.future.forEach((qm) => { planMatchUpdate(updates, qm, calc.newLenPct, calc.newMinutes, now); count++; });
        if (calc.hitFloor) {
          const realFinish = new Date(Date.now() + calc.curRemainMin * 60000 + calc.future.length * calc.newMinutes * 60000);
          if (!latestFinish || realFinish > latestFinish) latestFinish = realFinish;
        }
        if (oi === ti) { setTLenPct(calc.newLenPct); }
      });
      if (count === 0) { setSnapMsg({ ok: false, text: "反映できる対戦がありませんでした" }); setSnapBusy(null); return; }
      await dbUpdate("matches", updates);
      let finalEndH = String(eH).padStart(2, "0"), finalEndM = String(eM).padStart(2, "0");
      let msg = `全卓（${count}試合）に終了予定 ${tEndH}:${tEndM} を反映し、それぞれ自動調整しました`;
      if (latestFinish) {
        finalEndH = String(latestFinish.getHours()).padStart(2, "0");
        finalEndM = String(latestFinish.getMinutes()).padStart(2, "0");
        setTEndH(finalEndH); setTEndM(finalEndM);
        msg += `（40%が下限の卓があるため終了予定を${finalEndH}:${finalEndM}に更新）`;
      }
      saveSettings({ endH: finalEndH, endM: finalEndM });
      if (skipped.length) msg += `（卓${skipped.join("・")}は対象外でした）`;
      setSnapMsg({ ok: true, text: msg });
      refresh();
    } catch (e) {
      setSnapMsg({ ok: false, text: "反映に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setSnapBusy(null);
  };

  // 押している卓（1分でも）と、余裕がありすぎる卓（10分超）だけを自動調整する。順調な卓はそのまま
  const applyConditionalAllTables = async () => {
    if (globalBusy) return;
    const eH = parseInt(tEndH, 10), eM = parseInt(tEndM, 10);
    if (isNaN(eH) || isNaN(eM)) { setSnapMsg({ ok: false, text: "終了予定時刻を入力してください" }); return; }
    setGlobalBusy(true);
    try {
      const cfg = loadSettings();
      const per100 = parseInt(cfg.per100Min, 10) || 60;
      const now = Date.now();
      const updates = {};
      let count = 0;
      const adjustedTables = [];
      let latestFinish = null;
      [0, 1, 2].forEach((oi) => {
        const est = perTableEstimate(oi);
        if (!est) return; // 予定がない卓は無視
        const targetD = new Date(); targetD.setHours(eH, eM, 0, 0);
        const diffMin = Math.round((targetD - est) / 60000);
        const needsAdjust = diffMin < 0 || diffMin > 10;
        if (!needsAdjust) return; // 順調な範囲は触らない
        const calc = computeTableAdjustment(queues[oi], eH, eM, per100);
        if (!calc || calc.error) return;
        calc.future.forEach((qm) => { planMatchUpdate(updates, qm, calc.newLenPct, calc.newMinutes, now); count++; });
        adjustedTables.push(oi + 1);
        if (calc.hitFloor) {
          const realFinish = new Date(Date.now() + calc.curRemainMin * 60000 + calc.future.length * calc.newMinutes * 60000);
          if (!latestFinish || realFinish > latestFinish) latestFinish = realFinish;
        }
      });
      if (count === 0) {
        setSnapMsg({ ok: true, text: "調整が必要な卓はありませんでした" });
        setGlobalBusy(false);
        return;
      }
      await dbUpdate("matches", updates);
      let finalEndH = String(eH).padStart(2, "0"), finalEndM = String(eM).padStart(2, "0");
      let msg = `卓${adjustedTables.join("・")}（${count}試合）を自動調整しました`;
      if (latestFinish) {
        finalEndH = String(latestFinish.getHours()).padStart(2, "0");
        finalEndM = String(latestFinish.getMinutes()).padStart(2, "0");
        setTEndH(finalEndH); setTEndM(finalEndM);
        msg += `（40%が下限のため終了予定を${finalEndH}:${finalEndM}に更新）`;
      }
      saveSettings({ endH: finalEndH, endM: finalEndM });
      setSnapMsg({ ok: true, text: msg });
      refresh();
    } catch (e) {
      setSnapMsg({ ok: false, text: "反映に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setGlobalBusy(false);
  };

  // 100%のときの時間（基準値）だけを更新し、各対戦の長さ％はそのまま持ち時間だけ再計算する。見積もり自体がずれていた時用
  const applyPer100ToAll = async () => {
    if (globalBusy) return;
    setGlobalBusy(true);
    try {
      const now = Date.now();
      const updates = {};
      let count = 0;
      [0, 1, 2].forEach((oi) => {
        queues[oi].slice(1).forEach((qm) => {
          const lenPct = qm.lenPct || 100;
          updates[qm.id + "/matchMinutes"] = Math.max(1, Math.round(tPer100 * (lenPct / 100)));
          updates[qm.id + "/version"] = (qm.version || 1) + 1;
          updates[qm.id + "/updatedAt"] = now;
          count++;
        });
      });
      if (count === 0) { setSnapMsg({ ok: false, text: "対象の対戦がありませんでした" }); setGlobalBusy(false); return; }
      await dbUpdate("matches", updates);
      saveSettings({ per100Min: String(tPer100) });
      setSnapMsg({ ok: true, text: `100%の時間を${tPer100}分に更新し、全卓${count}試合の持ち時間を再計算しました` });
      refresh();
    } catch (e) {
      setSnapMsg({ ok: false, text: "反映に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setGlobalBusy(false);
  };

  const urlFor = (m) => {
    const rt = m.raceTo || [0, 0];
    const url = new URL(B2_URL);
    url.searchParams.set("m", m.id);
    url.searchParams.set("p1", m.names[0]);
    url.searchParams.set("p2", m.names[1]);
    url.searchParams.set("r1", 0);
    url.searchParams.set("r2", 0);
    url.searchParams.set("len", 100);
    url.searchParams.set("t", m.table);
    url.searchParams.set("rt1", rt[0]);
    url.searchParams.set("rt2", rt[1]);
    return url.toString();
  };

  const [qrMatch, setQrMatch] = useState(null); // 次戦以降のQRのみを表示する軽量モーダル
  const [showMoreTi, setShowMoreTi] = useState(null); // 「さらに次を見る」を展開中の卓番号(0-2) or null
  const toggleShowMore = (ti) => {
    if (showMoreTi === ti) { setShowMoreTi(null); return; }
    setTableAdjust(null);
    setRefereeOpen(null);
    setShowGlobalAdjust(false);
    setShowMoreTi(ti);
  };

  // 卓のカードをタップ：現在対戦の調整パネルをその場で展開／格納
  const toggleExpand = (ti) => {
    if (tableAdjust === ti) { setTableAdjust(null); return; }
    setShowMoreTi(null);
    openTableAdjust(ti);
  };

  const toggleGlobalAdjust = () => {
    if (showGlobalAdjust) { setShowGlobalAdjust(false); return; }
    setTableAdjust(null);
    setRefereeOpen(null);
    setShowMoreTi(null);
    const cfg = loadSettings();
    setTEndH(cfg.endH || "17");
    setTEndM(cfg.endM || "00");
    setTPer100(parseInt(cfg.per100Min, 10) || 60);
    setShowGlobalAdjust(true);
  };

  const _cfg = loadSettings();
  const sharedEnd = (_cfg.endH && _cfg.endM) ? `${_cfg.endH}:${_cfg.endM}` : "未設定";

  return (
    <div style={{ padding: "16px 12px 24px", color: C.ink }}>
      {loadErr && <Notice>データを取得できません：{loadErr}</Notice>}

      {showGlobalAdjust && (
        <div style={{ background: C.zone, border: `2px solid ${C.blue}`, borderRadius: 14, padding: 16, marginBottom: 16, position: "relative" }}>
          <button onClick={() => setShowGlobalAdjust(false)} style={{ position: "absolute", top: 10, right: 12, background: "none", border: "none", color: C.sub, fontSize: 20, fontWeight: 700, cursor: "pointer", lineHeight: 1, padding: 4 }}>✖️</button>
          <div style={{ fontSize: 17, fontWeight: 900, color: C.blue, textAlign: "center", marginBottom: 16 }}>全卓の調整</div>

          <div style={{ fontSize: 12, fontWeight: 700, color: C.ink, textAlign: "center", marginBottom: 6 }}>終了予定時刻（全卓共通）</div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 10 }}>
            <input inputMode="numeric" value={tEndH} onChange={(e) => setTEndH(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} style={{ width: 64, textAlign: "center", border: `1px solid ${C.line}`, borderRadius: 8, padding: "10px 0", fontSize: 20, fontWeight: 800, fontFamily: FONT }} />
            <span style={{ fontSize: 18, fontWeight: 800, color: C.sub }}>:</span>
            <input inputMode="numeric" value={tEndM} onChange={(e) => setTEndM(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} style={{ width: 64, textAlign: "center", border: `1px solid ${C.line}`, borderRadius: 8, padding: "10px 0", fontSize: 20, fontWeight: 800, fontFamily: FONT }} />
          </div>
          <button onClick={applyConditionalAllTables} disabled={globalBusy} style={{ width: "100%", background: C.win, color: "#fff", border: "none", borderRadius: 10, padding: "13px 0", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT, marginBottom: 6 }}>
            {globalBusy ? "計算中…" : "✓ 押している卓・余裕がある卓だけ自動調整"}
          </button>
          <div style={{ fontSize: 10.5, color: C.sub, textAlign: "center", marginBottom: 16 }}>1分でも押している卓は間に合うよう短く、10分を超えて余裕がある卓は伸ばします。順調な卓はそのままです</div>

          <div style={{ borderTop: `2px solid ${C.line}`, paddingTop: 16 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: C.ink, textAlign: "center", marginBottom: 4 }}>100%の時間（全卓共通）</div>
            <div style={{ fontSize: 10.5, color: C.sub, textAlign: "center", marginBottom: 8 }}>そもそもの見積もりがずれていると感じたら、ここで調整</div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10 }}>
              <button onClick={() => setTPer100((v) => Math.max(10, v - 1))} style={{ ...homeStepBtn, width: 44, height: 44, fontSize: 20 }}>−</button>
              <div style={{ flex: 1, textAlign: "center", fontSize: 18, fontWeight: 800 }}>{tPer100}分</div>
              <button onClick={() => setTPer100((v) => Math.min(180, v + 1))} style={{ ...homeStepBtn, width: 44, height: 44, fontSize: 20 }}>＋</button>
            </div>
            <button onClick={applyPer100ToAll} disabled={globalBusy} style={{ width: "100%", background: C.ink, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>
              {globalBusy ? "反映中…" : "この基準値を全卓に反映する"}
            </button>
          </div>

          {snapMsg && <div style={{ marginTop: 12, textAlign: "center", fontSize: 12, fontWeight: 700, color: snapMsg.ok ? C.win : C.minus }}>{snapMsg.ok ? "✓ " : "✗ "}{snapMsg.text}</div>}
        </div>
      )}

      {(() => {
        const tinfo = [0, 1, 2].map((ti) => {
          const q = queues[ti];
          const cur = q[0];
          const live = cur && cur.startedAt ? cur : null; // 「対戦中」に出す対象：実際に始まっている試合のみ
          const callTarget = cur && !cur.startedAt ? cur : (q[1] || null); // 「呼び出し」に出す対象：次に呼ぶべき試合
          const rest = q.slice(cur && !cur.startedAt ? 1 : 2);
          const est = perTableEstimate(ti);
          const status = tableScheduleStatus(ti);
          const settingSrc = callTarget || live;
          return { ti, q, cur, live, callTarget, rest, est, status, settingSrc };
        });
        return (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0, 1fr))", columnGap: 6, rowGap: 8, alignItems: "start" }}>
            {/* 見出し行 */}
            {tinfo.map(({ ti }) => (
              <div key={ti} style={{ textAlign: "center", fontSize: 20, fontWeight: 900, color: C.ink }}>{ti + 1}</div>
            ))}

            {/* 終了目安・押し具合・設定 */}
            {tinfo.map(({ ti, cur, status, settingSrc }) => (
              <div key={ti} onClick={() => toggleExpand(ti)} style={{
                position: "relative", textAlign: "center", cursor: "pointer", boxSizing: "border-box", width: "100%",
                background: tableAdjust === ti ? C.blue : (status && !status.ok ? "#FFF5F4" : "#fff"),
                border: `2px ${tableAdjust === ti ? "solid" : "dashed"} ${tableAdjust === ti ? C.blue : status && !status.ok ? C.minus : C.blue}`,
                borderRadius: 14, padding: "10px 6px 8px",
              }}>
                <span style={{ position: "absolute", top: 6, right: 8, fontSize: 12, color: tableAdjust === ti ? "#fff" : C.blue, opacity: 0.8 }}>✎</span>
                {cur ? (
                  <>
                    <div style={{
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontSize: 13, fontWeight: 800, borderRadius: 8, padding: "5px 8px", lineHeight: 1.3,
                      color: tableAdjust === ti ? C.blue : (status ? (status.ok ? C.win : "#fff") : C.sub),
                      background: tableAdjust === ti ? "#fff" : (status ? (status.ok ? C.zone : C.minus) : "transparent"),
                    }}>
                      {status ? (status.ok ? `☑️${status.text}` : `⚠️${status.text}`) : "–"}
                    </div>
                    {settingSrc && (settingSrc.lenPct || settingSrc.matchMinutes) && (
                      <div style={{ marginTop: 6, fontSize: 13, fontWeight: 700, color: tableAdjust === ti ? "#fff" : C.ink }}>
                        <div>🎱{settingSrc.lenPct || 100}%</div>
                        <div>⏰{settingSrc.matchMinutes || 30}分</div>
                      </div>
                    )}
                  </>
                ) : (
                  <div style={{ fontSize: 13, color: tableAdjust === ti ? "#fff" : C.sub, marginTop: 4 }}>予定なし</div>
                )}
              </div>
            ))}

            {/* 卓調整パネル：タップした卓の設定カードのすぐ下に全幅で展開する。開いている間は対戦中／次戦は隠す */}
            {tableAdjust != null && queues[tableAdjust][0] && (() => {
              const ti = tableAdjust;
              const cur = queues[ti][0];
              const future = queues[ti].slice(1);
              return (
                <div style={{ gridColumn: "1 / -1", background: C.zone, border: `2px solid ${C.blue}`, borderRadius: 14, padding: 16, position: "relative" }}>
                  <button onClick={() => setTableAdjust(null)} style={{ position: "absolute", top: 10, right: 12, background: "none", border: "none", color: C.sub, fontSize: 20, fontWeight: 700, cursor: "pointer", lineHeight: 1, padding: 4 }}>✖️</button>
                  <div style={{ fontSize: 17, fontWeight: 900, color: C.blue, textAlign: "center", marginBottom: 16 }}>卓{ti + 1} を調整中</div>

                  <div style={{ fontSize: 13, color: C.ink, marginBottom: 10, fontWeight: 800, textAlign: "center" }}>⚙ 次戦以降（残り{future.length}試合）を調整</div>

                  {future.length === 0 ? (
                    <div style={{ fontSize: 12.5, color: C.sub, textAlign: "center", padding: "8px 0 16px" }}>この卓は現在の対戦が最後です</div>
                  ) : (
                    <>
                      <div style={{ fontSize: 12, fontWeight: 700, color: C.ink, textAlign: "center", marginBottom: 6 }}>終了予定時刻（全卓共通）</div>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 10 }}>
                        <input inputMode="numeric" value={tEndH} onChange={(e) => setTEndH(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} style={{ width: 64, textAlign: "center", border: `1px solid ${C.line}`, borderRadius: 8, padding: "10px 0", fontSize: 20, fontWeight: 800, fontFamily: FONT }} />
                        <span style={{ fontSize: 18, fontWeight: 800, color: C.sub }}>:</span>
                        <input inputMode="numeric" value={tEndM} onChange={(e) => setTEndM(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} style={{ width: 64, textAlign: "center", border: `1px solid ${C.line}`, borderRadius: 8, padding: "10px 0", fontSize: 20, fontWeight: 800, fontFamily: FONT }} />
                      </div>
                      <button onClick={() => applyTableEndTime(ti)} disabled={snapBusy != null} style={{ width: "100%", background: C.win, color: "#fff", border: "none", borderRadius: 10, padding: "13px 0", fontSize: 14.5, fontWeight: 800, cursor: "pointer", fontFamily: FONT, marginBottom: 6 }}>
                        {snapBusy === ti ? "計算中…" : "✓ この時刻に合わせる（持ち時間・ハンデ自動）"}
                      </button>
                      <button onClick={applyAllTables} disabled={snapBusy != null} style={{ width: "100%", background: "#fff", border: `1.5px solid ${C.blue}`, color: C.blue, borderRadius: 10, padding: "11px 0", fontSize: 13.5, fontWeight: 800, cursor: "pointer", fontFamily: FONT, marginTop: 10, marginBottom: 16 }}>
                        {snapBusy === ti ? "反映中…" : "全卓まとめて自動調整する"}
                      </button>

                      <div style={{ fontSize: 11, color: C.sub, textAlign: "center", marginBottom: 8 }}>または手動で設定</div>
                      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 12, marginBottom: 10 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                          <span style={{ fontSize: 13, fontWeight: 700 }}>試合の長さ</span>
                          <span style={{ fontSize: 17, fontWeight: 800 }}>{tLenPct}%</span>
                        </div>
                        <input type="range" min={40} max={140} step={5} value={tLenPct} onChange={(e) => setTLenPct(+e.target.value)} style={{ width: "100%", accentColor: C.blue }} />
                      </div>
                      <div style={{ fontSize: 12, fontWeight: 700, color: C.sub, marginBottom: 6, textAlign: "center" }}>100%の時間（全卓共通）</div>
                      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 12 }}>
                        <button onClick={() => setTPer100((v) => Math.max(10, v - 1))} style={{ ...homeStepBtn, width: 44, height: 44, fontSize: 20 }}>−</button>
                        <div style={{ flex: 1, textAlign: "center", fontSize: 18, fontWeight: 800 }}>{tPer100}分</div>
                        <button onClick={() => setTPer100((v) => Math.min(180, v + 1))} style={{ ...homeStepBtn, width: 44, height: 44, fontSize: 20 }}>＋</button>
                      </div>
                      <button onClick={applyTableAdjust} disabled={snapBusy != null} style={{ width: "100%", background: C.ink, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT, marginBottom: 16 }}>
                        {snapBusy === ti ? "反映中…" : "手動の値で全卓に反映する"}
                      </button>
                    </>
                  )}

                  <div style={{ marginTop: 16 }}>
                    {snapMsg && <div style={{ textAlign: "center", fontSize: 12, fontWeight: 700, color: snapMsg.ok ? C.win : C.minus }}>{snapMsg.ok ? "✓ " : "✗ "}{snapMsg.text}</div>}
                  </div>
                </div>
              );
            })()}

            {tableAdjust == null && (
              <>
                {/* 呼び出し 見出し（全幅）：本部のメインの仕事。次に呼ぶべき対戦をここに出す */}
                <div style={{ gridColumn: "1 / -1", fontSize: 21, fontWeight: 900, color: C.blue, marginTop: 10 }}>📣 呼び出し</div>
                {tinfo.map(({ ti, callTarget }) => (
                  <div key={ti}>
                    {callTarget && <TimelineCard m={callTarget} current order={0} onOpen={() => setQrMatch(callTarget)} referee={callTarget.referee} />}
                    {!callTarget && <EmptySlot label="予定なし" />}
                  </div>
                ))}

                {/* スコアラー候補：呼び出す対戦にその場で割り当てる */}
                {tinfo.map(({ ti, callTarget }) => (
                  <div key={ti}>
                    {callTarget && (
                      <div style={{ textAlign: "center" }}>
                        <button onClick={() => toggleRefereeList(ti)} style={{ background: "none", border: "none", color: C.blue, fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: FONT, padding: "2px 0", textDecoration: "underline" }}>
                          {refereeOpen === ti ? "▲ 閉じる" : "📝 スコアラー候補"}
                        </button>
                      </div>
                    )}
                    {refereeOpen === ti && (
                      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 8, marginTop: 4 }}>
                        {getRefereeCandidates(ti).length === 0 ? (
                          <div style={{ fontSize: 11, color: C.sub, textAlign: "center" }}>候補なし</div>
                        ) : (
                          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                            {getRefereeCandidates(ti).map((p) => (
                              <button key={p.id} onClick={() => assignReferee(ti, p.name, callTarget)} disabled={refereeBusy}
                                style={{ background: C.zone, border: "none", borderRadius: 8, padding: "6px 8px", fontSize: 11.5, color: p.tier > 0 ? C.sub : C.ink, textAlign: "left", cursor: "pointer", fontFamily: FONT }}>
                                {p.name}{p.count ? `（${p.count}）` : ""}
                                {p.tier === 1 && <span style={{ color: C.sub, fontSize: 10 }}>　同卓に次試合あり</span>}
                                {p.tier === 2 && <span style={{ color: C.sub, fontSize: 10 }}>　別卓に次試合あり</span>}
                              </button>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                ))}

                {/* 対戦中 見出し（全幅）：実際に始まっている試合だけを出す。無ければ空欄にして「呼び出しが必要」を目立たせる */}
                <div style={{ gridColumn: "1 / -1", fontSize: 19, fontWeight: 900, color: C.ink, marginTop: 10 }}>対戦中</div>
                {tinfo.map(({ ti, live }) => (
                  <div key={ti}>
                    {live && <TimelineCard m={live} current order={0} onOpen={() => setQrMatch(live)} referee={live.referee} />}
                    {!live && <div style={{ minHeight: 48 }} />}
                  </div>
                ))}

                {/* さらに次以降 */}
                {tinfo.map(({ ti, rest }) => (
                  <div key={ti} style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {rest.length > 0 && (
                      <button onClick={() => toggleShowMore(ti)} style={{ background: "none", border: "none", color: C.sub, fontSize: 11.5, fontWeight: 700, cursor: "pointer", fontFamily: FONT, padding: "4px 0" }}>
                        {showMoreTi === ti ? "▲ 閉じる" : `▼ さらに次を見る（${rest.length}）`}
                      </button>
                    )}
                    {showMoreTi === ti && rest.map((m, k) => (
                      <TimelineCard key={m.id} m={m} current={false} order={k + 1} onOpen={() => setQrMatch(m)} />
                    ))}
                  </div>
                ))}
              </>
            )}
          </div>
        );
      })()}

      {qrMatch && (
        <div onClick={() => setQrMatch(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 24 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", borderRadius: 18, padding: "24px 20px", textAlign: "center", maxWidth: 320, width: "100%" }}>
            <div style={{ fontSize: 16, fontWeight: 800, marginBottom: 12 }}>卓{qrMatch.table}：{qrMatch.names.join(" 対 ")}</div>
            <img src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(urlFor(qrMatch))}`} style={{ width: 200, height: 200, margin: "0 auto" }} />
            <button onClick={() => setQrMatch(null)} style={{ marginTop: 16, width: "100%", background: C.ink, color: "#fff", border: "none", borderRadius: 12, padding: "12px 0", fontSize: 15, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>閉じる</button>
          </div>
        </div>
      )}

      {refereeQR && (
        <div onClick={() => setRefereeQR(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 24 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", borderRadius: 20, padding: "28px 22px", textAlign: "center", maxWidth: 340, width: "100%" }}>
            <div style={{ fontSize: 13, fontWeight: 800, color: C.sub, letterSpacing: 1, marginBottom: 6 }}>卓{refereeQR.match.table}　スコアラー呼び出し</div>
            <div style={{ fontSize: 22, fontWeight: 900, color: C.blue, marginBottom: 4 }}>📝 {refereeQR.name} さん</div>
            <div style={{ fontSize: 13, color: C.sub, marginBottom: 16 }}>このQRを読み込んでください</div>
            <img src={`https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(urlFor(refereeQR.match))}`} style={{ width: 240, height: 240, margin: "0 auto" }} />
            <button onClick={() => setRefereeQR(null)} style={{ marginTop: 18, width: "100%", background: C.blue, color: "#fff", border: "none", borderRadius: 12, padding: "13px 0", fontSize: 15, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>閉じる</button>
          </div>
        </div>
      )}


      {finished.length > 0 && (
        <div style={{ marginTop: 24 }}>
          <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 8 }}>結果（{finished.length}試合）</div>
          <div style={{ maxHeight: 300, overflowY: "auto", border: `1px solid ${C.line}`, borderRadius: 12 }}>
            {finished.map((m) => {
              const names = m.names || ["P1", "P2"];
              const tot = m.tot || [0, 0];
              const rt = m.raceTo || [0, 0];
              const w = m.winner != null ? m.winner : (tot[0] >= rt[0] ? 0 : 1);
              return (
                <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 12px", borderBottom: `1px solid ${C.line}` }}>
                  <span style={{ fontSize: 11, fontWeight: 800, color: C.sub, flexShrink: 0, width: 26 }}>卓{m.table}</span>
                  <span style={{ flex: 1, minWidth: 0, fontSize: 13.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    <b style={{ color: w === 0 ? C.win : C.sub, fontWeight: w === 0 ? 800 : 600 }}>{names[0]}</b>
                    <span style={{ color: C.sub, margin: "0 5px" }}>対</span>
                    <b style={{ color: w === 1 ? C.win : C.sub, fontWeight: w === 1 ? 800 : 600 }}>{names[1]}</b>
                  </span>
                  <span style={{ fontSize: 13.5, fontWeight: 800, fontVariantNumeric: "tabular-nums", flexShrink: 0 }}>
                    <span style={{ color: C.blue }}>{tot[0]}</span>
                    <span style={{ color: C.sub, margin: "0 2px" }}>-</span>
                    <span style={{ color: C.red }}>{tot[1]}</span>
                  </span>
                  <span style={{ fontSize: 10.5, color: C.sub, flexShrink: 0, width: 52, textAlign: "right" }}>{fmtElapsed(m.elapsedMs)}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}
function EmptySlot({ label }) {
  return (
    <div style={{ background: C.zone, border: `1px dashed ${C.line}`, borderRadius: 14, padding: "20px 4px", textAlign: "center", color: C.sub, fontSize: 13, boxSizing: "border-box", width: "100%" }}>
      {label}
    </div>
  );
}
function TimelineCard({ m, current, order, onOpen, referee }) {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    if (!current) return;
    const iv = setInterval(() => setTick((t) => t + 1), 15000);
    return () => clearInterval(iv);
  }, [current]);

  const names = m.names || ["P1", "P2"];
  const raceTo = m.raceTo || [0, 0];
  const tot = m.tot || [0, 0];
  const balls = m.balls || [];
  const live = [balls.filter((b) => b.loc === "p1" && !b.dead).length, balls.filter((b) => b.loc === "p2" && !b.dead).length];
  const disp = current && m.phase === "play" ? [tot[0] + live[0], tot[1] + live[1]] : tot;
  const hasProgress = (tot[0] > 0 || tot[1] > 0 || (m.rack || 1) > 1 || m.phase === "done");
  const awaitingCall = current && !m.startedAt && !hasProgress;
  const hillHill = raceTo[0] > 0 && raceTo[1] > 0 && (raceTo[0] - tot[0] <= 14) && (raceTo[1] - tot[1] <= 14);

  // 参加者の持ち時間の残り。deadline（絶対時刻）を基準に逆算する
  let timeInfo = null;
  if (current && m.startedAt && m.deadline && !m.finishedAt) {
    const totalMs = m.deadline - m.startedAt;
    const remainMs = m.deadline - Date.now();
    const remainMin = Math.max(0, remainMs / 60000);
    const progress = totalMs > 0 ? Math.min(1, Math.max(0, 1 - remainMs / totalMs)) : 1;
    timeInfo = { remainMin, progress, over: remainMs <= 0 };
  }
  const aboutToFinish = current && timeInfo && timeInfo.remainMin <= 3;

  // 終わりそう度＝スコアの達成率と残り時間の進み具合のうち大きい方（数字は出さず、バーだけで見せる）
  const scoreProgress = raceTo[0] > 0 && raceTo[1] > 0 ? Math.max(disp[0] / raceTo[0], disp[1] / raceTo[1]) : 0;
  const finishProgress = Math.max(scoreProgress, timeInfo ? timeInfo.progress : 0);
  const finishColor = finishProgress > 0.85 ? C.minus : finishProgress > 0.6 ? C.hill : C.win;

  const statusLabel = !current
    ? `${order + 1}戦後`
    : awaitingCall ? "📣 呼び出し中"
    : m.phase === "banking" ? "バンキング待ち"
    : aboutToFinish ? (hillHill ? "🔥 ヒルヒル！" : "⏰ 終わりそう")
    : "試合中";
  const accent = C.blue;

  if (!current) {
    return (
      <div onClick={onOpen} style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: "6px 5px", cursor: "pointer", opacity: 0.8, boxSizing: "border-box", width: "100%" }}>
        <div style={{ textAlign: "center", fontSize: 9.5, color: C.sub, fontWeight: 700, marginBottom: 3 }}>{statusLabel}</div>
        <div style={{ display: "flex", gap: 4 }}>
          {[0, 1].map((i) => (
            <div key={i} style={{ flex: 1, textAlign: "center", minWidth: 0 }}>
              <div style={{ fontSize: 10.5, fontWeight: 600, color: C.sub, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{names[i]}</div>
              <div style={{ fontSize: 12, fontWeight: 700, color: C.ink, opacity: 0.6 }}>{raceTo[i]}</div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div onClick={onOpen} style={{
      background: C.lightBlue,
      border: `3px solid ${accent}`,
      boxShadow: `0 3px 12px rgba(46,109,181,0.28)`,
      borderRadius: 16, padding: "12px 8px 10px", cursor: "pointer", boxSizing: "border-box", width: "100%",
    }}>
      <div style={{ display: "inline-block", background: accent, color: "#fff", borderRadius: 20, padding: "3px 10px", fontSize: 11, fontWeight: 800, marginBottom: 8 }}>{statusLabel}</div>
      <div style={{ display: "flex", gap: 4 }}>
        {[0, 1].map((i) => (
          <div key={i} style={{ flex: 1, textAlign: "center", minWidth: 0 }}>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: i === 0 ? C.blue : C.red, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", marginBottom: 1 }}>{names[i]}</div>
            <div style={{ fontSize: 18, fontWeight: 900, color: C.ink, lineHeight: 1.1, whiteSpace: "nowrap" }}>
              {m.phase === "banking" ? "–" : disp[i]}
              <span style={{ fontSize: 11, fontWeight: 700, opacity: 0.45 }}>/{raceTo[i]}</span>
            </div>
          </div>
        ))}
      </div>
      <div style={{ marginTop: 8 }}>
        <div style={{ height: 6, background: "rgba(0,0,0,0.1)", borderRadius: 4, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${Math.round(finishProgress * 100)}%`, background: finishColor, borderRadius: 4, transition: "width 400ms ease" }} />
        </div>
      </div>
      {referee && (
        <div style={{ marginTop: 8, textAlign: "center", fontSize: 12, fontWeight: 700, color: C.ink }}>✏️{referee}</div>
      )}

    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  showCrash(e.message + "\n" + (e.stack || ""));
}
</script>
</body>
</html>
