/* ========= ハンデ計算（App A/B2と共通） ========= */
function roundHalfToEven(v) {
  const w = Math.floor(v);
  const d = v - w;
  if (Math.abs(d - 0.5) > 1e-9) return d > 0.5 ? w + 1 : w;
  return w % 2 === 1 ? w + 1 : w;
}
function normalizeRace(rt1, rt2, lowClamp) {
  const highClamp = 99.0;
  const p1IsHigh = rt1 >= rt2;
  const highRace = Math.max(rt1, rt2), lowRace = Math.min(rt1, rt2);
  let highC = highRace > highClamp ? highClamp : highRace;
  let lowC = highRace > highClamp ? lowRace - lowRace * ((highRace - highClamp) / highRace) : lowRace;
  highC = Math.min(lowRace < lowClamp ? highC + highC * ((lowClamp - lowRace) / lowC) : highC, highClamp);
  lowC = Math.max(lowC < lowClamp ? lowClamp : lowC, lowClamp);
  return { rt1: p1IsHigh ? highC : lowC, rt2: p1IsHigh ? lowC : highC };
}
function computeRace(R1, R2, lenPct) {
  const dampFactor = lenPct / 100;
  const avg = (R1 + R2) / 2;
  const gp = 0.018 * avg - 1.4;
  const delta = R1 - R2;
  const p1 = 1 - 1 / (1 + Math.pow(2, delta / 100));
  const p2 = 1 - p1;
  const p1AvgPts = p1 * 14.0 + p2 * (7.4 - 0.0062 * R2);
  const p2AvgPts = p2 * 14.0 + p1 * (7.4 - 0.0062 * R1);
  const rt1raw = p1AvgPts * gp * dampFactor;
  const rt2raw = p2AvgPts * gp * dampFactor;
  const lowClamp = 0.16 * lenPct + 12;
  const norm = normalizeRace(rt1raw, rt2raw, lowClamp);
  return { rt1: roundHalfToEven(norm.rt1), rt2: roundHalfToEven(norm.rt2), p1, p2 };
}

const FONT = "system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif";

/* 1回だけ読む */
async function dbGet(path) {
  const snap = await db.ref(path).once("value");
  return snap.val();
}
/* 変更を購読する。ポーリングと違い、変わった瞬間に届く。戻り値を呼ぶと解除 */
function dbSubscribe(path, onValue, onError) {
  const ref = db.ref(path);
  const handler = ref.on("value", (snap) => onValue(snap.val()),
    (e) => onError && onError(e && e.message ? e.message : String(e)));
  return () => ref.off("value", handler);
}
async function dbSet(path, value) { await db.ref(path).set(value); }
/* 複数の場所をまとめて更新する。指定した項目だけが変わるので、
   スコアラーが入力中の値を本部側が上書きしてしまう事故が起きない */
async function dbUpdate(path, values) { await db.ref(path).update(values); }

function normalizeRecord(rec) {
  rec = rec || {};
  return {
    roster: Array.isArray(rec.roster) ? rec.roster : [],
    results: Array.isArray(rec.results) ? rec.results : [],

    refereeCounts: rec.refereeCounts && typeof rec.refereeCounts === "object" ? rec.refereeCounts : {},
  };
}

}
const ROSTER_BACKUP_KEY = "jcl9_b1_roster_backup_v1";

}

}
async function saveRoster(roster, allowEmpty) {

}
async function saveMatch(matchId, state) {
  // その対戦だけを書き換える（他の卓のデータには触れない）
  await dbSet("matches/" + matchId, { ...state, updatedAt: Date.now() });
}
function randomMatchId() {
  return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
}

const STALE_MS = 1000 * 60 * 60 * 6;
/* Firebaseは空の配列を保存しない（キーごと消える）ので、読み込み側で補う */

/* 試合を組むときの既定の時間割。
   開始は「今から5分後」を5分刻みで切り上げた時刻（＝今から5〜10分後のキリのいい時刻）、
   終了はその3時間後。当日その場で組むことが多いので、前回の値ではなく毎回いまの時刻から出す */
const fmtDateTime = (ms) => {
  const d = new Date(ms);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const fmtStamp = (ms) => {
  const d = new Date(ms);
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
};
const fmtClock = (ms) => {
  const d = new Date(ms);
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
};
function defaultSchedule() {
  const p2 = (n) => String(n).padStart(2, "0");
  const st = new Date(Date.now() + 5 * 60000);
  st.setSeconds(0, 0);
  st.setMinutes(Math.ceil(st.getMinutes() / 5) * 5);
  const en = new Date(st.getTime() + 3 * 60 * 60000);
  return { startH: p2(st.getHours()), startM: p2(st.getMinutes()), endH: p2(en.getHours()), endM: p2(en.getMinutes()) };
}


/* ========= 復元のしくみ =========
   ・試合ごとの履歴：値を書き換える前に、その試合のスナップショットを history/<試合ID> に積む。
     間違えて消した・直したときに、その時点へ戻せる（直近HISTORY_KEEP件だけ残す）
   ・まるごとバックアップ：対戦表の組み直しなど、全体を入れ替える操作の前に matches 全体を控える */
const HISTORY_KEEP = 20;
const BACKUP_KEEP = 10;
async function dbPush(path, value) {
  const ref = db.ref(path).push();
  await ref.set(value);
  return ref.key;
}
async function pruneOldest(path, keep) {
  const all = (await dbGet(path)) || {};
  const keys = Object.keys(all).sort((a, b) => (all[a].at || 0) - (all[b].at || 0));
  const drop = keys.slice(0, Math.max(0, keys.length - keep));
  if (!drop.length) return;
  const upd = {};
  drop.forEach((k) => { upd[k] = null; });
  await dbUpdate(path, upd);
}
// 復元に必要な項目だけを控える（試合の中身がそのまま戻せる粒度）
function snapOfMatch(m) {
  if (!m) return null;
  const keep = ["names", "table", "slot", "tot", "raceTo", "hist", "rack", "brk", "balls", "phase",
    "lastResult", "r1", "r2", "lenPct", "matchMinutes", "scheduledAt", "startedAt", "deadline",
    "finishedAt", "elapsedMs", "winner", "bothLose", "referee", "createdAt", "version",
    "bracket", "bracketRound", "bracketPos", "bracketSize", "pending"];
  const o = {};
  keep.forEach((k) => { if (m[k] !== undefined && m[k] !== null) o[k] = m[k]; });
  return o;
}
async function saveMatchHistory(matchId, m, label) {
  try {
    const snap = snapOfMatch(m);
    if (!snap) return;
    await dbPush("history/" + matchId, { at: Date.now(), label, snap });
    await pruneOldest("history/" + matchId, HISTORY_KEEP);
  } catch {}
}
async function saveBackup(label) {
  try {
    const matches = (await dbGet("matches")) || {};
    await dbPush("backups", { at: Date.now(), label, count: Object.keys(matches).length, matches });
    await pruneOldest("backups", BACKUP_KEEP);
  } catch {}
}

function normalizeMatch(m) {
  if (!m) return m;
  return {
    ...m,
    names: Array.isArray(m.names) ? m.names : ["P1", "P2"],
    tot: Array.isArray(m.tot) ? m.tot : [0, 0],
    raceTo: Array.isArray(m.raceTo) ? m.raceTo : [0, 0],
    balls: Array.isArray(m.balls) ? m.balls : [],
    hist: Array.isArray(m.hist) ? m.hist : [],
    rack: m.rack || 1,
  };
}
function isMatchFinished(m) {
  if (m.bothLose) return true;
  // スコアラー側で決着が確定した試合。9番以外で目標点に到達して勝った場合、
  // 台上の球がまだ tot に入っていないことがあるので、tot だけでは終了と判定できない
  if (m.winner === 0 || m.winner === 1) return true; // 時間切れ・最終ラック終了時にどちらも目標に届かなかった場合
  const rt = m.raceTo || [0, 0], tot = m.tot || [0, 0];
  return (rt[0] > 0 && tot[0] >= rt[0]) || (rt[1] > 0 && tot[1] >= rt[1]);
}
// 卓ごとの待機列：未終了の対戦を作成順に並べる。[0]が現在対戦中、[1]が次戦
function getQueueForTable(matches, tableNum) {
  const list = [];
  for (const id in matches) {
    const m = matches[id];
    if (!m || Number(m.table) !== tableNum) continue;
    if (!m.updatedAt || Date.now() - m.updatedAt > STALE_MS) continue;
    if (isMatchFinished(m)) continue;
    list.push({ ...normalizeMatch(m), id });
  }
  list.sort((a, b) => (a.createdAt || a.updatedAt) - (b.createdAt || b.updatedAt));
  return list;
}
// 調整対象＝未開始の試合すべて。先頭が開始済み（試合中）の時だけ先頭を除く
function adjustableMatches(q) { return q[0] && q[0].startedAt ? q.slice(1) : q; }

// 実際に開始済みの試合の残り時間だけを確保し、未開始の試合（呼び出し中を含む）すべてを
// 指定の終了予定時刻に収める試合の長さ・持ち時間を逆算する
function computeTableAdjustment(queueForTable, eH, eM, per100) {
  const cur = queueForTable[0];
  const curStarted = !!(cur && cur.startedAt);
  // 先頭が未開始（呼び出し中）なら、それも調整対象に含める。開始済みの試合だけは設定が確定しているので触らない
  const future = curStarted ? queueForTable.slice(1) : queueForTable.slice(0);
  if (!future.length) return null;
  const targetD = new Date(); targetD.setHours(eH, eM, 0, 0);
  const availableMin = (targetD - Date.now()) / 60000;
  if (availableMin <= 0) return { error: "すでにその時刻を過ぎています" };
  let curRemainMin = 0;
  if (curStarted && cur.matchMinutes) {
    const elapsed = (Date.now() - cur.startedAt) / 60000;
    curRemainMin = Math.max(0, cur.matchMinutes - elapsed);
  }
  const availableForFuture = availableMin - curRemainMin;
  if (availableForFuture <= 0) return { error: "現在の対戦の残り時間だけで、指定時刻を超えています" };
  const perMatchMin = availableForFuture / future.length;
  const rawPct = Math.round((perMatchMin / per100) * 100 / 5) * 5;
  const hitFloor = rawPct < 40;
  const newLenPct = Math.min(140, Math.max(40, rawPct));
  const newMinutes = Math.max(5, Math.round(per100 * (newLenPct / 100)));
  return { future, newLenPct, newMinutes, hitFloor, curRemainMin };
}

// 卓ごとの全対戦（終了分も含む）を作成順に並べる。タイムラインの「コマ」順の復元に使う
function getAllForTable(matches, tableNum) {
  const list = [];
  for (const id in matches) {
    const m = matches[id];
    if (!m || Number(m.table) !== tableNum) continue;
    if (!m.updatedAt || Date.now() - m.updatedAt > STALE_MS) continue;
    list.push({ ...normalizeMatch(m), id });
  }
  list.sort((a, b) => (a.createdAt || a.updatedAt) - (b.createdAt || b.updatedAt));
  return list;
}
// 予選だけ（決勝トーナメントは専用の表示があるので外す）。PC表示用の対戦表で使う
function getPrelimForTable(matches, tableNum) {
  return getAllForTable(matches, tableNum).filter((m) => !m.bracket);
}
// 卓ごとの一覧に状態を付ける。
// 終了／試合中（スコアラーがバンキング勝者を選んだ）／呼び出し中（次に始める1試合だけ）／待機中（それより先）

/* 卓ごとに実際の進行を追って、各試合の開始見込み時刻を出す。
   終わった試合はその終了時刻を基準に、進行中は「開始＋持ち時間」で終わる想定、
   未開始は前の試合の終わり＋入替時間から積み上げる。押していればその分ずれて出る */
function buildEta(matches, changeoverMin) {
  const eta = {};
  const chg = (changeoverMin || 0) * 60000;
  [1, 2, 3].forEach((t) => {
    let cursor = null;
    getAllForTable(matches, t).forEach((m) => {
      const mins = m.matchMinutes || 30;
      if (isMatchFinished(m)) {
        eta[m.id] = { start: m.startedAt || null, end: m.finishedAt || m.updatedAt || null, done: true };
        cursor = m.finishedAt || m.updatedAt || cursor;
        return;
      }
      const start = m.startedAt
        ? m.startedAt
        : Math.max(cursor != null ? cursor + chg : Date.now(), Date.now());
      eta[m.id] = { start, end: start + mins * 60000, started: !!m.startedAt };
      cursor = start + mins * 60000;
    });
  });
  return eta;
}

function annotateColumn(list) {
  let calledYet = false;
  return list.map((m) => {
    if (isMatchFinished(m)) return { m, st: "done" };
    if (m.startedAt) return { m, st: "live" };
    // 決勝トーナメントの「◯回戦①の勝者」枠。予定として卓には並べるが、まだ始められない
    if (m.pending) return { m, st: "pending" };
    if (!calledYet) { calledYet = true; return { m, st: "call" }; }
    return { m, st: "queued" };
  });
}
/* ========= 決勝トーナメント（単純な抽選ブラケット。予選と同じハンデ・試合の長さで組む） ========= */
function getBracketMatches(matches) {
  return Object.values(matches || {}).filter((m) => m && m.bracket).map((m) => ({ ...normalizeMatch(m) }));
}
function bracketMatchesForRound(matches, round) {
  return getBracketMatches(matches).filter((m) => m.bracketRound === round).sort((a, b) => a.bracketPos - b.bracketPos);
}
function bracketTotalRounds(size) { return Math.round(Math.log2(size)); }
function matchWinnerIndex(m) {
  if (m.bothLose) return null; // 両者負け
  if (m.winner === 0 || m.winner === 1) return m.winner;
  const rt = m.raceTo || [0, 0], tot = m.tot || [0, 0];
  const r0 = rt[0] > 0 && tot[0] >= rt[0];
  const r1 = rt[1] > 0 && tot[1] >= rt[1];
  // ヒルヒルで両者が目標に達した場合は、そのラックで9番を落とした方（＝最終ラックの勝者）が勝ち
  if (r0 && r1) {
    const last = (m.hist || []).slice(-1)[0];
    return last ? last.w : 0;
  }
  if (r0) return 0;
  if (r1) return 1;
  return null;
}
// タイムラインで点数を手直しした時、保存済みの m.winner に頼らず新しい点数から勝敗を計算し直す
function recomputeWinner(raceTo, tot, hist) {
  const r0 = raceTo[0] > 0 && tot[0] >= raceTo[0];
  const r1 = raceTo[1] > 0 && tot[1] >= raceTo[1];
  if (r0 && r1) { const last = (hist || []).slice(-1)[0]; return last ? last.w : 0; }
  if (r0) return 0;
  if (r1) return 1;
  return null;
}
// 成績集計
// ・勝ちがつかなかった試合は、目標点に対する取得点の割合（達成率、上限100%）を記録
// ・時間切れでどちらも目標に届かなかった試合は両者負け扱いで、双方に達成率を記録
// ・並び順は 勝ち数 → 達成率の平均 → 得失点差
function buildStandings(matches, roster) {
  const stats = {};
  const ensure = (name) => {
    if (!stats[name]) stats[name] = { name, win: 0, loss: 0, rates: [], pf: 0, pa: 0 };
    return stats[name];
  };
  roster.forEach((p) => { if (p.name) ensure(p.name); });

  for (const id in matches) {
    const m = matches[id];
    if (!m || !isMatchFinished(m)) continue;
    if (!m.updatedAt || Date.now() - m.updatedAt > STALE_MS) continue;
    const names = m.names || [];
    const tot = m.tot || [0, 0];
    const rt = m.raceTo || [0, 0];
    const w = matchWinnerIndex(m); // null なら両者負け
    [0, 1].forEach((i) => {
      if (!names[i]) return;
      const s = ensure(names[i]);
      s.pf += tot[i] || 0;
      s.pa += tot[1 - i] || 0;
      if (i === w) s.win++;
      else {
        s.loss++;
        if (rt[i] > 0) s.rates.push(Math.min(1, (tot[i] || 0) / rt[i])); // 100%を上限にする
      }
    });
  }

  const rows = Object.values(stats).map((s) => ({
    ...s,
    played: s.win + s.loss,
    avgRate: s.rates.length ? s.rates.reduce((a, b) => a + b, 0) / s.rates.length : null,
  }));
  rows.sort((a, b) => {
    if (b.win !== a.win) return b.win - a.win;
    // 負け試合がない（＝全勝）方を上に
    const ar = a.avgRate == null ? 2 : a.avgRate;
    const br = b.avgRate == null ? 2 : b.avgRate;
    if (br !== ar) return br - ar;
    return (b.pf - b.pa) - (a.pf - a.pa);
  });
  // 同着は同じ順位にし、次の順位は同着人数ぶん飛ばす（一般的な順位付け）
  rows.forEach((r, i) => {
    if (i > 0) {
      const p = rows[i - 1];
      const same = p.win === r.win && (p.avgRate == null ? 2 : p.avgRate) === (r.avgRate == null ? 2 : r.avgRate) && (p.pf - p.pa) === (r.pf - r.pa);
      r.rank = same ? p.rank : i + 1;
    } else {
      r.rank = 1;
    }
  });
  return rows;
}
const fmtRate = (v) => (v == null ? "–" : v.toFixed(3));

// 各選手が対戦した順（回転がある場合はその順、無ければ作成順）に、相手と結果（勝ちならW、負けなら達成率）を並べる。
// 「戦績（対戦相手つき）」PC表示用
function buildDetailedStandings(matches, roster) {
  const base = buildStandings(matches, roster);
  const list = Object.values(matches || {})
    .filter((m) => m && Array.isArray(m.names))
    .map((m) => ({ ...m }));
  list.sort((a, b) => (a.slot != null && b.slot != null ? a.slot - b.slot : (a.createdAt || 0) - (b.createdAt || 0)));

  const byName = {};
  base.forEach((r) => { byName[r.name] = { ...r, games: [] }; });

  list.forEach((m) => {
    const names = m.names || [];
    const finished = isMatchFinished(m);
    const w = finished ? matchWinnerIndex(m) : null; // null: 未終了 or 両者負け
    [0, 1].forEach((i) => {
      const name = names[i];
      if (!name || !byName[name]) return;
      const opponent = names[1 - i] || "";
      if (!finished) {
        byName[name].games.push({ opponent, display: "", pending: true });
      } else if (i === w) {
        byName[name].games.push({ opponent, display: "W", isWin: true });
      } else {
        const tot = m.tot || [0, 0];
        const rt = m.raceTo || [0, 0];
        const rate = rt[i] > 0 ? Math.min(1, (tot[i] || 0) / rt[i]) : 0;
        byName[name].games.push({ opponent, display: `${Math.round(rate * 100)}%`, isWin: false });
      }
    });
  });

  const rows = Object.values(byName);
  rows.sort((a, b) => a.rank - b.rank);
  const maxGames = rows.reduce((m, r) => Math.max(m, r.games.length), 0);
  return { rows, maxGames };
}

function TimelineSlotCard({

  const names = m ? (m.names || ["", ""]) : ["", ""];

    const totalMs = m.deadline - m.startedAt;
    const remainMs = m.deadline - Date.now();

  }

  const oneHill = m && rt[0] > 0 && rt[1] > 0 && ((rt[0] - tot[0] <= 14) || (rt[1] - tot[1] <= 14));
  const urgent = oneHill || (remainMin != null && remainMin <= 3);

      await dbUpdate("matches/" + m.id, {
        table: newTable, slot: null, scheduledAt: null, createdAt: Date.now(),
        version: (m.version || 1) + 1, updatedAt: Date.now(),
      });
      setMenu(null);
    } catch {}
    setSaving(false);
  };

  const style = !m
    ? { bg: C.zone, border: C.line, badgeBg: "transparent", badgeCol: C.sub, badge: "空き" }
    : st === "done"
      ? (m.bothLose
          ? { bg: "#fff", border: C.line, badgeBg: C.hillBg, badgeCol: C.hill, badge: "時間切れ" }
          : { bg: "#fff", border: C.line, badgeBg: C.zone, badgeCol: C.sub, badge: "試合終了" })
      : st === "live"
      ? { bg: C.lightBlue, border: C.blue, badgeBg: C.blue, badgeCol: "#fff", badge: "試合中" }
      : st === "call"
      ? { bg: "#fff", border: C.blue, badgeBg: "#fff", badgeCol: C.blue, badge: "呼び出し中" }
      : st === "pending"
      ? { bg: C.zone, border: C.line, badgeBg: "transparent", badgeCol: C.sub, badge: "勝者待ち" }
      : { bg: C.zone, border: C.line, badgeBg: "transparent", badgeCol: C.sub, badge: "待機中" };

  // 終了した試合は勝敗だけを出す。点数は大小で勝敗が決まるわけではないので出さない
  const won = (i) => m && !m.bothLose && w === i;
  const handleClick = () => {
    if (swapMode) {
      if (isSwapSource) { onStartSwap && onStartSwap(null); return; }
      if (swapEligible) { onSwapTarget && onSwapTarget(m); return; }
      return;
    }
    setMenu("menu");
  };

  return (
    <div onClick={handleClick} style={{
      position: "relative", height: TL_CARD_H, boxSizing: "border-box",
      background: isSwapSource ? C.lightBlue : style.bg,
      border: isSwapSource ? `4px solid ${C.blue}` : swapMode && swapEligible ? `2px dashed ${C.blue}` : `${m && (st === "live" || st === "call") ? 2 : 1}px ${m ? "solid" : "dashed"} ${style.border}`,
      borderRadius: 12,
      padding: "8px 5px", display: "flex", flexDirection: "column", justifyContent: "space-between",
      overflow: "hidden",
      boxShadow: isSwapSource ? "0 0 0 3px rgba(46,109,181,0.28)" : "none",
      animation: isSwapSource ? "selectPulse 1.1s ease-in-out infinite" : "none",

    }}>
      {swapMode && (isSwapSource || swapEligible) && (
        <div style={{
          position: "absolute", top: 3, left: 3, zIndex: 2, background: C.blue, color: "#fff",
          borderRadius: 8, padding: "2px 7px", fontSize: 10.5, fontWeight: 800,
        }}>{isSwapSource ? "✓ 選択中" : "ここへ"}</div>
      )}
      {m && refereeEnabled && (st === "call" || st === "live") && (
        <button onClick={(e) => { e.stopPropagation(); onEditReferee && onEditReferee(m); }} style={{

          display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", padding: 0,
        }} title={m.referee ? `スコアラー：${m.referee}` : "スコアラーを選ぶ"}>📱</button>

      {!m ? (
        <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 4 }}>
          <span style={{ fontSize: 13.5, fontWeight: 800, color: C.sub }}>空き</span>
          <span style={{ fontSize: 20 }}>＋</span>

      ) : (
        <>

              border: st === "call" ? `1.5px solid ${C.blue}` : "none",
              borderRadius: 12, padding: "3px 10px", fontSize: 13.5, fontWeight: 800, whiteSpace: "nowrap",
            }}>{style.badge}</span>
          </div>

          {/* 2: 選手（名前は横書きのまま上下2段。スコアと目標点は出さず、名前だけを大きく見せる。

            whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", lineHeight: 1.3,
          }}>🎱{m.lenPct || 100}% ⏰{m.matchMinutes || 30}分</div>

          {/* 4: 中央揃えでヒント（終了=✏️）かステータスバー（試合中） */}
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: 14, flexShrink: 0 }}>
            {st === "done" && <span style={{ fontSize: 13, opacity: 0.6 }}>✏️</span>}
            {st === "live" && (

                <button onClick={() => finishAs(1, false)} disabled={saving} style={{ ...menuBtn, borderColor: C.red, color: C.red }}>🏆 {names[1]} の勝ちで終了</button>
                <button onClick={() => finishAs(null, true)} disabled={saving} style={{ ...menuBtn, borderColor: C.hill, color: C.hill }}>⏱ 時間切れで終了（両者とも届かず）</button>
                <button onClick={() => setMenu("edit")} style={{ ...menuBtn, background: C.zone, fontWeight: 700 }}>もどる</button>

                      />

                <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
                  <button onClick={() => setMenu("edit")} style={{ flex: 1, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 0", fontSize: 14.5, fontWeight: 700, color: C.ink, cursor: "pointer", fontFamily: FONT }}>もどる</button>

/* ========= 成績タブ：勝ち数→負け試合の達成率平均の順に並べる ========= */
function StandingsTab() {
  const [rows, setRows] = useState([]);
  const [err, setErr] = useState(null);

  useEffect(() => dbSubscribe("/",
    (rec) => { const r = normalizeRecord(rec); setRows(buildStandings(r.matches, r.roster)); setErr(null); },
    (e) => setErr(e)), []);

  return (
    <div style={{ padding: "16px 12px 32px", color: C.ink }}>
      <div style={{ display: "grid", gridTemplateColumns: "38px 1fr 48px 48px 76px", gap: 6, padding: "0 12px 8px", fontSize: 14.5, color: C.sub, fontWeight: 800 }}>
        <div>順</div><div>選手</div><div style={{ textAlign: "center" }}>勝</div><div style={{ textAlign: "center" }}>敗</div><div style={{ textAlign: "right" }}>達成率</div>
      </div>
      {rows.length === 0 && <div style={{ textAlign: "center", fontSize: 15, color: C.sub, padding: "28px 0" }}>まだ結果がありません</div>}
      {rows.map((r, ri) => {
        const top = r.rank <= 8 && r.played > 0;
        // 決勝トーナメントの区切り。4人開催なら4位、8人開催なら8位の下に線を引く
        const prev = ri > 0 ? rows[ri - 1] : null;
        const cutAbove = prev && prev.played > 0 && (prev.rank === 4 || prev.rank === 8) && r.rank > prev.rank;
        return (
          <React.Fragment key={r.name}>
          {cutAbove && (
            <div style={{ display: "flex", alignItems: "center", gap: 8, margin: "2px 0 10px" }}>
              <div style={{ flex: 1, height: 2, background: C.blue, opacity: 0.4 }} />
              <div style={{ fontSize: 12.5, fontWeight: 900, color: C.blue, whiteSpace: "nowrap" }}>ここまで{prev.rank}位</div>
              <div style={{ flex: 1, height: 2, background: C.blue, opacity: 0.4 }} />
            </div>
          )}
          <div style={{
            display: "grid", gridTemplateColumns: "38px 1fr 48px 48px 76px", gap: 6, alignItems: "center",
            background: top ? C.lightBlue : "#fff", border: `1.5px solid ${top ? C.blue : C.line}`,
            borderRadius: 12, padding: "15px 12px", marginBottom: 8,
          }}>
            <div style={{ fontSize: 21, fontWeight: 900, color: top ? C.blue : C.sub }}>{r.rank}</div>
            <div style={{ fontSize: 21, fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.name}</div>
            <div style={{ textAlign: "center", fontSize: 25, fontWeight: 900, color: C.win }}>{r.win}</div>
            <div style={{ textAlign: "center", fontSize: 25, fontWeight: 800, color: C.sub }}>{r.loss}</div>
            <div style={{ textAlign: "right", fontSize: 19, fontWeight: 800, fontVariantNumeric: "tabular-nums", color: C.ink }}>{fmtRate(r.avgRate)}</div>
          </div>
          </React.Fragment>
        );
      })}
      <div style={{ fontSize: 13.5, color: C.sub, marginTop: 16, lineHeight: 1.7 }}>
        並び順：勝ち数 → 負け試合の達成率（取得点÷目標点）の平均 → 得失点差。全勝の選手は達成率「–」で最上位に並びます。
      </div>
      {err && <div style={{ textAlign: "center", fontSize: 12, color: C.minus, marginTop: 12 }}>同期エラー: {err}</div>}
    </div>
  );
}

/* ========= 総当たり表：a×bの正方マトリクス。行＝自分、列＝相手。セルはその視点でのスコア（勝ちは色付け）。
   単体でも他タブに埋め込んでも使えるよう、自前でデータ購読する ========= */
function RoundRobinMatrix({ compact, fill }) {
  const [matches, setMatches] = useState({});
  const [roster, setRoster] = useState([]);
  const [err, setErr] = useState(null);

  useEffect(() => dbSubscribe("matches",
    (m) => { setMatches(m || {}); setErr(null); },
    (e) => setErr(e)), []);
  useEffect(() => dbSubscribe("roster",
    (r) => setRoster(Array.isArray(r) ? r : []),
    () => {}), []);

  const matrix = useMemo(() => {
    const all = Object.values(matches || {}).filter((m) => m && !m.bracket).map((m) => normalizeMatch(m));
    const names = [];
    const seen = new Set();
    roster.forEach((p) => {
      if (p && p.name && !seen.has(p.name) && all.some((m) => (m.names || []).includes(p.name))) {
        names.push(p.name); seen.add(p.name);
      }
    });
    all.forEach((m) => (m.names || []).forEach((n) => { if (n && !seen.has(n)) { names.push(n); seen.add(n); } }));
    const idx = new Map(names.map((n, i) => [n, i]));
    const grid = names.map(() => names.map(() => null));
    all.forEach((m) => {
      const [n1, n2] = m.names || [];
      if (idx.has(n1) && idx.has(n2)) {
        const i = idx.get(n1), j = idx.get(n2);
        grid[i][j] = { m, mine: 0 };
        grid[j][i] = { m, mine: 1 };
      }
    });
    return { names, grid };
  }, [matches, roster]);

  const cellH = compact ? 30 : 40;
  const cellFont = compact ? 12 : 16;
  const headFont = compact ? 11 : 13;

  if (matrix.names.length === 0) {
    return <div style={{ color: C.sub, fontSize: 14, textAlign: "center", padding: "20px 0" }}>対戦がまだ登録されていません</div>;
  }

  return (
    <div style={{ overflowX: "auto", height: fill ? "100%" : "auto", boxSizing: "border-box" }}>
      {err && <div style={{ color: C.minus, fontSize: 12, marginBottom: 6 }}>同期エラー: {err}</div>}
      <div style={{
        display: "grid", height: fill ? "100%" : "auto",
        gridTemplateColumns: `${compact ? 60 : 84}px repeat(${matrix.names.length}, minmax(${compact ? 44 : 64}px, 1fr))`,
        gridTemplateRows: fill ? `${compact ? 28 : 34}px repeat(${matrix.names.length}, 1fr)` : undefined,
        border: `1px solid ${C.line}`, boxSizing: "border-box",
      }}>
        <div style={{ border: `1px solid ${C.line}`, background: "#fafafa" }} />
        {matrix.names.map((n, j) => (
          <div key={"h" + j} style={{ border: `1px solid ${C.line}`, background: "#fafafa", display: "flex", alignItems: "center", justifyContent: "center", fontSize: headFont, fontWeight: 800, color: C.sub, padding: "5px 2px", textAlign: "center", wordBreak: "break-all" }}>
            {n}
          </div>
        ))}
        {matrix.names.map((rowName, i) => (
          <React.Fragment key={"r" + i}>
            <div style={{ border: `1px solid ${C.line}`, background: "#fafafa", display: "flex", alignItems: "center", justifyContent: "center", fontSize: headFont, fontWeight: 800, color: C.sub, padding: "5px 4px", textAlign: "center", wordBreak: "break-all" }}>
              {rowName}
            </div>
            {matrix.names.map((colName, j) => {
              if (i === j) {
                return <div key={"c" + j} style={{ border: `1px solid ${C.line}`, background: "#EEF0F2" }} />;
              }
              const cell = matrix.grid[i][j];
              if (!cell) {
                return <div key={"c" + j} style={{ border: `1px solid ${C.line}`, background: "#fff" }} />;
              }
              const { m, mine } = cell;
              const done = isMatchFinished(m);
              const live = !done && !!m.startedAt;
              const bg = done ? "#DADDE1" : live ? "#FFF3B0" : "#fff";
              const tot = m.tot || [0, 0];
              const w = done ? matchWinnerIndex(m) : null;
              const win = w != null && w === mine;
              return (
                <div key={"c" + j} style={{ border: `1px solid ${C.line}`, background: bg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: cellFont, fontWeight: win ? 900 : 600, color: win ? C.win : C.ink, minHeight: fill ? 0 : cellH }}>
                  {done ? `${tot[mine]}-${tot[1 - mine]}` : live ? "●" : ""}
                </div>
              );
            })}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

/* ========= PC対戦表タブ：列＝卓、行＝コマ（下に行くほど後の試合）。
   1試合＝1カードで、対戦相手を上下に並べる。行は 1fr なので、コマ数が変わっても常に1画面に収まる。
   開きっぱなしで見せる用の表示なので、カードの操作はスマホ操作用のタイムライン側で行う ========= */
function PcMatchCard({ m, st }) {
  const names = m.names || ["", ""];
  const tot = m.tot || [0, 0];
  const rt = m.raceTo || [0, 0];
  const w = st === "done" ? matchWinnerIndex(m) : null;

  const box =
    st === "done" ? { background: "#EFF1F3", border: `1px solid ${C.line}` }
    : st === "live" ? { background: "#FFF8D6", border: "2px solid #D8B54A" }
    : st === "call" ? { background: "#fff", border: `2px solid ${C.blue}` }
    : { background: "#fff", border: `1px solid ${C.line}` };
  const divider = st === "live" ? "#D8B54A" : C.line;

  const nameColor = (i) =>
    st === "done" ? (w === i ? C.win : C.sub) : st === "queued" ? C.sub : C.ink;

  return (
    <div style={{
      ...box, borderRadius: 12, display: "flex", alignItems: "stretch", overflow: "hidden",
      minHeight: 0, position: "relative",
    }}>
      <div style={{
        flex: "0 0 46px", display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: 14, fontWeight: 900, color: C.sub, borderRight: `1px solid ${divider}`,
      }}>T{m.table}</div>

      <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", justifyContent: "center", padding: "4px 12px", gap: 2 }}>
        {[0, 1].map((i) => (
          <div key={i} style={{ display: "flex", alignItems: "baseline", gap: 8, minWidth: 0 }}>
            <span style={{
              flex: 1, minWidth: 0, fontSize: 18, fontWeight: w === i ? 900 : 700, color: nameColor(i),
              whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
            }}>{names[i]}</span>
            {st === "done" || st === "live" ? (
              <span style={{
                fontSize: 21, fontWeight: 900, fontVariantNumeric: "tabular-nums",
                color: st === "done" ? (w === i ? C.win : C.sub) : C.ink,
              }}>{tot[i]}</span>
            ) : (
              <span style={{ fontSize: 19, fontWeight: 800, color: C.sub }}>–</span>
            )}
            <span style={{ fontSize: 13, fontWeight: 700, color: C.sub, fontVariantNumeric: "tabular-nums", minWidth: 30, textAlign: "right" }}>/{rt[i]}</span>
          </div>
        ))}
      </div>

      {st === "done" && m.bothLose && (
        <div style={{ position: "absolute", bottom: 2, right: 8, fontSize: 10.5, fontWeight: 800, color: C.hill, whiteSpace: "nowrap" }}>時間切れ</div>
      )}
    </div>
  );
}

/* ========= 決勝トーナメント（4人 or 8人の抽選ブラケット。予選と同じハンデ・試合の長さで組む） ========= */
function BracketTab({ roster }) {
  const s0 = useMemo(() => loadSettings(), []);
  const [size, setSize] = useState(s0.bracketSize === 4 ? 4 : 8);
  const [slotIdx, setSlotIdx] = useState(() => Array.from({ length: 8 }, () => 0)); // 出場する8人（成績順に並ぶ）
  const [drawNo, setDrawNo] = useState(() => Array.from({ length: 8 }, (_, i) => String(i + 1))); // 各人が引いた抽選番号
  // 予選と同じ長さを基準に、勝ち上がるほど1試合を長くする（決勝がいちばん長い）
  const basePct = parseInt(s0.lenPct, 10) || 100;
  const per100 = parseInt(s0.per100Min, 10) || 60;
  const changeover = parseInt(s0.changeoverMin, 10) || 5;
  const defaultPctFor = (r, total) => Math.min(140, basePct + (r === total ? 30 : r === total - 1 ? 15 : 0));
  const [pcts, setPcts] = useState(() => [1, 2, 3].map((r) => defaultPctFor(r, 3)));
  const d0 = useMemo(() => defaultSchedule(), []);
  const [startH, setStartH] = useState(d0.startH);
  const [startM, setStartM] = useState(d0.startM);
  const lenPct = basePct; // 個別に組む時（後から回戦を足す場合）の既定値
  const [registering, setRegistering] = useState(false);
  const [msg, setMsg] = useState(null);
  const [matches, setMatches] = useState({});

  useEffect(() => dbSubscribe("matches", (m) => setMatches(m || {}), () => {}), []);
  useEffect(() => { saveSettings({ bracketSize: size }); }, [size]);
  useEffect(() => {
    const total = bracketTotalRounds(size);
    setPcts(Array.from({ length: total }, (_, i) => defaultPctFor(i + 1, total)));
    setDrawNo(Array.from({ length: 8 }, (_, i) => String(i + 1)));
  }, [size]);

  // 各回戦の1試合の長さ（分）と、開始予定時刻。前の回戦が終わってから入替時間ぶん空けて始める想定
  const minutesOf = (pct) => Math.max(5, Math.round(per100 * (pct / 100)));
  const roundPlan = useMemo(() => {
    const total = bracketTotalRounds(size);
    const st = new Date();
    st.setHours(parseInt(startH, 10) || 0, parseInt(startM, 10) || 0, 0, 0);
    let cursor = st.getTime();
    return Array.from({ length: total }, (_, i) => {
      const pct = pcts[i] != null ? pcts[i] : defaultPctFor(i + 1, total);
      const mins = minutesOf(pct);
      const startAt = cursor;
      cursor = startAt + (mins + changeover) * 60000;
      return { round: i + 1, pct, mins, startAt };
    });
  }, [size, pcts, startH, startM]);

  const bracketMatches = useMemo(() => getBracketMatches(matches), [matches]);
  const totalRounds = bracketTotalRounds(size);
  const started = bracketMatches.length > 0;

  const resetBracket = async () => {
    if (!window.confirm(`決勝トーナメントの対戦（${bracketMatches.length}試合）をすべて削除します。\n進行中・終了した試合も含めて消えます（バックアップからは戻せます）。\n\nよろしいですか？`)) return;
    if (!window.confirm("本当に削除しますか？")) return;
    setRegistering(true);
    try {
      await saveBackup("決勝トーナメントをリセットする前");
      const clearUpd = {};
      Object.entries(matches || {}).forEach(([id, m]) => { if (m && m.bracket) clearUpd[id] = null; });
      await dbUpdate("matches", clearUpd);
      setMsg({ ok: true, text: "決勝トーナメントを削除しました" });
    } catch (e) {
      setMsg({ ok: false, text: "削除に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setRegistering(false);
  };

  // 予選の成績順（1位から）で枠を埋めておく。抽選番号はこのあと手で入れ替えられる
  const standings = useMemo(() => buildStandings(matches, roster), [matches, roster]);
  const rankedIdx = useMemo(() => {
    const played = standings.filter((r) => r.played > 0);
    const idx = [];
    played.forEach((r) => {
      const i = roster.findIndex((p) => p.name === r.name);
      if (i >= 0 && !idx.includes(i)) idx.push(i);
    });
    roster.forEach((p, i) => { if (!idx.includes(i)) idx.push(i); }); // 予選未消化の人は後ろに
    return idx;
  }, [standings, roster]);
  const filledRef = useRef("");

  // 成績が揃った時点で、上位から順に枠へ入れておく。人数を変えた時も入れ直す。
  // 一度セットしたあとに手で並べ替えた分は、上書きしない
  useEffect(() => {
    if (started || rankedIdx.length === 0) return;
    const key = `${size}:${rankedIdx.slice(0, size).join(",")}`;
    if (filledRef.current === key) return;
    filledRef.current = key;
    setSlotIdx((arr) => {
      const next = [...arr];
      for (let i = 0; i < 8; i++) next[i] = rankedIdx[i] != null ? rankedIdx[i] : 0;
      return next;
    });
  }, [rankedIdx, size, started]);


  const winnerInfo = (m) => {
    const w = matchWinnerIndex(m);
    if (w == null) return null;
    return { name: m.names[w], r: w === 0 ? (m.r1 || 0) : (m.r2 || 0) };
  };

  // 4人の時はT1・T2だけ使う。空いている（未終了の対戦を持たない）卓を優先し、
  // 一度に複数試合を組む時は割り当てるごとに数を数えて偏らないようにする
  const allowedTables = size === 4 ? [1, 2] : [1, 2, 3];
  const assignTables = (count) => {
    const pending = {};
    allowedTables.forEach((t) => { pending[t] = 0; });
    Object.values(matches || {}).forEach((m) => {
      if (!m) return;
      const t = Number(m.table);
      if (!(t in pending)) return;
      if (!isMatchFinished(m)) pending[t]++;
    });
    const result = [];
    for (let i = 0; i < count; i++) {
      let best = allowedTables[0];
      allowedTables.forEach((t) => { if (pending[t] < pending[best]) best = t; });
      result.push(best);
      pending[best]++;
    }
    return result;
  };

  // 抽選番号が決まった時点で、1回戦から決勝までの予定をまとめて登録する。
  // 2回戦以降は対戦相手がまだ決まらないので「◯回戦①の勝者」という仮の枠（pending）で押さえておき、
  // 前の回戦が終わった時点で名前と目標点を埋める。仮の枠はタイムラインや卓の待機列には出さない
  const CIRCLE = ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧"];
  const mkMatch = (extra) => ({
    version: 1, phase: "banking", brk: null, tot: [0, 0], rack: 1,
    balls: Array.from({ length: 9 }, (_, k) => ({ n: k + 1, loc: "c", dead: false })),
    lastResult: null, hist: [], ...extra,
  });

  const registerAll = async () => {
    if (registering) return;
    const entries = slotIdx.slice(0, size).map((idx, i) => ({ p: roster[idx], no: parseInt(drawNo[i], 10) }));
    if (entries.some((e) => !e.p)) { setMsg({ ok: false, text: "全ての枠に選手を割り当ててください" }); return; }
    const names = entries.map((e) => e.p.name);
    if (new Set(names).size !== names.length) { setMsg({ ok: false, text: "同じ選手が2回入っています" }); return; }
    const nos = entries.map((e) => e.no);
    if (nos.some((n) => !(n >= 1 && n <= size))) { setMsg({ ok: false, text: `抽選番号は1〜${size}で入れてください` }); return; }
    if (new Set(nos).size !== nos.length) { setMsg({ ok: false, text: "抽選番号が重複しています" }); return; }
    // 引いた番号の順に並べる。1番と2番が1回戦で当たる、という並びになる
    const players = [...entries].sort((a, b) => a.no - b.no).map((e) => e.p);
    const total = bracketTotalRounds(size);
    const totalMatches = size - 1;
    if (!window.confirm(`決勝トーナメント（${size}人）の全${totalMatches}試合を、予定時刻つきで登録します。よろしいですか？`)) return;
    setRegistering(true);
    try {
      const now = Date.now();
      const next = {};
      for (let r = 1; r <= total; r++) {
        const plan = roundPlan[r - 1];
        const count = size / Math.pow(2, r);
        // 決勝はT1で行う。それ以外は空いている卓に振り分ける
        const tables = r === total ? [1] : assignTables(count);
        for (let i = 0; i < count; i++) {
          const id = randomMatchId();
          const common = {
            table: tables[i], lenPct: plan.pct, matchMinutes: plan.mins,
            scheduledAt: plan.startAt,
            createdAt: now + r * 100 + i, updatedAt: now,
            bracket: true, bracketRound: r, bracketPos: i, bracketSize: size,
          };
          if (r === 1) {
            const p1 = players[i * 2], p2 = players[i * 2 + 1];
            const R1 = parseInt(p1.r, 10) || 0, R2 = parseInt(p2.r, 10) || 0;
            const race = R1 > 0 && R2 > 0 ? computeRace(R1, R2, plan.pct) : { rt1: 0, rt2: 0 };
            next[id] = mkMatch({ ...common, names: [p1.name, p2.name], raceTo: [race.rt1, race.rt2], r1: R1, r2: R2 });
          } else {
            const prevLabel = (r - 1) === total ? "決勝" : total - (r - 1) === 1 ? "準決勝" : `${r - 1}回戦`;
            next[id] = mkMatch({
              ...common, pending: true, raceTo: [0, 0], r1: 0, r2: 0,
              names: [`${prevLabel}${CIRCLE[i * 2]}の勝者`, `${prevLabel}${CIRCLE[i * 2 + 1]}の勝者`],
            });
          }
        }
      }
      await saveBackup("決勝トーナメントを登録する前");
      await dbUpdate("matches", next);
      setMsg({ ok: true, text: `全${totalMatches}試合を登録しました` });
    } catch (e) {
      setMsg({ ok: false, text: "登録に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setRegistering(false);
  };

  const advanceRound = async (fromRound) => {
    if (registering) return;
    const prev = bracketMatchesForRound(matches, fromRound);
    if (prev.length === 0 || prev.some((m) => !isMatchFinished(m))) { setMsg({ ok: false, text: "前のラウンドがまだ終わっていません" }); return; }
    const winners = prev.map(winnerInfo);
    if (winners.some((w) => !w)) { setMsg({ ok: false, text: "勝者が確定していない試合があります" }); return; }
    const nextRound = fromRound + 1;
    const placeholders = bracketMatchesForRound(matches, nextRound).filter((m) => m.pending);
    const label = nextRound === totalRounds ? "決勝" : totalRounds - nextRound === 1 ? "準決勝" : `${nextRound}回戦`;
    if (!window.confirm(`${label}の${winners.length / 2}試合に、勝ち上がった選手を入れます。よろしいですか？`)) return;
    setRegistering(true);
    try {
      const now = Date.now();
      const next = {};
      const plan = roundPlan[nextRound - 1] || { pct: lenPct, mins: Math.round((parseInt(loadSettings().per100Min, 10) || 60) * (lenPct / 100)) };
      const tables = assignTables(winners.length / 2);
      for (let i = 0; i < winners.length / 2; i++) {
        const p1 = winners[i * 2], p2 = winners[i * 2 + 1];
        const ph = placeholders.find((m) => m.bracketPos === i);
        const pct = ph ? (ph.lenPct || plan.pct) : plan.pct;
        const race = p1.r > 0 && p2.r > 0 ? computeRace(p1.r, p2.r, pct) : { rt1: 0, rt2: 0 };
        if (ph) {
          // まとめて登録した仮の枠を埋める。卓・予定時刻・試合の長さはそのまま活かす
          if (nextRound === totalRounds && Number(ph.table) !== 1) next[ph.id + "/table"] = 1; // 決勝はT1
          next[ph.id + "/names"] = [p1.name, p2.name];
          next[ph.id + "/raceTo"] = [race.rt1, race.rt2];
          next[ph.id + "/r1"] = p1.r;
          next[ph.id + "/r2"] = p2.r;
          next[ph.id + "/pending"] = null;
          next[ph.id + "/updatedAt"] = now;
          next[ph.id + "/version"] = (ph.version || 1) + 1;
        } else {
          const id = randomMatchId();
          next[id] = {
            version: 1, phase: "banking", brk: null, tot: [0, 0], rack: 1,
            balls: Array.from({ length: 9 }, (_, k) => ({ n: k + 1, loc: "c", dead: false })),
            lastResult: null, hist: [], raceTo: [race.rt1, race.rt2],
            names: [p1.name, p2.name], table: nextRound === totalRounds ? 1 : tables[i],
            r1: p1.r, r2: p2.r, lenPct: pct, matchMinutes: plan.mins,
            createdAt: now + i, updatedAt: now,
            bracket: true, bracketRound: nextRound, bracketPos: i, bracketSize: size,
          };
        }
      }
      await dbUpdate("matches", next);
      setMsg({ ok: true, text: `${label}の対戦を確定しました` });
    } catch (e) {
      setMsg({ ok: false, text: "登録に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setRegistering(false);
  };

  const roundLabel = (r) => (r === totalRounds ? "決勝" : totalRounds - r === 1 ? "準決勝" : `${r}回戦`);

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "20px 16px 32px", color: C.ink }}>
      <div style={{ textAlign: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 22, fontWeight: 800 }}>決勝トーナメント</div>
        <div style={{ fontSize: 13, color: C.sub, marginTop: 4 }}>抽選で引いた番号順に枠へ入れて組みます</div>
      </div>

      {bracketMatches.length > 0 && (
        <button onClick={resetBracket} disabled={registering} style={{
          width: "100%", background: "#fff", border: `1.5px solid ${C.minus}`, borderRadius: 12,
          color: C.minus, fontSize: 14.5, fontWeight: 800, padding: "13px 0", cursor: "pointer",
          fontFamily: FONT, marginBottom: 16,
        }}>🗑 決勝トーナメントをリセット（{bracketMatches.length}試合を削除）</button>
      )}

      {!started && (
        <>
          <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
            {[4, 8].map((n) => (
              <button key={n} onClick={() => setSize(n)} style={{ flex: 1, border: `2px solid ${size === n ? C.blue : C.line}`, background: size === n ? C.lightBlue : "#fff", borderRadius: 12, padding: "12px 0", fontSize: 15, fontWeight: 800, color: size === n ? C.blue : C.ink, cursor: "pointer", fontFamily: FONT }}>{n}人</button>
            ))}
          </div>

          <div style={{ fontSize: 13, fontWeight: 700, color: C.sub, marginBottom: 2 }}>出場者と抽選番号</div>
          <div style={{ fontSize: 14, color: "#3F4A55", marginBottom: 8, lineHeight: 1.75 }}>
            予選の上位{size}人を入れてあります。カードを引いたら、その番号を右の欄に入れてください（1〜{size}）。
            1番と2番、3番と4番…が1回戦で当たります
          </div>
          {Array.from({ length: size }, (_, i) => {
            const st = standings.find((x) => x.name === (roster[slotIdx[i]] || {}).name);
            const no = parseInt(drawNo[i], 10);
            const dup = no >= 1 && no <= size && drawNo.slice(0, size).filter((v) => parseInt(v, 10) === no).length > 1;
            const bad = !(no >= 1 && no <= size) || dup;
            return (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                <div style={{ width: 34, textAlign: "center", fontSize: 12.5, fontWeight: 800, color: C.sub, flexShrink: 0 }}>
                  {st && st.played > 0 ? `${st.rank}位` : "－"}
                </div>
                <select value={slotIdx[i] ?? 0} onChange={(e) => setSlotIdx((arr) => { const next = [...arr]; next[i] = +e.target.value; return next; })} style={{ ...selectStyle, flex: 1, minWidth: 0 }}>
                  {roster.map((p, ri) => {
                    const s2 = standings.find((x) => x.name === p.name);
                    const rank = s2 && s2.played > 0 ? `${s2.rank}位 ` : "";
                    return <option key={p.id} value={ri}>{rank}{p.name || "（無名）"}　{p.r ? `Fargo ${p.r}` : ""}</option>;
                  })}
                </select>
                <input inputMode="numeric" value={drawNo[i] ?? ""}
                  onChange={(e) => setDrawNo((arr) => { const nx = [...arr]; nx[i] = e.target.value.replace(/[^0-9]/g, "").slice(0, 1); return nx; })}
                  style={{ ...numBoxStyle, width: 46, textAlign: "center", flexShrink: 0, borderColor: bad ? C.minus : undefined, color: bad ? C.minus : C.ink }} />
              </div>
            );
          })}

          <div style={{ background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, margin: "16px 0" }}>
            <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 8 }}>1回戦の開始予定</div>
            <TimeInput h={startH} m={startM} onH={setStartH} onM={setStartM} />
            <div style={{ fontSize: 14, color: "#3F4A55", marginTop: 6, lineHeight: 1.75 }}>
              以降の回戦は、前の回戦が終わってから入替{changeover}分を空けて始まる想定で計算します
            </div>
          </div>

          <div style={{ background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, marginBottom: 16 }}>
            <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 2 }}>回戦ごとの長さ</div>
            <div style={{ fontSize: 14, color: "#3F4A55", marginBottom: 10 }}>予選（{basePct}%）を基準に、勝ち上がるほど長くしています</div>
            {roundPlan.map((pl, i) => (
              <div key={pl.round} style={{ marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
                  <span style={{ fontSize: 14, fontWeight: 800 }}>{roundLabel(pl.round)}</span>
                  <span style={{ fontSize: 13, fontWeight: 800, fontVariantNumeric: "tabular-nums" }}>
                    <span style={{ color: C.sub, marginRight: 8 }}>{fmtClock(pl.startAt)}〜</span>
                    🎱{pl.pct}%（{pl.mins}分）
                  </span>
                </div>
                <input type="range" min={40} max={140} step={5} value={pl.pct}
                  onChange={(e) => setPcts((arr) => { const nx = [...arr]; nx[i] = +e.target.value; return nx; })}
                  style={{ width: "100%", accentColor: C.blue }} />
              </div>
            ))}
          </div>

          <div style={{ background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, margin: "16px 0" }}>
            <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 8 }}>1回戦の組み合わせ</div>
            {(() => {
              const entries = Array.from({ length: size }, (_, i) => ({ p: roster[slotIdx[i]], no: parseInt(drawNo[i], 10) }));
              const nos = entries.map((e) => e.no);
              const ok = nos.every((n) => n >= 1 && n <= size) && new Set(nos).size === size;
              if (!ok) return <div style={{ fontSize: 12.5, color: C.minus, fontWeight: 700 }}>抽選番号を1〜{size}で重複なく入れてください</div>;
              const sorted = [...entries].sort((a, b) => a.no - b.no);
              return sorted.filter((_, i) => i % 2 === 0).map((e, k) => (
                <div key={k} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13.5, fontWeight: 700, marginBottom: 4 }}>
                  <span style={{ color: C.blue, fontWeight: 900 }}>{e.no}</span>
                  <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{(e.p || {}).name}</span>
                  <span style={{ color: C.sub }}>対</span>
                  <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", textAlign: "right" }}>{(sorted[k * 2 + 1] || {}).p ? sorted[k * 2 + 1].p.name : ""}</span>
                  <span style={{ color: C.red, fontWeight: 900 }}>{(sorted[k * 2 + 1] || {}).no}</span>
                </div>
              ));
            })()}
          </div>

          <button onClick={registerAll} disabled={registering} style={{ width: "100%", background: registering ? C.line : C.blue, color: "#fff", border: "none", borderRadius: 14, padding: "15px 0", fontSize: 16, fontWeight: 800, cursor: registering ? "wait" : "pointer", fontFamily: FONT }}>
            {registering ? "登録中…" : `全${size - 1}試合をまとめて登録する`}
          </button>
          <div style={{ fontSize: 14, color: "#3F4A55", marginTop: 8, lineHeight: 1.75 }}>
            2回戦以降は「◯回戦①の勝者」の枠で押さえておき、前の回戦が終わった時点で名前と目標点が入ります。
            相手が決まるまでは卓の待機列やタイムラインには出ません。
          </div>
        </>
      )}

      {msg && <div style={{ textAlign: "center", fontSize: 13, fontWeight: 700, color: msg.ok ? C.win : C.minus, marginTop: 12 }}>{msg.ok ? "✓ " : "✗ "}{msg.text}</div>}

      {started && (
        <div style={{ marginTop: started ? 0 : 16 }}>
          {Array.from({ length: totalRounds }, (_, ri) => ri + 1).map((r) => {
            const ms = bracketMatchesForRound(matches, r);
            if (ms.length === 0) return null;
            const allDone = ms.every((m) => isMatchFinished(m));
            const readyToFill = ms.every((m) => m.pending) && bracketMatchesForRound(matches, r - 1).length > 0
              && bracketMatchesForRound(matches, r - 1).every((m) => isMatchFinished(m));
            const isLastShown = r === Math.max(...bracketMatches.map((m) => m.bracketRound));
            const head = ms[0] || {};
            return (
              <div key={r} style={{ marginBottom: 18 }}>
                <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 8 }}>
                  <span style={{ fontSize: 15, fontWeight: 800, color: C.blue }}>{roundLabel(r)}</span>
                  <span style={{ fontSize: 12, fontWeight: 800, color: C.sub, fontVariantNumeric: "tabular-nums" }}>
                    {head.scheduledAt ? `${fmtClock(head.scheduledAt)}〜　` : ""}🎱{head.lenPct || "-"}%（{head.matchMinutes || "-"}分）
                  </span>
                </div>
                {ms.map((m) => {
                  const w = isMatchFinished(m) ? matchWinnerIndex(m) : null;
                  return (
                    <div key={m.id} style={{
                      display: "flex", gap: 8, alignItems: "center", background: m.pending ? C.zone : "#fff",
                      border: `1px solid ${C.line}`, borderRadius: 10, padding: "8px 10px", marginBottom: 6,
                    }}>
                      <span style={{ fontSize: 11, fontWeight: 900, color: "#fff", background: m.pending ? C.sub : C.ink, borderRadius: 5, padding: "1px 6px", flexShrink: 0 }}>T{m.table}</span>
                      {[0, 1].map((i) => (
                        <div key={i} style={{
                          flex: 1, textAlign: "center", fontSize: 14,
                          fontWeight: w === i ? 900 : 600,
                          color: m.pending ? C.sub : w === i ? C.win : w == null ? C.ink : C.sub,
                          whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                        }}>
                          {m.names[i]}{isMatchFinished(m) && ` (${(m.tot || [0, 0])[i]})`}
                        </div>
                      ))}
                    </div>
                  );
                })}
                {readyToFill && (
                  <button onClick={() => advanceRound(r - 1)} disabled={registering} style={{ width: "100%", background: C.win, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT, marginTop: 4 }}>
                    {registering ? "反映中…" : `${roundLabel(r)}に勝ち上がった選手を入れる`}
                  </button>
                )}
                {allDone && isLastShown && r < totalRounds && (
                  <button onClick={() => advanceRound(r)} disabled={registering} style={{ width: "100%", background: C.win, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT, marginTop: 4 }}>
                    {registering ? "登録中…" : `${roundLabel(r + 1)}を組む`}
                  </button>
                )}
                {allDone && r === totalRounds && (
                  <div style={{ textAlign: "center", fontSize: 15, fontWeight: 800, color: C.win, marginTop: 6 }}>
                    🏆 優勝：{ms[0].names[matchWinnerIndex(ms[0])]}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ========= 接続診断：保存できない原因（通信・上限・データ量）をその場で確認する ========= */
function ConnectionTest() {
  const [log, setLog] = useState(null);
  const [busy, setBusy] = useState(false);

  const run = async () => {
    setBusy(true);
    const lines = [];
    lines.push(`接続先：${FIREBASE_CONFIG.databaseURL}`);
    try {
      const t0 = Date.now();
      const rec = (await dbGet("/")) || {};
      lines.push(`① 読み込み：成功（${Date.now() - t0}ms）`);
      lines.push(`   データ量：${(JSON.stringify(rec).length / 1024).toFixed(1)} KB`);
      lines.push(`   メンバー：${(rec.roster || []).length}人`);
      lines.push(`   対戦データ：${Object.keys(rec.matches || {}).length}件`);
      // 実データには触れず、確認用の場所に書き込んで権限をチェックする
      const t1 = Date.now();
      await dbSet("_healthcheck", Date.now());
      lines.push(`② 書き込み：成功（${Date.now() - t1}ms）`);
      lines.push("→ 読み書きとも正常です");
    } catch (e) {
      const msg = e && e.message ? e.message : String(e);
      lines.push(`エラー：${msg}`);
      if (/permission|Permission/.test(msg)) lines.push("→ Realtime Databaseのルールが許可になっていません");
      else if (/FIREBASE_CONFIG|Invalid|invalid/.test(msg)) lines.push("→ databaseURL の値を確認してください");
      else lines.push("→ オフライン、または設定値が違う可能性があります");
    }
    setLog(lines);
    setBusy(false);
  };

  return (
    <div style={{ marginTop: 14 }}>
      <button onClick={run} disabled={busy} style={{ width: "100%", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.ink, fontSize: 13.5, fontWeight: 700, padding: "11px 0", cursor: "pointer", fontFamily: FONT }}>
        {busy ? "確認中…" : "🔌 保存できるか接続を確認する"}
      </button>
      {log && (
        <pre style={{ marginTop: 8, background: C.zone, border: `1px solid ${C.line}`, borderRadius: 10, padding: 10, fontSize: 11, lineHeight: 1.7, color: C.ink, whiteSpace: "pre-wrap", wordBreak: "break-all", fontFamily: "monospace" }}>{log.join("\n")}</pre>
      )}
    </div>
  );
}

  return (
    <div>

            boxShadow: deviceMode !== "pc" ? "0 1px 3px rgba(0,0,0,0.12)" : "none",
          }}>📱 スマホ操作用</button>
          <button onClick={() => onSetDeviceMode("pc")} style={{

/* バナーへの書き込みを受け付けるかどうかの切り替え */
function PostSwitch({ label, k }) {
  const [on, setOn] = useState(true);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    (async () => {
      try { const v = await dbGet("config/" + k); setOn(v !== false && v !== "off"); } catch {}
      setLoaded(true);
    })();
  }, [k]);
  const toggle = async () => {
    const next = !on;
    setOn(next);
    try { await dbUpdate("config", { [k]: next }); } catch {}
  };
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: C.zone, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 14px", marginTop: 8 }}>
      <span style={{ fontSize: 15, fontWeight: 800, color: C.ink }}>{label}</span>
      <button onClick={toggle} disabled={!loaded} style={{
        background: on ? C.win : C.line, color: on ? "#fff" : C.sub, border: "none", borderRadius: 20,
        padding: "9px 18px", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT, flexShrink: 0, marginLeft: 10,
      }}>{on ? "受け付ける" : "止める"}</button>
    </div>
  );
}

/* ========= まるごとバックアップから戻す =========
   対戦表の組み直しなど、全体を入れ替える操作の直前に控えた状態へ戻す。
   いまの対戦はすべて置き換わるので、確認を2回はさむ */
function BackupPanel() {
  const [list, setList] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [open, setOpen] = useState(false);

  const load = async () => {
    setBusy(true); setMsg(null);
    try {
      const all = (await dbGet("backups")) || {};
      setList(Object.entries(all).map(([k, v]) => ({ k, ...v })).sort((a, b) => (b.at || 0) - (a.at || 0)));
    } catch (e) { setMsg({ ok: false, text: String(e && e.message ? e.message : e) }); }
    setBusy(false);
  };
  const openPanel = () => { setOpen(true); load(); };

  const restore = async (b) => {
    if (!window.confirm(`${fmtDateTime(b.at)} の状態（${b.count || 0}試合）に戻します。\nいまの対戦はすべて置き換わります。\n\nよろしいですか？`)) return;
    if (!window.confirm("本当に戻しますか？　進行中の試合があると、その端末の表示も戻ります。")) return;
    setBusy(true);
    try {
      await saveBackup("バックアップから戻す前");
      await dbSet("matches", b.matches || {});
      setMsg({ ok: true, text: "戻しました" });
      load();
    } catch (e) { setMsg({ ok: false, text: String(e && e.message ? e.message : e) }); }
    setBusy(false);
  };

  return (
    <div style={{ marginTop: 18, border: `1.5px solid ${C.line}`, borderRadius: 12, padding: "12px 12px 14px" }}>
      <div style={{ fontSize: 17, fontWeight: 900, marginBottom: 7 }}>🗄 バックアップから戻す</div>
      <div style={{ ...HELP, marginBottom: 12 }}>
        対戦表の組み直し・レートの反映・決勝トーナメントの登録の直前に、その時点の全対戦を控えています。
        操作を間違えた時はここから戻せます（直近{BACKUP_KEEP}件）
      </div>
      {!open ? (
        <button onClick={openPanel} style={{
          width: "100%", background: "#fff", border: `1.5px solid ${C.blue}`, borderRadius: 10,
          color: C.blue, fontSize: 16, fontWeight: 800, padding: "14px 0", cursor: "pointer", fontFamily: FONT,
        }}>控えを見る</button>
      ) : (
        <>
          {busy && <div style={{ fontSize: 12.5, color: C.sub }}>読み込み中…</div>}
          {list && list.length === 0 && <div style={{ fontSize: 12.5, color: C.sub }}>まだ控えがありません</div>}
          {list && list.map((b) => (
            <div key={b.k} style={{ border: `1px solid ${C.line}`, borderRadius: 10, padding: "8px 10px", marginBottom: 6 }}>
              <div style={{ fontSize: 16, fontWeight: 900, color: C.ink }}>{fmtDateTime(b.at)}</div>
              <div style={{ ...HELP, marginBottom: 8 }}>{b.label || ""}　{b.count || 0}試合</div>
              <button onClick={() => restore(b)} disabled={busy} style={{
                width: "100%", background: "#fff", border: `1px solid ${C.hill}`, borderRadius: 8,
                color: C.hill, fontSize: 15.5, fontWeight: 800, padding: "12px 0", cursor: "pointer", fontFamily: FONT,
              }}>この状態に戻す</button>
            </div>
          ))}
          <button onClick={() => setOpen(false)} style={{
            width: "100%", background: C.zone, border: `1px solid ${C.line}`, borderRadius: 10,
            color: C.ink, fontSize: 13, fontWeight: 700, padding: "9px 0", cursor: "pointer", fontFamily: FONT, marginTop: 2,
          }}>閉じる</button>
        </>
      )}
      {msg && <div style={{ marginTop: 8, fontSize: 12.5, fontWeight: 700, color: msg.ok ? C.win : C.minus }}>{msg.text}</div>}
    </div>
  );
}

/* ========= レート変更を未開始の試合に反映する =========
   公式ファーゴレートを持たない選手は運営側で暫定レートを入れる。
   試合の合間にその値を直しても、既に組まれた対戦の目標点は作成時に確定しているので変わらない。
   ここで「まだ始まっていない試合」だけを、今のメンバーリストのレートで組み直す。
   進行中・終了した試合には一切触らない（途中で目標点が動くと不公平になるため） */
function RateApplyPanel({ roster }) {
  const [scanning, setScanning] = useState(false);
  const [diffs, setDiffs] = useState(null);
  const [msg, setMsg] = useState(null);

  const rateOf = (name) => {
    const p = roster.find((x) => x.name === name);
    const v = p ? parseInt(p.r, 10) : NaN;
    return isNaN(v) ? 0 : v;
  };

  const scan = async () => {
    setScanning(true); setMsg(null); setDiffs(null);
    try {
      const matches = (await dbGet("matches")) || {};
      const list = [];
      for (const id in matches) {
        const m = matches[id];
        if (!m || m.startedAt || isMatchFinished(m)) continue; // 進行中・終了済みは対象外
        const names = m.names || ["", ""];
        const R1 = rateOf(names[0]), R2 = rateOf(names[1]);
        if (!(R1 > 0 && R2 > 0)) continue; // レート未入力の対戦は組み直せない
        const lenPct = m.lenPct || 100;
        const race = computeRace(R1, R2, lenPct);
        const cur = m.raceTo || [0, 0];
        if (race.rt1 === cur[0] && race.rt2 === cur[1]) continue;
        list.push({ id, table: m.table, names, before: [cur[0], cur[1]], after: [race.rt1, race.rt2],
                    R1, R2, lenPct, version: m.version || 1 });
      }
      list.sort((a, b) => (a.table - b.table));
      setDiffs(list);
      if (list.length === 0) setMsg({ ok: true, text: "組み直しが必要な試合はありません" });
    } catch (e) {
      setMsg({ ok: false, text: String(e && e.message ? e.message : e) });
    }
    setScanning(false);
  };

  const apply = async () => {
    if (!diffs || !diffs.length) return;
    if (!window.confirm(`${diffs.length}試合の目標点を組み直します。よろしいですか？\n（進行中・終了した試合は変わりません）`)) return;
    setScanning(true);
    try {
      const now = Date.now();
      const upd = {};
      diffs.forEach((d) => {
        upd[d.id + "/raceTo"] = d.after;
        upd[d.id + "/r1"] = d.R1;
        upd[d.id + "/r2"] = d.R2;
        upd[d.id + "/updatedAt"] = now;
        upd[d.id + "/version"] = d.version + 1; // 選手の端末（B2）に確実に届くよう版を上げる
      });
      await saveBackup("レートを試合に反映する前");
      await dbUpdate("matches", upd);
      setMsg({ ok: true, text: `${diffs.length}試合の目標点を組み直しました` });
      setDiffs(null);
    } catch (e) {
      setMsg({ ok: false, text: String(e && e.message ? e.message : e) });
    }
    setScanning(false);
  };

  return (
    <div style={{ marginTop: 18, border: `1.5px solid ${C.line}`, borderRadius: 12, padding: "12px 12px 14px" }}>
      <div style={{ fontSize: 17, fontWeight: 900, marginBottom: 7 }}>レート変更を試合に反映</div>
      <div style={{ ...HELP, marginBottom: 12 }}>
        上でレートを直したあとに押してください。<b>まだ始まっていない試合</b>だけを、今のレートで組み直します。
        進行中・終了した試合の目標点は変わりません。
      </div>
      <button onClick={scan} disabled={scanning} style={{
        width: "100%", background: "#fff", border: `1.5px solid ${C.blue}`, borderRadius: 10,
        color: C.blue, fontSize: 16, fontWeight: 800, padding: "14px 0", cursor: "pointer", fontFamily: FONT,
        opacity: scanning ? 0.5 : 1,
      }}>{scanning ? "確認中…" : "🔍 変わる試合を確認する"}</button>

      {msg && <div style={{ marginTop: 8, fontSize: 12.5, fontWeight: 700, color: msg.ok ? C.win : C.minus }}>{msg.text}</div>}

      {diffs && diffs.length > 0 && (
        <div style={{ marginTop: 10 }}>
          <div style={{ fontSize: 12.5, color: C.sub, fontWeight: 700, marginBottom: 6 }}>{diffs.length}試合が変わります</div>
          {diffs.map((d) => (
            <div key={d.id} style={{ border: `1px solid ${C.line}`, borderRadius: 10, padding: "7px 10px", marginBottom: 6 }}>
              <div style={{ fontSize: 13, fontWeight: 800, marginBottom: 2 }}>T{d.table}　{d.names[0]} 対 {d.names[1]}</div>
              <div style={{ fontSize: 13, color: C.sub, fontVariantNumeric: "tabular-nums" }}>
                目標点 <s>{d.before[0]} / {d.before[1]}</s>
                <b style={{ color: C.ink, marginLeft: 8 }}>→ {d.after[0]} / {d.after[1]}</b>
              </div>
            </div>
          ))}
          <button onClick={apply} disabled={scanning} style={{
            width: "100%", marginTop: 4, background: C.win, color: "#fff", border: "none", borderRadius: 10,
            fontSize: 14.5, fontWeight: 800, padding: "12px 0", cursor: "pointer", fontFamily: FONT,
            opacity: scanning ? 0.5 : 1,
          }}>この内容で組み直す</button>
        </div>
      )}
    </div>
  );
}

function MembersTab({ roster, setRoster, onRefresh, loaded, loadError }) {
  const [saving, setSaving] = useState(false);
  const [saveMsg, setSaveMsg] = useState(null);
  const saveTimer = useRef(null);
  const rosterRef = useRef(roster);
  rosterRef.current = roster;
  const backup = useRef(loadRosterBackup()).current;

  // 保存は「ユーザーが実際に編集した時」だけ走らせる。
  // 以前は roster の変化を useEffect で監視していたため、読み込みに失敗して空のままこのタブを開くと、
  // マウント時に空リストで上書き保存されてしまっていた
  const persist = (allowEmpty) => {
    if (!loaded) return; // 読み込みに成功していない間は絶対に保存しない
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      setSaving(true);
      try {
        await saveRoster(rosterRef.current, allowEmpty);
        setSaveMsg(null);
      } catch (e) {
        setSaveMsg(String(e && e.message ? e.message : e));
      }
      setSaving(false);
    }, 600);
  };

  const update = (id, k, v) => { setRoster((rs) => rs.map((p) => (p.id === id ? { ...p, [k]: v } : p))); persist(); };

  );
