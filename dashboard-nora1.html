              {st && <div style={{ fontSize: 9.5, color: C.sub, marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{st.names ? st.names.join(" / ") : ""}</div>}
            </div>
          );
        })}
      </div>

      <Field label="プレイヤー1">
        <select value={i1} onChange={(e) => setI1(+e.target.value)} style={selectStyle}>
          {roster.map((p, i) => <option key={p.id} value={i}>{p.name || "（無名）"}　{p.r ? `Fargo ${p.r}` : ""}</option>)}
        </select>
      </Field>
      <Field label="プレイヤー2">
        <select value={i2} onChange={(e) => setI2(+e.target.value)} style={selectStyle}>
          {roster.map((p, i) => <option key={p.id} value={i}>{p.name || "（無名）"}　{p.r ? `Fargo ${p.r}` : ""}</option>)}
        </select>
      </Field>

      <div style={{ background: C.zone, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, margin: "14px 0" }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
          <span style={{ fontSize: 14, fontWeight: 700 }}>試合の長さ</span>
          <span style={{ fontSize: 16, fontWeight: 800 }}>{lenPct}%</span>
        </div>
        <input type="range" min={40} max={140} step={5} value={lenPct} onChange={(e) => setLenPct(+e.target.value)} style={{ width: "100%", accentColor: C.blue }} />
        <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
          {[["ショート", 75], ["ロング", 100], ["長め", 120]].map(([t, v]) => (
            <button key={t} onClick={() => setLenPct(v)} style={{ flex: 1, border: `2px solid ${lenPct === v ? C.blue : C.line}`, background: lenPct === v ? C.lightBlue : "#fff", borderRadius: 8, padding: "8px 0", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>{t}</button>
          ))}
        </div>
      </div>

      {i1 === i2 && <Notice>同じ選手が選ばれています</Notice>}
      {res && (
        <div style={{ textAlign: "center", marginBottom: 14, fontSize: 15 }}>
          目標点：<b style={{ color: C.blue }}>{res.rt1}</b> 対 <b style={{ color: C.red }}>{res.rt2}</b>
        </div>
      )}

      <button onClick={create} disabled={!valid || creating} style={{ width: "100%", background: valid ? C.ink : C.line, color: valid ? "#fff" : C.sub, border: "none", borderRadius: 14, padding: "15px 0", fontSize: 16, fontWeight: 800, cursor: valid ? "pointer" : "default", fontFamily: FONT }}>
        {creating ? "作成中…" : `T${table}に対戦を作成 ▶`}
      </button>

      {createdInfo && (
        <div style={{ marginTop: 18, textAlign: "center" }}>
          <div style={{ fontSize: 13.5, color: C.win, fontWeight: 700, marginBottom: 6 }}>✓ T{createdInfo.table}に作成しました</div>
          <div style={{ fontSize: 15, fontWeight: 800, color: C.ink }}>{createdInfo.names.join(" 対 ")}</div>
          <div style={{ fontSize: 12, color: C.sub, marginTop: 8, lineHeight: 1.7 }}>目標点 {createdInfo.raceTo[0]} 対 {createdInfo.raceTo[1]}<br />選手用アプリの「対戦表」から、この試合のカードを押してもらってください</div>
        </div>
      )}
    </div>
  );
}
function Field({ label, children }) {
  return <div style={{ marginBottom: 10 }}><div style={{ fontSize: 13.5, fontWeight: 700, color: C.sub, marginBottom: 6 }}>{label}</div>{children}</div>;
}
function Notice({ children }) {
  return <div style={{ fontSize: 13.5, color: C.hill, background: C.hillBg, border: `1px solid ${C.hill}`, borderRadius: 10, padding: "8px 12px", marginBottom: 12 }}>{children}</div>;
}
const selectStyle = { width: "100%", boxSizing: "border-box", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, color: C.ink, fontSize: 15, padding: "11px 12px", outline: "none", fontFamily: FONT };

// 対戦の「試合の長さ・持ち時間・目標点」だけを部分更新するための組み立て。
// 対戦データ全体を書き戻さないので、スコアラーが入力中のスコアを消してしまわない
function planMatchUpdate(updates, qm, lenPct, minutes, now) {
  const R1 = qm.r1 || 0, R2 = qm.r2 || 0;
  const base = qm.raceTo || [0, 0];
  const rt = R1 > 0 && R2 > 0 ? computeRace(R1, R2, lenPct) : { rt1: base[0], rt2: base[1] };
  updates[qm.id + "/raceTo"] = [rt.rt1, rt.rt2];
  updates[qm.id + "/lenPct"] = lenPct;
  updates[qm.id + "/matchMinutes"] = minutes;
  updates[qm.id + "/version"] = (qm.version || 1) + 1;
  updates[qm.id + "/updatedAt"] = now;
}


/* 予選／準々決勝／準決勝／決勝。決勝トーナメントの試合だけ回戦名を出す */
function roundLabelOf(m) {
  if (!m || !m.bracket) return "予選";
  const total = Math.round(Math.log2(m.bracketSize || 8));
  const r = m.bracketRound || 1;
  if (r === total) return "決勝";
  if (total - r === 1) return "準決勝";
  if (total - r === 2) return "準々決勝";
  return `${r}回戦`;
}


/* このアプリの立場。バナーの投稿を止めるかどうかの判定に使う
   hq=本部(B1)／player=選手・スコアラー(B2)／viewer=観戦(B3) */
const APP_KIND = "hq";
/* バナーへの書き込みが許されているか。本部は常に可。
   選手側・観戦側は本部の設定で個別に止められる（悪質な書き込みが続いた時のため） */
function useBannerPostAllowed() {
  const [ok, setOk] = useState(APP_KIND === "hq");
  useEffect(() => {
    if (APP_KIND === "hq") return;
    const ref = db.ref("config");
    const handler = ref.on("value", (snap) => {
      const c = snap.val() || {};
      const v = APP_KIND === "viewer" ? c.bannerPostViewer : c.bannerPostPlayer;
      setOk(v !== false && v !== "off"); // 既定は受け付ける
    });
    return () => ref.off("value", handler);
  }, []);
  return ok;
}

/* ========= 1行バナー =========
   本部（B1）の設定タブで編集した文言を、待機中の卓やスコアラー画面の下にランダムで出す。
   config/banners に改行区切りで入っている。空なら下の既定文言を使う */
const DEFAULT_BANNERS = [
  "本日のミカおすすめ→レバニラ",
  "初デートのおすすめ→ガスト",
  "NO！スポハラ！",
  "球場外は1回100円(常連のみ)",
  "モスセーフティにご注意",
  "コワーキングスペースNORA",
  "あれ、髪切りました？",
  "プレデターのネコ",
  "中野軽率署",
  "それはちょっとタランティーノ",
];
/* 🐾は表示するときに必ず先頭へ付ける。保存する文章には含めない
   （前に🐾込みで保存されたものが残っていても、ここで取り除く） */
const stripPaw = (x) => String(x || "").replace(/^[\s🐾]+/, "").trim();
function parseBanners(raw) {
  const arr = String(raw == null ? "" : raw).split("\n").map(stripPaw).filter(Boolean);
  return arr.length ? arr : DEFAULT_BANNERS;
}
/* 一定時間ごとに別の文言へ入れ替える */
function useBanner(intervalMs) {
  const [list, setList] = useState(DEFAULT_BANNERS);
  const [idx, setIdx] = useState(() => Math.floor(Math.random() * DEFAULT_BANNERS.length));
  useEffect(() => {
    const ref = db.ref("config/banners");
    const handler = ref.on("value", (snap) => {
      const arr = parseBanners(snap.val());
      setList(arr);
      setIdx(Math.floor(Math.random() * arr.length));
    });
    return () => ref.off("value", handler);
  }, []);
  useEffect(() => {
    if (list.length < 2) return;
    // 毎回リスト全体からランダムで選ぶ。ただし直前と同じものは避ける
    const iv = setInterval(() => setIdx((n) => {
      const r = Math.floor(Math.random() * (list.length - 1));
      return r >= n ? r + 1 : r;
    }), intervalMs || 15000);
    return () => clearInterval(iv);
  }, [list, intervalMs]);
  return list[idx % list.length] || "";
}
/* バナーを閉じる仕組み。うるさいと感じた人が✖️で消せるようにする。
   画面を読み込み直すとまた出る（設定として残さない）。
   同じアプリ内の他のバナーもまとめて消えるように、閉じたことを共有する */
let bannersClosed = false;
const bannerClosers = new Set();
function closeBanners() {
  bannersClosed = true;
  bannerClosers.forEach((fn) => fn(true));
}

function BannerLine({ style, boxed }) {
  const text = useBanner();
  // 画面が出た直後は出さず、3秒おいてからふわっと表示する。
  // 高さは最初から確保しておき、出た時に他のカードがずれないようにする
  const [ready, setReady] = useState(false);
  const [shown, setShown] = useState("");
  const [vis, setVis] = useState(false);
  const [shift, setShift] = useState(0); // 枠からはみ出した分（横に流す量）
  const [closed, setClosed] = useState(bannersClosed);
  const [editing, setEditing] = useState(false); // タップで開く入力窓
  const canPost = useBannerPostAllowed();
  const boxRef = useRef(null);
  const textRef = useRef(null);

  useEffect(() => {
    bannerClosers.add(setClosed);
    return () => { bannerClosers.delete(setClosed); };
  }, []);

  useEffect(() => {
    const t = setTimeout(() => setReady(true), 3000);
    return () => clearTimeout(t);
  }, []);
  useEffect(() => {
    if (!ready) return;
    setVis(false); // いったん消してから入れ替える（文言が変わる時もふわっと切り替わる）
    const t = setTimeout(() => { setShown(text); setVis(true); }, 260);
    return () => clearTimeout(t);
  }, [ready, text]);

  // 文字が枠に収まらない時は、左右にゆっくり流して最後まで読めるようにする
  useEffect(() => {
    const bx = boxRef.current, tx = textRef.current;
    if (!bx || !tx) return;
    const over = tx.scrollWidth - bx.clientWidth;
    setShift(over > 4 ? over + 8 : 0);
  }, [shown]);

  const h = boxed ? 50 : 26;
  const box = {
    height: "100%", boxSizing: "border-box",
    display: "flex", alignItems: "center", justifyContent: "center",
    overflow: "hidden",
    opacity: vis ? 1 : 0, transition: "opacity 600ms ease",
    ...(boxed ? {
      background: C.zone, border: `1px solid ${C.line}`, borderRadius: 12, padding: "0 12px",
    } : {}),
  };
  const inner = {
    fontSize: "clamp(14px, 4.3vw, 17px)", fontWeight: 800,
    color: boxed ? "#5A646E" : C.sub, whiteSpace: "nowrap",
    ...(shift > 0 ? {
      // はみ出す量に応じて時間を決める（速すぎると読めない）
      animation: `bannerScroll ${Math.max(6, Math.round(shift / 18) + 5)}s ease-in-out infinite alternate`,
      "--shift": `-${shift}px`,
    } : {}),
  };
  if (closed) return null;

  return (
    <div style={{ height: h, flexShrink: 0, ...style }}>
      <div ref={boxRef} onClick={() => { if (canPost) setEditing(true); }}
        style={{ ...box, position: "relative", paddingRight: boxed ? 38 : 26, cursor: canPost ? "pointer" : "default" }}>
        <span ref={textRef} style={inner}>{shown ? "🐾" + shown : ""}</span>
        {/* うるさい時はここで閉じられる。読み込み直せばまた出る */}
        <button onClick={(e) => { e.stopPropagation(); closeBanners(); }} aria-label="バナーを閉じる" style={{
          position: "absolute", right: 2, top: 0, bottom: 0, width: 34,
          background: "none", border: "none", color: C.sub, fontSize: 15, lineHeight: 1,
          cursor: "pointer", fontFamily: FONT, opacity: vis ? 0.7 : 0, transition: "opacity 600ms ease",
        }}>✕</button>
      </div>
      {editing && <BannerCompose onClose={() => setEditing(false)} />}
    </div>
  );
}

/* バナーをタップした時に出る入力窓。登録するとリストのいちばん上に入る。
   🐾は表示するときに自動で付くので、ここでは書かない */
function BannerCompose({ onClose }) {
  const [value, setValue] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const save = async () => {
    const line = stripPaw(value);
    if (!line) { onClose(); return; }
    setBusy(true);
    try {
      const cur = await dbGet("config/banners");
      const list = String(cur == null ? DEFAULT_BANNERS.join("\n") : cur)
        .split("\n").map(stripPaw).filter(Boolean);
      const next = [line, ...list.filter((x) => x !== line)]; // 新しいものを先頭に
      await dbUpdate("config", { banners: next.join("\n") });
      onClose();
    } catch (e) {
      setErr(String(e && e.message ? e.message : e));
      setBusy(false);
    }
  };

  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.55)", zIndex: 2100,
      display: "flex", alignItems: "center", justifyContent: "center", padding: 18,
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: "#fff", borderRadius: 16, padding: "18px 16px", width: "100%", maxWidth: 420, boxSizing: "border-box",
      }}>
        <div style={{ fontSize: 17, fontWeight: 900, color: C.ink, marginBottom: 4 }}>ひとこと追加</div>
        <div style={{ fontSize: 13, color: "#5A646E", lineHeight: 1.7, marginBottom: 10 }}>
          みんなの画面に出ます。先頭の🐾は自動で付きます
        </div>
        <input value={value} onChange={(e) => setValue(e.target.value.slice(0, 40))} autoFocus
          placeholder="例：本日のミカおすすめ→レバニラ"
          onKeyDown={(e) => { if (e.key === "Enter") save(); }}
          style={{
            width: "100%", boxSizing: "border-box", background: "#fff", border: `1px solid ${C.line}`,
            borderRadius: 10, color: C.ink, fontSize: 16, padding: "12px", outline: "none", fontFamily: FONT,
          }} />
        <div style={{ fontSize: 12.5, color: C.sub, marginTop: 6, minHeight: 18 }}>
          {err ? <span style={{ color: C.minus, fontWeight: 700 }}>{err}</span> : `${value.length}/40　プレビュー：🐾${stripPaw(value)}`}
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
          <button onClick={onClose} style={{
            flex: 1, background: C.zone, border: `1px solid ${C.line}`, borderRadius: 10,
            padding: "12px 0", fontSize: 15, fontWeight: 800, color: C.ink, fontFamily: FONT, cursor: "pointer",
          }}>やめる</button>
          <button onClick={save} disabled={busy || !stripPaw(value)} style={{
            flex: 1, background: busy || !stripPaw(value) ? C.line : C.blue, color: "#fff", border: "none", borderRadius: 10,
            padding: "12px 0", fontSize: 15, fontWeight: 800, fontFamily: FONT, cursor: busy ? "wait" : "pointer",
          }}>{busy ? "登録中…" : "登録する"}</button>
        </div>
      </div>
    </div>
  );
}

/* 対戦データに入っている各選手のファーゴレート */
function rateOfPlayer(m, i) {
  const v = parseInt(i === 0 ? (m && m.r1) : (m && m.r2), 10);
  return v > 0 ? v : null;
}

/* ========= テーブルの様子：卓ごとの1試合を、ラック履歴つきで見せる =========
   左右が選手カード、真ん中がここまでのラック履歴。履歴の下に現在のスコア。
   進行中のラックは黄色の行で出し、点数が入ると5秒だけ点滅させる（他卓を横目で見ても気づけるように）。
   古いラックは直近5件を残して畳む（タップで開閉） */
const SHOW_RACKS = 5;

function LiveTablePanel({ tableNum, m }) {
  const [nowTs, setNowTs] = useState(Date.now());
  const [openHist, setOpenHist] = useState(false);
  const [flashing, setFlashing] = useState(false);
  const lastLiveRef = useRef(null);
  const flashTimerRef = useRef(null);

  useEffect(() => { const iv = setInterval(() => setNowTs(Date.now()), 1000); return () => clearInterval(iv); }, []);

  const balls = (m && m.balls) || [];
  const live = [
    balls.filter((b) => b.loc === "p1" && !b.dead).length,
    balls.filter((b) => b.loc === "p2" && !b.dead).length,
  ];
  const liveKey = m ? `${m.id}:${m.rack}:${live[0]}/${live[1]}` : "";

  // 進行中ラックの点数が変わったら点滅。試合や卓が切り替わった時は点滅させない
  useEffect(() => {
    if (!m || m.phase !== "play") { lastLiveRef.current = liveKey; return; }
    if (lastLiveRef.current !== null && lastLiveRef.current !== liveKey) {
      setFlashing(true);
      clearTimeout(flashTimerRef.current);
      flashTimerRef.current = setTimeout(() => setFlashing(false), 5000);
    }
    lastLiveRef.current = liveKey;
  }, [liveKey]);
  useEffect(() => () => clearTimeout(flashTimerRef.current), []);

  const panelBox = {
    background: "#fff", border: `3px solid ${C.ink}`, borderRadius: 14,
    padding: "10px 12px", marginBottom: 14, boxSizing: "border-box",
    opacity: m && m.pending ? 0.75 : 1, // 勝者待ちの予定はまだ始められないので薄く
  };
  const tBadge = {
    display: "inline-block", background: C.ink, color: "#fff", borderRadius: 6,
    padding: "3px 11px", fontSize: 15, fontWeight: 900, letterSpacing: 2, whiteSpace: "nowrap",
  };

  if (!m) {
    // 予定のない卓は情報が無いので、場所を取らないように1行だけにする
    return (
      <div style={{ ...panelBox, padding: "8px 12px", display: "flex", alignItems: "center", gap: 10 }}>
        <span style={tBadge}>T{tableNum}</span>
        <span style={{ fontSize: 14, fontWeight: 800, color: C.sub }}>予定なし</span>
      </div>
    );
  }

  const names = m.names || ["", ""];
  const raceTo = m.raceTo || [0, 0];
  const tot = m.tot || [0, 0];
  const hist = m.hist || [];
  const bothLose = !!m.bothLose;
  const reached = [raceTo[0] > 0 && tot[0] >= raceTo[0], raceTo[1] > 0 && tot[1] >= raceTo[1]];
  const winner = bothLose ? null
    : (m.winner === 0 || m.winner === 1) ? m.winner
    : (reached[0] && reached[1]) ? ((hist.slice(-1)[0] || { w: 0 }).w)
    : reached[0] ? 0 : reached[1] ? 1 : null;
  const finished = winner != null || bothLose;
  // ヒルヒル＝両者とも残り14点以下（確定分で判定）。このラックの9番で決まるので、残り点数は出さない
  const hillHill = !finished && m.phase === "play" &&
    raceTo[0] > 0 && raceTo[1] > 0 && raceTo[0] - tot[0] <= 14 && raceTo[1] - tot[1] <= 14;
  // 得点は台上の球を含めて常にライブ更新する。ただしヒルヒルに入ったら、その9番で決着が付くまで
  // 表示を確定分（tot）で止める（ヒルヒル中は「あと◯」を出さない仕様と揃える）
  const disp = (m.phase === "play" && !hillHill) ? [tot[0] + live[0], tot[1] + live[1]] : tot;

  const rateOf = (i) => (raceTo[i] > 0 ? Math.min(1, tot[i] / raceTo[i]) : 0);
  const badgeOf = (i) => {
    if (m.phase === "banking") return null;
    if (bothLose) return { t: `達成率 ${Math.round(rateOf(i) * 100)}％`, gray: true };
    if (winner != null) return winner === i ? { t: "勝ち" } : { t: `達成率 ${Math.round(rateOf(i) * 100)}％`, gray: true };
    if (hillHill) return { t: i === 0 ? "ヒルヒル！" : "9番勝負！" };
    const rem = raceTo[i] - disp[i];
    if (rem <= 0) return { t: "達成" };
    const toHill = rem - 14;
    return toHill > 0 ? { t: `あと${toHill}でヒル` } : { t: `あと${rem}で勝ち` };
  };

  // 残り時間。deadline（絶対時刻）から逆算し、決着したらその時点で止める
  const clockJsx = (() => {
    if (m.pending) return <span style={{ fontSize: 14.5, fontWeight: 900, color: C.sub, whiteSpace: "nowrap" }}>⏰ {m.matchMinutes || 30}分</span>;
    if (m.phase === "banking") {
      return <span style={{ fontSize: 14.5, fontWeight: 900, color: C.sub, whiteSpace: "nowrap" }}>⏰ 持ち時間 {m.matchMinutes || 30}分</span>;
    }
    if (!m.deadline) return null;
    const left = m.deadline - (m.finishedAt || nowTs);
    if (left <= 0) return <span style={{ fontSize: 15, fontWeight: 900, color: C.minus, whiteSpace: "nowrap" }}>⏰ 時間切れ</span>;
    const sec = Math.floor(left / 1000);
    const txt = `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
    const col = finished ? C.sub : left < 5 * 60 * 1000 ? C.hill : C.ink;
    return <span style={{ fontSize: 15, fontWeight: 900, color: col, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>⏰ {txt}</span>;
  })();

  const stateTxt = m.pending ? "勝者待ち" : m.phase === "banking" ? "バンキング中" : finished ? "試合終了" : "";

  const card = (i) => {
    const pc = i === 0 ? C.blue : C.red;
    const b = badgeOf(i);
    const isBrk = m.brk === i;
    const isWinner = finished && !bothLose && winner === i;
    return (
      <div style={{
        flex: 1, minWidth: 0, background: pc, borderRadius: 14, padding: "8px 5px 6px",
        textAlign: "center", color: "#fff",
        boxShadow: isWinner
          ? "0 0 0 3px #FFD54A, inset 0 0 0 3px rgba(255,255,255,0.65)"
          : isBrk ? "inset 0 0 0 3px rgba(255,255,255,0.65)" : "none",
      }}>
        <div style={{
          fontSize: 16.5, fontWeight: 800, background: "rgba(0,0,0,0.16)", borderRadius: 7,
          padding: "2px 4px", marginBottom: 2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
        }}>{names[i]}</div>
        {/* ファーゴレート。数字を読みやすくするため、FRの文字は小さく、数字は大きく太く。
            運営が暫定で決めた人もいるので、無い時は出さない */}
        <div style={{ minHeight: 17, marginBottom: 2, display: "flex", alignItems: "baseline", justifyContent: "center", gap: 2 }}>
          {rateOfPlayer(m, i) && (
            <>
              <span style={{ fontSize: 10, fontWeight: 800, opacity: 0.6 }}>FR</span>
              <span style={{ fontSize: 15, fontWeight: 900, letterSpacing: 0.4, fontVariantNumeric: "tabular-nums", opacity: 0.95 }}>
                {rateOfPlayer(m, i)}
              </span>
            </>
          )}
        </div>
        <div style={{ fontSize: 40, fontWeight: 800, lineHeight: 1.05, fontVariantNumeric: "tabular-nums" }}>
          {m.pending ? "–" : m.phase === "banking" ? "–" : disp[i]}
          {!m.pending && <span style={{ fontSize: 21, fontWeight: 700, opacity: 0.75 }}>/{raceTo[i]}</span>}
        </div>
        <div style={{ height: 24, marginTop: 4, display: "flex", alignItems: "stretch" }}>
          {b && (
            <span style={{
              flex: 1, minWidth: 0, background: isWinner ? "#FFD54A" : "#fff", color: isWinner ? "#5A4400" : b.gray ? C.sub : pc, borderRadius: 8,
              display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 13.5, fontWeight: 800, whiteSpace: "nowrap", overflow: "hidden", padding: "0 2px",
            }}>{b.t}</span>
          )}
        </div>
        <div style={{ minHeight: 18, marginTop: 4, fontSize: 12.5, fontWeight: 800, letterSpacing: 1, visibility: isBrk ? "visible" : "hidden" }}>● ブレイク</div>
      </div>
    );
  };

  // 中央：ラック履歴
  const hidden = Math.max(0, hist.length - SHOW_RACKS);
  const shown = openHist ? hist : hist.slice(hidden);
  const rowStyle = { display: "flex", alignItems: "center", justifyContent: "center", gap: 3, fontSize: 15, fontWeight: 700, fontVariantNumeric: "tabular-nums", lineHeight: 1.4 };
  const numStyle = (side, strong) => ({ width: 24, textAlign: side === "a" ? "right" : "left", color: side === "a" ? C.blue : C.red, fontWeight: strong ? 900 : 700 });

  const histJsx = (
    <div style={{ width: 78, flexShrink: 0, background: "#fff", border: `1.5px solid ${C.line}`, borderRadius: 12, padding: "5px 4px", display: "flex", flexDirection: "column" }}>
      <div style={{ fontSize: 11, fontWeight: 800, color: C.sub, textAlign: "center", marginBottom: 3, letterSpacing: 1 }}>ラック</div>
      {m.pending || m.phase === "banking" ? (
        <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", color: C.sub, fontSize: 11, textAlign: "center" }}>
          {m.pending ? <>前の試合<br />待ち</> : <>まだ<br />ありません</>}
        </div>
      ) : (
        <>
          <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 1, overflow: "hidden" }}>
            {hidden > 0 && (
              <div onClick={() => setOpenHist((v) => !v)} style={{
                fontSize: 11.5, fontWeight: 800, color: C.sub, textAlign: "center", lineHeight: 1.6,
                border: `1px solid ${C.line}`, borderRadius: 5, marginBottom: 2, cursor: "pointer", background: C.zone,
              }}>{openHist ? "▲ 畳む" : `▼ 前の${hidden}ラック`}</div>
            )}
            {shown.map((h, k) => {
              const add = h.add || [0, 0];
              return (
                <div key={k} style={rowStyle}>
                  <span style={numStyle("a", h.w === 0)}>{add[0]}</span>
                  <span style={{ color: "#B8BFC6", fontSize: 12 }}>-</span>
                  <span style={numStyle("b", h.w === 1)}>{add[1]}</span>
                </div>
              );
            })}
            {m.phase === "play" && (
              <div style={{ ...rowStyle, background: flashing ? undefined : "#FFF6CC", borderRadius: 5, animation: flashing ? "rackFlash 0.45s steps(1) 0s 11" : "none" }}>
                <span style={numStyle("a")}>{live[0]}</span>
                <span style={{ color: "#B8BFC6", fontSize: 12 }}>-</span>
                <span style={numStyle("b")}>{live[1]}</span>
              </div>
            )}
          </div>
          <div style={{ marginTop: 4, paddingTop: 4, borderTop: `1.5px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", gap: 4, fontSize: 19, fontWeight: 900, fontVariantNumeric: "tabular-nums" }}>
            <span style={{ color: C.blue }}>{disp[0]}</span>
            <span style={{ color: C.sub, fontSize: 14 }}>-</span>
            <span style={{ color: C.red }}>{disp[1]}</span>
          </div>
        </>
      )}
    </div>
  );

  return (
    <div style={panelBox}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <span style={{ display: "flex", alignItems: "baseline", gap: 7, minWidth: 0 }}>
          <span style={tBadge}>T{tableNum}</span>
          <span style={{ fontSize: 14.5, fontWeight: 900, color: m.bracket ? C.hill : C.sub, whiteSpace: "nowrap" }}>{roundLabelOf(m)}</span>
        </span>
        <span style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14.5, fontWeight: 900, color: C.ink }}>
          {stateTxt}{clockJsx}
        </span>
      </div>
      <div style={{ display: "flex", gap: 5, alignItems: "stretch" }}>
        {card(0)}
        {histJsx}
        {card(1)}
      </div>
      {bothLose ? (
        <div style={{ marginTop: 8, textAlign: "center", fontSize: 16.5, fontWeight: 900, color: "#fff", background: C.hill, borderRadius: 8, padding: "3px 0" }}>時間切れ</div>
      ) : winner != null ? (
        <div style={{ marginTop: 8, textAlign: "center", fontSize: 16.5, fontWeight: 900, color: "#fff", background: C.win, borderRadius: 8, padding: "3px 0" }}>🏆 {names[winner]} 勝利</div>
      ) : null}
    </div>
  );
}

/* ========= テーブルタブ：3卓の今の様子を縦に並べる ========= */
// 卓に今どの試合を出すか決める。次の試合がまだバンキング中（先攻未決定）の間は、
// その卓で直近に終わった試合のスコアを出し続ける（次のバンキング結果が出た瞬間に切り替わる）
function pickDisplayMatch(matches, tableNum) {
  const queue = getQueueForTable(matches, tableNum);
  const next = queue[0] || null;
  if (!next) return null;
  if (next.phase === "banking" && !next.pending) {
    const finished = getAllForTable(matches, tableNum).filter(isMatchFinished);
    if (finished.length) {
      finished.sort((a, b) => (b.finishedAt || b.updatedAt || 0) - (a.finishedAt || a.updatedAt || 0));
      return finished[0];
    }
  }
  return next;
}
function LiveTablesTab() {
  const [matches, setMatches] = useState({});
  const [err, setErr] = useState(null);
  useEffect(() => dbSubscribe("matches",
    (m) => { setMatches(m || {}); setErr(null); },
    (e) => setErr(String(e && e.message ? e.message : e))), []);
  const display = useMemo(() => [1, 2, 3].map((t) => pickDisplayMatch(matches, t)), [matches]);
  return (
    <div style={{ padding: "16px 12px 32px", fontFamily: FONT, maxWidth: 560, margin: "0 auto" }}>
      {[0, 1, 2].map((i) => (
        <LiveTablePanel key={i} tableNum={i + 1} m={display[i]} />
      ))}
      {err && <div style={{ textAlign: "center", fontSize: 13, color: C.minus, marginTop: 12 }}>同期エラー: {err}</div>}
      {/* バナーはこの画面で1つだけ。下までスクロールした時に目に入る位置に置く */}
      <BannerLine boxed style={{ marginTop: 18 }} />
    </div>
  );
}

function HomeTab() {
  const [queues, setQueues] = useState([[], [], []]);
  const refereeEnabled = loadSettings().refereeEnabled !== false; // 設定タブでオフにできる
  // スコアの更新が無くても時間経過だけで「そろそろ呼び出し」判定が動くよう、定期的に再描画する
  const [, forceTick] = useState(0);
  useEffect(() => { const iv = setInterval(() => forceTick((t) => t + 1), 15000); return () => clearInterval(iv); }, []);
  const [roster, setRoster] = useState([]);
  const [refereeCounts, setRefereeCounts] = useState({});
  const [refModalMatch, setRefModalMatch] = useState(null); // ✏️で開くスコアラー候補モーダルの対象試合
  const [refereeBusy, setRefereeBusy] = useState(false);
  const [tableAdjust, setTableAdjust] = useState(null); // 展開中の卓番号(0-2) or null
  const [foldPrelim, setFoldPrelim] = useState(null); // 予選のコマをたたむ。null=まだ自動判定していない
  const [showGlobalAdjust, setShowGlobalAdjust] = useState(false);
  const [globalBusy, setGlobalBusy] = useState(false);
  const [tLenPct, setTLenPct] = useState(100);
  const [tPer100, setTPer100] = useState(60);
  const [swapSource, setSwapSource] = useState(null);

  const performSwap = async (source, target) => {
    if (!source || !target || source.id === target.id) { setSwapSource(null); return; }
    const sn0 = source.names[0], sn1 = source.names[1];
    const tn0 = target.names[0], tn1 = target.names[1];
    if (!window.confirm(`T${source.table}　${sn0} 対 ${sn1}\nと\nT${target.table}　${tn0} 対 ${tn1}\nの卓・順番を入れ替えます。よろしいですか？`)) { setSwapSource(null); return; }
    try {
      await saveMatchHistory(source.id, source, "入れ替えの前");
      await saveMatchHistory(target.id, target, "入れ替えの前");
      const now = Date.now();
      const upd = {};
      upd[source.id + "/table"] = target.table;
      upd[source.id + "/createdAt"] = target.createdAt;
      upd[source.id + "/version"] = (source.version || 1) + 1;
      upd[source.id + "/updatedAt"] = now;
      upd[target.id + "/table"] = source.table;
      upd[target.id + "/createdAt"] = source.createdAt;
      upd[target.id + "/version"] = (target.version || 1) + 1;
      upd[target.id + "/updatedAt"] = now;
      if (source.slot != null || target.slot != null) {
        upd[source.id + "/slot"] = target.slot != null ? target.slot : null;
        upd[target.id + "/slot"] = source.slot != null ? source.slot : null;
      }
      if (source.scheduledAt != null || target.scheduledAt != null) {
        upd[source.id + "/scheduledAt"] = target.scheduledAt != null ? target.scheduledAt : null;
        upd[target.id + "/scheduledAt"] = source.scheduledAt != null ? source.scheduledAt : null;
      }
      await dbUpdate("matches", upd);
    } catch {}
    setSwapSource(null);
  };
  // 空いているマス（その卓の待機列の末尾）へ移す
  const performMoveToEmpty = async (source, table) => {
    if (!source) { setSwapSource(null); return; }
    if (!window.confirm(`T${source.table}　${source.names[0]} 対 ${source.names[1]}\nをT${table}の空きへ移動します。よろしいですか？`)) { setSwapSource(null); return; }
    try {
      await saveMatchHistory(source.id, source, "移動の前");
      await dbUpdate("matches/" + source.id, {
        table, slot: null, scheduledAt: null, createdAt: Date.now(),
        version: (source.version || 1) + 1, updatedAt: Date.now(),
      });
    } catch {}
    setSwapSource(null);
  };

  const [loadErr, setLoadErr] = useState(null);
  const [cols, setCols] = useState([[], [], []]); // 終了分も含む全対戦（タイムライン表示用）
  const [eta, setEta] = useState({}); // 各試合の開始見込み時刻
  const applyRecord = (rec) => {
    const r = normalizeRecord(rec);
    setQueues([1, 2, 3].map((t) => getQueueForTable(r.matches, t)));
    setCols([1, 2, 3].map((t) => annotateColumn(getAllForTable(r.matches, t))));
    setEta(buildEta(r.matches, parseInt(loadSettings().changeoverMin, 10) || 5));
    setRoster(r.roster);
    setRefereeCounts(r.refereeCounts);
    setLoadErr(null);
  };
  // 手動更新用（購読しているので通常は不要）
  const refresh = async () => {
    try { applyRecord(await dbGet("/")); }
    catch (e) { setLoadErr(String(e && e.message ? e.message : e)); }
  };
  // 変更を購読する。ポーリングしないので、開きっぱなしでも通信が積み上がらない
  useEffect(() => dbSubscribe("/", applyRecord, (e) => setLoadErr(e)), []);

  const getRefereeCandidates = (ti, target) => {
    if (!target) return [];
    const isLive = !!target.startedAt; // true: 対戦中カードの変更／false: 呼び出しカードの候補

    // 実際に試合中（ライブ）の選手は除外。
    // ただし「呼び出し」の候補では、同卓で今まさに試合中の選手は除外しない
    // （この対戦が始まる頃には、その試合はもう終わっているはずだから）
    const playingNow = new Set();
    queues.forEach((q, qi) => {
      if (!(q[0] && q[0].startedAt)) return;
      if (!isLive && qi === ti) return;
      q[0].names.forEach((n) => playingNow.add(n));
    });
    // これから呼び出す・変更する対戦の当事者2人は、自分の試合のスコアラーにはなれないので必ず除外
    target.names.forEach((n) => playingNow.add(n));

    // 既にスコアラーとして動いている・決まっている人も除外
    // （現在試合中の担当、呼び出し中で決まっている担当の両方。卓に関わらず未終了の対戦すべてを見る）
    const refereeingNow = new Set();
    queues.forEach((q) => q.forEach((m) => { if (m && m.referee) refereeingNow.add(m.referee); }));

    // 呼び出し候補限定：同卓で今試合中の選手（終わったら空くのでおすすめ表示にする）
    const sameTableLiveNames = new Set(
      !isLive && queues[ti][0] && queues[ti][0].startedAt ? queues[ti][0].names : []
    );

    const nextAtThisTable = new Set(queues[ti][1] ? queues[ti][1].names : []);
    const nextAtOtherTable = new Set();
    queues.forEach((q, qi) => {
      if (qi === ti) return;
      // 別卓で今まさに呼び出し中（まだ始まっていない）対戦の当事者も、もうすぐ試合が始まるので後回しにする
      if (q[0] && !q[0].startedAt) q[0].names.forEach((n) => nextAtOtherTable.add(n));
      if (q[1]) q[1].names.forEach((n) => nextAtOtherTable.add(n));
    });

    return roster
      .filter((p) => p.name && !playingNow.has(p.name) && !refereeingNow.has(p.name))
      .map((p) => {
        const sameTableLive = sameTableLiveNames.has(p.name);
        // 0: 次試合なし（優先）／1: 同卓の次試合／2: 別卓の次試合（後回し）
        const tier = nextAtThisTable.has(p.name) ? 1 : nextAtOtherTable.has(p.name) ? 2 : 0;
        const count = refereeCounts[p.name] || 0;
        return { ...p, tier, count, sameTableLive };
      })
      .sort((a, b) => (a.sameTableLive === b.sameTableLive ? 0 : a.sameTableLive ? -1 : 1) || a.tier - b.tier || a.count - b.count);
  };

  const [refereePicked, setRefereePicked] = useState(null); // 直前に決めたスコアラー { name, match }
  const assignReferee = async (ti, name, target) => {
    if (!target || refereeBusy) return;
    setRefereeBusy(true);
    try {
      // 対戦の一部だけを更新する。スコアラーが入力中の値には触れない
      await dbUpdate("matches/" + target.id, {
        referee: name, version: (target.version || 1) + 1, updatedAt: Date.now(),
      });
      const prevCount = (await dbGet("refereeCounts/" + name)) || 0;
      await dbSet("refereeCounts/" + name, prevCount + 1);
      setRefModalMatch(null);
      setRefereePicked({ name, match: target });
      refresh();
    } catch {}
    setRefereeBusy(false);
  };

  const [snapBusy, setSnapBusy] = useState(null);
  const [snapMsg, setSnapMsg] = useState(null);

  const perTableEstimate = (ti) => {
    const q = queues[ti];
    if (!q.length) return null;
    let totalMin = 0;
    q.forEach((m, idx) => {
      if (idx === 0 && m.startedAt && m.matchMinutes) {
        const elapsed = (Date.now() - m.startedAt) / 60000;
        totalMin += Math.max(0, m.matchMinutes - elapsed);
      } else {
        totalMin += m.matchMinutes || 30;
      }
    });
    return new Date(Date.now() + totalMin * 60000);
  };

  // 終了予定時刻に対して、この卓は順調か・押しているかを判定
  const tableScheduleStatus = (ti) => {
    const est = perTableEstimate(ti);
    if (!est) return null;
    const cfg = loadSettings();
    const eH = parseInt(cfg.endH, 10), eM = parseInt(cfg.endM, 10);
    if (isNaN(eH) || isNaN(eM)) return null;
    const targetD = new Date(); targetD.setHours(eH, eM, 0, 0);
    const diffMin = Math.round((targetD - est) / 60000);
    // 表示上、前後5分の誤差は「順調」扱いにする（自動調整の計算自体は誤差ゼロを狙う従来通り）
    return diffMin >= -5
      ? { ok: true, text: `余裕${Math.max(0, diffMin)}分` }
      : { ok: false, text: `押し${Math.abs(diffMin)}分` };
  };

  // 開始済みの試合は設定確定なので対象外。未開始の試合（呼び出し中を含む）を、指定した最終試合の終了予定時刻から逆算して調整する
  const applyTableEndTime = async (ti) => {
    if (snapBusy != null) return;
    const eH = parseInt(tEndH, 10), eM = parseInt(tEndM, 10);
    if (isNaN(eH) || isNaN(eM)) { setSnapMsg({ ok: false, text: "終了予定時刻を入力してください" }); return; }
    const cfg = loadSettings();
    const per100 = parseInt(cfg.per100Min, 10) || 60;
    const calc = computeTableAdjustment(queues[ti], eH, eM, per100);
    if (!calc) { setSnapMsg({ ok: false, text: "次の試合がありません" }); return; }
    if (calc.error) { setSnapMsg({ ok: false, text: calc.error }); return; }
    setSnapBusy(ti);
    try {
      const now = Date.now();
      const updates = {};
      calc.future.forEach((qm) => planMatchUpdate(updates, qm, calc.newLenPct, calc.newMinutes, now));
      await dbUpdate("matches", updates);
      setTLenPct(calc.newLenPct);

      let finalEndH = String(eH).padStart(2, "0"), finalEndM = String(eM).padStart(2, "0");
      let msg = `T${ti + 1}：未開始の${calc.future.length}試合を${calc.newLenPct}%・${calc.newMinutes}分に設定しました`;
      if (calc.hitFloor) {
        // 下限40%でも指定時刻に間に合わないので、最終試合の終了予定時刻自体を現実的な時刻へ更新する
        const realFinish = new Date(Date.now() + calc.curRemainMin * 60000 + calc.future.length * calc.newMinutes * 60000);
        finalEndH = String(realFinish.getHours()).padStart(2, "0");
        finalEndM = String(realFinish.getMinutes()).padStart(2, "0");
        setTEndH(finalEndH); setTEndM(finalEndM);
        msg += `（40%が下限のため終了予定を${finalEndH}:${finalEndM}に更新）`;
      }
      saveSettings({ endH: finalEndH, endM: finalEndM });
      setSnapMsg({ ok: true, text: msg });
      refresh();
    } catch (e) {
      setSnapMsg({ ok: false, text: "反映に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setSnapBusy(null);
  };

  const [tEndH, setTEndH] = useState("17");
  const [tEndM, setTEndM] = useState("00");

  const openTableAdjust = (ti) => {
    setRefModalMatch(null);
    setShowGlobalAdjust(false);
    const future = adjustableMatches(queues[ti]); // 開始済みの試合だけ対象外（呼び出し中は含む）
    const avgLen = future.length ? Math.round(future.reduce((s, m) => s + (m.lenPct || 100), 0) / future.length / 5) * 5 : 100;
    setTLenPct(avgLen);
    const cfg = loadSettings();
    setTPer100(parseInt(cfg.per100Min, 10) || 60);
    setTEndH(cfg.endH || "17");
    setTEndM(cfg.endM || "00");
    setTableAdjust(ti);
  };
  // 100%のときの時間（分）は全卓共通の基準値。ここで変えたら全卓の未開始の試合にまとめて反映する
  const applyTableAdjust = async () => {
    if (tableAdjust == null || snapBusy != null) return;
    const newMinutes = Math.max(1, Math.round(tPer100 * (tLenPct / 100)));
    setSnapBusy(tableAdjust);
    try {
      const now = Date.now();
      const updates = {};
      let count = 0;
      [0, 1, 2].forEach((oi) => {
        adjustableMatches(queues[oi]).forEach((qm) => { planMatchUpdate(updates, qm, tLenPct, newMinutes, now); count++; });
      });
      if (count === 0) { setSnapMsg({ ok: false, text: "次の試合がありません" }); setSnapBusy(null); return; }
      await dbUpdate("matches", updates);
      saveSettings({ per100Min: String(tPer100) });
      setSnapMsg({ ok: true, text: `全卓（${count}試合）を${tLenPct}%・${newMinutes}分（100%基準${tPer100}分）に反映しました` });
      refresh();
    } catch (e) {
      setSnapMsg({ ok: false, text: "反映に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setSnapBusy(null);
  };

  // 終了予定時刻は全卓共通。この時刻に対して、卓ごとに押し／順調／余裕を見て、それぞれ自動調整する
  const applyAllTables = async () => {
    if (tableAdjust == null || snapBusy != null) return;
    const ti = tableAdjust;
    const eH = parseInt(tEndH, 10), eM = parseInt(tEndM, 10);
    if (isNaN(eH) || isNaN(eM)) { setSnapMsg({ ok: false, text: "終了予定時刻を入力してください" }); return; }
    setSnapBusy(ti);
    try {
      const cfg = loadSettings();
      const per100 = parseInt(cfg.per100Min, 10) || 60;
      const now = Date.now();
      const updates = {};
      let count = 0;
      const skipped = [];
      let latestFinish = null; // 40%下限に達した卓の中で、一番遅い現実的な終了時刻
      [0, 1, 2].forEach((oi) => {
        const calc = computeTableAdjustment(queues[oi], eH, eM, per100);
        if (!calc || calc.error) { skipped.push(oi + 1); return; }
        calc.future.forEach((qm) => { planMatchUpdate(updates, qm, calc.newLenPct, calc.newMinutes, now); count++; });
        if (calc.hitFloor) {
          const realFinish = new Date(Date.now() + calc.curRemainMin * 60000 + calc.future.length * calc.newMinutes * 60000);
          if (!latestFinish || realFinish > latestFinish) latestFinish = realFinish;
        }
        if (oi === ti) { setTLenPct(calc.newLenPct); }
      });
      if (count === 0) { setSnapMsg({ ok: false, text: "反映できる対戦がありませんでした" }); setSnapBusy(null); return; }
      await dbUpdate("matches", updates);
      let finalEndH = String(eH).padStart(2, "0"), finalEndM = String(eM).padStart(2, "0");
      let msg = `全卓（${count}試合）に終了予定 ${tEndH}:${tEndM} を反映し、それぞれ自動調整しました`;
      if (latestFinish) {
        finalEndH = String(latestFinish.getHours()).padStart(2, "0");
        finalEndM = String(latestFinish.getMinutes()).padStart(2, "0");
        setTEndH(finalEndH); setTEndM(finalEndM);
        msg += `（40%が下限の卓があるため終了予定を${finalEndH}:${finalEndM}に更新）`;
      }
      saveSettings({ endH: finalEndH, endM: finalEndM });
      if (skipped.length) msg += `（T${skipped.join("・")}は対象外でした）`;
      setSnapMsg({ ok: true, text: msg });
      refresh();
    } catch (e) {
      setSnapMsg({ ok: false, text: "反映に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setSnapBusy(null);
  };

  // 押している卓（1分でも）と、余裕がありすぎる卓（10分超）だけを自動調整する。順調な卓はそのまま
  const applyConditionalAllTables = async () => {
    if (globalBusy) return;
    const eH = parseInt(tEndH, 10), eM = parseInt(tEndM, 10);
    if (isNaN(eH) || isNaN(eM)) { setSnapMsg({ ok: false, text: "終了予定時刻を入力してください" }); return; }
    setGlobalBusy(true);
    try {
      const cfg = loadSettings();
      const per100 = parseInt(cfg.per100Min, 10) || 60;
      const now = Date.now();
      const updates = {};
      let count = 0;
      const adjustedTables = [];
      let latestFinish = null;
      [0, 1, 2].forEach((oi) => {
        const est = perTableEstimate(oi);
        if (!est) return; // 予定がない卓は無視
        const targetD = new Date(); targetD.setHours(eH, eM, 0, 0);
        const diffMin = Math.round((targetD - est) / 60000);
        const needsAdjust = diffMin < 0 || diffMin > 10;
        if (!needsAdjust) return; // 順調な範囲は触らない
        const calc = computeTableAdjustment(queues[oi], eH, eM, per100);
        if (!calc || calc.error) return;
        calc.future.forEach((qm) => { planMatchUpdate(updates, qm, calc.newLenPct, calc.newMinutes, now); count++; });
        adjustedTables.push(oi + 1);
        if (calc.hitFloor) {
          const realFinish = new Date(Date.now() + calc.curRemainMin * 60000 + calc.future.length * calc.newMinutes * 60000);
          if (!latestFinish || realFinish > latestFinish) latestFinish = realFinish;
        }
      });
      if (count === 0) {
        setSnapMsg({ ok: true, text: "調整が必要な卓はありませんでした" });
        setGlobalBusy(false);
        return;
      }
      await dbUpdate("matches", updates);
      let finalEndH = String(eH).padStart(2, "0"), finalEndM = String(eM).padStart(2, "0");
      let msg = `T${adjustedTables.join("・")}（${count}試合）を自動調整しました`;
      if (latestFinish) {
        finalEndH = String(latestFinish.getHours()).padStart(2, "0");
        finalEndM = String(latestFinish.getMinutes()).padStart(2, "0");
        setTEndH(finalEndH); setTEndM(finalEndM);
        msg += `（40%が下限のため終了予定を${finalEndH}:${finalEndM}に更新）`;
      }
      saveSettings({ endH: finalEndH, endM: finalEndM });
      setSnapMsg({ ok: true, text: msg });
      refresh();
    } catch (e) {
      setSnapMsg({ ok: false, text: "反映に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setGlobalBusy(false);
  };

  // 100%のときの時間（基準値）だけを更新し、各対戦の長さ％はそのまま持ち時間だけ再計算する。見積もり自体がずれていた時用
  const applyPer100ToAll = async () => {
    if (globalBusy) return;
    setGlobalBusy(true);
    try {
      const now = Date.now();
      const updates = {};
      let count = 0;
      const newMinutes = Math.max(1, Math.round(tPer100 * (tLenPct / 100)));
      [0, 1, 2].forEach((oi) => {
        adjustableMatches(queues[oi]).forEach((qm) => {
          updates[qm.id + "/lenPct"] = tLenPct;
          updates[qm.id + "/matchMinutes"] = newMinutes;
          updates[qm.id + "/version"] = (qm.version || 1) + 1;
          updates[qm.id + "/updatedAt"] = now;
          count++;
        });
      });
      if (count === 0) { setSnapMsg({ ok: false, text: "対象の対戦がありませんでした" }); setGlobalBusy(false); return; }
      await dbUpdate("matches", updates);
      saveSettings({ per100Min: String(tPer100) });
      setSnapMsg({ ok: true, text: `全卓（${count}試合）を${tLenPct}%・${newMinutes}分（100%基準${tPer100}分）に反映しました` });
      refresh();
    } catch (e) {
      setSnapMsg({ ok: false, text: "反映に失敗しました: " + (e && e.message ? e.message : e) });
    }
    setGlobalBusy(false);
  };

  const toggleGlobalAdjust = () => {
    if (showGlobalAdjust) { setShowGlobalAdjust(false); return; }
    setTableAdjust(null);
    setRefModalMatch(null);
    const cfg = loadSettings();
    setTEndH(cfg.endH || "17");
    setTEndM(cfg.endM || "00");
    setTPer100(parseInt(cfg.per100Min, 10) || 60);
    setShowGlobalAdjust(true);
  };

  const slots = Math.max(0, ...cols.map((c) => c.length));
  const totalMatches = cols.reduce((s, c) => s + c.length, 0);
  const doneCount = cols.reduce((s, c) => s + c.filter((e) => e.st === "done").length, 0);
  // 終了した試合の勝者一覧。決勝トーナメントの「◯回戦①の勝者」枠を手で埋め直したい時などに使う
  const winnerChoices = [];
  cols.forEach((col) => col.forEach((e) => {
    if (e.st !== "done") return;
    const wi = matchWinnerIndex(e.m);
    if (wi == null) return;
    const name = (e.m.names || [])[wi];
    if (!name || winnerChoices.some((x) => x.value === name)) return;
    winnerChoices.push({
      value: name,
      label: `${name}（T${e.m.table} ${roundLabelOf(e.m)}の勝者）`,
    });
  }));
  // 決勝トーナメントの試合が最初に現れる行（卓ごとの一番早い位置）。無ければ Infinity
  const bracketStartRow = Math.min(
    ...cols.map((c) => { const idx = c.findIndex((e) => e.m && e.m.bracket); return idx === -1 ? Infinity : idx; })
  );
  // 予選が全部終わったら、予選のコマは自動でたたむ（自分で開いたあとは勝手に閉じない）
  const hasBracketRow = bracketStartRow !== Infinity;
  const prelimEntries = cols.flatMap((c) => c.filter((e, si) => !hasBracketRow || si < bracketStartRow));
  const prelimAllDone = prelimEntries.length > 0 && prelimEntries.every((e) => e.st === "done");
  useEffect(() => {
    if (foldPrelim === null && prelimAllDone && hasBracketRow) setFoldPrelim(true);
  }, [prelimAllDone, hasBracketRow, foldPrelim]);
  const foldedPrelim = foldPrelim === true && hasBracketRow;
  // その行の試合のうち、いちばん早い開始（見込み）時刻
  const rowStartAt = (si) => {
    const ts = [0, 1, 2].map((ti) => {
      const e = cols[ti][si];
      if (!e) return null;
      const info = eta[e.m.id];
      return (e.m.startedAt || (info && info.start)) || null;
    }).filter(Boolean);
    return ts.length ? Math.min(...ts) : null;
  };
  const rowStarted = (si) => [0, 1, 2].some((ti) => cols[ti][si] && cols[ti][si].m.startedAt);
  // 予選／決勝トーナメントが終わる見込み（終わっていれば実際に終わった時刻）
  const endAtOf = (wantBracket) => {
    const ends = [];
    [0, 1, 2].forEach((ti) => {
      (cols[ti] || []).forEach((e) => {
        if (!!e.m.bracket !== wantBracket) return;
        const info = eta[e.m.id];
        const t = isMatchFinished(e.m) ? (e.m.finishedAt || e.m.updatedAt) : (info && info.end);
        if (t) ends.push(t);
      });
    });
    return ends.length ? Math.max(...ends) : null;
  };
  // 予選が終わるまでは「予選終了」、終わったら「決勝終了」の見込みに切り替える
  const bracketEndAt = endAtOf(true);
  const headEnd = prelimAllDone && bracketEndAt != null
    ? { label: "決勝終了", at: bracketEndAt }
    : { label: "予選終了", at: endAtOf(false) };

  const tinfo = [0, 1, 2].map((ti) => {
    const q = queues[ti];
    const cur = q[0];
    const status = tableScheduleStatus(ti);
    const settingSrc = adjustableMatches(q)[0] || null;
    return { ti, cur, status, settingSrc };
  });

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", color: C.ink }}>
      {/* ===== 固定エリア：進捗・卓見出し・卓調整 ===== */}
      <div style={{ flexShrink: 0, padding: "14px 8px 10px", borderBottom: `2px solid ${C.line}`, background: C.bg }}>
        {loadErr && <Notice>データを取得できません：{loadErr}</Notice>}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", position: "relative", marginBottom: 10 }}>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 17.5, color: C.ink, fontWeight: 900 }}>終了 {doneCount} / 全{totalMatches}試合</div>
            <div style={{ height: 7, width: 160, background: C.line, borderRadius: 4, overflow: "hidden", marginTop: 6 }}>
              <div style={{ height: "100%", width: `${totalMatches ? Math.round((doneCount / totalMatches) * 100) : 0}%`, background: C.win, borderRadius: 4, transition: "width 400ms ease" }} />
            </div>
          </div>
          <button onClick={toggleGlobalAdjust} style={{ position: "absolute", right: 0, background: "none", border: `1px solid ${C.line}`, borderRadius: 8, padding: "5px 9px", fontSize: 11.5, fontWeight: 700, color: C.sub, cursor: "pointer", fontFamily: FONT }}>⚙ 全卓調整</button>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "44px repeat(3, minmax(0, 1fr))", columnGap: 4, rowGap: 6 }}>
          <div />
          {tinfo.map(({ ti }) => (
            <div key={ti} style={{ textAlign: "center", fontSize: 20, fontWeight: 900, color: C.ink }}>T{ti + 1}</div>
          ))}
          {/* 左の空きスペースに、予選が終わる見込みを出す */}
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", lineHeight: 1.25 }}>
            {headEnd.at != null && (
              <>
                <span style={{ fontSize: 11.5, fontWeight: 800, color: C.sub, whiteSpace: "nowrap" }}>{headEnd.label}</span>
                <span style={{ fontSize: 13.5, fontWeight: 900, color: C.ink, fontVariantNumeric: "tabular-nums" }}>{fmtClock(headEnd.at)}</span>
              </>
            )}
          </div>
          {tinfo.map(({ ti, cur, status, settingSrc }) => (
            <div key={ti} onClick={() => openTableAdjust(ti)} style={{
              position: "relative", textAlign: "center", cursor: "pointer", boxSizing: "border-box", width: "100%",
              background: tableAdjust === ti ? C.blue : (status && !status.ok ? "#FFF5F4" : "#fff"),
              border: `2px ${tableAdjust === ti ? "solid" : "dashed"} ${tableAdjust === ti ? C.blue : status && !status.ok ? C.minus : C.blue}`,
              borderRadius: 12, padding: "7px 5px 6px",
            }}>
              {cur ? (
                <>
                  <div style={{
                    display: "flex", alignItems: "center", justifyContent: "center", whiteSpace: "nowrap",
                    fontSize: 12, fontWeight: 800, borderRadius: 8, padding: "4px 6px", lineHeight: 1.3,
                    color: tableAdjust === ti ? C.blue : (status ? (status.ok ? C.win : "#fff") : C.sub),
                    background: tableAdjust === ti ? "#fff" : (status ? (status.ok ? C.zone : C.minus) : "transparent"),
                  }}>
                    {status ? (status.ok ? `☑️${status.text}` : `⚠️${status.text}`) : "–"}
                  </div>
                  {settingSrc && (settingSrc.lenPct || settingSrc.matchMinutes) && (
                    <div style={{ marginTop: 4, fontSize: 11.5, fontWeight: 700, color: tableAdjust === ti ? "#fff" : C.ink, whiteSpace: "nowrap" }}>
                      🎱{settingSrc.lenPct || 100}% ⏰{settingSrc.matchMinutes || 30}分
                    </div>
                  )}
                </>
              ) : (
                <div style={{ fontSize: 12.5, color: tableAdjust === ti ? "#fff" : C.sub }}>予定なし</div>
              )}
            </div>
          ))}
        </div>
      </div>

      {/* ===== スクロールエリア：ラウンドごとのタイムライン ===== */}
      <div style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: "10px 8px 24px" }}>
        {swapSource && (
          <div style={{
            display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8,
            background: C.lightBlue, border: `2px solid ${C.blue}`, borderRadius: 12,
            padding: "10px 14px", marginBottom: 14,
          }}>
            <div style={{ fontSize: 13, fontWeight: 800, color: C.blue, lineHeight: 1.5 }}>
              T{swapSource.table}　{swapSource.names[0]} 対 {swapSource.names[1]}
              <br />と入れ替える相手か、空きマスをタップしてください
            </div>
            <button onClick={() => setSwapSource(null)} style={{
              background: "#fff", border: `1.5px solid ${C.blue}`, borderRadius: 8, padding: "7px 14px",
              fontSize: 12.5, fontWeight: 800, color: C.blue, cursor: "pointer", fontFamily: FONT, flexShrink: 0,
            }}>キャンセル</button>
          </div>
        )}
        <div style={{ display: "grid", gridTemplateColumns: "44px repeat(3, minmax(0, 1fr))", columnGap: 4, rowGap: 22 }}>
          {foldedPrelim && (
            <div onClick={() => setFoldPrelim(false)} style={{
              gridColumn: "1 / -1", background: C.zone, border: `1px solid ${C.line}`, borderRadius: 12,
              padding: "11px 0", textAlign: "center", fontSize: 14, fontWeight: 800, color: C.sub, cursor: "pointer",
            }}>▼ 予選 {prelimEntries.length}試合（終了）を見る</div>
          )}
          {Array.from({ length: slots }, (_, s) => (
            foldedPrelim && s < bracketStartRow ? null : (
            <React.Fragment key={s}>
              {s === bracketStartRow && (
                <div style={{ gridColumn: "1 / -1", display: "flex", alignItems: "center", gap: 8, margin: "6px 0 2px" }}>
                  <div style={{ flex: 1, height: 2, background: C.blue }} />
                  <div style={{ fontSize: 14.5, fontWeight: 900, color: C.blue, whiteSpace: "nowrap" }}>🏆 ここから決勝トーナメント</div>
                  <div style={{ flex: 1, height: 2, background: C.blue }} />
                </div>
              )}
              {s === bracketStartRow && !foldedPrelim && (
                <div onClick={() => setFoldPrelim(true)} style={{
                  gridColumn: "1 / -1", textAlign: "center", fontSize: 11.5, fontWeight: 800,
                  color: C.sub, cursor: "pointer", marginBottom: 2,
                }}>▲ 予選をたたむ</div>
              )}
              {/* 時刻はカードとカードの間（行の境目）に出す。
                  そこが「前の試合が終わる時刻」であり「次の試合が始まる時刻」でもあるため */}
              <div style={{ position: "relative", display: "flex", alignItems: "center", justifyContent: "center" }}>
                <span style={{ fontSize: 13, fontWeight: 800, color: C.sub }}>{s + 1}</span>
                {/* いちばん上のカードの上には時刻を出さない。
                    そこは「予選終了◯◯」の表示と重なってしまうため */}
                {rowStartAt(s + 1) != null && (
                  <span style={{ position: "absolute", bottom: -17, left: 0, right: 0, textAlign: "center", fontSize: 13.5, fontWeight: 900, color: rowStarted(s + 1) ? C.ink : C.sub, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>
                    {fmtClock(rowStartAt(s + 1))}
                  </span>
                )}
              </div>
              {[0, 1, 2].map((ti) => {
                const e = cols[ti][s];
                return (
                  <div key={ti}>
                    {e ? (
                      <TimelineSlotCard
                        m={e.m} st={e.st} table={ti + 1} roster={roster}
                        refereeEnabled={refereeEnabled} onEditReferee={(mm) => setRefModalMatch(mm)}
                        swapMode={!!swapSource} isSwapSource={!!swapSource && swapSource.id === e.m.id}
                        swapEligible={e.st === "call" || e.st === "queued" || e.st === "pending"}
                        onStartSwap={(mm) => setSwapSource(mm)}
                        onSwapTarget={(mm) => performSwap(swapSource, mm)}
                        winnerChoices={winnerChoices}
                      />
                    ) : (
                      <TimelineSlotCard
                        m={null} st={null} table={ti + 1} roster={roster}
                        swapMode={!!swapSource} isSwapSource={false}
                        swapEligible={!!swapSource}
                        onStartSwap={() => {}}
                        onSwapTarget={() => performMoveToEmpty(swapSource, ti + 1)}
                        winnerChoices={winnerChoices}
                      />
                    )}
                  </div>
                );
              })}
            </React.Fragment>
            )
          ))}
          {slots === 0 && <div style={{ gridColumn: "1 / -1", textAlign: "center", color: C.sub, fontSize: 14, padding: "24px 0" }}>対戦がまだ登録されていません</div>}
          {/* 各卓の一番下に、その卓の末尾へ新規作成するための最小限の空欄カードを追加 */}
          <div />
          {[1, 2, 3].map((t) => (
            <AddCardMini key={t} roster={roster} table={t} />
          ))}
        </div>
      </div>

      {/* ===== モーダル：卓調整（1卓） ===== */}
      {tableAdjust != null && queues[tableAdjust] && (() => {
        const ti = tableAdjust;
        const future = adjustableMatches(queues[ti]);
        return (
          <div onClick={() => setTableAdjust(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 20 }}>
            <div onClick={(e) => e.stopPropagation()} style={{ background: C.zone, borderRadius: 16, padding: 18, width: "100%", maxWidth: 360, maxHeight: "85vh", overflowY: "auto", position: "relative" }}>
              <button onClick={() => setTableAdjust(null)} style={{ position: "absolute", top: 10, right: 12, background: "none", border: "none", color: C.sub, fontSize: 20, fontWeight: 700, cursor: "pointer", lineHeight: 1, padding: 4 }}>✖️</button>
              <div style={{ fontSize: 17, fontWeight: 900, color: C.blue, textAlign: "center", marginBottom: 16 }}>T{ti + 1} を調整中</div>
              <div style={{ fontSize: 13, color: C.ink, marginBottom: 10, fontWeight: 800, textAlign: "center" }}>⚙ 未開始の試合（残り{future.length}試合）を調整</div>

              {future.length === 0 ? (
                <div style={{ fontSize: 12.5, color: C.sub, textAlign: "center", padding: "8px 0 16px" }}>この卓は現在の対戦が最後です</div>
              ) : (
                <>
                  <div style={{ fontSize: 12, fontWeight: 700, color: C.ink, textAlign: "center", marginBottom: 6 }}>終了予定時刻（全卓共通）</div>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 10 }}>
                    <input inputMode="numeric" value={tEndH} onChange={(e) => setTEndH(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} style={{ width: 64, textAlign: "center", border: `1px solid ${C.line}`, borderRadius: 8, padding: "10px 0", fontSize: 20, fontWeight: 800, fontFamily: FONT }} />
                    <span style={{ fontSize: 18, fontWeight: 800, color: C.sub }}>:</span>
                    <input inputMode="numeric" value={tEndM} onChange={(e) => setTEndM(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} style={{ width: 64, textAlign: "center", border: `1px solid ${C.line}`, borderRadius: 8, padding: "10px 0", fontSize: 20, fontWeight: 800, fontFamily: FONT }} />
                  </div>
                  <button onClick={() => applyTableEndTime(ti)} disabled={snapBusy != null} style={{ width: "100%", background: C.win, color: "#fff", border: "none", borderRadius: 10, padding: "13px 0", fontSize: 14.5, fontWeight: 800, cursor: "pointer", fontFamily: FONT, marginBottom: 6 }}>
                    {snapBusy === ti ? "計算中…" : "✓ この時刻に合わせる（持ち時間・ハンデ自動）"}
                  </button>
                  <button onClick={applyAllTables} disabled={snapBusy != null} style={{ width: "100%", background: "#fff", border: `1.5px solid ${C.blue}`, color: C.blue, borderRadius: 10, padding: "11px 0", fontSize: 13.5, fontWeight: 800, cursor: "pointer", fontFamily: FONT, marginTop: 10, marginBottom: 16 }}>
                    {snapBusy === ti ? "反映中…" : "全卓まとめて自動調整する"}
                  </button>

                  <div style={{ fontSize: 11, color: C.sub, textAlign: "center", marginBottom: 8 }}>または手動で設定</div>
                  <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 12, marginBottom: 10 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                      <span style={{ fontSize: 13, fontWeight: 700 }}>ロングゲームの時間設定</span>
                      <span style={{ fontSize: 17, fontWeight: 800 }}>🎱100%（{tPer100}分）</span>
                    </div>
                    <input type="range" min={10} max={180} step={5} value={tPer100} onChange={(e) => setTPer100(+e.target.value)} style={{ width: "100%", accentColor: C.blue }} />
                  </div>
                  <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 12, marginBottom: 12 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                      <span style={{ fontSize: 13, fontWeight: 700 }}>ショートゲームの割合設定</span>
                      <span style={{ fontSize: 17, fontWeight: 800 }}>🎱{tLenPct}%（{Math.round(tPer100 * (tLenPct / 100))}分）</span>
                    </div>
                    <input type="range" min={40} max={140} step={5} value={tLenPct} onChange={(e) => setTLenPct(+e.target.value)} style={{ width: "100%", accentColor: C.blue }} />
                  </div>
                  <button onClick={applyTableAdjust} disabled={snapBusy != null} style={{ width: "100%", background: C.ink, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT, marginBottom: 4 }}>
                    {snapBusy === ti ? "反映中…" : "手動の値で全卓に反映する"}
                  </button>
                </>
              )}

              {snapMsg && <div style={{ marginTop: 12, textAlign: "center", fontSize: 12, fontWeight: 700, color: snapMsg.ok ? C.win : C.minus }}>{snapMsg.ok ? "✓ " : "✗ "}{snapMsg.text}</div>}
            </div>
          </div>
        );
      })()}

      {/* ===== モーダル：全卓調整 ===== */}
      {showGlobalAdjust && (
        <div onClick={() => setShowGlobalAdjust(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 20 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: C.zone, borderRadius: 16, padding: 18, width: "100%", maxWidth: 360, maxHeight: "85vh", overflowY: "auto", position: "relative" }}>
            <button onClick={() => setShowGlobalAdjust(false)} style={{ position: "absolute", top: 10, right: 12, background: "none", border: "none", color: C.sub, fontSize: 20, fontWeight: 700, cursor: "pointer", lineHeight: 1, padding: 4 }}>✖️</button>
            <div style={{ fontSize: 17, fontWeight: 900, color: C.blue, textAlign: "center", marginBottom: 16 }}>全卓の調整</div>

            <div style={{ fontSize: 12, fontWeight: 700, color: C.ink, textAlign: "center", marginBottom: 6 }}>終了予定時刻（全卓共通）</div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 10 }}>
              <input inputMode="numeric" value={tEndH} onChange={(e) => setTEndH(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} style={{ width: 64, textAlign: "center", border: `1px solid ${C.line}`, borderRadius: 8, padding: "10px 0", fontSize: 20, fontWeight: 800, fontFamily: FONT }} />
              <span style={{ fontSize: 18, fontWeight: 800, color: C.sub }}>:</span>
              <input inputMode="numeric" value={tEndM} onChange={(e) => setTEndM(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))} style={{ width: 64, textAlign: "center", border: `1px solid ${C.line}`, borderRadius: 8, padding: "10px 0", fontSize: 20, fontWeight: 800, fontFamily: FONT }} />
            </div>
            <button onClick={applyConditionalAllTables} disabled={globalBusy} style={{ width: "100%", background: C.win, color: "#fff", border: "none", borderRadius: 10, padding: "13px 0", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT, marginBottom: 6 }}>
              {globalBusy ? "計算中…" : "✓ 押している卓・余裕がある卓だけ自動調整"}
            </button>
            <div style={{ fontSize: 10.5, color: C.sub, textAlign: "center", marginBottom: 16 }}>1分でも押している卓は間に合うよう短く、10分を超えて余裕がある卓は伸ばします。順調な卓はそのままです</div>

            <div style={{ borderTop: `2px solid ${C.line}`, paddingTop: 16 }}>
              <div style={{ fontSize: 10.5, color: C.sub, textAlign: "center", marginBottom: 10 }}>そもそもの見積もりがずれていると感じたら、ここで調整</div>
              <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 12, marginBottom: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                  <span style={{ fontSize: 13, fontWeight: 700 }}>ロングゲームの時間設定</span>
                  <span style={{ fontSize: 17, fontWeight: 800 }}>🎱100%（{tPer100}分）</span>
                </div>
                <input type="range" min={10} max={180} step={5} value={tPer100} onChange={(e) => setTPer100(+e.target.value)} style={{ width: "100%", accentColor: C.blue }} />
              </div>
              <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 12, marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                  <span style={{ fontSize: 13, fontWeight: 700 }}>ショートゲームの割合設定</span>
                  <span style={{ fontSize: 17, fontWeight: 800 }}>🎱{tLenPct}%（{Math.round(tPer100 * (tLenPct / 100))}分）</span>
                </div>
                <input type="range" min={40} max={140} step={5} value={tLenPct} onChange={(e) => setTLenPct(+e.target.value)} style={{ width: "100%", accentColor: C.blue }} />
              </div>
              <button onClick={applyPer100ToAll} disabled={globalBusy} style={{ width: "100%", background: C.ink, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>
                {globalBusy ? "反映中…" : "この基準値を全卓に反映する"}
              </button>
            </div>

            {snapMsg && <div style={{ marginTop: 12, textAlign: "center", fontSize: 12, fontWeight: 700, color: snapMsg.ok ? C.win : C.minus }}>{snapMsg.ok ? "✓ " : "✗ "}{snapMsg.text}</div>}
          </div>
        </div>
      )}

      {/* ===== モーダル：スコアラーを決めた直後の確認 ===== */}
      {refereePicked && (
        <div onClick={() => setRefereePicked(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 24 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", borderRadius: 20, padding: "28px 22px", textAlign: "center", maxWidth: 340, width: "100%" }}>
            <div style={{ fontSize: 13, fontWeight: 800, color: C.sub, letterSpacing: 1, marginBottom: 6 }}>T{refereePicked.match.table}　スコアラー</div>
            <div style={{ fontSize: 24, fontWeight: 900, color: C.blue, marginBottom: 10 }}>📝 {refereePicked.name} さん</div>
            <div style={{ fontSize: 13.5, color: C.ink, lineHeight: 1.8 }}>
              選手用アプリの「対戦表」から<br />
              <b>T{refereePicked.match.table}　{refereePicked.match.names[0]} 対 {refereePicked.match.names[1]}</b><br />
              のカードを押してもらってください
            </div>
            <button onClick={() => setRefereePicked(null)} style={{ marginTop: 18, width: "100%", background: C.blue, color: "#fff", border: "none", borderRadius: 12, padding: "13px 0", fontSize: 15, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>閉じる</button>
          </div>
        </div>
      )}

      {/* ===== モーダル：✏️から開くスコアラー候補 ===== */}
      {refModalMatch && (
        <div onClick={() => setRefModalMatch(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 24 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", borderRadius: 18, padding: "20px 18px", maxWidth: 340, width: "100%", maxHeight: "80vh", overflowY: "auto" }}>
            <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 4, textAlign: "center" }}>T{refModalMatch.table}：スコアラーを選ぶ</div>
            <div style={{ fontSize: 12.5, color: C.sub, marginBottom: 14, textAlign: "center" }}>{refModalMatch.names[0]} 対 {refModalMatch.names[1]}{refModalMatch.referee ? `（現在：${refModalMatch.referee}）` : ""}</div>
            {getRefereeCandidates(refModalMatch.table - 1, refModalMatch).length === 0 ? (
              <div style={{ fontSize: 12.5, color: C.sub, textAlign: "center", padding: "10px 0" }}>候補なし</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {getRefereeCandidates(refModalMatch.table - 1, refModalMatch).map((p) => {
                  const tierInfo = p.sameTableLive
                    ? { label: "同卓で試合中（終了次第）", bg: C.lightBlue, col: C.blue }
                    : p.tier === 1
                    ? { label: "同卓に次試合", bg: "#FFF3E0", col: C.hill }
                    : p.tier === 2
                    ? { label: "別卓に次試合", bg: C.zone, col: C.sub }
                    : null;
                  return (
                    <button key={p.id} onClick={() => assignReferee(refModalMatch.table - 1, p.name, refModalMatch)} disabled={refereeBusy}
                      style={{
                        display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8,
                        background: p.tier === 0 || p.sameTableLive ? C.lightBlue : "#fff",
                        border: `1.5px solid ${p.tier === 0 || p.sameTableLive ? C.blue : C.line}`,
                        borderRadius: 10, padding: "10px 12px", cursor: "pointer", fontFamily: FONT, textAlign: "left",
                      }}>
                      <span style={{ fontSize: 15, fontWeight: 800, color: C.ink }}>{p.name}</span>
                      <span style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
                        {p.count > 0 && <span style={{ fontSize: 11.5, color: C.sub, fontWeight: 700 }}>担当{p.count}回</span>}
                        {tierInfo && (
                          <span style={{ background: tierInfo.bg, color: tierInfo.col, borderRadius: 8, padding: "2px 8px", fontSize: 11, fontWeight: 800, whiteSpace: "nowrap" }}>
                            {tierInfo.label}
                          </span>
                        )}
                      </span>
                    </button>
                  );
                })}
              </div>
            )}
            <button onClick={() => setRefModalMatch(null)} style={{ marginTop: 14, width: "100%", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "11px 0", fontSize: 13.5, fontWeight: 700, color: C.ink, cursor: "pointer", fontFamily: FONT }}>閉じる</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ========= 各卓の待機列末尾に置く、新規作成専用の小さな空欄カード ========= */
function AddCardMini({ roster, table }) {
  const [open, setOpen] = useState(false);
  return (
    <>
      <div onClick={() => setOpen(true)} style={{
        height: 40, boxSizing: "border-box", background: C.zone, border: `1.5px dashed ${C.line}`,
        borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "center",
        color: C.sub, fontSize: 13, fontWeight: 800, cursor: "pointer",
      }}>＋ T{table}に追加</div>
      {open && (
        <Portal>
        <div onClick={() => setOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.55)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 5000 }}>
          <div onClick={(e) => e.stopPropagation()} style={{
            background: "#fff", borderRadius: "18px 18px 0 0", padding: "16px 18px calc(18px + env(safe-area-inset-bottom, 0px))",
            maxWidth: 420, width: "100%", maxHeight: "82vh", overflowY: "auto", boxSizing: "border-box", fontFamily: FONT,
          }}>
            <div style={{ width: 40, height: 4, background: C.line, borderRadius: 2, margin: "0 auto 12px" }} />
            <div style={{ fontSize: 15, fontWeight: 900, textAlign: "center", marginBottom: 12 }}>T{table} の最後に試合を追加</div>
            <CreateMatchForm roster={roster} defaultTable={table} existing={null} onDone={() => setOpen(false)} onCancel={() => setOpen(false)} />
          </div>
        </div>
        </Portal>
      )}
    </>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  showCrash(e.message + "\n" + (e.stack || ""));
}
</script>
</body>
</html>
